<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estadísticas y Archivo Clínico</title>
    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/img/favicon.ico" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link href="/main_css/estilos.css" rel="stylesheet" />
  </head>

  <body>
    <div class="glass" id="dashboard">
      <h5>Base</h5>
      <div id="header"></div>
      <div class="grid">
        <div
          style="
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 100%;
            padding-bottom: 0;
            box-shadow: 0 2px 8px 0 rgba(63, 69, 81, 0.16);
            margin-top: 1.6em;
            margin-bottom: 0.9em;
            overflow: hidden;
            border-radius: 8px;
            will-change: transform;
          "
        >
          <iframe
            loading="lazy"
            style="
              position: absolute;
              width: 100%;
              height: 100%;
              top: 0;
              left: 0;
              border: none;
              padding: 0;
              margin: 0;
            "
            src="https://www.canva.com/design/DAG1TvE7vFQ/CgTXUGXynArbHbUxIHW7Kg/view?embed"
            allowfullscreen="allowfullscreen"
            allow="fullscreen"
          >
          </iframe>
      <div id="footer"></div>
    </div>
    <script>
      fetch("/comun/header.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("header").innerHTML = html;

          // Cargar sesión.js después de insertar el HTML
          const s = document.createElement("script");
          s.src = "/comun/sesion_bk.js";

          s.onload = () => {
            console.log("🔥 sesion_bk.js cargado. Verificando sesión...");
            verificarAutenticacion();
          };

          document.body.appendChild(s);
        });

      fetch("/comun/footer.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("footer").innerHTML = html;

          // Ya existe footerText
          const footer = document.getElementById("footerText");
          if (footer) {
            footer.innerHTML = `Hecho con ❤️ por Ricardo · ${new Date().getFullYear()}`;
          }
        });
    </script>
    <script src="/comun/estadoSistema.js"></script>
    <script src="/comun/sesion_bk.js"></script>
  </body>
</html>
