<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informe de expedientes · agrupado por mes</title>
  <style>
    /* reset & base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0d0d1a;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    .paper {
      max-width: 1200px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      padding: 2rem 1.8rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      transition: all 0.2s;
    }

    /* header del informe */
    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 2px solid #1e2a3a;
      padding-bottom: 0.8rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
    }
    .report-header h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #0b1a2b;
      letter-spacing: -0.3px;
    }
    .report-header .meta {
      color: #2c3e50;
      font-size: 0.9rem;
      background: #f0f4f9;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }
    .report-header .meta i {
      opacity: 0.6;
    }

    /* controles de filtro / impresión */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.8rem;
      gap: 0.8rem;
    }
    .toolbar .left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem;
    }
    .toolbar label {
      font-size: 0.85rem;
      font-weight: 500;
      color: #1a2b3c;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .toolbar input[type="month"] {
      padding: 0.3rem 0.8rem;
      border-radius: 30px;
      border: 1px solid #bcc9d6;
      background: white;
      font-size: 0.85rem;
      font-weight: 500;
      color: #0b1a2b;
    }
    .btn-print {
      background: #1a2b3c;
      border: none;
      color: white;
      padding: 0.5rem 1.6rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    .btn-print:hover {
      background: #0f1e2e;
      transform: scale(1.01);
    }
    .btn-print i {
      font-size: 1rem;
    }

    /* tabla principal */
    .table-responsive {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid #e6edf4;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      min-width: 780px;
    }
    th {
      background: #f2f6fc;
      color: #142433;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      font-size: 0.7rem;
      padding: 0.9rem 0.6rem;
      border-bottom: 2px solid #d0dce8;
      text-align: left;
    }
    td {
      padding: 0.6rem 0.6rem;
      border-bottom: 1px solid #e6edf4;
      vertical-align: middle;
      color: #1a2b3c;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .grupo-mes td {
      background: #f8faff;
      font-weight: 600;
      color: #0f1f30;
      border-top: 2px solid #cbd8e6;
      border-bottom: 2px solid #cbd8e6;
      padding: 0.4rem 0.6rem;
      font-size: 0.85rem;
    }
    .grupo-mes td i {
      margin-right: 8px;
      color: #2a4b6e;
    }
    .expediente {
      font-weight: 600;
      color: #004080;
      letter-spacing: 0.2px;
    }
    .estado-badge {
      display: inline-block;
      padding: 0.15rem 0.6rem;
      border-radius: 30px;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: capitalize;
      background: #eef3f8;
      color: #1a2b3c;
    }
    .estado-activo {
      background: #d2f0d9;
      color: #00542b;
    }
    .estado-inactivo {
      background: #fff1cc;
      color: #7a5800;
    }
    .estado-defuncion {
      background: #fdd8d8;
      color: #a10000;
    }
    .estado-alta {
      background: #d4e4ff;
      color: #003b7a;
    }
    .text-muted {
      color: #4a617c;
      font-weight: 400;
    }
    .badge-mes {
      background: #dce6f0;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.75rem;
      color: #0b1f30;
    }
    .fila-vacia {
      text-align: center;
      padding: 2.5rem 0;
      color: #647b94;
      font-style: italic;
    }

    /* resumen footer */
    .report-footer {
      margin-top: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #d0dce8;
      padding-top: 1.2rem;
      font-size: 0.85rem;
      color: #1f384d;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .report-footer .total-registros {
      font-weight: 500;
      background: #eef4fa;
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
    }

    /* modo impresión: tamaño carta horizontal */
    @media print {
      body {
        background: white !important;
        padding: 0.2in !important;
        margin: 0 !important;
      }
      .paper {
        box-shadow: none !important;
        border-radius: 0 !important;
        padding: 0.1in 0.1in !important;
        max-width: 100% !important;
      }
      .toolbar .btn-print,
      .toolbar .left label {
        display: none !important;
      }
      .toolbar .left .badge-mes {
        display: none !important;
      }
      .toolbar {
        justify-content: flex-end !important;
        margin-bottom: 0.5rem !important;
      }
      .report-header h1 {
        font-size: 1.6rem !important;
      }
      th {
        background: #eef3f8 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .grupo-mes td {
        background: #f4f8fe !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .estado-activo,
      .estado-inactivo,
      .estado-defuncion,
      .estado-alta {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .report-footer .total-registros {
        background: #f0f4f9 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .btn-print {
        display: none !important;
      }
      .table-responsive {
        border: 1px solid #ccc !important;
      }
      /* forzar horizontal */
      @page {
        size: landscape;
        margin: 0.5in 0.3in;
      }
    }

    /* íconos fontawesome local */
    .fas,
    .far,
    .fa-solid {
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
    }
    .fa-print::before {
      content: "\f02f";
    }
    .fa-calendar-alt::before {
      content: "\f073";
    }
    .fa-file-medical::before {
      content: "\f477";
    }
    .fa-users::before {
      content: "\f0c0";
    }
    .fa-trash-alt::before {
      content: "\f2ed";
    }
    .fa-sync-alt::before {
      content: "\f2f1";
    }
    .fa-inbox::before {
      content: "\f01c";
    }
    .fa-exclamation-triangle::before {
      content: "\f071";
    }
  </style>
</head>
<body>
<div class="paper" id="reportPaper">

  <!-- cabecera -->
  <div class="report-header">
    <h1><i class="fas fa-file-medical" style="color:#1a4970; margin-right:10px;"></i>Expedientes clínicos</h1>
    <div class="meta">
      <i class="fas fa-calendar-alt"></i> 
      <span id="fechaGeneracion">Cargando...</span>
      <span style="opacity:0.4; margin:0 4px;">|</span>
      <span id="totalRegistrosMeta">0 registros</span>
    </div>
  </div>

  <!-- barra de herramientas -->
  <div class="toolbar">
    <div class="left">
      <label for="mesFiltro">
        <i class="fas fa-calendar-alt" style="opacity:0.6;"></i> Mes:
        <input type="month" id="mesFiltro" value="2026-08" />
      </label>
      <span class="badge-mes" id="badgeMesActual">agosto 2026</span>
    </div>
    <button class="btn-print" onclick="window.print()">
      <i class="fas fa-print"></i> Imprimir / PDF
    </button>
  </div>

  <!-- tabla -->
  <div class="table-responsive">
    <table id="tablaInforme">
      <thead>
        <tr>
          <th style="width:22%;">Paciente</th>
          <th style="width:14%;">Expediente</th>
          <th style="width:16%;">Servicio</th>
          <th style="width:10%;">Estado</th>
          <th style="width:12%;">Sexo</th>
          <th style="width:14%;">Fecha nac.</th>
          <th style="width:12%;">Teléfono</th>
        </tr>
      </thead>
      <tbody id="tbodyInforme">
        <!-- las filas se inyectan con js -->
      </tbody>
    </table>
  </div>

  <!-- pie -->
  <div class="report-footer">
    <span><i class="fas fa-users" style="opacity:0.6;"></i> Agrupado por mes de registro</span>
    <span class="total-registros" id="totalRegistrosPie">0 registros</span>
  </div>
</div>

<!-- ⚠️ librería supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // ============================
  // CONFIGURACIÓN SUPABASE
  // ============================
  const SUPABASE_URL = "https://njtlruvhcatklccdxpla.supabase.co";
  const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qdGxydXZoY2F0a2xjY2R4cGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzIwOTIsImV4cCI6MjEwMDkwODA5Mn0.MzVwk4OWvahcUfP1KF_kHbLlIXWIbZ-wljce1i2Q1sc";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ============================
  // VARIABLES GLOBALES
  // ============================
  let todosLosRegistros = [];
  let datosAgrupados = [];

  // elementos DOM
  const tbody = document.getElementById('tbodyInforme');
  const mesFiltro = document.getElementById('mesFiltro');
  const badgeMes = document.getElementById('badgeMesActual');
  const totalRegistrosPie = document.getElementById('totalRegistrosPie');
  const totalRegistrosMeta = document.getElementById('totalRegistrosMeta');
  const fechaGen = document.getElementById('fechaGeneracion');

  // ============================
  // UTILITIES
  // ============================
  function formatearFecha(fechaStr) {
    if (!fechaStr) return '—';
    try {
      const f = new Date(fechaStr + 'T00:00:00');
      if (isNaN(f)) return fechaStr;
      return f.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
    } catch {
      return fechaStr;
    }
  }

  function obtenerMesAnio(fechaStr) {
    if (!fechaStr) return null;
    try {
      const f = new Date(fechaStr + 'T00:00:00');
      if (isNaN(f)) return null;
      const mes = String(f.getMonth() + 1).padStart(2, '0');
      const anio = f.getFullYear();
      return `${anio}-${mes}`;
    } catch {
      return null;
    }
  }

  function nombreMes(numMes) {
    const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    return meses[numMes - 1] || '';
  }

  function formatearMesAnio(monthValue) {
    if (!monthValue) return '—';
    const parts = monthValue.split('-');
    if (parts.length !== 2) return monthValue;
    const anio = parts[0];
    const mesNum = parseInt(parts[1], 10);
    return `${nombreMes(mesNum)} ${anio}`;
  }

  // ============================
  // CARGAR DATOS DESDE SUPABASE
  // ============================
  async function cargarDatos() {
    try {
      const { data, error } = await sb
        .from('expedientes')
        .select('*')
        .order('fecha_registro', { ascending: true });

      if (error) throw error;

      todosLosRegistros = data || [];
      // fecha generación
      const ahora = new Date();
      fechaGen.textContent = ahora.toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric' });

      // establecer mes por defecto: el más reciente con registros, o el actual
      if (todosLosRegistros.length > 0) {
        // obtener los meses únicos de los registros
        const mesesSet = new Set();
        todosLosRegistros.forEach(r => {
          const m = obtenerMesAnio(r.fecha_registro);
          if (m) mesesSet.add(m);
        });
        const mesesArray = Array.from(mesesSet).sort();
        if (mesesArray.length > 0) {
          const ultimoMes = mesesArray[mesesArray.length - 1];
          mesFiltro.value = ultimoMes;
        } else {
          // fallback: mes actual
          const hoy = new Date();
          mesFiltro.value = `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}`;
        }
      } else {
        const hoy = new Date();
        mesFiltro.value = `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}`;
      }

      // actualizar badge
      actualizarBadge();

      // agrupar y renderizar
      agruparYRenderizar();

    } catch (error) {
      console.error('Error cargando datos:', error);
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:2rem; color:#b33;">⚠️ Error al cargar datos: ${error.message}</td></tr>`;
    }
  }

  // ============================
  // AGRUPAR POR MES Y RENDERIZAR
  // ============================
  function agruparYRenderizar() {
    const mesSeleccionado = mesFiltro.value;
    if (!mesSeleccionado) {
      tbody.innerHTML = `<tr><td colspan="7" class="fila-vacia">Selecciona un mes para visualizar</td></tr>`;
      actualizarTotales(0);
      return;
    }

    // filtrar registros por mes
    const filtrados = todosLosRegistros.filter(r => {
      const m = obtenerMesAnio(r.fecha_registro);
      return m === mesSeleccionado;
    });

    // agrupar por mes (aunque ya están filtrados, mantener estructura)
    // ordenar por fecha_registro ascendente dentro del mes
    filtrados.sort((a, b) => (a.fecha_registro || '').localeCompare(b.fecha_registro || ''));

    // construir filas
    let html = '';
    let contador = 0;

    if (filtrados.length === 0) {
      html = `<tr><td colspan="7" class="fila-vacia"><i class="fas fa-inbox" style="font-size:1.4rem; display:block; margin-bottom:0.5rem;"></i>No hay registros en este mes</td></tr>`;
    } else {
      // agregar fila de grupo (mes)
      const mesLabel = formatearMesAnio(mesSeleccionado);
      html += `<tr class="grupo-mes"><td colspan="7"><i class="fas fa-calendar-alt"></i> ${mesLabel} · ${filtrados.length} expediente${filtrados.length !== 1 ? 's' : ''}</td></tr>`;

      // filas de registros
      filtrados.forEach(r => {
        contador++;
        const estado = r.estado || '—';
        let estadoClass = '';
        const estadoLower = estado.toLowerCase();
        if (estadoLower === 'activo') estadoClass = 'estado-activo';
        else if (estadoLower === 'inactivo') estadoClass = 'estado-inactivo';
        else if (estadoLower === 'defunción' || estadoLower === 'defuncion') estadoClass = 'estado-defuncion';
        else if (estadoLower === 'alta') estadoClass = 'estado-alta';

        html += `<tr>
          <td><strong>${r.nombre_paciente || '—'}</strong></td>
          <td><span class="expediente">${r.expediente || '—'}</span></td>
          <td>${r.servicio || '—'}</td>
          <td><span class="estado-badge ${estadoClass}">${estado}</span></td>
          <td>${r.sexo || '—'}</td>
          <td>${formatearFecha(r.fecha_nac)}</td>
          <td>${r.tel_part || '—'}</td>
        </tr>`;
      });
    }

    tbody.innerHTML = html;
    actualizarTotales(contador);
  }

  function actualizarTotales(cantidad) {
    const texto = `${cantidad} registro${cantidad !== 1 ? 's' : ''}`;
    totalRegistrosPie.textContent = texto;
    totalRegistrosMeta.textContent = texto;
  }

  function actualizarBadge() {
    const val = mesFiltro.value;
    if (val) {
      badgeMes.textContent = formatearMesAnio(val);
    } else {
      badgeMes.textContent = '—';
    }
  }

  // ============================
  // EVENTOS
  // ============================
  mesFiltro.addEventListener('change', function() {
    actualizarBadge();
    agruparYRenderizar();
  });

  // ============================
  // INICIO
  // ============================
  document.addEventListener('DOMContentLoaded', () => {
    cargarDatos();
  });

  // también recargar si se necesita desde el dashboard (por si acaso)
  window.recargarInforme = function() {
    cargarDatos();
  };
</script>
</body>
</html>
