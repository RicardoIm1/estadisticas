<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Informe de Expedientes Clínicos</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: white;
        font-family: "Segoe UI", Roboto, system-ui, sans-serif;
        padding: 0.3in;
      }

      .paper {
        max-width: 100%;
      }

      /* ===== HEADER ===== */
      .report-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 3px solid #1a2a3f;
        padding-bottom: 1rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        gap: 0.8rem 1.5rem;
      }

      .report-header .logo-area {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .report-header .logo-icon {
        width: 52px;
        height: 52px;
        background: linear-gradient(135deg, #1a3a5c, #0d2137);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.6rem;
        flex-shrink: 0;
      }

      .report-header h1 {
        font-size: 1.8rem;
        font-weight: 700;
        color: #0b1a2b;
        letter-spacing: -0.5px;
      }

      .report-header h1 small {
        display: block;
        font-size: 0.75rem;
        font-weight: 400;
        color: #5a7a9a;
        letter-spacing: 0.3px;
        margin-top: 2px;
      }

      .report-header .meta {
        color: #2c3e50;
        font-size: 0.8rem;
        background: #f0f5fb;
        padding: 0.4rem 1.2rem;
        border-radius: 40px;
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        flex-wrap: wrap;
      }

      .report-header .meta i {
        opacity: 0.5;
      }

      /* ===== TABLA ===== */
      .table-responsive {
        overflow-x: auto;
        border-radius: 16px;
        border: 1px solid #e6edf4;
        background: white;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.75rem;
        min-width: 1100px;
      }

      thead {
        position: sticky;
        top: 0;
        z-index: 20;
      }

      th {
        background: #eaf0f8;
        color: #0f2030;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        font-size: 0.6rem;
        padding: 0.7rem 0.5rem;
        border-bottom: 2.5px solid #c8d7e6;
        text-align: left;
        white-space: nowrap;
        position: sticky;
        top: 0;
      }

      th i {
        opacity: 0.5;
        margin-right: 3px;
        font-size: 0.55rem;
      }

      td {
        padding: 0.4rem 0.5rem;
        border-bottom: 1px solid #eef3f8;
        vertical-align: middle;
        color: #1a2b3c;
        line-height: 1.3;
        word-break: break-word;
      }

      tr:last-child td {
        border-bottom: none;
      }

      /* ===== SEPARADORES ===== */
      .separador-urgente td {
        background: #fef0ee !important;
        border-top: 3px solid #c0392b !important;
        border-bottom: 3px solid #c0392b !important;
        padding: 0.6rem 0.7rem;
        font-weight: 700;
        font-size: 0.85rem;
        color: #8a1a1a;
      }

      .separador-urgente td i {
        color: #c0392b;
        margin-right: 10px;
      }

      .separador-regular td {
        background: #f0f6fe !important;
        border-top: 3px solid #2a6a9e !important;
        border-bottom: 3px solid #2a6a9e !important;
        padding: 0.6rem 0.7rem;
        font-weight: 700;
        font-size: 0.85rem;
        color: #0a1e30;
      }

      .separador-regular td i {
        color: #2a6a9e;
        margin-right: 10px;
      }

      .separador-mes td {
        background: #e8eef6 !important;
        border-top: 2px solid #b8c8da !important;
        border-bottom: 2px solid #b8c8da !important;
        padding: 0.3rem 0.7rem;
        font-weight: 600;
        font-size: 0.75rem;
        color: #1a3a5a;
      }

      .separador-mes td i {
        margin-right: 8px;
        color: #4a7a9a;
      }

      .count-badge {
        padding: 0.1rem 0.8rem;
        border-radius: 30px;
        font-size: 0.65rem;
        font-weight: 600;
        margin-left: 0.8rem;
        display: inline-block;
      }

      .count-urg {
        background: #fdd8d8;
        color: #8a1a1a;
      }

      .count-reg {
        background: #d4e4ff;
        color: #003b7a;
      }

      .count-mes {
        background: #e8eef6;
        padding: 0.1rem 0.8rem;
        border-radius: 30px;
        font-size: 0.65rem;
        font-weight: 600;
        margin-left: 0.8rem;
      }

      /* ===== ESTILOS DE CELDAS ===== */
      .num-col {
        text-align: center;
        font-weight: 600;
        color: #5a7a9a;
        font-size: 0.7rem;
        width: 30px;
        min-width: 30px;
      }

      .expediente {
        font-weight: 700;
        color: #004080;
        font-family: "Courier New", monospace;
        font-size: 0.85rem;
        padding: 0.1rem 0.3rem;
        display: inline-block;
      }

      .nombre-paciente {
        font-weight: 600;
        color: #0b1a2b;
      }

      .usuario-registro {
        color: #1a5a7a;
        font-weight: 500;
      }

      .fecha-registro {
        font-weight: 500;
        color: #0b1a2b;
      }

      .estado-badge {
        display: inline-block;
        padding: 0.15rem 0.6rem;
        border-radius: 30px;
        font-size: 0.6rem;
        font-weight: 700;
        text-transform: capitalize;
        letter-spacing: 0.2px;
        background: #eef3f8;
        color: #1a2b3c;
      }

      .estado-activo {
        background: #d2f0d9;
        color: #00542b;
      }

      .estado-inactivo {
        background: #fff1cc;
        color: #7a5800;
      }

      .estado-defuncion {
        background: #fdd8d8;
        color: #a10000;
      }

      .estado-alta {
        background: #d4e4ff;
        color: #003b7a;
      }

      .fila-vacia {
        text-align: center;
        padding: 3rem 0;
        color: #8a9eb0;
        font-style: italic;
      }

      .fila-vacia i {
        font-size: 2.5rem;
        display: block;
        margin-bottom: 0.8rem;
        opacity: 0.3;
      }

      .uuid-cell {
        font-family: "Courier New", monospace;
        font-size: 0.6rem;
        color: #5a7a9a;
        max-width: 100px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .fecha-cell {
        font-size: 0.7rem;
        white-space: nowrap;
      }

      /* ===== FOOTER ===== */
      .report-footer {
        margin-top: 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 2px solid #e6edf4;
        padding-top: 1rem;
        font-size: 0.8rem;
        color: #1f384d;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .report-footer .footer-left {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        flex-wrap: wrap;
      }

      .report-footer .footer-left span {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .report-footer .footer-left i {
        opacity: 0.5;
      }

      .total-registros {
        font-weight: 600;
        background: #eef4fa;
        padding: 0.3rem 1.4rem;
        border-radius: 40px;
        font-size: 0.85rem;
        color: #0b1f30;
      }

      .total-registros strong {
        font-size: 1.1rem;
        color: #003b7a;
      }

      .total-urg {
        background: #fdd8d8 !important;
        color: #8a1a1a !important;
      }

      .total-urg strong {
        color: #a10000 !important;
      }

      .total-reg {
        background: #d4e4ff !important;
        color: #003b7a !important;
      }

      .total-reg strong {
        color: #003b7a !important;
      }

      /* ===== IMPRESIÓN ===== */
      @media print {
        body {
          padding: 0.1in;
          background: white !important;
        }

        .paper {
          max-width: 100% !important;
        }

        .report-header {
          border-bottom-color: #1a2a3f !important;
        }

        .report-header .logo-icon {
          background: #1a3a5c !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        th {
          background: #eaf0f8 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .estado-activo,
        .estado-inactivo,
        .estado-defuncion,
        .estado-alta {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .separador-urgente td {
          background: #fef0ee !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .separador-regular td {
          background: #f0f6fe !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .separador-mes td {
          background: #e8eef6 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .count-urg {
          background: #fdd8d8 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .count-reg {
          background: #d4e4ff !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .count-mes {
          background: #e8eef6 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .total-registros {
          background: #eef4fa !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .total-urg {
          background: #fdd8d8 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .total-reg {
          background: #d4e4ff !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .table-responsive {
          border: 1px solid #ccc !important;
          border-radius: 0 !important;
        }

        .report-footer {
          border-top-color: #d0dce8 !important;
        }

        @page {
          size: landscape;
          margin: 0.2in 0.15in;
        }

        table {
          font-size: 0.6rem !important;
          min-width: 100% !important;
        }

        th,
        td {
          padding: 0.15rem 0.25rem !important;
        }

        .num-col {
          font-size: 0.6rem !important;
          min-width: 18px !important;
          width: 18px !important;
        }
      }

      /* ===== SCROLLBAR ===== */
      .table-responsive::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .table-responsive::-webkit-scrollbar-track {
        background: #f0f5fb;
        border-radius: 10px;
      }
      .table-responsive::-webkit-scrollbar-thumb {
        background: #c8d7e6;
        border-radius: 10px;
      }
      .table-responsive::-webkit-scrollbar-thumb:hover {
        background: #a8b8c8;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .paper {
        animation: fadeIn 0.4s ease;
      }
    </style>
  </head>
  <body>
    <div class="paper" id="reportPaper">
      <!-- ===== HEADER ===== -->

                <i class="fas fa-clock"></i> Actualizado

      <!-- ===== FOOTER ===== -->
      <div class="report-footer">

          </span>
          <span id="footerRegCount" style="display: none; color: #2a6a9e">

        <span class="total-registros" id="totalRegistrosPie">

    <!-- ===== SUPABASE ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      // ============================================================
      // CONFIGURACIÓN SUPABASE
      // ============================================================
      const SUPABASE_URL = "https://njtlruvhcatklccdxpla.supabase.co";
      const SUPABASE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qdGxydXZoY2F0a2xjY2R4cGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzIwOTIsImV4cCI6MjEwMDkwODA5Mn0.MzVwk4OWvahcUfP1KF_kHbLlIXWIbZ-wljce1i2Q1sc";

      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // ============================================================
      // VARIABLES GLOBALES
      // ============================================================
      let todosLosRegistros = [];

      // Elementos DOM
      const tbody = document.getElementById("tbodyInforme");
      const totalPie = document.getElementById("totalRegistrosPie");
      const totalUrgPie = document.getElementById("totalUrgPie");
      const totalRegPie = document.getElementById("totalRegPie");
      const urgCountPie = document.getElementById("urgCountPie");
      const regCountPie = document.getElementById("regCountPie");
      const totalMeta = document.getElementById("totalRegistrosMeta");
      const fechaGen = document.getElementById("fechaGeneracion");
      const footerUsuario = document.getElementById("footerUsuario");
      const footerTotalRegistros = document.getElementById(
        "footerTotalRegistros",
      );
      const footerUrgCount = document.getElementById("footerUrgCount");
      const footerUrgNum = document.getElementById("footerUrgNum");
      const footerRegCount = document.getElementById("footerRegCount");
      const footerRegNum = document.getElementById("footerRegNum");

      // ============================================================
      // UTILIDADES
      // ============================================================
      function esUrgente(expediente) {
        if (!expediente) return false;
        return expediente.toLowerCase().startsWith("urg-");
      }

      function formatearFecha(fechaStr) {
        if (!fechaStr) return "—";
        try {
          if (fechaStr.match(/^\d{4}-\d{2}-\d{2}$/)) {
            const parts = fechaStr.split("-");
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
          }
          const f = new Date(fechaStr);
          if (isNaN(f)) return fechaStr;
          return f.toLocaleDateString("es-ES", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
          });
        } catch {
          return fechaStr;
        }
      }

      function formatearFechaHora(fechaStr) {
        if (!fechaStr) return "—";
        try {
          const f = new Date(fechaStr);
          if (isNaN(f)) return fechaStr;
          return f.toLocaleDateString("es-ES", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });
        } catch {
          return fechaStr;
        }
      }

      function obtenerMesAnio(fechaStr) {
        if (!fechaStr) return null;
        try {
          if (fechaStr.match(/^\d{4}-\d{2}-\d{2}$/)) {
            const parts = fechaStr.split("-");
            return `${parts[0]}-${parts[1]}`;
          }
          const f = new Date(fechaStr);
          if (isNaN(f)) return null;
          const mes = String(f.getMonth() + 1).padStart(2, "0");
          const anio = f.getFullYear();
          return `${anio}-${mes}`;
        } catch {
          return null;
        }
      }

      function nombreMes(numMes) {
        const meses = [
          "enero",
          "febrero",
          "marzo",
          "abril",
          "mayo",
          "junio",
          "julio",
          "agosto",
          "septiembre",
          "octubre",
          "noviembre",
          "diciembre",
        ];
        return meses[numMes - 1] || "";
      }

      function formatearMesAnio(monthValue) {
        if (!monthValue) return "—";
        const parts = monthValue.split("-");
        if (parts.length !== 2) return monthValue;
        const anio = parts[0];
        const mesNum = parseInt(parts[1], 10);
        return `${nombreMes(mesNum)} ${anio}`;
      }

      function getEstadoClass(estado) {
        const lower = (estado || "").toLowerCase();
        if (lower === "activo") return "estado-activo";
        if (lower === "inactivo") return "estado-inactivo";
        if (lower === "defunción" || lower === "defuncion")
          return "estado-defuncion";
        if (lower === "alta") return "estado-alta";
        return "";
      }

      function truncarUUID(uuid) {
        if (!uuid) return "—";
        return uuid.substring(0, 8) + "…";
      }

      // ============================================================
      // CARGAR DATOS
      // ============================================================
      async function cargarDatos() {
        try {
          const { data, error } = await sb
            .from("expedientes")
            .select("*")
            .order("fecha_registro", { ascending: false });

          if (error) throw error;

          todosLosRegistros = data || [];

          const ahora = new Date();
          fechaGen.textContent = ahora.toLocaleDateString("es-ES", {
            day: "2-digit",
            month: "long",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });

          try {
            const user = localStorage.getItem("usuario") || "Sistema";
            footerUsuario.textContent = user;
          } catch {
            footerUsuario.textContent = "Sistema";
          }

          renderizarTabla();
        } catch (error) {
          console.error("Error cargando datos:", error);
          tbody.innerHTML = `<tr><td colspan="13" style="text-align:center; padding:2.5rem; color:#b33;">
                        <i class="fas fa-exclamation-triangle" style="font-size:2rem; display:block; margin-bottom:0.8rem;"></i>
                        Error al cargar datos: ${error.message}
                    </td></tr>`;
        }
      }

      // ============================================================
      // RENDERIZAR TABLA
      // ============================================================
      function renderizarTabla() {
        if (todosLosRegistros.length === 0) {
          tbody.innerHTML = `<tr><td colspan="13" class="fila-vacia"><i class="fas fa-inbox"></i>No hay registros para mostrar</td></tr>`;
          actualizarTotales(0, 0, 0);
          return;
        }

        // Agrupar por mes
        const grupos = {};
        todosLosRegistros.forEach((r) => {
          const mes = obtenerMesAnio(r.fecha_registro) || "sin-fecha";
          if (!grupos[mes]) grupos[mes] = [];
          grupos[mes].push(r);
        });

        const mesesOrdenados = Object.keys(grupos).sort((a, b) => {
          if (a === "sin-fecha") return 1;
          if (b === "sin-fecha") return -1;
          return b.localeCompare(a);
        });

        let html = "";
        let totalRegistros = 0;
        let totalUrgentes = 0;
        let totalRegulares = 0;

        mesesOrdenados.forEach((mes) => {
          const registrosMes = grupos[mes];
          const mesLabel =
            mes === "sin-fecha" ? "Sin fecha" : formatearMesAnio(mes);

          const urgentes = registrosMes.filter((r) => esUrgente(r.expediente));
          const regulares = registrosMes.filter(
            (r) => !esUrgente(r.expediente),
          );

          totalUrgentes += urgentes.length;
          totalRegulares += regulares.length;

          const ordenarPorFecha = (a, b) =>
            (b.fecha_registro || "").localeCompare(a.fecha_registro || "");
          urgentes.sort(ordenarPorFecha);
          regulares.sort(ordenarPorFecha);

          // === ENCABEZADO DEL MES ===
          html += `<tr class="separador-mes">
                            <td colspan="13">
                                <i class="fas fa-calendar-alt"></i> ${mesLabel}
                                <span class="count-mes">${registrosMes.length} expediente${registrosMes.length !== 1 ? "s" : ""}</span>
                                ${urgentes.length > 0 ? `<span class="count-badge count-urg"><i class="fas fa-exclamation-triangle"></i> ${urgentes.length} urgente${urgentes.length !== 1 ? "s" : ""}</span>` : ""}
                            </td>
                        </tr>`;

          // === URGENTES ===
          if (urgentes.length > 0) {
            html += `<tr class="separador-urgente">
                                <td colspan="13">
                                    <i class="fas fa-exclamation-triangle"></i> 
                                    URGENTES 
                                    <span class="count-badge count-urg">${urgentes.length} expediente${urgentes.length !== 1 ? "s" : ""}</span>
                                </td>
                            </tr>`;

            urgentes.forEach((r, i) => {
              totalRegistros++;
              const estado = r.estado || "—";
              const estadoClass = getEstadoClass(estado);

              html += `<tr>
                                    <td class="num-col">${i + 1}</td>
                                    <td class="uuid-cell" title="${r.id || ""}">${truncarUUID(r.id)}</td>
                                    <td><span class="nombre-paciente">${r.nombre_paciente || "—"}</span></td>
                                    <td><span class="expediente">${r.expediente || "—"}</span></td>
                                    <td>${r.servicio || "—"}</td>
                                    <td class="fecha-registro fecha-cell"><strong>${formatearFecha(r.fecha_registro)}</strong></td>
                                    <td><span class="estado-badge ${estadoClass}">${estado}</span></td>
                                    <td>${r.sexo || "—"}</td>
                                    <td class="fecha-cell">${formatearFecha(r.fecha_nac)}</td>
                                    <td>${r.tel_part || "—"}</td>
                                    <td class="fecha-cell">${formatearFechaHora(r.created_at)}</td>
                                    <td class="fecha-cell">${formatearFechaHora(r.updated_at)}</td>
                                    <td><span class="usuario-registro">${r.usuario_registro || "—"}</span></td>
                                </tr>`;
            });
          }

          // === REGULARES ===
          if (regulares.length > 0) {
            if (urgentes.length > 0) {
              html += `<tr class="separador-mes">
                                    <td colspan="13">
                                        <i class="fas fa-arrow-down"></i> ——— REGULARES ———
                                        <span class="count-badge count-reg">${regulares.length} expediente${regulares.length !== 1 ? "s" : ""}</span>
                                    </td>
                                </tr>`;
            } else {
              html += `<tr class="separador-regular">
                                    <td colspan="13">
                                        <i class="fas fa-file-medical"></i> 
                                        REGULARES
                                        <span class="count-badge count-reg">${regulares.length} expediente${regulares.length !== 1 ? "s" : ""}</span>
                                    </td>
                                </tr>`;
            }

            regulares.forEach((r, i) => {
              totalRegistros++;
              const estado = r.estado || "—";
              const estadoClass = getEstadoClass(estado);

              html += `<tr>
                                    <td class="num-col">${i + 1}</td>
                                    <td class="uuid-cell" title="${r.id || ""}">${truncarUUID(r.id)}</td>
                                    <td><span class="nombre-paciente">${r.nombre_paciente || "—"}</span></td>
                                    <td><span class="expediente">${r.expediente || "—"}</span></td>
                                    <td>${r.servicio || "—"}</td>
                                    <td class="fecha-registro fecha-cell"><strong>${formatearFecha(r.fecha_registro)}</strong></td>
                                    <td><span class="estado-badge ${estadoClass}">${estado}</span></td>
                                    <td>${r.sexo || "—"}</td>
                                    <td class="fecha-cell">${formatearFecha(r.fecha_nac)}</td>
                                    <td>${r.tel_part || "—"}</td>
                                    <td class="fecha-cell">${formatearFechaHora(r.created_at)}</td>
                                    <td class="fecha-cell">${formatearFechaHora(r.updated_at)}</td>
                                    <td><span class="usuario-registro">${r.usuario_registro || "—"}</span></td>
                                </tr>`;
            });
          }
        });

        tbody.innerHTML = html;
        actualizarTotales(totalRegistros, totalUrgentes, totalRegulares);
      }

      // ============================================================
      // ACTUALIZAR TOTALES
      // ============================================================
      function actualizarTotales(cantidad, urgentes, regulares) {
        const texto = `${cantidad} registro${cantidad !== 1 ? "s" : ""}`;
        totalPie.innerHTML = `<strong>${cantidad}</strong> registros`;
        totalMeta.textContent = texto;
        footerTotalRegistros.textContent = texto;

        if (urgentes > 0) {
          totalUrgPie.style.display = "inline-flex";
          urgCountPie.textContent = urgentes;
          footerUrgCount.style.display = "inline";
          footerUrgNum.textContent = urgentes;
        } else {
          totalUrgPie.style.display = "none";
          footerUrgCount.style.display = "none";
        }

        if (regulares > 0) {
          totalRegPie.style.display = "inline-flex";
          regCountPie.textContent = regulares;
          footerRegCount.style.display = "inline";
          footerRegNum.textContent = regulares;
        } else {
          totalRegPie.style.display = "none";
          footerRegCount.style.display = "none";
        }
      }

      // ============================================================
      // INICIO
      // ============================================================
      document.addEventListener("DOMContentLoaded", () => {
        cargarDatos();
      });
    </script>
  </body>
</html>
