<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Informe Completo de Expedientes · Todos los registros</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      /* ===== RESET Y BASE ===== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0a0e17;
        display: flex;
        justify-content: center;
        padding: 1.5rem 1rem;
        font-family: "Segoe UI", Roboto, system-ui, sans-serif;
        min-height: 100vh;
      }

      .paper {
        max-width: 1400px;
        width: 100%;
        background: #ffffff;
        border-radius: 28px;
        padding: 2rem 2rem 1.5rem;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        transition: all 0.2s;
      }

      /* ===== HEADER ===== */
      .report-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 3px solid #1a2a3f;
        padding-bottom: 1rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        gap: 0.8rem 1.5rem;
      }

      .report-header .logo-area {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .report-header .logo-icon {
        width: 52px;
        height: 52px;
        background: linear-gradient(135deg, #1a3a5c, #0d2137);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.6rem;
        flex-shrink: 0;
      }

      .report-header h1 {
        font-size: 1.8rem;
        font-weight: 700;
        color: #0b1a2b;
        letter-spacing: -0.5px;
      }

      .report-header h1 small {
        display: block;
        font-size: 0.75rem;
        font-weight: 400;
        color: #5a7a9a;
        letter-spacing: 0.3px;
        margin-top: 2px;
      }

      .report-header .meta {
        color: #2c3e50;
        font-size: 0.8rem;
        background: #f0f5fb;
        padding: 0.4rem 1.2rem;
        border-radius: 40px;
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        white-space: nowrap;
        flex-wrap: wrap;
      }

      .report-header .meta i {
        opacity: 0.5;
      }

      /* ===== TOOLBAR ===== */
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        gap: 0.8rem;
        background: #f8faff;
        padding: 0.6rem 1.2rem;
        border-radius: 16px;
        border: 1px solid #e8eef6;
      }

      .toolbar .left {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.8rem;
      }

      .toolbar label {
        font-size: 0.8rem;
        font-weight: 600;
        color: #1a2b3c;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .toolbar input[type="month"] {
        padding: 0.35rem 0.9rem;
        border-radius: 30px;
        border: 1.5px solid #d0dce8;
        background: white;
        font-size: 0.85rem;
        font-weight: 500;
        color: #0b1a2b;
        outline: none;
        transition: 0.2s;
      }

      .toolbar input[type="month"]:focus {
        border-color: #2a6a9e;
        box-shadow: 0 0 0 3px rgba(42, 106, 158, 0.15);
      }

      .badge-mes {
        background: #e4ecf5;
        padding: 0.25rem 1.2rem;
        border-radius: 40px;
        font-weight: 600;
        font-size: 0.78rem;
        color: #0b1f30;
        letter-spacing: 0.2px;
      }

      .btn-print {
        background: #1a2b3c;
        border: none;
        color: white;
        padding: 0.5rem 1.8rem;
        border-radius: 40px;
        font-weight: 600;
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        cursor: pointer;
        transition: 0.25s;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .btn-print:hover {
        background: #0f1e2e;
        transform: translateY(-1px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      }

      .btn-print i {
        font-size: 0.95rem;
      }

      .btn-export {
        background: transparent;
        border: 1.5px solid #d0dce8;
        color: #2c3e50;
        padding: 0.5rem 1.2rem;
        border-radius: 40px;
        font-weight: 500;
        font-size: 0.8rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        transition: 0.25s;
      }

      .btn-export:hover {
        background: #f0f5fb;
        border-color: #a0b8d0;
      }

      /* ===== CONTADOR DE REGISTROS ===== */
      .registros-info {
        font-size: 0.78rem;
        color: #5a7a9a;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .registros-info strong {
        color: #0b1a2b;
        font-size: 0.9rem;
      }

      /* ===== TABLA ===== */
      .table-responsive {
        overflow-x: auto;
        border-radius: 16px;
        border: 1px solid #e6edf4;
        background: white;
        max-height: 75vh;
        overflow-y: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.78rem;
        min-width: 1100px;
      }

      thead {
        position: sticky;
        top: 0;
        z-index: 20;
      }

      th {
        background: #eaf0f8;
        color: #0f2030;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        font-size: 0.6rem;
        padding: 0.7rem 0.5rem;
        border-bottom: 2.5px solid #c8d7e6;
        text-align: left;
        white-space: nowrap;
        position: sticky;
        top: 0;
      }

      th i {
        opacity: 0.5;
        margin-right: 3px;
        font-size: 0.55rem;
      }

      td {
        padding: 0.45rem 0.5rem;
        border-bottom: 1px solid #eef3f8;
        vertical-align: middle;
        color: #1a2b3c;
        line-height: 1.3;
        word-break: break-word;
      }

      tr:last-child td {
        border-bottom: none;
      }

      /* Grupo de mes */
      .grupo-mes td {
        background: #f4f9ff;
        font-weight: 700;
        color: #0a1e30;
        border-top: 2.5px solid #b8c8da;
        border-bottom: 2px solid #b8c8da;
        padding: 0.4rem 0.7rem;
        font-size: 0.82rem;
      }

      .grupo-mes td i {
        margin-right: 10px;
        color: #2a5a7a;
      }

      .grupo-mes td .mes-count {
        background: #dce6f0;
        padding: 0.1rem 0.8rem;
        border-radius: 30px;
        font-size: 0.65rem;
        font-weight: 600;
        margin-left: 0.8rem;
        color: #1a3a5a;
      }

      /* Estilos de celdas */
      .expediente {
        font-weight: 700;
        color: #004080;
        font-family: "Courier New", monospace;
        font-size: 0.8rem;
      }

      .nombre-paciente {
        font-weight: 600;
        color: #0b1a2b;
      }

      .estado-badge {
        display: inline-block;
        padding: 0.15rem 0.6rem;
        border-radius: 30px;
        font-size: 0.6rem;
        font-weight: 700;
        text-transform: capitalize;
        letter-spacing: 0.2px;
        background: #eef3f8;
        color: #1a2b3c;
      }

      .estado-activo {
        background: #d2f0d9;
        color: #00542b;
      }

      .estado-inactivo {
        background: #fff1cc;
        color: #7a5800;
      }

      .estado-defuncion {
        background: #fdd8d8;
        color: #a10000;
      }

      .estado-alta {
        background: #d4e4ff;
        color: #003b7a;
      }

      .text-muted {
        color: #8a9eb0;
      }

      .fila-vacia {
        text-align: center;
        padding: 3rem 0;
        color: #8a9eb0;
        font-style: italic;
      }

      .fila-vacia i {
        font-size: 2.5rem;
        display: block;
        margin-bottom: 0.8rem;
        opacity: 0.3;
      }

      .uuid-cell {
        font-family: "Courier New", monospace;
        font-size: 0.65rem;
        color: #5a7a9a;
        max-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .fecha-cell {
        font-size: 0.7rem;
        white-space: nowrap;
      }

      /* ===== FOOTER ===== */
      .report-footer {
        margin-top: 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 2px solid #e6edf4;
        padding-top: 1rem;
        font-size: 0.8rem;
        color: #1f384d;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .report-footer .footer-left {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        flex-wrap: wrap;
      }

      .report-footer .footer-left span {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .report-footer .footer-left i {
        opacity: 0.5;
      }

      .total-registros {
        font-weight: 600;
        background: #eef4fa;
        padding: 0.3rem 1.4rem;
        border-radius: 40px;
        font-size: 0.85rem;
        color: #0b1f30;
      }

      .total-registros strong {
        font-size: 1.1rem;
        color: #003b7a;
      }

      /* ===== RESPONSIVE ===== */
      @media (max-width: 768px) {
        .paper {
          padding: 1rem;
        }
        .report-header {
          flex-direction: column;
          align-items: stretch;
        }
        .report-header .meta {
          align-self: flex-start;
          font-size: 0.7rem;
          padding: 0.3rem 0.8rem;
        }
        .toolbar {
          flex-direction: column;
          align-items: stretch;
        }
        .toolbar .left {
          flex-wrap: wrap;
        }
        .btn-print,
        .btn-export {
          justify-content: center;
        }
        .registros-info {
          width: 100%;
          justify-content: center;
        }
        table {
          font-size: 0.7rem;
          min-width: 900px;
        }
        th,
        td {
          padding: 0.3rem 0.4rem;
        }
      }

      @media (max-width: 480px) {
        .report-header h1 {
          font-size: 1.2rem;
        }
        .report-header .logo-icon {
          width: 40px;
          height: 40px;
          font-size: 1.2rem;
        }
      }

      /* ===== IMPRESIÓN ===== */
      @media print {
        body {
          background: white !important;
          padding: 0.05in !important;
          margin: 0 !important;
        }

        .paper {
          box-shadow: none !important;
          border-radius: 0 !important;
          padding: 0.1in 0.1in !important;
          max-width: 100% !important;
        }

        .toolbar .btn-print,
        .toolbar .btn-export,
        .toolbar .left label {
          display: none !important;
        }

        .toolbar .left .badge-mes {
          display: none !important;
        }

        .toolbar {
          justify-content: flex-end !important;
          background: transparent !important;
          border: none !important;
          padding: 0 !important;
          margin-bottom: 0.3rem !important;
        }

        .report-header {
          border-bottom-color: #1a2a3f !important;
        }

        .report-header .logo-icon {
          background: #1a3a5c !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        th {
          background: #eaf0f8 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .grupo-mes td {
          background: #f4f9ff !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .estado-activo,
        .estado-inactivo,
        .estado-defuncion,
        .estado-alta {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .total-registros {
          background: #eef4fa !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .table-responsive {
          border: 1px solid #ccc !important;
          border-radius: 0 !important;
          max-height: none !important;
          overflow: visible !important;
        }

        .report-footer {
          border-top-color: #d0dce8 !important;
        }

        .grupo-mes td .mes-count {
          background: #dce6f0 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .registros-info {
          display: none !important;
        }

        @page {
          size: landscape;
          margin: 0.2in 0.15in;
        }

        /* Mostrar todos los registros en impresión */
        .table-responsive {
          max-height: none !important;
          overflow: visible !important;
        }

        table {
          font-size: 0.65rem !important;
          min-width: 100% !important;
        }

        th,
        td {
          padding: 0.2rem 0.3rem !important;
        }

        .uuid-cell {
          font-size: 0.55rem !important;
          max-width: 80px !important;
        }
      }

      /* ===== SCROLLBAR ===== */
      .table-responsive::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .table-responsive::-webkit-scrollbar-track {
        background: #f0f5fb;
        border-radius: 10px;
      }
      .table-responsive::-webkit-scrollbar-thumb {
        background: #c8d7e6;
        border-radius: 10px;
      }
      .table-responsive::-webkit-scrollbar-thumb:hover {
        background: #a8b8c8;
      }

      /* ===== ANIMACIÓN ===== */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .paper {
        animation: fadeIn 0.4s ease;
      }
    </style>
  </head>
  <body>
    <div class="paper" id="reportPaper">
      <!-- ===== HEADER ===== -->
      <div class="report-header">
        <div class="logo-area">
          <div class="logo-icon">
            <i class="fas fa-notes-medical"></i>
          </div>
          <div>
            <h1>
              Expedientes Clínicos
              <small>Informe completo · todos los registros por mes</small>
            </h1>
          </div>
        </div>
        <div class="meta">
          <i class="fas fa-calendar-alt"></i>
          <span id="fechaGeneracion">Cargando...</span>
          <span style="opacity: 0.3; margin: 0 4px">|</span>
          <i class="fas fa-database"></i>
          <span id="totalRegistrosMeta">0 registros</span>
        </div>
      </div>

      <!-- ===== TOOLBAR ===== -->
      <div class="toolbar">
        <div class="left">
          <label for="mesFiltro">
            <i class="fas fa-calendar-alt" style="opacity: 0.6"></i>
            <span>Filtrar por mes:</span>
            <input type="month" id="mesFiltro" value="2026-08" />
          </label>
          <span class="badge-mes" id="badgeMesActual">agosto 2026</span>
          <span class="registros-info" id="registrosInfo">
            <i class="fas fa-file-alt"></i>
            <strong id="contadorRegistros">0</strong> registros
          </span>
        </div>
        <div style="display: flex; gap: 0.6rem; flex-wrap: wrap">
          <button
            class="btn-export"
            onclick="cargarDatos()"
            title="Recargar datos desde Supabase"
          >
            <i class="fas fa-sync-alt"></i> Actualizar
          </button>
          <button class="btn-print" onclick="window.print()">
            <i class="fas fa-print"></i> Imprimir / PDF
          </button>
        </div>
      </div>

      <!-- ===== TABLA CON TODOS LOS CAMPOS ===== -->
      <div class="table-responsive" id="tablaContainer">
        <table id="tablaInforme">
          <thead>
            <tr>
              <th style="width: 8%"><i class="fas fa-hashtag"></i> ID</th>
              <th style="width: 14%"><i class="fas fa-user"></i> Paciente</th>
              <th style="width: 10%">
                <i class="fas fa-file-signature"></i> Expediente
              </th>
              <th style="width: 10%">
                <i class="fas fa-stethoscope"></i> Servicio
              </th>
              <th style="width: 9%">
                <i class="fas fa-calendar-check"></i> Fecha Reg.
              </th>
              <th style="width: 8%"><i class="fas fa-circle"></i> Estado</th>
              <th style="width: 6%"><i class="fas fa-venus-mars"></i> Sexo</th>
              <th style="width: 9%">
                <i class="fas fa-birthday-cake"></i> Fecha Nac.
              </th>
              <th style="width: 8%"><i class="fas fa-phone"></i> Teléfono</th>
              <th style="width: 10%"><i class="fas fa-clock"></i> Creado</th>
              <th style="width: 10%">
                <i class="fas fa-clock"></i> Actualizado
              </th>
              <th style="width: 8%"><i class="fas fa-user-cog"></i> Usuario</th>
            </tr>
          </thead>
          <tbody id="tbodyInforme">
            <!-- Inyectado por JavaScript -->
          </tbody>
        </table>
      </div>

      <!-- ===== FOOTER ===== -->
      <div class="report-footer">
        <div class="footer-left">
          <span
            ><i class="fas fa-calendar-alt"></i> Agrupado por
            <strong>fecha_registro</strong></span
          >
          <span
            ><i class="fas fa-user-md"></i>
            <span id="footerUsuario">Sistema</span></span
          >
          <span
            ><i class="fas fa-file-alt"></i>
            <span id="footerTotalRegistros">0 registros</span></span
          >
        </div>
        <span class="total-registros" id="totalRegistrosPie">
          <strong>0</strong> registros totales
        </span>
      </div>
    </div>

    <!-- ===== SUPABASE ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      // ============================================================
      // CONFIGURACIÓN SUPABASE
      // ============================================================
      const SUPABASE_URL = "https://njtlruvhcatklccdxpla.supabase.co";
      const SUPABASE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qdGxydXZoY2F0a2xjY2R4cGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzIwOTIsImV4cCI6MjEwMDkwODA5Mn0.MzVwk4OWvahcUfP1KF_kHbLlIXWIbZ-wljce1i2Q1sc";

      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // ============================================================
      // VARIABLES GLOBALES
      // ============================================================
      let todosLosRegistros = [];

      // Elementos DOM
      const tbody = document.getElementById("tbodyInforme");
      const mesFiltro = document.getElementById("mesFiltro");
      const badgeMes = document.getElementById("badgeMesActual");
      const totalPie = document.getElementById("totalRegistrosPie");
      const totalMeta = document.getElementById("totalRegistrosMeta");
      const fechaGen = document.getElementById("fechaGeneracion");
      const contadorRegistros = document.getElementById("contadorRegistros");
      const registrosInfo = document.getElementById("registrosInfo");
      const footerUsuario = document.getElementById("footerUsuario");
      const footerTotalRegistros = document.getElementById(
        "footerTotalRegistros",
      );

      // ============================================================
      // UTILIDADES
      // ============================================================
      function formatearFecha(fechaStr) {
        if (!fechaStr) return "—";
        try {
          const f = new Date(fechaStr + "T00:00:00");
          if (isNaN(f)) return fechaStr;
          return f.toLocaleDateString("es-ES", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
          });
        } catch {
          return fechaStr;
        }
      }

      function formatearFechaHora(fechaStr) {
        if (!fechaStr) return "—";
        try {
          const f = new Date(fechaStr);
          if (isNaN(f)) return fechaStr;
          return f.toLocaleDateString("es-ES", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });
        } catch {
          return fechaStr;
        }
      }

      function obtenerMesAnio(fechaStr) {
        if (!fechaStr) return null;
        try {
          const f = new Date(fechaStr + "T00:00:00");
          if (isNaN(f)) return null;
          const mes = String(f.getMonth() + 1).padStart(2, "0");
          const anio = f.getFullYear();
          return `${anio}-${mes}`;
        } catch {
          return null;
        }
      }

      function nombreMes(numMes) {
        const meses = [
          "enero",
          "febrero",
          "marzo",
          "abril",
          "mayo",
          "junio",
          "julio",
          "agosto",
          "septiembre",
          "octubre",
          "noviembre",
          "diciembre",
        ];
        return meses[numMes - 1] || "";
      }

      function formatearMesAnio(monthValue) {
        if (!monthValue) return "—";
        const parts = monthValue.split("-");
        if (parts.length !== 2) return monthValue;
        const anio = parts[0];
        const mesNum = parseInt(parts[1], 10);
        return `${nombreMes(mesNum)} ${anio}`;
      }

      function getEstadoClass(estado) {
        const lower = (estado || "").toLowerCase();
        if (lower === "activo") return "estado-activo";
        if (lower === "inactivo") return "estado-inactivo";
        if (lower === "defunción" || lower === "defuncion")
          return "estado-defuncion";
        if (lower === "alta") return "estado-alta";
        return "";
      }

      function truncarUUID(uuid) {
        if (!uuid) return "—";
        return uuid.substring(0, 8) + "…";
      }

      // ============================================================
      // CARGAR DATOS DESDE SUPABASE
      // ============================================================
      async function cargarDatos() {
        try {
          const { data, error } = await sb
            .from("expedientes")
            .select("*")
            .order("fecha_registro", { ascending: true });

          if (error) throw error;

          todosLosRegistros = data || [];

          // Fecha de generación
          const ahora = new Date();
          fechaGen.textContent = ahora.toLocaleDateString("es-ES", {
            day: "2-digit",
            month: "long",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });

          // Usuario
          try {
            const user = localStorage.getItem("usuario") || "Sistema";
            footerUsuario.textContent = user;
          } catch {
            footerUsuario.textContent = "Sistema";
          }

          // Establecer mes por defecto: el más reciente con registros
          if (todosLosRegistros.length > 0) {
            const mesesSet = new Set();
            todosLosRegistros.forEach((r) => {
              const m = obtenerMesAnio(r.fecha_registro);
              if (m) mesesSet.add(m);
            });
            const mesesArray = Array.from(mesesSet).sort();
            if (mesesArray.length > 0) {
              mesFiltro.value = mesesArray[mesesArray.length - 1];
            } else {
              const hoy = new Date();
              mesFiltro.value = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, "0")}`;
            }
          } else {
            const hoy = new Date();
            mesFiltro.value = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, "0")}`;
          }

          actualizarBadge();
          actualizarTotalesGenerales();
          renderizarTabla();
        } catch (error) {
          console.error("Error cargando datos:", error);
          tbody.innerHTML = `<tr><td colspan="12" style="text-align:center; padding:2.5rem; color:#b33;">
                        <i class="fas fa-exclamation-triangle" style="font-size:2rem; display:block; margin-bottom:0.8rem;"></i>
                        Error al cargar datos: ${error.message}
                    </td></tr>`;
        }
      }

      // ============================================================
      // RENDERIZAR TABLA CON TODOS LOS CAMPOS
      // ============================================================
      function renderizarTabla() {
        const mesSeleccionado = mesFiltro.value;

        if (!mesSeleccionado) {
          tbody.innerHTML = `<tr><td colspan="12" class="fila-vacia"><i class="fas fa-calendar-alt"></i>Selecciona un mes para visualizar</td></tr>`;
          actualizarTotalesParciales(0);
          return;
        }

        // Filtrar por mes según fecha_registro
        const filtrados = todosLosRegistros.filter((r) => {
          const m = obtenerMesAnio(r.fecha_registro);
          return m === mesSeleccionado;
        });

        // Ordenar por nombre
        filtrados.sort((a, b) =>
          (a.nombre_paciente || "").localeCompare(
            b.nombre_paciente || "",
            "es",
          ),
        );

        let html = "";
        let contador = 0;

        if (filtrados.length === 0) {
          html = `<tr><td colspan="12" class="fila-vacia"><i class="fas fa-inbox"></i>No hay registros en este mes</td></tr>`;
        } else {
          const mesLabel = formatearMesAnio(mesSeleccionado);
          html += `<tr class="grupo-mes">
                            <td colspan="12">
                                <i class="fas fa-calendar-alt"></i> ${mesLabel}
                                <span class="mes-count">${filtrados.length} expediente${filtrados.length !== 1 ? "s" : ""}</span>
                            </td>
                        </tr>`;

          filtrados.forEach((r) => {
            contador++;
            const estado = r.estado || "—";
            const estadoClass = getEstadoClass(estado);

            html += `<tr>
                                <td class="uuid-cell" title="${r.id || ""}">${truncarUUID(r.id)}</td>
                                <td><span class="nombre-paciente">${r.nombre_paciente || "—"}</span></td>
                                <td><span class="expediente">${r.expediente || "—"}</span></td>
                                <td>${r.servicio || "—"}</td>
                                <td class="fecha-cell">${formatearFecha(r.fecha_registro)}</td>
                                <td><span class="estado-badge ${estadoClass}">${estado}</span></td>
                                <td>${r.sexo || "—"}</td>
                                <td class="fecha-cell">${formatearFecha(r.fecha_nac)}</td>
                                <td>${r.tel_part || "—"}</td>
                                <td class="fecha-cell">${formatearFechaHora(r.created_at)}</td>
                                <td class="fecha-cell">${formatearFechaHora(r.updated_at)}</td>
                                <td>${r.usuario_registro || "—"}</td>
                            </tr>`;
          });
        }

        tbody.innerHTML = html;
        actualizarTotalesParciales(contador);
      }

      // ============================================================
      // ACTUALIZAR TOTALES
      // ============================================================
      function actualizarTotalesGenerales() {
        const total = todosLosRegistros.length;
        const texto = `${total} registro${total !== 1 ? "s" : ""}`;
        totalPie.innerHTML = `<strong>${total}</strong> registros totales`;
        totalMeta.textContent = texto;
        footerTotalRegistros.textContent = texto;
        contadorRegistros.textContent = total;
      }

      function actualizarTotalesParciales(cantidad) {
        const mes = formatearMesAnio(mesFiltro.value);
        const texto = `${cantidad} registro${cantidad !== 1 ? "s" : ""} en ${mes}`;
        // Actualizar el contador rápido
        const infoSpan = document.querySelector(".registros-info strong");
        if (infoSpan) {
          infoSpan.textContent = cantidad;
        }
        // Actualizar el badge de información
        const registrosInfoEl = document.getElementById("registrosInfo");
        if (registrosInfoEl) {
          registrosInfoEl.innerHTML = `
                            <i class="fas fa-file-alt"></i>
                            <strong>${cantidad}</strong> registros en ${mes}
                        `;
        }
      }

      function actualizarBadge() {
        const val = mesFiltro.value;
        badgeMes.textContent = val ? formatearMesAnio(val) : "—";
      }

      // ============================================================
      // EVENTOS
      // ============================================================
      mesFiltro.addEventListener("change", function () {
        actualizarBadge();
        renderizarTabla();
      });

      // ============================================================
      // INICIO
      // ============================================================
      document.addEventListener("DOMContentLoaded", () => {
        cargarDatos();
      });

      // Exponer función para recarga externa
      window.recargarInforme = cargarDatos;
    </script>
  </body>
</html>
