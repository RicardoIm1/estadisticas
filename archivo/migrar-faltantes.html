<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migración Completa a Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0f0f1a;
            color: #eee;
            padding: 20px;
            margin: 0;
        }
        #log {
            background: #0f0f1a;
            padding: 20px;
            border-radius: 10px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #333;
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.5;
        }
        .success { color: #00ff89; }
        .error { color: #ff4444; }
        .info { color: #4a9eff; }
        .title { color: #ffdd00; font-size: 18px; }
        .warning { color: #ff9900; }
        .danger { color: #ff2222; font-weight: bold; }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #4a9eff, #00ff89);
            border-radius: 10px;
            transition: width 0.5s ease;
            width: 0%;
        }
    </style>
</head>
<body>
    <h1>📋 Migración Completa a Supabase</h1>
    <div style="background: rgba(255,50,50,0.1); border: 1px solid #ff4444; border-radius: 10px; padding: 15px; margin: 10px 0;">
        <span style="color: #ff4444; font-weight: bold;">⚠️ ADVERTENCIA:</span>
        <span style="color: #eee;">Este script ELIMINARÁ todos los registros existentes y los volverá a migrar desde datos.json</span>
    </div>
    <button onclick="iniciarMigracion()" style="padding: 12px 30px; background: #ff4444; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: bold;">
        🚨 ELIMINAR Y MIGRAR TODO
    </button>
    <div class="progress-bar">
        <div class="fill" id="progressFill"></div>
    </div>
    <div id="log">⏳ Esperando inicio...</div>

    <script>
        const SUPABASE_URL = "https://njtlruvhcatklccdxpla.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qdGxydXZoY2F0a2xjY2R4cGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzIwOTIsImV4cCI6MjEwMDkwODA5Mn0.MzVwk4OWvahcUfP1KF_kHbLlIXWIbZ-wljce1i2Q1sc";

        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const logDiv = document.getElementById('log');
        const progressFill = document.getElementById('progressFill');

        function log(message, type = 'info') {
            const colors = {
                success: '#00ff89',
                error: '#ff4444',
                info: '#4a9eff',
                title: '#ffdd00',
                warning: '#ff9900',
                danger: '#ff2222'
            };
            logDiv.innerHTML += `<span style="color: ${colors[type] || '#eee'}">${message}</span>\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateProgress(current, total) {
            const percent = total > 0 ? Math.round((current / total) * 100) : 0;
            progressFill.style.width = percent + '%';
        }

        async function cargarDatosJSON() {
            try {
                log('📂 Cargando datos.json...', 'info');
                const response = await fetch('datos.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const registros = Array.isArray(data) ? data : (data.rows || data.data || []);
                log(`✅ Cargados ${registros.length} registros`, 'success');
                return registros;
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
                return null;
            }
        }

        async function iniciarMigracion() {
            if (!confirm('⚠️ ¿Estás SEGURO? Esto ELIMINARÁ TODOS los registros y los volverá a migrar.')) return;
            if (!confirm('⚠️ Confirmación final: ¿Eliminar TODOS los registros de expedientes?')) return;

            log('\n🚨 INICIANDO MIGRACIÓN COMPLETA...\n', 'danger');

            // 1. Eliminar todos los registros
            log('🗑️ Eliminando registros existentes...', 'warning');
            const { error: deleteError } = await sb
                .from('expedientes')
                .delete()
                .neq('id', '00000000-0000-0000-0000-000000000000');

            if (deleteError) {
                log(`❌ Error al eliminar: ${deleteError.message}`, 'error');
                return;
            }
            log('✅ Registros eliminados', 'success');

            // 2. Cargar datos.json
            const registros = await cargarDatosJSON();
            if (!registros) return;

            // 3. Migrar todos
            log('\n🚀 Migrando todos los registros...\n', 'title');

            let migrados = 0;
            let errores = 0;
            const total = registros.length;
            const BATCH_SIZE = 100;

            for (let i = 0; i < registros.length; i += BATCH_SIZE) {
                const batch = registros.slice(i, i + BATCH_SIZE);
                const batchRegistros = [];

                for (const item of batch) {
                    const registro = {
                        nombre_paciente: (item["NOMBRE DEL PACIENTE"] || "").trim(),
                        expediente: (item["EXPEDIENTE"] || "").trim(),
                        servicio: (item["SERVICIO"] || "").trim() || null,
                        fecha_registro: item["FECHA DE REGISTRO"] 
                            ? new Date(item["FECHA DE REGISTRO"]).toISOString().split('T')[0] 
                            : null,
                        estado: item["estado"] || "Activo",
                        sexo: item["sexo"] || null,
                        fecha_nac: item["fecha_nac"] || null,
                        tel_part: item["tel_part"] || null
                    };

                    if (registro.expediente) {
                        batchRegistros.push(registro);
                    }
                }

                if (batchRegistros.length === 0) continue;

                try {
                    const { error } = await sb
                        .from('expedientes')
                        .insert(batchRegistros);

                    if (error) {
                        for (const reg of batchRegistros) {
                            try {
                                const { error: singleError } = await sb
                                    .from('expedientes')
                                    .insert([reg]);

                                if (singleError) {
                                    errores++;
                                    log(`❌ ${reg.expediente}: ${singleError.message}`, 'error');
                                } else {
                                    migrados++;
                                }
                            } catch (e) {
                                errores++;
                            }
                        }
                    } else {
                        migrados += batchRegistros.length;
                    }

                    const procesados = Math.min(i + BATCH_SIZE, total);
                    updateProgress(procesados, total);
                    log(`📊 Progreso: ${procesados}/${total} (${Math.round((procesados/total)*100)}%) - ${migrados} migrados`, 'info');

                } catch (error) {
                    log(`❌ Error: ${error.message}`, 'error');
                    errores += batchRegistros.length;
                }

                await new Promise(resolve => setTimeout(resolve, 300));
            }

            log('\n' + '='.repeat(60), 'info');
            log('📊 MIGRACIÓN COMPLETADA', 'title');
            log(`   ✅ Migrados exitosamente: ${migrados}`, 'success');
            log(`   ❌ Errores: ${errores}`, 'error');
            log(`   📦 Total procesados: ${total}`, 'info');
            log('='.repeat(60), 'info');

            // Verificar tu registro
            const { data: verif } = await sb
                .from('expedientes')
                .select('*')
                .eq('expediente', '10-65-73');

            if (verif && verif.length > 0) {
                log('\n✅ TU REGISTRO ESTÁ EN SUPABASE:', 'success');
                log(JSON.stringify(verif, null, 2), 'success');
            } else {
                log('\n❌ TU REGISTRO NO APARECE', 'error');
            }
        }
    </script>
</body>
</html>
