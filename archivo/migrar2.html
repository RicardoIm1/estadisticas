<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Migrar CSV a Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body {
        font-family: "Courier New", monospace;
        background: #0f0f1a;
        color: #eee;
        padding: 20px;
      }
      #log {
        background: #0f0f1a;
        padding: 20px;
        border-radius: 10px;
        max-height: 80vh;
        overflow-y: auto;
        border: 1px solid #333;
        white-space: pre-wrap;
        font-size: 13px;
        line-height: 1.5;
      }
      .success {
        color: #00ff89;
      }
      .error {
        color: #ff4444;
      }
      .info {
        color: #4a9eff;
      }
      .title {
        color: #ffdd00;
        font-size: 18px;
      }
      .warning {
        color: #ff9900;
      }
      .progress-bar {
        width: 100%;
        height: 20px;
        background: #333;
        border-radius: 10px;
        margin: 10px 0;
        overflow: hidden;
      }
      .progress-bar .fill {
        height: 100%;
        background: linear-gradient(90deg, #4a9eff, #00ff89);
        border-radius: 10px;
        transition: width 0.5s ease;
        width: 0%;
      }
      .drop-zone {
        border: 2px dashed #4a9eff;
        border-radius: 10px;
        padding: 40px;
        text-align: center;
        margin: 20px 0;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .drop-zone:hover {
        background: rgba(74, 158, 255, 0.1);
        border-color: #00ff89;
      }
      .drop-zone.dragover {
        background: rgba(0, 255, 89, 0.1);
        border-color: #00ff89;
      }
    </style>
  </head>
  <body>
    <h1>📋 Migrar CSV a Supabase</h1>
    <p style="color: rgba(255, 255, 255, 0.5)">Arrastra tu archivo CSV</p>

    <div class="drop-zone" id="dropZone">
      <p style="margin-top: 10px; font-size: 48px">📂</p>
      <p>Arrastra tu archivo CSV aquí</p>
      <input type="file" id="fileInput" accept=".csv" style="display: none" />
    </div>

    <div class="progress-bar">
      <div class="fill" id="progressFill"></div>
    </div>
    <div id="log">⏳ Esperando archivo...</div>

    <script>
      const SUPABASE_URL = "https://njtlruvhcatklccdxpla.supabase.co";
      const SUPABASE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qdGxydXZoY2F0a2xjY2R4cGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzIwOTIsImV4cCI6MjEwMDkwODA5Mn0.MzVwk4OWvahcUfP1KF_kHbLlIXWIbZ-wljce1i2Q1sc";

      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const logDiv = document.getElementById("log");
      const progressFill = document.getElementById("progressFill");
      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");

      function log(message, type = "info") {
        const colors = {
          success: "#00ff89",
          error: "#ff4444",
          info: "#4a9eff",
          title: "#ffdd00",
          warning: "#ff9900",
        };
        logDiv.innerHTML += `<span style="color: ${colors[type] || "#eee"}">${message}</span>\n`;
        logDiv.scrollTop = logDiv.scrollHeight;
      }

      function updateProgress(current, total) {
        const percent = total > 0 ? Math.round((current / total) * 100) : 0;
        progressFill.style.width = percent + "%";
      }

      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("dragover");
      });
      dropZone.addEventListener("dragleave", () => {
        dropZone.classList.remove("dragover");
      });
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");
        if (e.dataTransfer.files.length > 0)
          procesarArchivo(e.dataTransfer.files[0]);
      });
      dropZone.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length > 0) procesarArchivo(e.target.files[0]);
      });

      function formatearFecha(fecha) {
        if (!fecha) return null;
        // Si ya está en formato YYYY-MM-DD
        if (/^\d{4}-\d{2}-\d{2}$/.test(fecha)) return fecha;
        // Si tiene formato DD/MM/YYYY o DD/MM/YYYY HH:MM:SS
        const partes = fecha.split(/[\/\s:]/);
        if (partes.length >= 3) {
          let dia = partes[0].padStart(2, "0");
          let mes = partes[1].padStart(2, "0");
          let anio = partes[2];
          if (anio.length === 2) {
            anio = parseInt(anio) > 30 ? "19" + anio : "20" + anio;
          }
          return `${anio}-${mes}-${dia}`;
        }
        return fecha;
      }

      async function procesarArchivo(file) {
        log(`📂 Procesando: ${file.name}`, "info");

        try {
          const text = await file.text();
          const lines = text.split("\n").filter((line) => line.trim());
          if (lines.length === 0) {
            log("❌ Archivo vacío", "error");
            return;
          }

          // Leer encabezados
          const headers = lines[0]
            .split(",")
            .map((h) => h.trim().toLowerCase());
          log(`📋 Columnas: ${headers.join(", ")}`, "info");

          // Verificar que los encabezados sean los correctos
          const expectedHeaders = [
            "expediente",
            "nombre_paciente",
            "fecha_registro",
            "estado",
            "sexo",
            "fecha_nac",
            "tel_part",
          ];
          const missing = expectedHeaders.filter((h) => !headers.includes(h));
          if (missing.length > 0) {
            log(`❌ Faltan columnas: ${missing.join(", ")}`, "error");
            return;
          }

          // Procesar datos
          const registros = [];
          for (let i = 1; i < lines.length; i++) {
            const values = lines[i].split(",").map((v) => v.trim());
            const obj = {};
            headers.forEach((header, index) => {
              obj[header] = values[index] || "";
            });
            registros.push(obj);
          }

          log(`✅ ${registros.length} registros cargados`, "success");

          // Verificar si la tabla tiene registros
          const { count } = await sb
            .from("expedientes")
            .select("*", { count: "exact", head: true });
          if (count > 0) {
            log(`⚠️ Tabla tiene ${count} registros`, "warning");
            if (!confirm(`¿Eliminar los ${count} registros existentes?`))
              return;
            await sb
              .from("expedientes")
              .delete()
              .neq("id", "00000000-0000-0000-0000-000000000000");
            log("🗑️ Tabla vaciada", "warning");
          }

          log("\n🚀 Migrando...\n", "title");

          let migrados = 0;
          let errores = 0;
          const BATCH_SIZE = 500;

          for (let i = 0; i < registros.length; i += BATCH_SIZE) {
            const batch = registros.slice(i, i + BATCH_SIZE);
            const batchRegistros = [];

            for (const item of batch) {
              const registro = {
                expediente: (item.expediente || "").trim(),
                nombre_paciente: (item.nombre_paciente || "").trim(),
                fecha_registro: formatearFecha(item.fecha_registro),
                estado: item.estado || "Activo",
                sexo: item.sexo || null,
                fecha_nac: formatearFecha(item.fecha_nac),
                tel_part: (item.tel_part || "").trim() || null,
              };

              if (registro.expediente) batchRegistros.push(registro);
            }

            try {
              const { error } = await sb
                .from("expedientes")
                .insert(batchRegistros);
              if (error) {
                for (const reg of batchRegistros) {
                  const { error: singleError } = await sb
                    .from("expedientes")
                    .insert([reg]);
                  if (singleError) {
                    errores++;
                    if (singleError.code !== "23505")
                      log(
                        `❌ ${reg.expediente}: ${singleError.message}`,
                        "error",
                      );
                  } else migrados++;
                }
              } else migrados += batchRegistros.length;

              updateProgress(i + BATCH_SIZE, registros.length);
              log(
                `📊 ${Math.round(((i + BATCH_SIZE) / registros.length) * 100)}% - ${migrados} migrados`,
                "info",
              );
            } catch (error) {
              errores += batchRegistros.length;
            }
            await new Promise((r) => setTimeout(r, 200));
          }

          log("\n" + "=".repeat(60), "info");
          log("📊 MIGRACIÓN COMPLETADA", "title");
          log(`   ✅ ${migrados} migrados`, "success");
          log(`   ❌ ${errores} errores`, "error");
          log("=".repeat(60), "info");

          const { count: finalCount } = await sb
            .from("expedientes")
            .select("*", { count: "exact", head: true });
          log(`\n📊 Total en Supabase: ${finalCount} registros`, "info");
        } catch (error) {
          log(`❌ Error: ${error.message}`, "error");
        }
      }
    </script>
  </body>
</html>
