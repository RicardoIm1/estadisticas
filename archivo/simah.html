<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BD SIMAH - Supabase</title>

    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/img/favicon.ico" type="image/x-icon" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link href="/main_css/estilos.css" rel="stylesheet" />

    <style>
      /* ===== SCROLLBAR SUTIL ===== */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.03);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.12) rgba(255, 255, 255, 0.03);
      }

      /* ===== GLASS CONTAINER ===== */
      .glass {
        background: rgba(255, 255, 255, 0.05) !important;
        backdrop-filter: blur(10px) !important;
        -webkit-backdrop-filter: blur(10px) !important;
        border-radius: 20px;
        padding: 2rem;
        max-width: 1400px;
        margin: 0 auto;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        transition:
          background 1s ease,
          border-color 1s ease,
          box-shadow 1s ease;
      }

      /* ===== ESTADOS DEL GLASS (COLOR DE FONDO) ===== */
      .glass.loading {
        background: rgba(74, 158, 255, 0.15) !important;
        border-color: rgba(74, 158, 255, 0.4);
        box-shadow: 0 8px 32px rgba(74, 158, 255, 0.15);
      }

      .glass.success {
        background: rgba(0, 255, 89, 0.1) !important;
        border-color: rgba(0, 255, 89, 0.3);
        box-shadow: 0 8px 32px rgba(0, 255, 89, 0.1);
      }

      .glass.error {
        background: rgba(255, 50, 50, 0.12) !important;
        border-color: rgba(255, 50, 50, 0.3);
        box-shadow: 0 8px 32px rgba(255, 50, 50, 0.1);
      }

      /* ===== HEADER ORIGINAL ===== */
      .header-simah {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
        margin-bottom: 15px;
      }

      .header-simah h5 {
        font-size: 1.1rem;
        color: #fff;
        margin: 0;
      }

      .header-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* ===== BOTONES ===== */
      .btn {
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
      }

      .btn-primary {
        background: linear-gradient(135deg, #4a9eff, #2d7dd2);
        color: white;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(74, 158, 255, 0.4);
      }

      .btn-success {
        background: linear-gradient(135deg, #00ff89, #00cc6a);
        color: #0f0f1a;
      }
      .btn-success:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(0, 255, 89, 0.4);
      }

      .btn-danger {
        background: linear-gradient(135deg, #ff4444, #cc0000);
        color: white;
      }
      .btn-danger:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(255, 50, 50, 0.4);
      }

      .btn-outline {
        background: rgba(255, 255, 255, 0.08);
        color: #eee;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .btn-outline:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      .btn-sm {
        padding: 4px 8px;
        font-size: 11px;
      }

      /* ===== CONTENEDOR PRINCIPAL CON GRID ===== */
      .grid {
        display: grid;
        grid-template-rows: 1fr auto;
        height: 100%;
        gap: 20px;
      }

      /* ===== CARDS GRID ===== */
      .cards-grid {
        grid-row: 1;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        width: 100%;
        overflow-y: auto;
      }

      /* ===== CARD INDIVIDUAL ===== */
      .card {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 1.2rem;
        transition:
          transform 0.2s ease,
          background 0.2s ease;
        min-height: 100px;
        overflow: hidden;
        word-wrap: break-word;
        hyphens: auto;
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .card:hover {
        transform: translateY(-3px);
        background: rgba(255, 255, 255, 0.12);
      }

      .card .card-actions {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 4px;
      }

      .card .card-actions button {
        background: rgba(255, 255, 255, 0.08);
        border: none;
        color: rgba(255, 255, 255, 0.6);
        padding: 3px 6px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 11px;
        transition: all 0.2s ease;
      }

      .card .card-actions button:hover {
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
      }

      .card .card-actions .btn-edit:hover {
        background: rgba(74, 158, 255, 0.3);
        color: #4a9eff;
      }
      .card .card-actions .btn-delete:hover {
        background: rgba(255, 50, 50, 0.3);
        color: #ff4444;
      }

      .card span {
        font-weight: 600;
        font-size: 14px;
        display: block;
        margin-bottom: 5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #fff;
      }

      .card small {
        font-size: 0.85rem;
        display: block;
        margin-bottom: 3px;
        color: rgba(255, 255, 255, 0.8);
      }

      .card small.inline {
        display: inline-block !important;
        margin-right: 10px;
      }

      /* ===== ESTADOS ===== */
      .estado-defuncion {
        color: #ff4444 !important;
        font-weight: bold !important;
      }
      .estado-activo {
        color: #00ff89 !important;
        font-weight: bold !important;
      }
      .estado-inactivo {
        color: #ff9900 !important;
        font-weight: bold !important;
      }
      .estado-alta {
        color: #4a9eff !important;
        font-weight: bold !important;
      }

      .expediente-verde {
        color: #00ff59;
        font-weight: bold;
        text-shadow: 0 0 5px rgba(0, 255, 89, 0.3);
      }

      /* ===== PAGINACIÓN ===== */
      .paginacion {
        grid-row: 2;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        padding: 15px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        flex-wrap: wrap;
      }

      .paginacion button {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .paginacion button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.2);
      }

      .paginacion button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .paginacion span {
        font-weight: 600;
        color: white;
      }

      .paginacion .page-numbers {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .paginacion .page-number {
        padding: 6px 12px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.05);
        color: rgba(255, 255, 255, 0.6);
        cursor: pointer;
        transition: all 0.3s ease;
        border: 1px solid transparent;
        font-size: 13px;
      }

      .paginacion .page-number:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
      }

      .paginacion .page-number.active {
        background: #4a9eff;
        color: white;
        border-color: #4a9eff;
      }

      /* ===== BUSCADOR Y FILTROS EN UNA SOLA FILA ===== */
      .search-filters-row {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 12px 0 20px;
        flex-wrap: wrap;
      }

      .buscador {
        flex: 2;
        min-width: 200px;
        position: relative;
      }

      .buscador input {
        width: 100%;
        padding: 10px 38px 10px 14px;
        border-radius: 12px;
        border: none;
        outline: none;
        font-size: 14px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        transition: all 0.3s ease;
      }

      .buscador input:focus {
        background: rgba(255, 255, 255, 0.18);
        box-shadow: 0 0 0 2px rgba(74, 158, 255, 0.3);
      }

      .buscador input::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }

      .buscador i {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0.6;
      }

      .filtros {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        flex: 1;
        min-width: 200px;
      }

      .filtros select {
        flex: 1;
        min-width: 120px;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 14px;
        cursor: pointer;
        outline: none;
        transition: all 0.3s ease;
      }

      .filtros select:focus {
        border-color: #4a9eff;
        box-shadow: 0 0 0 2px rgba(74, 158, 255, 0.2);
        background: rgba(255, 255, 255, 0.12);
      }

      .filtros select option {
        background: #1a1a2e;
        color: #fff;
      }

      /* ===== ESTADÍSTICAS EN UNA SOLA FILA ===== */
      .stats-row {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
        flex-wrap: wrap;
        justify-content: space-around;
      }

      .stat-card {
        flex: 1;
        min-width: 70px;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 10px;
        padding: 8px 12px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        text-align: center;
      }

      .stat-card .number {
        font-size: 1.3rem;
        font-weight: 700;
        display: block;
      }

      .stat-card .label {
        font-size: 9px;
        color: rgba(255, 255, 255, 0.5);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .stat-card.activo .number {
        color: #00ff89;
      }
      .stat-card.inactivo .number {
        color: #ff9900;
      }
      .stat-card.defuncion .number {
        color: #ff4444;
      }
      .stat-card.alta .number {
        color: #4a9eff;
      }
      .stat-card.total .number {
        color: #fff;
      }

      /* ===== MODAL ===== */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(8px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .modal-overlay.active {
        display: flex;
      }

      .modal {
        background: rgba(30, 35, 45, 0.95);
        border-radius: 16px;
        padding: 2rem;
        max-width: 550px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        animation: modalIn 0.3s ease;
      }

      @keyframes modalIn {
        from {
          transform: translateY(30px) scale(0.95);
          opacity: 0;
        }
        to {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .modal-header h2 {
        font-size: 1.3rem;
        color: #fff;
      }

      .modal-close {
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.4);
        font-size: 1.5rem;
        cursor: pointer;
        transition: color 0.3s ease;
      }

      .modal-close:hover {
        color: #fff;
      }

      .modal-body {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .form-group label {
        font-size: 12px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.7);
      }

      .form-group input,
      .form-group select {
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        font-size: 14px;
        transition: all 0.3s ease;
      }

      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: #4a9eff;
        box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.2);
        background: rgba(255, 255, 255, 0.1);
      }

      .form-group input::placeholder {
        color: rgba(255, 255, 255, 0.3);
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .modal-actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        padding-top: 1rem;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      .modal-actions .btn {
        flex: 1;
        justify-content: center;
      }

      /* ===== RESPONSIVE ===== */
      @media (max-width: 1200px) {
        .cards-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      @media (max-width: 900px) {
        .cards-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .form-row {
          grid-template-columns: 1fr;
        }

        .search-filters-row {
          flex-direction: column;
          align-items: stretch;
        }

        .buscador {
          flex: none;
          width: 100%;
        }

        .filtros {
          flex: none;
          width: 100%;
        }

        .filtros select {
          flex: 1;
        }
      }

      @media (max-width: 600px) {
        .cards-grid {
          grid-template-columns: 1fr;
        }
        .paginacion {
          flex-direction: column;
          gap: 10px;
        }

        .stats-row {
          flex-wrap: wrap;
          gap: 6px;
        }

        .stat-card {
          flex: 1 1 calc(33% - 6px);
          min-width: 60px;
          padding: 6px 8px;
        }

        .stat-card .number {
          font-size: 1rem;
        }

        .stat-card .label {
          font-size: 8px;
        }

        .header-simah {
          flex-direction: column;
          align-items: stretch;
        }
        .header-actions {
          justify-content: stretch;
        }
        .header-actions .btn {
          flex: 1;
          justify-content: center;
          font-size: 12px;
          padding: 8px 12px;
        }
        .modal {
          padding: 1.2rem;
          margin: 10px;
        }
        .glass {
          padding: 0.8rem;
          margin: 0.5rem;
        }

        .search-filters-row {
          flex-direction: column;
          gap: 8px;
        }

        .filtros {
          flex-direction: column;
        }

        .filtros select {
          width: 100%;
        }
      }

      /* ===== OCULTAR SCROLL PERO MANTENER FUNCIONALIDAD ===== */
      .glass .grid::-webkit-scrollbar,
      .cards-grid::-webkit-scrollbar {
        width: 4px;
      }
      .glass .grid::-webkit-scrollbar-thumb,
      .cards-grid::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
      }
      .glass .grid::-webkit-scrollbar-track,
      .cards-grid::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>

  <body>
    <div class="glass" id="dashboard">
      <div class="header-simah">
        <h5>📋 EXPEDIENTES CLÍNICOS - SUPABASE</h5>
        <div class="header-actions">
          <button class="btn btn-primary" onclick="abrirModal()">
            <i class="fas fa-plus"></i> Nuevo
          </button>
          <button class="btn btn-outline" onclick="recargarDatos()">
            <i class="fas fa-sync-alt"></i>
          </button>
        </div>
      </div>

      <div id="header"></div>

      <!-- 📊 ESTADÍSTICAS EN UNA SOLA FILA -->
      <div class="stats-row" id="stats">
        <div class="stat-card total">
          <span class="number" id="totalCount">0</span>
          <span class="label">Total</span>
        </div>
        <div class="stat-card activo">
          <span class="number" id="activoCount">0</span>
          <span class="label">Activos</span>
        </div>
        <div class="stat-card inactivo">
          <span class="number" id="inactivoCount">0</span>
          <span class="label">Inactivos</span>
        </div>
        <div class="stat-card defuncion">
          <span class="number" id="defuncionCount">0</span>
          <span class="label">Defunciones</span>
        </div>
        <div class="stat-card alta">
          <span class="number" id="altaCount">0</span>
          <span class="label">Altas</span>
        </div>
      </div>

      <!-- 🔍 BUSCADOR Y FILTROS EN UNA SOLA FILA -->
      <div class="search-filters-row">
        <div class="buscador">
          <input
            type="text"
            id="busqueda"
            placeholder="Buscar por nombre, expediente o servicio…"
            oninput="buscar()"
          />
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="filtros">
          <select id="estadoFilter" onchange="buscar()">
            <option value="">Todos los estados</option>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
            <option value="Defunción">Defunción</option>
            <option value="Alta">Alta</option>
          </select>
          <select id="sexoFilter" onchange="buscar()">
            <option value="">Todos los sexos</option>
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
          </select>
        </div>
      </div>

      <!-- 🎯 CONTENEDOR GRID PRINCIPAL -->
      <div class="grid">
        <div id="cards" class="cards-grid"></div>
        <div class="paginacion">
          <button onclick="cambiarPagina(-1)" id="prevBtn" disabled>
            ← Anterior
          </button>
          <div class="page-numbers" id="pageNumbers"></div>
          <button onclick="cambiarPagina(1)" id="nextBtn">Siguiente →</button>
        </div>
      </div>

      <div id="footer"></div>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modalTitle">Nuevo Expediente</h2>
          <button class="modal-close" onclick="cerrarModal()">&times;</button>
        </div>
        <form id="crudForm" onsubmit="guardar(event)">
          <input type="hidden" id="editId" />
          <div class="modal-body">
            <div class="form-group">
              <label>Nombre del Paciente *</label>
              <input
                type="text"
                id="nombrePaciente"
                required
                placeholder="Ej: Juan Pérez García"
              />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Expediente *</label>
                <input
                  type="text"
                  id="expediente"
                  required
                  placeholder="Ej: 24-01-001"
                />
              </div>
              <div class="form-group">
                <label>Servicio</label>
                <input
                  type="text"
                  id="servicio"
                  placeholder="Ej: Medicina Interna"
                />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Fecha de Registro</label>
                <input type="date" id="fechaRegistro" />
              </div>
              <div class="form-group">
                <label>Fecha de Nacimiento</label>
                <input type="date" id="fechaNac" />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Estado</label>
                <select id="estado">
                  <option value="Activo">Activo</option>
                  <option value="Inactivo">Inactivo</option>
                  <option value="Defunción">Defunción</option>
                  <option value="Alta">Alta</option>
                </select>
              </div>
              <div class="form-group">
                <label>Sexo</label>
                <select id="sexo">
                  <option value="">No especificado</option>
                  <option value="M">Masculino</option>
                  <option value="F">Femenino</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Teléfono</label>
              <input type="text" id="telPart" placeholder="Ej: 555-1234" />
            </div>
          </div>
          <div class="modal-actions">
            <button type="submit" class="btn btn-success">
              <i class="fas fa-save"></i> Guardar
            </button>
            <button
              type="button"
              class="btn btn-outline"
              onclick="cerrarModal()"
            >
              Cancelar
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ⚠️ CARGA LA LIBRERÍA DE SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      // ============================================================
      // CONFIGURACIÓN SUPABASE
      // ============================================================
      const SUPABASE_URL = "https://njtlruvhcatklccdxpla.supabase.co";
      const SUPABASE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qdGxydXZoY2F0a2xjY2R4cGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzIwOTIsImV4cCI6MjEwMDkwODA5Mn0.MzVwk4OWvahcUfP1KF_kHbLlIXWIbZ-wljce1i2Q1sc";

      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // ============================================================
      // VARIABLES GLOBALES
      // ============================================================
      let datos = [];
      let paginaActual = 1;
      const registrosPorPagina = 12;
      let textoBusqueda = "";
      let estadoFiltro = "";
      let sexoFiltro = "";
      let totalRegistros = 0;

      // ============================================================
      // SISTEMA DE ESTADO (como el login)
      // ============================================================
      let intensidadUso = 0;
      let respiracionInterval;

      function iniciarRespiracion() {
        const dashboard = document.querySelector(".glass");
        if (!dashboard) return;

        clearInterval(respiracionInterval);

        let fase = 0;
        respiracionInterval = setInterval(() => {
          fase += 0.02;
          const intensidad = Math.min(0.15 + intensidadUso / 80, 0.4);
          const escala = 1 + Math.sin(fase) * intensidad * 0.02;
          dashboard.style.transform = `scale(${escala})`;
        }, 500);
      }

      function setEstado(estado, mensaje = null) {
        const dashboard = document.querySelector(".glass");
        if (!dashboard) return;

        intensidadUso = Math.min(intensidadUso + 1, 10);
        iniciarRespiracion();
        setTimeout(
          () => (intensidadUso = Math.max(intensidadUso - 1, 0)),
          8000,
        );

        dashboard.classList.remove("loading", "success", "error");
        dashboard.classList.add(estado);

        // Si es success, después de 3 segundos vuelve a normal
        if (estado === "success") {
          setTimeout(() => {
            dashboard.classList.remove("loading", "success", "error");
          }, 3000);
        } else if (estado === "error") {
          setTimeout(() => {
            dashboard.classList.remove("loading", "success", "error");
          }, 4000);
        } else if (estado === "loading") {
          // El loading se quita cuando termina la operación
        }
      }

      // Iniciar respiración al cargar
      document.addEventListener("DOMContentLoaded", function () {
        iniciarRespiracion();
      });

      // ============================================================
      // FUNCIONES CRUD
      // ============================================================

      // 📥 CARGAR DATOS
      async function cargarDatos() {
        setEstado("loading");

        try {
          let query = sb.from("expedientes").select("*", { count: "exact" });

          if (textoBusqueda) {
            query = query.or(
              `nombre_paciente.ilike.%${textoBusqueda}%,` +
                `expediente.ilike.%${textoBusqueda}%,` +
                `servicio.ilike.%${textoBusqueda}%`,
            );
          }

          if (estadoFiltro) {
            query = query.eq("estado", estadoFiltro);
          }

          if (sexoFiltro) {
            query = query.eq("sexo", sexoFiltro);
          }

          const from = (paginaActual - 1) * registrosPorPagina;
          const to = from + registrosPorPagina - 1;

          const { data, error, count } = await query
            .order("nombre_paciente", { ascending: true })
            .range(from, to);

          if (error) throw error;

          datos = data || [];
          totalRegistros = count || 0;

          renderCards(datos);
          actualizarEstadisticas();
          renderPaginacion(
            totalRegistros,
            Math.ceil(totalRegistros / registrosPorPagina),
          );

          setEstado("success");
        } catch (error) {
          console.error("Error:", error);
          setEstado("error");
        }
      }

      // 📊 ESTADÍSTICAS
      async function actualizarEstadisticas() {
        try {
          const { count: total } = await sb
            .from("expedientes")
            .select("*", { count: "exact", head: true });

          const { count: activos } = await sb
            .from("expedientes")
            .select("*", { count: "exact", head: true })
            .eq("estado", "Activo");

          const { count: inactivos } = await sb
            .from("expedientes")
            .select("*", { count: "exact", head: true })
            .eq("estado", "Inactivo");

          const { count: defunciones } = await sb
            .from("expedientes")
            .select("*", { count: "exact", head: true })
            .eq("estado", "Defunción");

          const { count: altas } = await sb
            .from("expedientes")
            .select("*", { count: "exact", head: true })
            .eq("estado", "Alta");

          document.getElementById("totalCount").textContent = total || 0;
          document.getElementById("activoCount").textContent = activos || 0;
          document.getElementById("inactivoCount").textContent = inactivos || 0;
          document.getElementById("defuncionCount").textContent =
            defunciones || 0;
          document.getElementById("altaCount").textContent = altas || 0;
        } catch (error) {
          console.error("Error en estadísticas:", error);
        }
      }

      // ➕ CREAR
      async function crearRegistro(datosForm) {
        setEstado("loading");

        try {
          const { data, error } = await sb
            .from("expedientes")
            .insert([datosForm])
            .select();

          if (error) throw error;

          setEstado("success");
          await cargarDatos();
          return data;
        } catch (error) {
          setEstado("error");
          console.error("Error al crear:", error);
          throw error;
        }
      }

      // ✏️ ACTUALIZAR
      async function actualizarRegistro(id, datosForm) {
        setEstado("loading");

        try {
          const { data, error } = await sb
            .from("expedientes")
            .update(datosForm)
            .eq("id", id)
            .select();

          if (error) throw error;

          setEstado("success");
          await cargarDatos();
          return data;
        } catch (error) {
          setEstado("error");
          console.error("Error al actualizar:", error);
          throw error;
        }
      }

      // 🗑️ ELIMINAR
      async function eliminarRegistro(id, nombre) {
        if (!confirm(`¿Estás seguro de eliminar el expediente de "${nombre}"?`))
          return;

        setEstado("loading");

        try {
          const { error } = await sb.from("expedientes").delete().eq("id", id);

          if (error) throw error;

          setEstado("success");
          await cargarDatos();
        } catch (error) {
          setEstado("error");
          console.error("Error al eliminar:", error);
        }
      }

      // ============================================================
      // FUNCIONES DE INTERFAZ
      // ============================================================

      // 🎨 RENDER CARDS
      function renderCards(rows) {
        const cont = document.getElementById("cards");
        cont.innerHTML = "";

        if (!rows || rows.length === 0) {
          cont.innerHTML = `
          <div style="grid-column:1/-1; text-align:center; padding:40px; color:rgba(255,255,255,0.3);">
            <i class="fas fa-inbox" style="font-size:32px; display:block; margin-bottom:10px;"></i>
            No hay registros que coincidan con la búsqueda
          </div>
        `;
          return;
        }

        rows.forEach((r) => {
          const estado = r.estado || "";
          let estadoClass = "";
          if (estado === "Defunción") estadoClass = "estado-defuncion";
          else if (estado === "Activo") estadoClass = "estado-activo";
          else if (estado === "Inactivo") estadoClass = "estado-inactivo";
          else if (estado === "Alta") estadoClass = "estado-alta";

          cont.innerHTML += `
          <div class="card">
            <div class="card-actions">
              <button class="btn-edit" onclick="abrirModalEditar('${r.id}')" title="Editar">
                <i class="fas fa-edit"></i>
              </button>
              <button class="btn-delete" onclick="eliminarRegistro('${r.id}','${r.nombre_paciente}')" title="Eliminar">
                <i class="fas fa-trash"></i>
              </button>
            </div>
            <span><b>${r.nombre_paciente || ""}</b></span>
            <small>Expediente: <strong class="expediente-verde">${r.expediente || ""}</strong></small>
            <small>Servicio: ${r.servicio || ""}</small>
            <small>Registro: ${r.fecha_registro || ""}</small>
            <small>Estado: <span class="${estadoClass}">${estado || ""}</span></small>
            <small>Sexo: ${r.sexo || ""}</small>
            <small>Teléfono: ${r.tel_part || ""}</small>
          </div>
        `;
        });
      }

      // 📋 RENDER PAGINACIÓN
      function renderPaginacion(total, totalPaginas) {
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        prevBtn.disabled = paginaActual <= 1;
        nextBtn.disabled = paginaActual >= totalPaginas;

        let html = "";
        const maxVisible = 5;
        let inicio = Math.max(1, paginaActual - Math.floor(maxVisible / 2));
        let fin = Math.min(totalPaginas, inicio + maxVisible - 1);

        if (fin - inicio + 1 < maxVisible) {
          inicio = Math.max(1, fin - maxVisible + 1);
        }

        if (inicio > 1) {
          html += `<span class="page-number" onclick="irPagina(1)">1</span>`;
          if (inicio > 2)
            html += `<span style="color:rgba(255,255,255,0.2);">…</span>`;
        }

        for (let i = inicio; i <= fin; i++) {
          html += `<span class="page-number ${i === paginaActual ? "active" : ""}" onclick="irPagina(${i})">${i}</span>`;
        }

        if (fin < totalPaginas) {
          if (fin < totalPaginas - 1)
            html += `<span style="color:rgba(255,255,255,0.2);">…</span>`;
          html += `<span class="page-number" onclick="irPagina(${totalPaginas})">${totalPaginas}</span>`;
        }

        document.getElementById("pageNumbers").innerHTML = html;
      }

      // 🔍 BUSCAR
      function buscar() {
        textoBusqueda = document
          .getElementById("busqueda")
          .value.toLowerCase()
          .trim();
        estadoFiltro = document.getElementById("estadoFilter").value;
        sexoFiltro = document.getElementById("sexoFilter").value;
        paginaActual = 1;
        cargarDatos();
      }

      // 🔄 CAMBIAR PÁGINA
      function cambiarPagina(direccion) {
        const totalPaginas =
          Math.ceil(totalRegistros / registrosPorPagina) || 1;
        if (direccion === -1 && paginaActual > 1) {
          paginaActual--;
          cargarDatos();
        }
        if (direccion === 1 && paginaActual < totalPaginas) {
          paginaActual++;
          cargarDatos();
        }
      }

      function irPagina(num) {
        paginaActual = num;
        cargarDatos();
      }

      // ============================================================
      // MODAL CRUD
      // ============================================================

      function abrirModal() {
        document.getElementById("modalTitle").textContent = "Nuevo Expediente";
        document.getElementById("editId").value = "";
        document.getElementById("crudForm").reset();
        document.getElementById("modalOverlay").classList.add("active");
      }

      function abrirModalEditar(id) {
        const registro = datos.find((r) => r.id === id);
        if (!registro) {
          setEstado("error");
          return;
        }

        document.getElementById("modalTitle").textContent = "Editar Expediente";
        document.getElementById("editId").value = id;
        document.getElementById("nombrePaciente").value =
          registro.nombre_paciente || "";
        document.getElementById("expediente").value = registro.expediente || "";
        document.getElementById("servicio").value = registro.servicio || "";
        document.getElementById("fechaRegistro").value =
          registro.fecha_registro || "";
        document.getElementById("fechaNac").value = registro.fecha_nac || "";
        document.getElementById("estado").value = registro.estado || "Activo";
        document.getElementById("sexo").value = registro.sexo || "";
        document.getElementById("telPart").value = registro.tel_part || "";

        document.getElementById("modalOverlay").classList.add("active");
      }

      function cerrarModal() {
        document.getElementById("modalOverlay").classList.remove("active");
      }

      // 📝 GUARDAR
      async function guardar(e) {
        e.preventDefault();

        const id = document.getElementById("editId").value;
        const datosForm = {
          nombre_paciente: document
            .getElementById("nombrePaciente")
            .value.trim(),
          expediente: document.getElementById("expediente").value.trim(),
          servicio: document.getElementById("servicio").value.trim() || null,
          fecha_registro:
            document.getElementById("fechaRegistro").value || null,
          fecha_nac: document.getElementById("fechaNac").value || null,
          estado: document.getElementById("estado").value,
          sexo: document.getElementById("sexo").value || null,
          tel_part: document.getElementById("telPart").value.trim() || null,
        };

        if (id) {
          await actualizarRegistro(id, datosForm);
        } else {
          await crearRegistro(datosForm);
        }

        cerrarModal();
      }

      // ============================================================
      // UTILIDADES
      // ============================================================

      function recargarDatos() {
        cargarDatos();
      }

      // ============================================================
      // HEADER Y FOOTER
      // ============================================================
      fetch("/comun/header-archivo.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("header").innerHTML = html;
          const s = document.createElement("script");
          s.src = "/comun/sesion_bk.js";
          s.onload = () => {
            if (typeof verificarAutenticacion === "function")
              verificarAutenticacion();
          };
          document.body.appendChild(s);
        });

      fetch("/comun/footer.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("footer").innerHTML = html;
          const footer = document.getElementById("footerText");
          if (footer) {
            footer.innerHTML = `Hecho con ❤️ por Ricardo · ${new Date().getFullYear()}`;
          }
        });

      // ============================================================
      // INICIALIZAR
      // ============================================================
      document.addEventListener("DOMContentLoaded", function () {
        cargarDatos();

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") cerrarModal();
        });

        document
          .getElementById("modalOverlay")
          .addEventListener("click", function (e) {
            if (e.target === this) cerrarModal();
          });
      });
    </script>
