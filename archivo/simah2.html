<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Migrar datos.json a Supabase (UUID)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body {
        font-family: "Courier New", monospace;
        background: #1a1a2e;
        color: #eee;
        padding: 20px;
        margin: 0;
      }
      #log {
        background: #0f0f1a;
        padding: 20px;
        border-radius: 10px;
        max-height: 80vh;
        overflow-y: auto;
        border: 1px solid #333;
        white-space: pre-wrap;
        font-size: 14px;
        line-height: 1.6;
      }
      .success {
        color: #00ff89;
      }
      .error {
        color: #ff4444;
      }
      .info {
        color: #4a9eff;
      }
      .title {
        color: #ffdd00;
        font-size: 20px;
      }
      .warning {
        color: #ff9900;
      }
    </style>
  </head>
  <body>
    <h1>📋 Migrador de datos.json → Supabase (UUID)</h1>
    <div id="log">⏳ Cargando datos.json...</div>

    <script>
      // ============================================================
// CONFIGURACIÓN SUPABASE
// ============================================================
const SUPABASE_URL = "https://njtlruvhcatklccdxpla.supabase.co";
const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qdGxydXZoY2F0a2xjY2R4cGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzIwOTIsImV4cCI6MjEwMDkwODA5Mn0.MzVwk4OWvahcUfP1KF_kHbLlIXWIbZ-wljce1i2Q1sc";

// ✅ SOLO UNA DECLARACIÓN - quita las otras
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // ============================================================
      // LOGGING
      // ============================================================
      const logDiv = document.getElementById("log");

      function log(message, type = "info") {
        const colors = {
          success: "#00ff89",
          error: "#ff4444",
          info: "#4a9eff",
          title: "#ffdd00",
          warning: "#ff9900",
        };
        logDiv.innerHTML += `<span style="color: ${colors[type] || "#eee"}">${message}</span>\n`;
        logDiv.scrollTop = logDiv.scrollHeight;
      }

      // ============================================================
      // CARGAR datos.json
      // ============================================================
      async function cargarDatosJSON() {
        try {
          log("📂 Cargando datos.json...", "info");

          const response = await fetch("datos.json");

          if (!response.ok) {
            throw new Error(
              `No se pudo cargar datos.json (HTTP ${response.status})`,
            );
          }

          const data = await response.json();
          const registros = Array.isArray(data)
            ? data
            : data.rows || data.data || [];

          log(
            `✅ Cargados ${registros.length} registros de datos.json\n`,
            "success",
          );

          return registros;
        } catch (error) {
          log(`❌ Error cargando datos.json: ${error.message}`, "error");
          log("\n💡 Asegúrate de que:", "info");
          log("   1. datos.json está en la misma carpeta", "info");
          log("   2. El archivo tiene formato JSON válido", "info");
          return null;
        }
      }

      // ============================================================
      // MIGRAR DATOS
      // ============================================================
      async function migrarDatos() {
        const registros = await cargarDatosJSON();
        if (!registros || registros.length === 0) {
          log("❌ No hay datos para migrar", "error");
          return;
        }

        log("\n🚀 Iniciando migración a Supabase (UUID)...\n", "title");

        let migrados = 0;
        let errores = 0;
        let duplicados = 0;

        for (let i = 0; i < registros.length; i++) {
          const item = registros[i];

          if (i % 10 === 0 && i > 0) {
            log(
              `\n📊 Progreso: ${i}/${registros.length} (${Math.round((i / registros.length) * 100)}%)`,
              "info",
            );
          }

          try {
            const registro = {
              // El ID se genera automáticamente con gen_random_uuid()
              nombre_paciente: item["NOMBRE DEL PACIENTE"]?.trim() || "",
              expediente: item["EXPEDIENTE"]?.trim() || "",
              servicio: item["SERVICIO"]?.trim() || "",
              fecha_registro: item["FECHA DE REGISTRO"]
                ? new Date(item["FECHA DE REGISTRO"])
                    .toISOString()
                    .split("T")[0]
                : null,
              estado: item["estado"] || "Activo",
              sexo: item["sexo"] || null,
              fecha_nac: item["fecha_nac"] || null,
              tel_part: item["tel_part"] || null,
            };

            if (!registro.expediente) {
              log(
                `⚠️ Expediente vacío en registro ${i + 1}, saltando`,
                "warning",
              );
              errores++;
              continue;
            }

            const { data, error } = await supabase
              .from("expedientes")
              .insert([registro])
              .select();

            if (error) {
              if (error.code === "23505") {
                log(
                  `⚠️ Duplicado: ${registro.expediente} (${registro.nombre_paciente})`,
                  "warning",
                );
                duplicados++;
              } else {
                log(
                  `❌ Error con ${registro.expediente}: ${error.message}`,
                  "error",
                );
                errores++;
              }
            } else {
              const uuid = data[0]?.id || "N/A";
              log(
                `✅ ${registro.nombre_paciente} (${registro.expediente}) → UUID: ${uuid.substring(0, 8)}...`,
                "success",
              );
              migrados++;
            }
          } catch (error) {
            log(`❌ Error en registro ${i + 1}: ${error.message}`, "error");
            errores++;
          }
        }

        log("\n" + "=".repeat(50), "info");
        log("📊 MIGRACIÓN COMPLETADA", "title");
        log(`   ✅ Migrados exitosamente: ${migrados}`, "success");
        log(`   ⚠️  Duplicados omitidos: ${duplicados}`, "warning");
        log(`   ❌ Errores: ${errores}`, "error");
        log(`   📦 Total procesados: ${registros.length}`, "info");
        log("=".repeat(50), "info");

        if (migrados > 0) {
          log("\n✅ Puedes cerrar esta ventana y abrir tu CRUD", "success");
          log("📋 Los datos ya están en Supabase con IDs UUID", "success");
        }
      }

      migrarDatos();
    </script>
  </body>
</html>
