<script>
  // ============================================================
  // CONFIGURACIÓN SUPABASE - CON VERIFICACIÓN DE EXISTENCIA
  // ============================================================
  const SUPABASE_URL = "https://njtlruvhcatklccdxpla.supabase.co";
  const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qdGxydXZoY2F0a2xjY2R4cGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzIwOTIsImV4cCI6MjEwMDkwODA5Mn0.MzVwk4OWvahcUfP1KF_kHbLlIXWIbZ-wljce1i2Q1sc";

  // ✅ VERIFICAR SI YA EXISTE - SOLO UNA DECLARACIÓN
  if (typeof supabase === "undefined") {
    var supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } else {
    console.log("✅ supabase ya estaba declarado, reutilizando...");
  }

  // ❌ ELIMINA ESTA LÍNEA SI ESTÁ PRESENTE:
  // const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ============================================================
  // VARIABLES GLOBALES
  // ============================================================
  let datos = [];
  let datosFiltrados = [];
  let paginaActual = 1;
  const registrosPorPagina = 15;
  let campoOrden = "nombre_paciente";
  let ordenDireccion = "asc";

  // ============================================================
  // FUNCIONES CRUD
  // ============================================================

  // 📥 CARGAR DATOS
  async function cargarDatos() {
    setGlassState("loading");

    try {
      const { data, error } = await supabase
        .from("expedientes")
        .select("*")
        .order(campoOrden, { ascending: ordenDireccion === "asc" });

      if (error) throw error;

      datos = data || [];
      datosFiltrados = [...datos];
      actualizarEstadisticas();
      mostrarPagina();
      setGlassState("success");
    } catch (error) {
      console.error("Error:", error);
      setGlassState("error");
      mostrarToast("Error al cargar datos: " + error.message, "error");
    }
  }

  // ➕ CREAR
  async function crearRegistro(datosForm) {
    try {
      const { data, error } = await supabase
        .from("expedientes")
        .insert([datosForm])
        .select();

      if (error) throw error;

      mostrarToast("✅ Expediente creado exitosamente", "success");
      await cargarDatos();
      return data;
    } catch (error) {
      mostrarToast("❌ Error al crear: " + error.message, "error");
      throw error;
    }
  }

  // ✏️ ACTUALIZAR
  async function actualizarRegistro(id, datosForm) {
    try {
      const { data, error } = await supabase
        .from("expedientes")
        .update(datosForm)
        .eq("id", id)
        .select();

      if (error) throw error;

      mostrarToast("✅ Expediente actualizado exitosamente", "success");
      await cargarDatos();
      return data;
    } catch (error) {
      mostrarToast("❌ Error al actualizar: " + error.message, "error");
      throw error;
    }
  }

  // 🗑️ ELIMINAR
  async function eliminarRegistro(id, nombre) {
    if (!confirm(`¿Estás seguro de eliminar el expediente de "${nombre}"?`))
      return;

    try {
      const { error } = await supabase
        .from("expedientes")
        .delete()
        .eq("id", id);

      if (error) throw error;

      mostrarToast("✅ Expediente eliminado exitosamente", "success");
      await cargarDatos();
    } catch (error) {
      mostrarToast("❌ Error al eliminar: " + error.message, "error");
    }
  }

  // ============================================================
  // FUNCIONES DE INTERFAZ
  // ============================================================

  // 📊 ESTADÍSTICAS
  function actualizarEstadisticas() {
    const total = datos.length;
    const activos = datos.filter((d) => d.estado === "Activo").length;
    const inactivos = datos.filter((d) => d.estado === "Inactivo").length;
    const defunciones = datos.filter((d) => d.estado === "Defunción").length;
    const altas = datos.filter((d) => d.estado === "Alta").length;

    document.getElementById("totalCount").textContent = total;
    document.getElementById("activoCount").textContent = activos;
    document.getElementById("inactivoCount").textContent = inactivos;
    document.getElementById("defuncionCount").textContent = defunciones;
    document.getElementById("altaCount").textContent = altas;
  }

  // 🔍 BUSCAR
  function buscar() {
    const texto = document
      .getElementById("searchInput")
      .value.toLowerCase()
      .trim();
    const estadoFilter = document.getElementById("estadoFilter").value;
    const sexoFilter = document.getElementById("sexoFilter").value;

    datosFiltrados = datos.filter((d) => {
      const matchTexto =
        !texto ||
        (d.nombre_paciente || "").toLowerCase().includes(texto) ||
        (d.expediente || "").toLowerCase().includes(texto) ||
        (d.servicio || "").toLowerCase().includes(texto);

      const matchEstado = !estadoFilter || d.estado === estadoFilter;
      const matchSexo = !sexoFilter || d.sexo === sexoFilter;

      return matchTexto && matchEstado && matchSexo;
    });

    paginaActual = 1;
    mostrarPagina();
  }

  // 📄 MOSTRAR PÁGINA
  function mostrarPagina() {
    const total = datosFiltrados.length;
    const totalPaginas = Math.ceil(total / registrosPorPagina) || 1;

    if (paginaActual > totalPaginas) paginaActual = totalPaginas;

    const inicio = (paginaActual - 1) * registrosPorPagina;
    const fin = Math.min(inicio + registrosPorPagina, total);
    const paginaDatos = datosFiltrados.slice(inicio, fin);

    renderizarTabla(paginaDatos);
    renderizarPaginacion(total, totalPaginas);
  }

  // 🎨 RENDER TABLA
  function renderizarTabla(rows) {
    const tbody = document.getElementById("tableBody");

    if (!rows || rows.length === 0) {
      tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align:center; padding:40px; color:rgba(255,255,255,0.3);">
                            <i class="fas fa-inbox" style="font-size:24px; display:block; margin-bottom:10px;"></i>
                            No hay registros que coincidan con la búsqueda
                        </td>
                    </tr>
                `;
      return;
    }

    tbody.innerHTML = rows
      .map((r) => {
        const estadoClass =
          {
            Activo: "estado-activo",
            Inactivo: "estado-inactivo",
            Defunción: "estado-defuncion",
            Alta: "estado-alta",
          }[r.estado] || "";

        return `
                    <tr>
                        <td><strong>${r.nombre_paciente || ""}</strong></td>
                        <td><span style="color:#00ff89; font-weight:600;">${r.expediente || ""}</span></td>
                        <td>${r.servicio || ""}</td>
                        <td>${r.fecha_registro || ""}</td>
                        <td><span class="estado-badge ${estadoClass}">${r.estado || ""}</span></td>
                        <td>
                            <div class="acciones">
                                <button class="btn btn-primary btn-sm" onclick="abrirModalEditar('${r.id}')">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="eliminarRegistro('${r.id}','${r.nombre_paciente}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
      })
      .join("");
  }

  // 📋 RENDER PAGINACIÓN
  function renderizarPaginacion(total, totalPaginas) {
    document.getElementById("paginationInfo").textContent =
      `Mostrando ${Math.min(total, registrosPorPagina)} de ${total} registros`;

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    prevBtn.disabled = paginaActual <= 1;
    nextBtn.disabled = paginaActual >= totalPaginas;

    let html = "";
    const maxVisible = 5;
    let inicio = Math.max(1, paginaActual - Math.floor(maxVisible / 2));
    let fin = Math.min(totalPaginas, inicio + maxVisible - 1);

    if (fin - inicio + 1 < maxVisible) {
      inicio = Math.max(1, fin - maxVisible + 1);
    }

    if (inicio > 1) {
      html += `<span class="page-number" onclick="irPagina(1)">1</span>`;
      if (inicio > 2)
        html += `<span style="color:rgba(255,255,255,0.2);">…</span>`;
    }

    for (let i = inicio; i <= fin; i++) {
      html += `<span class="page-number ${i === paginaActual ? "active-page" : ""}" onclick="irPagina(${i})">${i}</span>`;
    }

    if (fin < totalPaginas) {
      if (fin < totalPaginas - 1)
        html += `<span style="color:rgba(255,255,255,0.2);">…</span>`;
      html += `<span class="page-number" onclick="irPagina(${totalPaginas})">${totalPaginas}</span>`;
    }

    document.getElementById("pageNumbers").innerHTML = html;
  }

  // 🔄 CAMBIAR PÁGINA
  function cambiarPagina(direccion) {
    const totalPaginas =
      Math.ceil(datosFiltrados.length / registrosPorPagina) || 1;
    if (direccion === "prev" && paginaActual > 1) paginaActual--;
    if (direccion === "next" && paginaActual < totalPaginas) paginaActual++;
    mostrarPagina();
  }

  function irPagina(num) {
    paginaActual = num;
    mostrarPagina();
  }

  // 📊 ORDENAR
  function ordenar(campo) {
    if (campoOrden === campo) {
      ordenDireccion = ordenDireccion === "asc" ? "desc" : "asc";
    } else {
      campoOrden = campo;
      ordenDireccion = "asc";
    }
    cargarDatos();
  }

  // ============================================================
  // MODAL CRUD
  // ============================================================

  function abrirModal() {
    document.getElementById("modalTitle").textContent = "Nuevo Expediente";
    document.getElementById("editId").value = "";
    document.getElementById("crudForm").reset();
    document.getElementById("modalOverlay").classList.add("active");
  }

  function abrirModalEditar(id) {
    const registro = datos.find((r) => r.id === id);
    if (!registro) return;

    document.getElementById("modalTitle").textContent = "Editar Expediente";
    document.getElementById("editId").value = id;
    document.getElementById("nombrePaciente").value =
      registro.nombre_paciente || "";
    document.getElementById("expediente").value = registro.expediente || "";
    document.getElementById("servicio").value = registro.servicio || "";
    document.getElementById("fechaRegistro").value =
      registro.fecha_registro || "";
    document.getElementById("fechaNac").value = registro.fecha_nac || "";
    document.getElementById("estado").value = registro.estado || "Activo";
    document.getElementById("sexo").value = registro.sexo || "";
    document.getElementById("telPart").value = registro.tel_part || "";

    document.getElementById("modalOverlay").classList.add("active");
  }

  function cerrarModal() {
    document.getElementById("modalOverlay").classList.remove("active");
  }

  // 📝 GUARDAR
  async function guardar(e) {
    e.preventDefault();

    const id = document.getElementById("editId").value;
    const datosForm = {
      nombre_paciente: document.getElementById("nombrePaciente").value.trim(),
      expediente: document.getElementById("expediente").value.trim(),
      servicio: document.getElementById("servicio").value.trim() || null,
      fecha_registro: document.getElementById("fechaRegistro").value || null,
      fecha_nac: document.getElementById("fechaNac").value || null,
      estado: document.getElementById("estado").value,
      sexo: document.getElementById("sexo").value || null,
      tel_part: document.getElementById("telPart").value.trim() || null,
    };

    if (id) {
      await actualizarRegistro(id, datosForm);
    } else {
      await crearRegistro(datosForm);
    }

    cerrarModal();
  }

  // ============================================================
  // UTILIDADES
  // ============================================================

  function recargarDatos() {
    cargarDatos();
    mostrarToast("🔄 Recargando datos...", "info");
  }

  // 💬 TOAST
  function mostrarToast(mensaje, tipo = "info") {
    const toast = document.getElementById("toast");
    toast.textContent = mensaje;
    toast.className = "toast " + tipo;
    setTimeout(() => toast.classList.add("show"), 10);

    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => {
      toast.classList.remove("show");
    }, 3000);
  }

  // 🎨 GLASS STATE
  function setGlassState(state) {
    const glass = document.querySelector(".glass");
    glass.classList.remove("loading", "success", "error");
    if (state) {
      glass.classList.add(state);
      clearTimeout(window.glassTimeout);
      window.glassTimeout = setTimeout(() => {
        glass.classList.remove("loading", "success", "error");
      }, 3000);
    }
  }

  // ============================================================
  // INICIALIZAR
  // ============================================================
  document.addEventListener("DOMContentLoaded", function () {
    cargarDatos();

    // Cerrar modal con ESC
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") cerrarModal();
    });

    // Cerrar modal al hacer clic fuera
    document
      .getElementById("modalOverlay")
      .addEventListener("click", function (e) {
        if (e.target === this) cerrarModal();
      });
  });
</script>
