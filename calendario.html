<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estadísticas y Archivo Clínico</title>
  <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="/main_css/estilos.css" rel="stylesheet">
</head>

<body>
  <div class="glass" id="dashboard">
    <h5>Base</h5>
    <div id="header"></div>
    <div class="grid">
      <!-- AQUI
      VA
      EL
  Calendario -->
    </div>
    <div id="footer"></div>
  </div>

  <script>
    google.script.run.withSuccessHandler(eventos => {
      const cont = document.getElementById('calendario');

      eventos.forEach(e => {
        const div = document.createElement('div');
        div.className = 'evento';
        div.innerHTML = `
      <strong>${e.titulo}</strong><br>
      🕒 ${e.inicio}<br>
      📍 ${e.lugar || '—'}
    `;
        cont.appendChild(div);
      });
    }).obtenerCalendarioOutlook();
  </script>

  <div id="calendario"></div>

  <script>
    fetch('/comun/header.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('header').innerHTML = html;

        // Cargar sesión.js después de insertar el HTML
        const s = document.createElement('script');
        s.src = '/comun/sesion_bk.js';

        s.onload = () => {
          console.log("🔥 sesion_bk.js cargado. Verificando sesión...");
          verificarAutenticacion();
        };

        document.body.appendChild(s);
      });

    fetch('/comun/footer.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('footer').innerHTML = html;

        // Ya existe footerText
        const footer = document.getElementById('footerText');
        if (footer) {
          footer.innerHTML = `Hecho con ❤️ por Ricardo · ${new Date().getFullYear()}`;
        }
      });
  </script>
  <script src="/comun/estadoSistema.js"></script>
  <script src="/comun/sesion_bk.js"></script>
</body>

</html>
