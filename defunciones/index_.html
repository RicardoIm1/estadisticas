  <style>
    /* CENTRAR EL CONTENEDOR PRINCIPAL */
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      background: #f0f2f5;
      padding: 20px;
    }

    .glass {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
    }

    #tabla-registros td:nth-child(2) {
      white-space: normal;
      word-break: break-word;
    }

    /* Iframe oculto para enviar formularios */
    #form-iframe {
      display: none;
      width: 0;
      height: 0;
      border: none;
    }

    .btn-grafica {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
    }

    .btn-grafica:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(108, 92, 231, 0.5);
    }

    .btn-grafica i {
      font-size: 1.1rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* Asegurar que el modal de Bootstrap esté centrado */
    .modal-dialog {
      display: flex;
      align-items: center;
      min-height: calc(100% - 1rem);
    }

    .modal-dialog-centered {
      min-height: calc(100% - 1rem);
    }

    .modal-content {
      width: 100%;
    }

    /* Asegurar que el canvas tenga el tamaño correcto */
    #graficaDefunciones {
      width: 100% !important;
      height: 100% !important;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .modal-grafica {
        padding: 20px;
        width: 95%;
      }
      .modal-grafica-header h2 {
        font-size: 1.2rem;
      }
      .grafica-container {
        height: 300px;
      }
    }
  </style>

    <!-- Iframe oculto para enviar formularios -->

    <script>
      // Footer dinámico
      document.getElementById("footerText").innerHTML =
        `Hecho con ❤️ por Ricardo · ${new Date().getFullYear()}`;

      // ========== FUNCIÓN PARA FORMATEAR FECHAS ==========
      function formatearFecha(fechaString) {
        if (!fechaString) return "-";

        try {
          if (/^\d{4}-\d{2}-\d{2}$/.test(fechaString)) {
            const fecha = new Date(fechaString + "T00:00:00");
            return fecha.toLocaleDateString("es-ES", {
              day: "2-digit",
              month: "2-digit",
              year: "numeric",
            });
          }

          const fecha = new Date(fechaString);

          if (isNaN(fecha.getTime())) {
            return "-";
          }

          return fecha.toLocaleDateString("es-ES", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
          });
        } catch (error) {
          console.error("Error formateando fecha:", fechaString, error);
          return "-";
        }
      }

      // ========== estadoSistema.js ==========
      function setEstado(estado) {
        const dashboard = document.querySelector(".glass");

        if (!dashboard) {
          console.warn("⚠️ No se encontró el contenedor .glass");
          return;
        }

        dashboard.style.transition =
          "background 0.5s ease, box-shadow 0.8s ease, border 0.5s ease";
        dashboard.classList.remove("loading", "success", "error");

        switch (estado) {
          case "loading":
            dashboard.classList.add("loading");
            break;
          case "success":
            dashboard.classList.add("success");
            break;
          case "error":
            dashboard.classList.add("error");
            break;
        }

        setTimeout(() => {
          dashboard.style.transition =
            "background 5s ease, box-shadow 5s ease, border 5s ease";
          dashboard.classList.remove("loading", "success", "error");
        }, 5000);
      }

      // ========== app.js ==========
      const GAS_URL =
        "https://script.google.com/macros/s/AKfycbzTd3NQZuEKXIrIjI9qTRBolbeB9RlJ0d0RETuPunYQqE2Xz4860uiwAqGKiXXg3mfK/exec";

      let idParaEliminar = null;
      let chartInstance = null;

      async function cargarRegistros() {
        try {
          console.log("🔄 Cargando registros...");
          setEstado("loading");

          const response = await fetch(GAS_URL);
          const text = await response.text();
          const data = JSON.parse(text);

          if (data.success) {
            if (data.rows && data.rows.length > 0) {
              data.rows.sort((a, b) => parseInt(b.id) - parseInt(a.id));
            }
            mostrarTabla(data.rows);
            window.registrosGlobales = data.rows || [];
            setEstado("success");
          } else {
            throw new Error(data.error || "Error del servidor");
          }
        } catch (error) {
          console.error("❌ Error:", error);
          setEstado("error");
          document.getElementById("tabla-registros").innerHTML =
            '<tr><td colspan="6" style="text-align:center; padding: 2rem; color: #ff6b6b;">Error cargando datos</td></tr>';
        }
      }

      function mostrarTabla(registros) {
        const tbody = document.getElementById("tabla-registros");
        tbody.innerHTML = "";

        if (!registros || registros.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="6" style="text-align:center; padding: 2rem;">No hay registros</td></tr>';
          return;
        }

        const registrosOrdenados = [...registros].sort((a, b) => {
          const fechaA = a.fechaDefuncion
            ? new Date(a.fechaDefuncion)
            : new Date(0);
          const fechaB = b.fechaDefuncion
            ? new Date(b.fechaDefuncion)
            : new Date(0);

          if (fechaA.getTime() !== fechaB.getTime()) {
            return fechaB.getTime() - fechaA.getTime();
          }

          const folioA = a.folio || "";
          const folioB = b.folio || "";

          const numA = extraerNumeroFolio(folioA);
          const numB = extraerNumeroFolio(folioB);

          if (numA !== null && numB !== null) {
            return numA - numB;
          }

          return String(folioA).localeCompare(String(folioB));
        });

        registrosOrdenados.forEach((registro, index) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${index + 1}</td>
            <td>${registro.folio || "-"}</td>
            <td>${registro.nombre || ""}</td>
            <td>${formatearFecha(registro.fechaDefuncion)}</td>
            <td>${registro.area || ""}</td>
            <td>
              <div class="acciones-tabla">
                <button class="btn-editar" onclick="editar('${registro.id}')" title="Editar registro">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="btn-eliminar" onclick="solicitarEliminar('${registro.id}')" title="Eliminar registro">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      function extraerNumeroFolio(folio) {
        if (folio === null || folio === undefined || folio === "") {
          return null;
        }

        const folioStr = String(folio);

        const match = folioStr.match(/\d+$/);
        if (match) {
          return parseInt(match[0], 10);
        }

        const todosNumeros = folioStr.match(/\d+/g);
        if (todosNumeros) {
          return parseInt(todosNumeros[todosNumeros.length - 1], 10);
        }

        return null;
      }

      function agregarRegistroAlTop(registro) {
        const tbody = document.getElementById("tabla-registros");

        if (
          tbody.children.length === 1 &&
          (tbody.children[0].textContent.includes("No hay registros") ||
            tbody.children[0].textContent.includes("Cargando"))
        ) {
          tbody.innerHTML = "";
        }

        let posicionInsertar = 0;
        const filas = tbody.querySelectorAll("tr");

        for (let i = 0; i < filas.length; i++) {
          const fila = filas[i];
          const fechaFila = fila.querySelector("td:nth-child(4)").textContent;
          const folioFila = fila.querySelector("td:nth-child(2)").textContent;

          const partes = fechaFila.split("/");
          const fechaObj =
            partes.length === 3
              ? new Date(partes[2], partes[1] - 1, partes[0])
              : new Date(0);
          const fechaNuevo = registro.fechaDefuncion
            ? new Date(registro.fechaDefuncion)
            : new Date(0);

          if (fechaObj.getTime() < fechaNuevo.getTime()) {
            posicionInsertar = i;
            break;
          } else if (fechaObj.getTime() === fechaNuevo.getTime()) {
            const numFila = extraerNumeroFolio(folioFila);
            const numNuevo = extraerNumeroFolio(registro.folio);

            if (numFila !== null && numNuevo !== null) {
              if (numFila > numNuevo) {
                posicionInsertar = i;
                break;
              }
            } else {
              const folioFilaStr = String(folioFila || "");
              const folioNuevoStr = String(registro.folio || "");
              if (folioFilaStr.localeCompare(folioNuevoStr) > 0) {
                posicionInsertar = i;
                break;
              }
            }
          }

          posicionInsertar = i + 1;
        }

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${posicionInsertar + 1}</td>
          <td>${registro.folio || "-"}</td>
          <td>${registro.nombre || ""}</td>
          <td>${formatearFecha(registro.fechaDefuncion)}</td>
          <td>${registro.area || ""}</td>
          <td>
            <div class="acciones-tabla">
              <button class="btn-editar" onclick="editar('${registro.id}')" title="Editar registro">
                <i class="fas fa-edit"></i>
              </button>
              <button class="btn-eliminar" onclick="solicitarEliminar('${registro.id}')" title="Eliminar registro">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </td>
        `;

        if (posicionInsertar === 0) {
          tbody.insertBefore(tr, tbody.firstChild);
        } else if (posicionInsertar >= filas.length) {
          tbody.appendChild(tr);
        } else {
          tbody.insertBefore(tr, filas[posicionInsertar]);
        }

        const filasActualizadas = tbody.querySelectorAll("tr");
        filasActualizadas.forEach((fila, index) => {
          fila.querySelector("td:first-child").textContent = index + 1;
        });
      }

      async function guardar(e) {
        e.preventDefault();

        const id = document.getElementById("id").value;
        const datos = {
          folio: document.getElementById("folio").value,
          nombre: document.getElementById("nombre").value,
          fechaDefuncion: document.getElementById("fechaDefuncion").value,
          area: document.getElementById("area").value,
          edad: document.getElementById("edad").value,
          sexo: document.getElementById("sexo").value,
          diagnostico: document.getElementById("diagnostico").value,
          expediente: document.getElementById("expediente").value,
          medico: document.getElementById("medico").value,
          observaciones: document.getElementById("observaciones").value,
        };

        if (!datos.nombre) {
          setEstado("error");
          alert("❌ El nombre es obligatorio");
          return;
        }

        console.log("💾 Enviando datos:", datos);
        setEstado("loading");

        const form = document.createElement("form");
        form.method = "POST";
        form.action = GAS_URL;
        form.target = "form-iframe";
        form.style.display = "none";

        const campos = {
          action: id ? "updateData" : "createData",
          ...datos,
        };

        if (id) campos.id = id;

        Object.keys(campos).forEach((key) => {
          const input = document.createElement("input");
          input.name = key;
          input.value = campos[key] || "";
          form.appendChild(input);
        });

        document.body.appendChild(form);
        form.submit();

        setTimeout(() => {
          document.body.removeChild(form);
          setEstado("success");
          limpiarForm();

          if (!id) {
            const nuevoRegistro = {
              id: Date.now().toString(),
              folio: datos.folio || "-",
              nombre: datos.nombre,
              fechaDefuncion: datos.fechaDefuncion || "",
              area: datos.area || "",
              edad: datos.edad || "",
              sexo: datos.sexo || "",
              diagnostico: datos.diagnostico || "",
              expediente: datos.expediente || "",
              medico: datos.medico || "",
              observaciones: datos.observaciones || "",
            };

            agregarRegistroAlTop(nuevoRegistro);
            if (window.registrosGlobales) {
              window.registrosGlobales.push(nuevoRegistro);
            }
          } else {
            cargarRegistros();
          }
        }, 1500);
      }

      async function eliminarConfirmado() {
        if (!idParaEliminar) return;

        try {
          setEstado("loading");

          const form = document.createElement("form");
          form.method = "POST";
          form.action = GAS_URL;
          form.target = "form-iframe";
          form.style.display = "none";

          const inputAction = document.createElement("input");
          inputAction.name = "action";
          inputAction.value = "deleteData";
          form.appendChild(inputAction);

          const inputId = document.createElement("input");
          inputId.name = "id";
          inputId.value = idParaEliminar;
          form.appendChild(inputId);

          document.body.appendChild(form);
          form.submit();

          setTimeout(() => {
            document.body.removeChild(form);
            setEstado("success");
            cerrarModal();

            const filas = document.querySelectorAll("#tabla-registros tr");
            filas.forEach((fila) => {
              const botonEliminar = fila.querySelector(".btn-eliminar");
              if (botonEliminar) {
                const onclickAttr = botonEliminar.getAttribute("onclick");
                if (onclickAttr && onclickAttr.includes(idParaEliminar)) {
                  fila.remove();
                  const filasRestantes = document.querySelectorAll(
                    "#tabla-registros tr",
                  );
                  filasRestantes.forEach((f, i) => {
                    const firstTd = f.querySelector("td:first-child");
                    if (firstTd) {
                      firstTd.textContent = i + 1;
                    }
                  });
                }
              }
            });

            if (window.registrosGlobales) {
              window.registrosGlobales = window.registrosGlobales.filter(
                (r) => r.id !== idParaEliminar,
              );
            }
          }, 1500);
        } catch (error) {
          console.error("❌ Error eliminando:", error);
          setEstado("error");
          alert("❌ Error eliminando: " + error.message);
          cerrarModal();
        }
      }

      function solicitarEliminar(id) {
        idParaEliminar = id;
        const modal = document.getElementById("modalEliminar");
        const modalContent = modal.querySelector(".modal");

        modal.style.display = "flex";
        setTimeout(() => {
          modalContent.classList.add("show");
        }, 10);
      }

      function cerrarModal() {
        const modal = document.getElementById("modalEliminar");
        const modalContent = modal.querySelector(".modal");

        modalContent.classList.remove("show");
        setTimeout(() => {
          modal.style.display = "none";
          idParaEliminar = null;
        }, 300);
      }

      async function editar(id) {
        try {
          setEstado("loading");

          const response = await fetch(GAS_URL);
          const data = await response.json();

          if (data.success) {
            const registro = data.rows.find((r) => r.id === id);
            if (registro) {
              document.getElementById("id").value = registro.id;
              document.getElementById("folio").value = registro.folio || "";
              document.getElementById("nombre").value = registro.nombre || "";

              if (registro.fechaDefuncion) {
                const fecha = new Date(registro.fechaDefuncion);
                if (!isNaN(fecha.getTime())) {
                  document.getElementById("fechaDefuncion").value = fecha
                    .toISOString()
                    .split("T")[0];
                } else {
                  document.getElementById("fechaDefuncion").value = "";
                }
              } else {
                document.getElementById("fechaDefuncion").value = "";
              }

              document.getElementById("area").value = registro.area || "";
              document.getElementById("edad").value = registro.edad || "";
              document.getElementById("sexo").value = registro.sexo || "";
              document.getElementById("diagnostico").value =
                registro.diagnostico || "";
              document.getElementById("expediente").value =
                registro.expediente || "";
              document.getElementById("medico").value = registro.medico || "";
              document.getElementById("observaciones").value =
                registro.observaciones || "";

              document.getElementById("btn-guardar").innerHTML =
                '<i class="fas fa-sync-alt"></i> Actualizar';
              document.getElementById("btn-cancelar").style.display = "block";

              setEstado("success");
              document
                .querySelector(".formulario")
                .scrollIntoView({ behavior: "smooth" });
            }
          }
        } catch (error) {
          setEstado("error");
          alert("❌ Error cargando registro para editar");
        }
      }

      function cancelarEdicion() {
        limpiarForm();
        setEstado("success");
      }

      function limpiarForm() {
        document.getElementById("crud-form").reset();
        document.getElementById("id").value = "";
        document.getElementById("btn-guardar").innerHTML =
          '<i class="fas fa-save"></i> Guardar';
        document.getElementById("btn-cancelar").style.display = "none";
        setEstado("success");
      }

      // ========== FUNCIONES PARA LA GRÁFICA ==========
      function generarDatosGrafica(registros) {
        const meses = {};
        const mesesOrden = [
          "Enero",
          "Febrero",
          "Marzo",
          "Abril",
          "Mayo",
          "Junio",
          "Julio",
          "Agosto",
          "Septiembre",
          "Octubre",
          "Noviembre",
          "Diciembre",
        ];

        mesesOrden.forEach((mes) => {
          meses[mes] = { hombres: 0, mujeres: 0 };
        });

        registros.forEach((registro) => {
          if (registro.fechaDefuncion) {
            const fecha = new Date(registro.fechaDefuncion);
            const mesIndex = fecha.getMonth();
            const mes = mesesOrden[mesIndex];

            if (registro.sexo === "Masculino") {
              meses[mes].hombres++;
            } else if (registro.sexo === "Femenino") {
              meses[mes].mujeres++;
            }
          }
        });

        const labels = mesesOrden;
        const hombres = labels.map((mes) => meses[mes].hombres);
        const mujeres = labels.map((mes) => meses[mes].mujeres);

        return { labels, hombres, mujeres };
      }

      function crearGrafica() {
        const canvas = document.getElementById("graficaDefunciones");
        if (!canvas) {
          console.error("Canvas no encontrado");
          return;
        }

        const ctx = canvas.getContext("2d");

        if (chartInstance) {
          chartInstance.destroy();
          chartInstance = null;
        }

        const registros = window.registrosGlobales || [];
        const datos = generarDatosGrafica(registros);

        chartInstance = new Chart(ctx, {
          type: "bar",
          data: {
            labels: datos.labels,
            datasets: [
              {
                label: "Hombres",
                data: datos.hombres,
                backgroundColor: "#0984e3",
                borderColor: "#0984e3",
                borderWidth: 1,
                borderRadius: 0,
              },
              {
                label: "Mujeres",
                data: datos.mujeres,
                backgroundColor: "#fd79a8",
                borderColor: "#fd79a8",
                borderWidth: 1,
                borderRadius: 0,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: true,
                position: "top",
                labels: {
                  font: { size: 13, weight: "600" },
                  padding: 20,
                  usePointStyle: true,
                  pointStyle: "circle",
                },
              },
              tooltip: {
                backgroundColor: "rgba(255,255,255,0.95)",
                titleColor: "#1a2a44",
                bodyColor: "#1a2a44",
                borderColor: "#dce6f0",
                borderWidth: 1,
                cornerRadius: 8,
                padding: 12,
                callbacks: {
                  title: function (tooltipItems) {
                    return tooltipItems[0].label;
                  },
                  label: function (context) {
                    return (
                      context.dataset.label +
                      ": " +
                      context.parsed.y +
                      " defunciones"
                    );
                  },
                  footer: function (tooltipItems) {
                    let total = 0;
                    tooltipItems.forEach((item) => (total += item.parsed.y));
                    return "Total: " + total + " defunciones";
                  },
                },
              },
            },
            scales: {
              x: {
                grid: { display: false },
                ticks: {
                  font: { size: 11, weight: "500" },
                  maxRotation: 45,
                  minRotation: 0,
                },
              },
              y: {
                beginAtZero: true,
                stacked: true,
                ticks: {
                  stepSize: 1,
                  font: { size: 11 },
                },
                grid: { color: "rgba(0, 0, 0, 0.08)" },
              },
            },
            datasets: {
              bar: {
                stack: "stack1",
                barPercentage: 0.7,
                categoryPercentage: 0.8,
              },
            },
          },
        });
      }

      function abrirGrafica() {
        const modalElement = document.getElementById("modalGrafica");
        let modal = bootstrap.Modal.getInstance(modalElement);
        if (!modal) {
          modal = new bootstrap.Modal(modalElement, {
            backdrop: true,
            keyboard: true,
            focus: true,
          });
        }

        modalElement.addEventListener(
          "shown.bs.modal",
          function () {
            setTimeout(() => {
              crearGrafica();
            }, 100);
          },
          { once: true },
        );

        modal.show();
      }

      function cerrarGrafica() {
        const modalElement = document.getElementById("modalGrafica");
        const modal = bootstrap.Modal.getInstance(modalElement);
        if (modal) {
          modal.hide();
        }
      }

      // ========== INICIALIZACIÓN ==========
      document.addEventListener("DOMContentLoaded", function () {
        console.log("🚀 Iniciando aplicación...");

        // Limpiar gráfica al cerrar el modal
        const modalElement = document.getElementById("modalGrafica");
        if (modalElement) {
          modalElement.addEventListener("hidden.bs.modal", function () {
            if (chartInstance) {
              chartInstance.destroy();
              chartInstance = null;
            }
          });
        }

        document
          .getElementById("crud-form")
          .addEventListener("submit", guardar);
        document
          .getElementById("btn-limpiar")
          .addEventListener("click", limpiarForm);
        document
          .getElementById("btn-cancelar")
          .addEventListener("click", cancelarEdicion);
        document
          .getElementById("btnConfirmarEliminar")
          .addEventListener("click", eliminarConfirmado);
        document
          .getElementById("btnCancelarEliminar")
          .addEventListener("click", cerrarModal);

        document
          .getElementById("btnAbrirGrafica")
          .addEventListener("click", abrirGrafica);

        document
          .getElementById("modalGrafica")
          .addEventListener("click", function (e) {
            if (e.target === this) {
              cerrarGrafica();
            }
          });

        document
          .getElementById("modalEliminar")
          .addEventListener("click", function (e) {
            if (e.target === this) {
              cerrarModal();
            }
          });

        cargarRegistros();
      });

      window.editar = editar;
      window.solicitarEliminar = solicitarEliminar;
      window.abrirGrafica = abrirGrafica;
      window.cerrarGrafica = cerrarGrafica;
    </script>

    <script>
      function verificarAutenticacion() {
        const usuario = localStorage.getItem("usuario");
        const rol = localStorage.getItem("rol");

        if (!usuario) {
          window.location.href = "/login.html";
          return;
        }

        console.log("Usuario:", usuario, "Rol:", rol);

        const userElement = document.getElementById("user-info");
        if (userElement) {
          userElement.innerHTML = `${usuario} (${rol})`;
        }
      }

      function cerrarSesion() {
        localStorage.removeItem("usuario");
        localStorage.removeItem("rol");
        localStorage.removeItem("loginTime");
        window.location.href = "index.html";
      }

      window.addEventListener("load", verificarAutenticacion);
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const buscador = document.getElementById("buscador");
        const filas = document.getElementById("tabla-registros");

        if (!buscador || !filas) return;

        buscador.addEventListener("keyup", function () {
          const valor = this.value.toLowerCase().trim();
          const registros = filas.querySelectorAll("tr");

          registros.forEach((fila) => {
            const textoFila = fila.textContent.toLowerCase();
            fila.style.display = textoFila.includes(valor) ? "" : "none";
          });
        });
      });
    </script>
  </body>
