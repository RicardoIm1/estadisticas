<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Médicos Internos - Hospital Regional Puerto Vallarta</title>
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      /* ============================================================
   RESET Y BASE
   ============================================================ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --primary-light: #3b82f6;
        --primary-gradient: linear-gradient(135deg, #1a56db, #3b82f6);
        --primary-gradient-hover: linear-gradient(135deg, #1e40af, #2563eb);
        --surface: #ffffff;
        --background: #f1f5f9;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #94a3b8;
        --border: #e2e8f0;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
        --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.1);
        --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.12);
        --radius: 16px;
        --radius-sm: 10px;
        --radius-lg: 24px;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        --success: #22c55e;
        --danger: #ef4444;
        --warning: #f59e0b;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--background);
        min-height: 100vh;
        padding: 24px;
        color: var(--text-primary);
      }

      /* ============================================================
   BENTO GRID LAYOUT
   ============================================================ */
      .bento-grid {
        display: grid;
        grid-template-columns: 30% 70%;
        gap: 24px;
        max-width: 1440px;
        margin: 0 auto;
        min-height: calc(100vh - 48px);
      }

      /* ============================================================
   COLUMNA IZQUIERDA - FORMULARIO
   ============================================================ */
      .bento-form {
        background: var(--surface);
        border-radius: var(--radius-lg);
        padding: 24px 20px;
        box-shadow: var(--shadow-lg);
        border: 1px solid rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(10px);
        overflow: hidden;
        max-width: 100%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        height: calc(100vh - 48px);
        position: sticky;
        top: 24px;
      }

      .bento-form .header {
        text-align: center;
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 2px solid var(--border);
        flex-shrink: 0;
      }

      .bento-form .header .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: white;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        margin-bottom: 8px;
        box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
        transition: var(--transition);
        padding: 5px;
        border: 2px solid #1a56db;
      }

      .bento-form .header .logo:hover {
        transform: scale(1.05) rotate(-3deg);
      }

      .bento-form .header .logo svg {
        width: 100%;
        height: 100%;
        display: block;
        border-radius: 50%;
      }

      .bento-form .header h1 {
        font-size: 20px;
        font-weight: 800;
        color: var(--text-primary);
        letter-spacing: -0.5px;
      }

      .bento-form .header p {
        color: var(--text-secondary);
        font-size: 13px;
        margin-top: 2px;
        font-weight: 500;
      }

      /* ============================================================
   FORMULARIO
   ============================================================ */
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        max-width: 100%;
        flex: 1;
        align-content: start;
        overflow-y: auto;
        padding-right: 4px;
      }

      .form-grid::-webkit-scrollbar {
        width: 6px;
      }

      .form-grid::-webkit-scrollbar-track {
        background: var(--background);
        border-radius: 10px;
      }

      .form-grid::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
        transition: var(--transition);
      }

      .form-grid::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        min-width: 0;
        max-width: 100%;
      }

      .form-group.full-width {
        grid-column: 1 / -1;
      }

      .form-group label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 4px;
        letter-spacing: 0.3px;
      }

      .form-group label .required {
        color: #ef4444;
        font-size: 14px;
      }

      .form-group label i {
        color: var(--primary);
        font-size: 13px;
      }

      .form-group .hint {
        font-size: 10px;
        color: var(--text-muted);
        margin-top: 3px;
        font-weight: 400;
      }

      .form-group input,
      .form-group select {
        padding: 10px 14px;
        border: 2px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 13px;
        transition: var(--transition);
        background: #fafbfc;
        color: var(--text-primary);
        width: 100%;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
        font-weight: 500;
        text-transform: uppercase;
      }

      .form-group input::placeholder {
        color: var(--text-muted);
        font-weight: 400;
        text-transform: none;
      }

      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        background: var(--surface);
      }

      .form-group input:read-only {
        background: #f1f4f9;
        cursor: not-allowed;
        color: var(--text-secondary);
        border-color: #e8ecf2;
        text-transform: none;
      }

      .form-group input:read-only:focus {
        box-shadow: none;
        border-color: #e8ecf2;
      }

      .form-group input.upper-input {
        text-transform: uppercase;
      }

      .form-group input[type="email"] {
        text-transform: lowercase;
      }

      /* ============================================================
   FOTO
   ============================================================ */
      .photo-section {
        grid-column: 1 / -1;
      }

      .photo-upload {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 16px;
        background: #fafbfc;
        border-radius: var(--radius-sm);
        border: 2px dashed var(--border);
        transition: var(--transition);
        flex-wrap: wrap;
      }

      .photo-upload:hover {
        border-color: var(--primary);
        background: #f8faff;
      }

      .photo-preview-container {
        position: relative;
        flex-shrink: 0;
      }

      .photo-preview {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--surface);
        box-shadow: var(--shadow-sm);
        background: white;
      }

      .photo-placeholder {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #eef2f6;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        font-size: 28px;
      }

      .photo-actions {
        display: flex;
        flex-direction: column;
        gap: 5px;
        flex: 1;
        min-width: 0;
      }

      .photo-actions .btn-group {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .photo-actions .btn-upload {
        background: var(--primary-gradient);
        color: white;
        padding: 6px 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        justify-content: center;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        flex: 1;
        min-width: 80px;
      }

      .photo-actions .btn-upload:hover {
        background: var(--primary-gradient-hover);
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
        color: white;
      }

      .photo-actions .btn-camera {
        background: linear-gradient(135deg, #059669, #10b981);
        color: white;
        padding: 6px 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        justify-content: center;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        flex: 1;
        min-width: 80px;
      }

      .photo-actions .btn-camera:hover {
        background: linear-gradient(135deg, #047857, #059669);
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
        color: white;
      }

      .photo-actions .btn-camera:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .photo-actions .btn-remove {
        background: #fee2e2;
        color: #dc2626;
        padding: 6px 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        justify-content: center;
        flex: 1;
        min-width: 80px;
      }

      .photo-actions .btn-remove:hover {
        background: #fecaca;
        transform: translateY(-1px);
        color: #dc2626;
      }

      .file-input-hidden {
        display: none;
      }

      /* ============================================================
   BOTONES
   ============================================================ */
      .form-actions {
        grid-column: 1 / -1;
        display: flex;
        gap: 10px;
        margin-top: 12px;
        padding-top: 16px;
        border-top: 2px solid var(--border);
        flex-shrink: 0;
      }

      .btn-submit {
        flex: 1;
        padding: 11px 20px;
        background: var(--primary-gradient);
        color: white;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 0;
        letter-spacing: 0.3px;
        box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
      }

      .btn-submit:hover:not(:disabled) {
        background: var(--primary-gradient-hover);
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(37, 99, 235, 0.4);
        color: white;
      }

      .btn-submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .btn-submit .spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .btn-reset {
        padding: 11px 20px;
        background: #f1f4f9;
        color: var(--text-secondary);
        border: 2px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .btn-reset:hover {
        background: #e8ecf2;
        border-color: #cbd5e1;
        transform: translateY(-1px);
        color: var(--text-secondary);
      }

      /* ============================================================
   TOAST NOTIFICATIONS
   ============================================================ */
      .toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 380px;
        width: 100%;
        pointer-events: none;
      }

      .toast {
        padding: 16px 20px;
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        font-weight: 500;
        box-shadow: var(--shadow-lg);
        animation: toastIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        pointer-events: auto;
        cursor: default;
        border-left: 4px solid transparent;
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(10px);
      }

      .toast::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        background: rgba(255, 255, 255, 0.4);
        animation: toastProgress 2.8s linear forwards;
      }

      .toast-success {
        background: linear-gradient(135deg, #dcfce7, #bbf7d0);
        color: #166534;
        border-left-color: #22c55e;
      }

      .toast-error {
        background: linear-gradient(135deg, #fee2e2, #fecaca);
        color: #991b1b;
        border-left-color: #ef4444;
      }

      .toast-info {
        background: linear-gradient(135deg, #dbeafe, #bfdbfe);
        color: #1e40af;
        border-left-color: #3b82f6;
      }

      .toast-warning {
        background: linear-gradient(135deg, #fef3c7, #fde68a);
        color: #92400e;
        border-left-color: #f59e0b;
      }

      .toast i {
        font-size: 22px;
        flex-shrink: 0;
      }

      .toast-success i {
        color: #22c55e;
      }

      .toast-error i {
        color: #ef4444;
      }

      .toast-info i {
        color: #3b82f6;
      }

      .toast-warning i {
        color: #f59e0b;
      }

      .toast-content {
        flex: 1;
        min-width: 0;
      }

      .toast-title {
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 2px;
      }

      .toast-message {
        font-weight: 400;
        font-size: 13px;
        opacity: 0.8;
      }

      .toast-close {
        background: none;
        border: none;
        font-size: 16px;
        cursor: pointer;
        opacity: 0.5;
        transition: var(--transition);
        padding: 4px;
        color: inherit;
        flex-shrink: 0;
      }

      .toast-close:hover {
        opacity: 1;
        transform: scale(1.1);
      }

      @keyframes toastIn {
        0% {
          opacity: 0;
          transform: translateX(120px) scale(0.9);
        }

        100% {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }

      @keyframes toastOut {
        0% {
          opacity: 1;
          transform: translateX(0) scale(1);
        }

        100% {
          opacity: 0;
          transform: translateX(120px) scale(0.9);
        }
      }

      @keyframes toastProgress {
        0% {
          width: 100%;
        }

        100% {
          width: 0%;
        }
      }

      .toast-exit {
        animation: toastOut 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards !important;
      }

      /* ============================================================
   LISTA DE INTERNOS
   ============================================================ */
      .bento-list .list-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0;
        background: var(--surface);
        padding: 12px 20px;
        border-radius: var(--radius) var(--radius) 0 0;
        box-shadow: var(--shadow-md);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-bottom: 2px solid var(--border);
        flex-shrink: 0;
        position: sticky;
        top: 0;
        z-index: 10;
        flex-wrap: wrap;
        gap: 8px;
      }

      .bento-list .list-header h2 {
        font-size: 16px;
        font-weight: 800;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .bento-list .list-header h2 i {
        color: var(--primary);
        font-size: 18px;
      }

      .bento-list .list-header .badge {
        background: var(--primary-gradient);
        color: white;
        padding: 1px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
      }

      .list-search {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .list-search input {
        padding: 9px 16px;
        border: 2px solid var(--border);
        border-radius: 9999px;
        font-size: 13px;
        transition: var(--transition);
        background: #fafbfc;
        width: 220px;
        font-weight: 500;
        outline: none;
      }

      .list-search input::placeholder {
        color: var(--text-muted);
        font-weight: 400;
      }

      .list-search input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        background: var(--surface);
      }

      /* ============================================================
   TOGGLE FILTRO
   ============================================================ */
      .filter-toggle-group {
        display: flex;
        gap: 4px;
        background: #f1f4f9;
        padding: 3px;
        border-radius: 9999px;
        border: 2px solid var(--border);
        flex-shrink: 0;
      }

      .filter-toggle-btn {
        padding: 5px 14px;
        border: none;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        background: transparent;
        color: var(--text-secondary);
        white-space: nowrap;
      }

      .filter-toggle-btn:hover {
        color: var(--text-primary);
      }

      .filter-toggle-btn.active {
        background: var(--primary-gradient);
        color: white;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        transform: scale(1.02);
      }

      .filter-toggle-btn.active:hover {
        background: var(--primary-gradient-hover);
        color: white;
      }

      .filter-toggle-btn .count {
        display: inline-block;
        background: rgba(255, 255, 255, 0.2);
        padding: 0 6px;
        border-radius: 10px;
        font-size: 9px;
        margin-left: 4px;
      }

      .filter-toggle-btn.active .count {
        background: rgba(255, 255, 255, 0.25);
      }

      .filter-toggle-btn:not(.active) .count {
        background: #e2e8f0;
        color: var(--text-muted);
      }

      .btn-print-all {
        background: linear-gradient(135deg, #059669, #10b981);
        color: white;
        padding: 8px 16px;
        border: none;
        border-radius: 9999px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
      }

      .btn-print-all:hover {
        background: linear-gradient(135deg, #047857, #059669);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
        color: white;
      }

      /* ============================================================
   CARDS
   ============================================================ */
      .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
        padding: 12px 4px 12px 0;
        align-content: start;
      }

      .card {
        background: var(--surface);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
        box-shadow: var(--shadow-sm);
        transition: var(--transition);
        cursor: pointer;
        border: 2px solid transparent;
        position: relative;
        height: fit-content;
        min-height: 140px;
        display: flex;
        flex-direction: column;
      }

      .card:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow-md);
        border-color: var(--primary-light);
      }

      .card .card-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }

      .card .card-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--primary-gradient);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        flex-shrink: 0;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2);
      }

      .card .card-avatar img {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        object-fit: cover;
      }

      .card .card-name {
        font-weight: 700;
        color: var(--text-primary);
        font-size: 13px;
        line-height: 1.2;
        text-transform: uppercase;
        white-space: normal;
        word-wrap: break-word;
        word-break: break-word;
        max-width: 100%;
      }

      .card .card-matricula {
        color: var(--text-secondary);
        font-size: 10px;
        font-weight: 500;
      }

      .card .card-body {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 6px;
        margin: 4px 0 6px 0;
        flex: 1;
        align-content: start;
      }

      .card .card-body .tag {
        background: #f1f4f9;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 9px;
        color: var(--text-secondary);
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }

      .card .card-body .tag i {
        font-size: 8px;
        color: var(--primary);
      }

      .card .card-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 6px;
        padding-top: 6px;
        border-top: 2px solid var(--border);
        flex-shrink: 0;
      }

      .card .card-footer-left {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .card .card-status {
        padding: 2px 10px;
        border-radius: 20px;
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }

      .status-activo {
        background: #dcfce7;
        color: #166534;
      }

      .status-inactivo {
        background: #fee2e2;
        color: #991b1b;
      }

      .card .card-updated {
        font-size: 8px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 3px;
        white-space: nowrap;
      }

      .card .card-updated i {
        font-size: 8px;
      }

      .card .card-actions {
        display: flex;
        gap: 2px;
        flex-shrink: 0;
      }

      .card .card-actions button {
        background: none;
        border: none;
        cursor: pointer;
        padding: 3px 6px;
        border-radius: 6px;
        transition: var(--transition);
        font-size: 12px;
        color: var(--text-muted);
      }

      .card .card-actions button:hover {
        background: #f1f4f9;
      }

      .card .card-actions .btn-edit:hover {
        color: var(--primary);
        background: #dbeafe;
      }

      .card .card-actions .btn-delete:hover {
        color: #ef4444;
        background: #fee2e2;
      }

      .card .card-qr-mini {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        overflow: hidden;
        margin-left: auto;
        background: #fafbfc;
        border-radius: 6px;
        padding: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card .card-qr-mini canvas {
        width: 30px !important;
        height: 30px !important;
      }

      /* ============================================================
   EMPTY STATE
   ============================================================ */
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-muted);
        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        border: 2px dashed var(--border);
        grid-column: 1 / -1;
      }

      .empty-state i {
        font-size: 48px;
        margin-bottom: 16px;
        opacity: 0.4;
        color: var(--primary);
      }

      .empty-state h3 {
        color: var(--text-secondary);
        font-size: 18px;
        font-weight: 700;
      }

      .empty-state p {
        font-size: 14px;
        margin-top: 4px;
        color: var(--text-muted);
      }

      /* ============================================================
   MODAL
   ============================================================ */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        animation: fadeIn 0.3s ease-out;
      }

      .modal-overlay.active {
        display: flex;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      .modal {
        background: var(--surface);
        border-radius: var(--radius-lg);
        padding: 32px;
        max-width: 95% !important;
        width: 95% !important;
        max-height: 95vh;
        overflow-y: auto;
        animation: scaleIn 0.3s ease-out;
        position: relative;
        box-shadow: var(--shadow-xl);
      }

      @keyframes scaleIn {
        from {
          transform: scale(0.92) translateY(20px);
          opacity: 0;
        }

        to {
          transform: scale(1) translateY(0);
          opacity: 1;
        }
      }

      .modal-close {
        position: absolute;
        top: 14px;
        right: 18px;
        background: #f1f4f9;
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        font-size: 18px;
        cursor: pointer;
        color: var(--text-secondary);
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }

      .modal-close:hover {
        background: var(--primary-gradient-hover);
        color: white;
        transform: rotate(90deg);
      }

      /* ============================================================
   MODAL ACTIONS
   ============================================================ */
      .modal-actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
        justify-content: center;
      }

      .modal-actions button {
        padding: 10px 24px;
        border: none;
        border-radius: var(--radius-sm);
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }

      .modal-actions .btn-print {
        background: var(--primary-gradient);
        color: white;
        box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
      }

      .modal-actions .btn-print:hover {
        background: var(--primary-gradient-hover);
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(37, 99, 235, 0.4);
        color: white;
      }

      .modal-actions .btn-close-modal {
        background: #f1f4f9;
        color: var(--text-secondary);
        border: 2px solid var(--border);
      }

      .modal-actions .btn-close-modal:hover {
        background: #e8ecf2;
        transform: translateY(-2px);
        color: var(--text-secondary);
      }

      /* ============================================================
   RESPONSIVE
   ============================================================ */
      @media (max-width: 1024px) {
        .bento-grid {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        .bento-form {
          height: auto;
          position: static;
          max-height: none;
        }

        .bento-list {
          height: auto;
          max-height: 600px;
          position: static;
        }

        .cards-grid {
          grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        }
      }

      @media (max-width: 768px) {
        body {
          padding: 16px;
        }

        .bento-list .list-header {
          flex-direction: column;
          gap: 12px;
          align-items: stretch;
          padding: 16px;
        }

        .bento-list .list-header h2 {
          font-size: 16px;
        }

        .list-search {
          flex-direction: column;
          width: 100%;
          gap: 8px;
        }

        .list-search input {
          width: 100%;
          border-radius: 10px;
        }

        .filter-toggle-group {
          width: 100%;
          justify-content: center;
        }

        .filter-toggle-btn {
          font-size: 10px;
          padding: 4px 10px;
        }

        .btn-print-all {
          width: 100%;
          justify-content: center;
        }

        .cards-grid {
          grid-template-columns: 1fr;
        }

        .photo-actions .btn-group {
          flex-direction: column;
        }

        .photo-actions .btn-upload,
        .photo-actions .btn-camera,
        .photo-actions .btn-remove {
          flex: 1;
          min-width: 100%;
        }

        .card .card-footer {
          flex-direction: column;
          align-items: stretch;
          gap: 8px;
        }

        .card .card-footer-left {
          justify-content: space-between;
        }

        .card .card-actions {
          justify-content: flex-end;
        }

        .bento-list {
          max-height: 400px;
        }
      }

      @media (max-width: 640px) {
        .form-grid {
          grid-template-columns: 1fr;
          gap: 10px;
          overflow-y: visible;
          padding-right: 0;
        }

        .bento-form {
          padding: 16px;
          border-radius: var(--radius);
          height: auto;
        }

        .modal {
          padding: 20px;
          max-width: 100%;
          width: 94%;
          border-radius: var(--radius);
        }

        .bento-form .header h1 {
          font-size: 18px;
        }

        .bento-form .header .logo {
          width: 50px;
          height: 50px;
        }

        .toast-container {
          top: 12px;
          right: 12px;
          left: 12px;
          max-width: none;
          width: auto;
        }

        .toast {
          padding: 14px 16px;
          font-size: 13px;
        }

        .toast i {
          font-size: 18px;
        }
      }

      /* ============================================================
   SCROLLBAR GLOBAL
   ============================================================ */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: var(--background);
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
        transition: var(--transition);
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* ============================================================
   FOOTER
   ============================================================ */
      .app-footer {
        text-align: center;
        padding: 16px 24px;
        margin-top: 8px;
        font-size: 13px;
        color: var(--text-muted);
        border-top: 1px solid var(--border);
        background: var(--surface);
        border-radius: 0 0 var(--radius-lg) var(--radius-lg);
        box-shadow: var(--shadow-sm);
        max-width: 1440px;
        margin-left: auto;
        margin-right: auto;
        transition: var(--transition);
      }

      .app-footer a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        transition: var(--transition);
        position: relative;
      }

      .app-footer a:hover {
        color: var(--primary-dark);
        text-decoration: underline;
      }

      .app-footer .heart {
        color: #ef4444;
        display: inline-block;
        animation: heartbeat 1.5s ease-in-out infinite;
      }

      @keyframes heartbeat {
        0%,
        100% {
          transform: scale(1);
        }
        14% {
          transform: scale(1.2);
        }
        28% {
          transform: scale(1);
        }
        42% {
          transform: scale(1.15);
        }
        56% {
          transform: scale(1);
        }
      }

      /* ============================================================
   PRINT STYLES
   ============================================================ */
      @media print {
        body * {
          visibility: hidden;
        }

        .modal-overlay,
        .modal-overlay * {
          visibility: visible;
        }

        .modal-overlay {
          position: fixed !important;
          background: white !important;
          backdrop-filter: none !important;
          display: flex !important;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          z-index: 9999;
          padding: 20px;
          margin: 0;
          justify-content: center;
          align-items: flex-start;
        }

        .modal {
          box-shadow: none !important;
          padding: 20px !important;
          max-width: 100% !important;
          width: 100% !important;
          margin: 0 !important;
          border-radius: 0 !important;
          animation: none !important;
          background: white !important;
          overflow: visible !important;
          max-height: none !important;
          border: none !important;
        }

        .modal-close,
        .modal-actions,
        .modal-actions * {
          display: none !important;
        }

        @page {
          size: A4 portrait;
          margin: 10mm;
        }

        .toast-container {
          display: none !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="bento-grid">
      <!-- ===== COLUMNA IZQUIERDA - FORMULARIO ===== -->
      <div class="bento-form">
        <div class="header">
          <div class="logo">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <circle
                cx="50"
                cy="50"
                r="46"
                fill="#1a56db"
                stroke="white"
                stroke-width="2"
              />
              <rect x="38" y="18" width="24" height="64" rx="4" fill="white" />
              <rect x="18" y="38" width="64" height="24" rx="4" fill="white" />
              <path
                d="M20 30 L25 18 L32 28 L38 20 L45 30 L50 22 L55 30 L62 20 L68 28 L75 18 L80 30"
                stroke="white"
                stroke-width="3"
                fill="none"
                stroke-linecap="round"
              />
              <circle
                cx="50"
                cy="50"
                r="10"
                fill="#1a56db"
                stroke="white"
                stroke-width="1.5"
              />
              <text
                x="50"
                y="54"
                text-anchor="middle"
                font-size="12"
                font-weight="900"
                fill="white"
                font-family="'Segoe UI', sans-serif"
              >
                H
              </text>
              <circle cx="35" cy="35" r="2" fill="white" opacity="0.4" />
              <circle cx="65" cy="35" r="2" fill="white" opacity="0.4" />
              <circle cx="35" cy="65" r="2" fill="white" opacity="0.4" />
              <circle cx="65" cy="65" r="2" fill="white" opacity="0.4" />
            </svg>
          </div>
          <h1>Registro de Médicos Internos</h1>
          <p>Hospital Regional Puerto Vallarta</p>
        </div>

        <div id="alertContainer"></div>

        <form id="internoForm" class="form-grid">
          <!-- Matrícula -->
          <div class="form-group full-width">
            <label> <i class="fas fa-id-card"></i> Matrícula </label>
            <input
              type="text"
              id="matricula"
              name="matricula"
              placeholder="Generando..."
              readonly
            />
          </div>

          <!-- Nombre -->
          <div class="form-group full-width">
            <label>
              <i class="fas fa-user"></i> Nombre Completo
              <span class="required">*</span>
            </label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Nombre completo"
              required
              class="upper-input"
              autofocus
            />
          </div>

          <!-- CURP -->
          <div class="form-group">
            <label> <i class="fas fa-id-card"></i> CURP </label>
            <input
              type="text"
              id="curp"
              name="curp"
              placeholder="CURP"
              class="upper-input"
            />
          </div>

          <!-- RFC -->
          <div class="form-group">
            <label> <i class="fas fa-file-invoice"></i> RFC </label>
            <input
              type="text"
              id="rfc"
              name="rfc"
              placeholder="RFC"
              class="upper-input"
            />
          </div>

          <!-- Universidad -->
          <div class="form-group">
            <label>
              <i class="fas fa-university"></i> Universidad
              <span class="required">*</span>
            </label>
            <input
              type="text"
              id="universidad"
              name="universidad"
              placeholder="Universidad"
              required
              class="upper-input"
            />
          </div>

          <!-- Carrera -->
          <div class="form-group">
            <label>
              <i class="fas fa-graduation-cap"></i> Carrera
              <span class="required">*</span>
            </label>
            <input
              type="text"
              id="carrera"
              name="carrera"
              placeholder="Carrera"
              required
              class="upper-input"
            />
          </div>

          <!-- Semestre -->
          <div class="form-group">
            <label>
              <i class="fas fa-layer-group"></i> Semestre
              <span class="required">*</span>
            </label>
            <input
              type="text"
              id="semestre"
              name="semestre"
              placeholder="8° Semestre"
              required
              class="upper-input"
            />
          </div>

          <!-- Generación -->
          <div class="form-group">
            <label>
              <i class="fas fa-calendar-alt"></i> Generación
              <span class="required">*</span>
            </label>
            <input
              type="text"
              id="generacion"
              name="generacion"
              placeholder="2020-2025"
              required
              class="upper-input"
            />
          </div>

          <!-- Correo -->
          <div class="form-group">
            <label>
              <i class="fas fa-envelope"></i> Correo
              <span class="required">*</span>
            </label>
            <input
              type="email"
              id="correo"
              name="correo"
              placeholder="correo@ejemplo.com"
              required
            />
          </div>

          <!-- Teléfono -->
          <div class="form-group">
            <label> <i class="fas fa-phone"></i> Teléfono </label>
            <input
              type="tel"
              id="telefono"
              name="telefono"
              placeholder="(55) 1234-5678"
              class="upper-input"
            />
          </div>

          <!-- Tipo Sanguíneo -->
          <div class="form-group">
            <label> <i class="fas fa-droplet"></i> Tipo Sanguíneo </label>
            <select id="tipo_sanguineo" name="tipo_sanguineo">
              <option value="">Seleccionar</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
              <option value="no lo se">No lo sé</option>
            </select>
          </div>

          <!-- Alergias -->
          <div class="form-group">
            <label> <i class="fas fa-allergies"></i> Alergias </label>
            <input
              type="text"
              id="alergias"
              name="alergias"
              placeholder="Ej: Penicilina, Polen, etc."
            />
          </div>

          <!-- Contacto de Emergencia -->
          <div class="form-group">
            <label>
              <i class="fas fa-user-friends"></i> Contacto de Emergencia
            </label>
            <input
              type="text"
              id="contacto_emergencia"
              name="contacto_emergencia"
              placeholder="Nombre del contacto"
              class="upper-input"
            />
          </div>

          <!-- Teléfono de Emergencia -->
          <div class="form-group">
            <label>
              <i class="fas fa-phone-alt"></i> Teléfono de Emergencia
            </label>
            <input
              type="tel"
              id="telefono_emergencia"
              name="telefono_emergencia"
              placeholder="(55) 1234-5678"
              class="upper-input"
            />
          </div>

          <!-- Estatus -->
          <div class="form-group" id="estatusGroup" style="display: none">
            <label> <i class="fas fa-toggle-on"></i> Estatus </label>
            <select id="estatus" name="estatus">
              <option value="activo">ACTIVO</option>
              <option value="inactivo">INACTIVO</option>
            </select>
            <span class="hint">Cambia el estatus del interno</span>
          </div>

          <input type="hidden" id="internoId" value="" />

          <!-- Foto -->
          <div class="form-group full-width photo-section">
            <label><i class="fas fa-camera"></i> Foto</label>
            <div class="photo-upload">
              <div class="photo-preview-container">
                <div id="photoPreview">
                  <div class="photo-placeholder">
                    <i class="fas fa-user-circle"></i>
                  </div>
                </div>
              </div>
              <div class="photo-actions">
                <div class="btn-group">
                  <button
                    type="button"
                    class="btn-upload"
                    onclick="document.getElementById('photoInput').click()"

                    <i class="fas fa-upload"></i> Subir
                  </button>
                  <button
                    type="button"
                    class="btn-camera"
                    id="btnCamera"
                    onclick="abrirCamara()"
                  >
                    <i class="fas fa-camera"></i> Cámara
                  </button>
                  <button
                    type="button"
                    class="btn-remove"
                    id="removePhotoBtn"
                    style="display: none"
                    onclick="removePhoto()"
                  >
                    <i class="fas fa-trash"></i> Eliminar
                  </button>
                </div>
                <input
                  type="file"
                  id="photoInput"
                  class="file-input-hidden"
                  accept="image/jpeg,image/png,image/webp"
                  onchange="handlePhotoSelect(event)"
                />
                <span class="hint">Formatos: JPG, PNG, WEBP · Max: 5MB</span>
              </div>
            </div>
          </div>

          <!-- BOTONES -->
          <div class="form-actions">
            <button type="submit" class="btn-submit" id="submitBtn">
              <i class="fas fa-save"></i>
              <span id="submitText">Guardar</span>
            </button>
            <button type="reset" class="btn-reset" onclick="resetForm()">
              <i class="fas fa-undo"></i>
            </button>
          </div>
        </form>
      </div>

      <!-- ===== COLUMNA DERECHA - LISTA ===== -->

          <h2>
            <i class="fas fa-users"></i> Internos

          </h2>
          <div class="list-search">
            <div class="filter-toggle-group" id="filterToggleGroup">
              <button
                class="filter-toggle-btn active"
                data-filter="todos"
                onclick="setFilter('todos')"
              >
                Todos <span class="count" id="countTodos">0</span>
              </button>
              <button
                class="filter-toggle-btn"
                data-filter="activo"
                onclick="setFilter('activo')"
              >
                <i
                  class="fas fa-check-circle"
                  style="color: #22c55e; font-size: 10px"
                ></i>
                Activos
                <span class="count" id="countActivos">0</span>
              </button>
              <button
                class="filter-toggle-btn"
                data-filter="inactivo"
                onclick="setFilter('inactivo')"
              >
                <i
                  class="fas fa-times-circle"
                  style="color: #ef4444; font-size: 10px"
                ></i>
                Inactivos
                <span class="count" id="countInactivos">0</span>
              </button>
            </div>
            <input
              type="text"
              id="searchInput"
              placeholder="Buscar interno..."
              oninput="filterCards()"
            />
            <button
              class="btn-print-all"
              onclick="imprimirMultiplesCredenciales()"
              title="Imprimir credenciales de los filtrados"
            >
              <i class="fas fa-print"></i> Imprimir
            </button>
          </div>
        </div>
        <div class="list-scroll" id="listScroll">
          <div id="internosList" class="cards-grid">
            <div class="empty-state">
              <i class="fas fa-user-plus"></i>
              <h3>No hay internos registrados</h3>
              <p>Comienza registrando un nuevo interno</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== MODAL DE CÁMARA ===== -->
    <div
      class="camera-overlay"

      // ============================================================

      function sanitizeUpperCase(text) {
        if (!text) return "";
        return text.toString().trim().replace(/\s+/g, " ").toUpperCase();
      }

      function sanitizeEmail(email) {
        if (!email) return "";
        return email.toString().trim().replace(/\s+/g, " ").toLowerCase();
      }

      function sanitizeMatricula(matricula) {
        if (!matricula) return "";
        return matricula.toString().trim().replace(/\s+/g, "").toUpperCase();
      }

      function sanitizeEstatus(estatus) {
        if (!estatus) return "activo";
        const value = estatus.toString().toLowerCase().trim();
        return value === "activo" || value === "inactivo" ? value : "activo";
      }

      function sanitizeInternoData(data) {
        const sanitized = {};
        const upperFields = [
          "nombre",
          "universidad",
          "carrera",
          "semestre",
          "generacion",
          "telefono",
          "curp",
          "rfc",
          "alergias",
          "contacto_emergencia",
          "telefono_emergencia",
        ];

        for (const [key, value] of Object.entries(data)) {
          if (value === null || value === undefined) {
            sanitized[key] = null;
            continue;
          }

          if (key === "correo") {
            sanitized[key] = sanitizeEmail(value);
          } else if (key === "matricula") {
            sanitized[key] = sanitizeMatricula(value);
          } else if (key === "estatus") {
            sanitized[key] = sanitizeEstatus(value);
          } else if (key === "tipo_sanguineo") {
            sanitized[key] = value.toString().trim() || null;
          } else if (upperFields.includes(key)) {
            sanitized[key] = sanitizeUpperCase(value);
          } else {
            sanitized[key] = value;
          }
        }

        return sanitized;
      }

      // ============================================================
      // FUNCIONES DE CÁMARA
      // ============================================================
      async function abrirCamara() {
        try {
          cameraOverlay.style.display = "flex";
          cameraStatus.textContent = "📷 Solicitando acceso a la cámara...";
          btnCapture.disabled = true;

          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            cameraStatus.textContent = "❌ Tu navegador no soporta la cámara";
            return;
          }

          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: "environment",
                width: { ideal: 640 },
                height: { ideal: 480 },
              },
              audio: false,
            });
          } catch (e) {
            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: "user",
                width: { ideal: 640 },
                height: { ideal: 480 },
              },
              audio: false,
            });
          }

          video.srcObject = stream;
          await video.play();

          cameraStatus.textContent = "📸 Listo para capturar";
          btnCapture.disabled = false;
        } catch (error) {
          console.error("Error al abrir cámara:", error);
          cameraStatus.textContent =
            "❌ No se pudo acceder a la cámara: " + error.message;
          btnCapture.disabled = true;
          showAlert(
            "No se pudo acceder a la cámara. Verifica los permisos.",
            "error",
          );
        }
      }

      function cerrarCamara() {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }
        video.srcObject = null;
        cameraOverlay.style.display = "none";
        btnCapture.disabled = true;
      }

      function capturarFoto() {
        if (!stream) {
          showAlert("La cámara no está activa", "error");
          return;
        }

        try {
          const canvas = document.createElement("canvas");
          const context = canvas.getContext("2d");

          const videoWidth = video.videoWidth || 640;
          const videoHeight = video.videoHeight || 480;
          const maxSize = 800;

          let width = videoWidth;
          let height = videoHeight;

          if (width > maxSize) {
            height = (height * maxSize) / width;
            width = maxSize;
          }
          if (height > maxSize) {
            width = (width * maxSize) / height;
            height = maxSize;
          }

          canvas.width = width;
          canvas.height = height;
          context.drawImage(video, 0, 0, width, height);

          canvas.toBlob(
            function (blob) {
              if (!blob) {
                showAlert("Error al capturar la foto", "error");
                return;
              }

              const file = new File([blob], `foto-camara-${Date.now()}.jpg`, {
                type: "image/jpeg",
              });

              const event = { target: { files: [file] } };
              handlePhotoSelect(event);
              cerrarCamara();
              showAlert("✅ Foto capturada correctamente", "success");
            },
            "image/jpeg",
            0.85,
          );
        } catch (error) {
          console.error("Error al capturar:", error);
          showAlert("Error al capturar la foto: " + error.message, "error");
        }
      }

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && cameraOverlay.style.display === "flex") {
          cerrarCamara();
        }
      });

      // ============================================================

      function getToastContainer() {
        let container = document.querySelector(".toast-container");
        if (!container) {
          container = document.createElement("div");
          container.className = "toast-container";
          document.body.appendChild(container);
        }
        return container;
      }

      function showAlert(message, type = "info", duration = 4800) {
        const container = getToastContainer();

        const configs = {
          success: {
            icon: "fa-check-circle",
            title: "¡Éxito!",
            className: "toast-success",
          },
          error: {
            icon: "fa-exclamation-circle",
            title: "¡Error!",
            className: "toast-error",
          },
          info: {
            icon: "fa-info-circle",
            title: "Información",
            className: "toast-info",
          },
          warning: {
            icon: "fa-exclamation-triangle",
            title: "Atención",
            className: "toast-warning",
          },
        };

        const config = configs[type] || configs.info;

        const toast = document.createElement("div");
        toast.className = `toast ${config.className}`;
        toast.innerHTML = `
                <i class="fas ${config.icon}"></i>
                <div class="toast-content">
                    <div class="toast-title">${config.title}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.closest('.toast').remove()">
                    <i class="fas fa-times"></i>
                </button>
            `;

        container.appendChild(toast);

        const timeoutId = setTimeout(() => {
          removeToast(toast);
        }, duration);

        toast.dataset.timeoutId = timeoutId;

        toast.addEventListener("click", function (e) {
          if (e.target.closest(".toast-close")) return;
          removeToast(this);
        });

        return toast;
      }

      function removeToast(toast) {
        if (toast.classList.contains("toast-exit")) return;

        if (toast.dataset.timeoutId) {
          clearTimeout(parseInt(toast.dataset.timeoutId));
        }

        toast.classList.add("toast-exit");

        setTimeout(() => {
          if (toast.parentNode) {
            toast.remove();
          }
        }, 500);
      }

      // ============================================================
      // GENERAR QR - CORREGIDO (texto reducido, nivel L)
      // ============================================================
      function generarQR(elementId, interno, size = 60) {
        const container = document.getElementById(elementId);
        if (!container) {
          console.warn("Contenedor no encontrado:", elementId);
          return;
        }

        container.innerHTML = "";

        const formatos = [
          () => {
            const iniciales = interno.nombre
              .split(" ")
              .filter((p) => p.length > 0)
              .map((p) => p[0])
              .join("")
              .slice(0, 6);
            return `HRPV|${interno.matricula}|${iniciales}`;
          },
          () => `${interno.matricula}|${interno.nombre.substring(0, 15)}`,
          () => `${interno.matricula}`,
        ];

        for (let i = 0; i < formatos.length; i++) {
          try {
            const texto = formatos[i]();
            if (!texto || texto.length < 2 || texto.length > 120) continue;

            const qr = new QRCode(container, {
              text: texto,
              width: size,
              height: size,
              colorDark: "#000000",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.L,
            });

            const canvas = container.querySelector("canvas");
            if (canvas) {
              canvas.style.width = size + "px";
              canvas.style.height = size + "px";
            }

            return qr;
          } catch (e) {
            console.warn(`Intento ${i + 1} falló:`, e.message);
          }
        }

        container.innerHTML = `
                <div style="width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;background:#fef2f2;border-radius:8px;font-size:8px;color:#dc2626;text-align:center;padding:2px;border:1px solid #fca5a5;line-height:1.2;">
                    QR Error
                </div>
            `;
        return null;
      }

      // ============================================================
      // GENERAR MATRÍCULA
      // ============================================================
      async function generarMatricula() {
        let intentos = 0;
        const maxIntentos = 100;

        while (intentos < maxIntentos) {
          const matricula = Math.floor(
            100000 + Math.random() * 900000,
          ).toString();

          const { data, error } = await supabaseClient
            .from("internos")
            .select("matricula")
            .eq("matricula", matricula)
            .maybeSingle();

          if (error) {
            console.error("Error verificando matrícula:", error);
            throw new Error("Error al verificar disponibilidad de matrícula");
          }

          if (!data) {
            return matricula;
          }

          intentos++;
        }

        throw new Error("No se pudo generar una matrícula única");
      }

      async function verificarDuplicado(nombre, universidad, idActual = null) {
        try {
          let query = supabaseClient
            .from("internos")
            .select("id, nombre, universidad")
            .eq("nombre", nombre.trim().toUpperCase())
            .eq("universidad", universidad.trim().toUpperCase());

          if (idActual) {
            query = query.neq("id", idActual);

          const { data, error } = await query;

          if (error) throw error;
          return data && data.length > 0;
        } catch (error) {
          console.error("Error verificando duplicado:", error);
          return false;
        }

                                    <i class="fas fa-trash"></i>
                                </button>

        setTimeout(() => {

      // ============================================================

      // ============================================================
      function setFilter(filter) {

        document.querySelectorAll(".filter-toggle-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.filter === filter);
        });
        filterCards();

      function getFilteredInternos() {
        if (currentFilter === "todos") {
          return allInternos;
        }
        return allInternos.filter(
          (interno) => interno.estatus === currentFilter,
        );
      }

      function updateFilterCounts() {
        const total = allInternos.length;
        const activos = allInternos.filter(
          (i) => i.estatus === "activo",
        ).length;
        const inactivos = allInternos.filter(
          (i) => i.estatus === "inactivo",
        ).length;

        document.getElementById("countTodos").textContent = total;
        document.getElementById("countActivos").textContent = activos;

      function filterCards() {
        const search = searchInput.value.toLowerCase().trim();

        let filtered = getFilteredInternos();

        if (search) {
          filtered = filtered.filter(
            (interno) =>
              interno.nombre.toLowerCase().includes(search) ||
              interno.matricula.includes(search) ||
              interno.carrera.toLowerCase().includes(search),
          );
        }

        filtered.sort((a, b) => a.nombre.localeCompare(b.nombre));

        filteredInternos = filtered;
        renderCards(filtered);

      // ============================================================
      // AGREGAR EVENTO A INTERNO
      // ============================================================
      async function agregarEventoInterno(internoId) {
        try {
          const nombreEvento = prompt("Nombre del evento/curso:");
          if (!nombreEvento) return;

          const tipo =
            prompt("Tipo (curso/taller/conferencia/seminario/otro):") || "otro";
          const fecha = prompt("Fecha (DD/MM/AAAA):");
          if (!fecha) return;

          const horas = parseInt(prompt("Horas de duración:")) || 0;

          const { data: evento, error: errorEvento } = await supabaseClient
            .from("eventos")
            .insert({
              nombre: nombreEvento.toUpperCase(),
              tipo: tipo.toLowerCase(),
              fecha_inicio: fecha.split("/").reverse().join("-"),
              horas: horas,
            })
            .select()
            .single();

          if (errorEvento) throw errorEvento;

          const { error: errorPart } = await supabaseClient
            .from("participaciones_internos")
            .insert({
              interno_id: internoId,
              evento_id: evento.id,
              desempenio: "Pendiente",
            });

          if (errorPart) throw errorPart;

          showAlert("✅ Evento agregado correctamente", "success");
          openExpediente(internoId);
        } catch (error) {
          console.error("Error:", error);
          showAlert("Error al agregar evento: " + error.message, "error");
        }
      }

          showAlert(
            "⏳ Espera un momento antes de guardar nuevamente",
            "warning",
          );
          return;
        }

        isSubmitting = true;
        lastSubmitTime = now;
        submitBtn.disabled = true;
        submitBtn.innerHTML = `
                <span class="spinner"></span> 
                ${isEditing ? "Actualizando..." : "Guardando..."}
            `;

        try {
          const id = document.getElementById("internoId").value;
          const matricula = document.getElementById("matricula").value.trim();
          const nombre = document.getElementById("nombre").value.trim();
          const curp = document.getElementById("curp").value.trim();
          const rfc = document.getElementById("rfc").value.trim();
          const universidad = document
            .getElementById("universidad")
            .value.trim();
          const carrera = document.getElementById("carrera").value.trim();
          const semestre = document.getElementById("semestre").value.trim();
          const generacion = document.getElementById("generacion").value.trim();
          const correo = document.getElementById("correo").value.trim();
          const telefono = document.getElementById("telefono").value.trim();
          const tipo_sanguineo =
            document.getElementById("tipo_sanguineo").value;
          const alergias = document.getElementById("alergias").value.trim();
          const contacto_emergencia = document
            .getElementById("contacto_emergencia")
            .value.trim();
          const telefono_emergencia = document
            .getElementById("telefono_emergencia")
            .value.trim();
          const estatus = document.getElementById("estatus").value;

          if (
            !nombre ||
            !universidad ||
            !carrera ||
            !semestre ||
            !generacion ||
            !correo
          ) {
            showAlert("Completa todos los campos obligatorios (*)", "error");
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerHTML = `
                        <i class="fas fa-save"></i> 
                        <span>${isEditing ? "Actualizar" : "Guardar"}</span>
                    `;
            return;
          }

          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(correo)) {
            showAlert("Correo electrónico inválido", "error");
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerHTML = `
                        <i class="fas fa-save"></i> 
                        <span>${isEditing ? "Actualizar" : "Guardar"}</span>
                    `;
            return;
          }

          const existeDuplicado = await verificarDuplicado(
            nombre,
            universidad,
            id || null,
          );
          if (existeDuplicado) {
            showAlert(
              "⚠️ Ya existe un interno con el mismo nombre y universidad",
              "warning",
            );
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerHTML = `
                        <i class="fas fa-save"></i> 
                        <span>${isEditing ? "Actualizar" : "Guardar"}</span>
                    `;
            return;
          }

          let foto_url = currentPhotoUrl;

          if (currentPhotoFile) {
            try {
              const matriculaParaFoto = matricula || "temp";
              foto_url = await uploadPhoto(matriculaParaFoto);
            } catch (uploadError) {
              showAlert(
                "Error al subir la foto: " + uploadError.message,
                "error",
              );
              isSubmitting = false;
              submitBtn.disabled = false;
              submitBtn.innerHTML = `
                            <i class="fas fa-save"></i> 
                            <span>${isEditing ? "Actualizar" : "Guardar"}</span>
                        `;
              return;
            }
          }

          const internoData = {
            nombre,
            curp: curp || null,
            rfc: rfc || null,
            universidad,
            carrera,
            semestre,
            generacion,
            correo,
            telefono: telefono || null,
            tipo_sanguineo: tipo_sanguineo || null,
            alergias: alergias || null,
            contacto_emergencia: contacto_emergencia || null,
            telefono_emergencia: telefono_emergencia || null,
            estatus,
            foto_url: foto_url || null,
          };

          if (matricula && !isEditing) {
            internoData.matricula = matricula;
          }

          let result;
          if (isEditing && id) {
            result = await updateInterno(id, internoData);
            showAlert("Interno actualizado correctamente", "success");
          } else {
            result = await createInterno(internoData);
            showAlert(
              "✅ Interno registrado. Matrícula: " + result.matricula,
              "success",
            );
          }

          await loadInternos();
          resetForm();
          document
            .querySelector(".bento-list")
            .scrollIntoView({ behavior: "smooth" });
        } catch (error) {
          console.error("Error:", error);
          showAlert("Error al guardar: " + error.message, "error");
        } finally {
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.innerHTML = `
                    <i class="fas fa-save"></i> 
                    <span>${isEditing ? "Actualizar" : "Guardar"}</span>
                `;
        }
      });

      // ============================================================
      // INICIALIZAR
      // ============================================================
      document.addEventListener("DOMContentLoaded", function () {
        loadInternos();
        pregenerarMatricula();
        document.getElementById("nombre").focus();
        console.log("🔍 Conectado a Supabase");
        console.log(
          "✅ Todos los datos se guardarán en MAYÚSCULAS (excepto email)",
        );
      });

      // ============================================================
      // FOOTER
      // ============================================================
      document.addEventListener("click", function (e) {
        const link = e.target.closest("#footerLink");
        if (link) {
          e.preventDefault();
          window.open(link.href, "_blank");
        }
      });
    </script>
  </body>
</html>
