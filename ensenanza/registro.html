<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Internos - Hospital Regional Puerto Vallarta</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            padding: 20px;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: 30% 70%;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            min-height: calc(100vh - 40px);
        }

        .bento-form {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .bento-form .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f4f8;
        }

        .bento-form .header .logo {
            display: inline-block;
            background: linear-gradient(135deg, #1a56db, #3b82f6);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            line-height: 60px;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .bento-form .header h1 {
            font-size: 20px;
            color: #1e293b;
            font-weight: 700;
        }

        .bento-form .header p {
            color: #64748b;
            font-size: 13px;
            margin-top: 3px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .form-group label .required {
            color: #ef4444;
        }

        .form-group input,
        .form-group select {
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 13px;
            transition: all 0.3s ease;
            background: #f8fafc;
            color: #1e293b;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
            background: white;
        }

        .form-group input:read-only {
            background: #f1f5f9;
            cursor: not-allowed;
            color: #475569;
        }

        .photo-upload {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 12px;
            border: 2px dashed #cbd5e1;
        }

        .photo-preview {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #e2e8f0;
            background: white;
        }

        .photo-placeholder {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 24px;
        }

        .photo-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .photo-actions .btn-upload {
            background: #3b82f6;
            color: white;
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .photo-actions .btn-upload:hover {
            background: #2563eb;
        }

        .photo-actions .btn-remove {
            background: #fee2e2;
            color: #dc2626;
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .photo-actions .btn-remove:hover {
            background: #fecaca;
        }

        .file-input-hidden {
            display: none;
        }

        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
            margin-top: 10px;
            padding-top: 15px;
            border-top: 2px solid #f0f4f8;
        }

        .btn-submit {
            flex: 1;
            padding: 12px;
            background: linear-gradient(135deg, #1a56db, #3b82f6);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.35);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-submit .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-reset {
            padding: 12px 20px;
            background: #f1f5f9;
            color: #475569;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-reset:hover {
            background: #e2e8f0;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
            border-left: 4px solid #22c55e;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border-left: 4px solid #3b82f6;
        }

        .alert .close-alert {
            margin-left: auto;
            cursor: pointer;
            font-size: 16px;
            opacity: 0.6;
            transition: opacity 0.3s ease;
            background: none;
            border: none;
        }

        .alert .close-alert:hover {
            opacity: 1;
        }

        .bento-list {
            background: transparent;
        }

        .bento-list .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
        }

        .bento-list .list-header h2 {
            font-size: 18px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bento-list .list-header .badge {
            background: #3b82f6;
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .list-search {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .list-search input {
            padding: 8px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 13px;
            transition: all 0.3s ease;
            background: #f8fafc;
            width: 200px;
        }

        .list-search input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
            border-color: #3b82f6;
        }

        .card .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .card .card-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #1a56db);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;
        }

        .card .card-avatar img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }

        .card .card-name {
            font-weight: 600;
            color: #1e293b;
            font-size: 15px;
        }

        .card .card-matricula {
            color: #64748b;
            font-size: 12px;
        }

        .card .card-body {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin: 8px 0;
        }

        .card .card-body .tag {
            background: #f1f5f9;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #475569;
        }

        .card .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #f0f4f8;
        }

        .card .card-status {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-activo {
            background: #dcfce7;
            color: #166534;
        }

        .status-inactivo {
            background: #fee2e2;
            color: #991b1b;
        }

        .card .card-actions {
            display: flex;
            gap: 6px;
        }

        .card .card-actions button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: 13px;
            color: #64748b;
        }

        .card .card-actions button:hover {
            background: #f1f5f9;
        }

        .card .card-actions .btn-edit:hover {
            color: #3b82f6;
        }

        .card .card-actions .btn-delete:hover {
            color: #ef4444;
        }

        .card .card-qr-mini {
            width: 50px;
            height: 50px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .card .card-qr-mini canvas {
            width: 50px !important;
            height: 50px !important;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal {
            background: white;
            border-radius: 24px;
            padding: 30px;
            max-width: 420px;
            width: 92%;
            max-height: 90vh;
            overflow-y: auto;
            animation: scaleIn 0.3s ease-out;
            position: relative;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #94a3b8;
            transition: color 0.3s ease;
            z-index: 10;
        }

        .modal-close:hover {
            color: #1e293b;
        }

        .credencial {
            background: linear-gradient(135deg, #0f2b5e, #1a56db);
            border-radius: 16px;
            padding: 20px;
            color: white;
            max-width: 340px;
            margin: 0 auto;
            font-size: 13px;
        }

        .credencial .credencial-header {
            text-align: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .credencial .credencial-header h3 {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .credencial .credencial-header p {
            font-size: 11px;
            opacity: 0.75;
            font-weight: 300;
        }

        .credencial .credencial-body {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .credencial .credencial-foto {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.4);
            object-fit: cover;
            flex-shrink: 0;
        }

        .credencial .credencial-foto-placeholder {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .credencial .credencial-info {
            flex: 1;
            min-width: 0;
        }

        .credencial .credencial-info .name {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .credencial .credencial-info .detail {
            font-size: 11px;
            opacity: 0.85;
            line-height: 1.4;
        }

        .credencial .credencial-info .detail i {
            width: 14px;
            opacity: 0.6;
        }

        .credencial .credencial-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid rgba(255, 255, 255, 0.15);
        }

        .credencial .credencial-footer .qr-container {
            background: white;
            padding: 5px;
            border-radius: 10px;
            line-height: 0;
        }

        .credencial .credencial-footer .qr-container canvas {
            width: 65px !important;
            height: 65px !important;
            display: block;
        }

        .credencial .credencial-footer .status-badge {
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .credencial .credencial-footer .status-badge.activo {
            background: rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .credencial .credencial-footer .status-badge.inactivo {
            background: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            justify-content: center;
        }

        .modal-actions button {
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .modal-actions .btn-print {
            background: #1a56db;
            color: white;
        }

        .modal-actions .btn-print:hover {
            background: #1e40af;
            transform: translateY(-2px);
        }

        .modal-actions .btn-close-modal {
            background: #f1f5f9;
            color: #475569;
        }

        .modal-actions .btn-close-modal:hover {
            background: #e2e8f0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state h3 {
            color: #475569;
            font-size: 18px;
        }

        .empty-state p {
            font-size: 14px;
            margin-top: 5px;
        }

        @media (max-width: 1024px) {
            .bento-grid {
                grid-template-columns: 1fr;
            }

            .bento-form {
                position: static;
            }

            .cards-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }
        }

        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .bento-form {
                padding: 16px;
            }

            .modal {
                padding: 16px;
                max-width: 100%;
                width: 95%;
            }

            .credencial {
                max-width: 100%;
                padding: 16px;
            }

            .credencial .credencial-body {
                flex-direction: column;
                text-align: center;
            }

            .credencial .credencial-footer {
                flex-direction: column;
                gap: 10px;
            }

            .list-search {
                flex-direction: column;
                width: 100%;
            }

            .list-search input {
                width: 100%;
            }

            .bento-list .list-header {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
            }
        }

        @media print {
            body * {
                visibility: hidden;
            }

            .modal-overlay,
            .modal-overlay * {
                visibility: visible;
            }

            .modal-overlay {
                position: fixed !important;
                background: white !important;
                backdrop-filter: none !important;
                display: flex !important;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 9999;
            }

            .modal {
                box-shadow: none !important;
                padding: 16px !important;
                max-width: 320px !important;
                width: 100% !important;
                margin: auto;
                border-radius: 0 !important;
                animation: none !important;
            }

            .modal-close,
            .modal-actions {
                display: none !important;
            }

            .credencial {
                max-width: 300px !important;
                margin: 0 auto;
                page-break-inside: avoid;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="bento-grid">
        <div class="bento-form">
            <div class="header">
                <div class="logo">
                    <i class="fas fa-hospital-user"></i>
                </div>
                <h1>Registro de Internos</h1>
                <p>Hospital Regional Puerto Vallarta</p>
            </div>

            <div id="alertContainer"></div>

            <form id="internoForm" class="form-grid">
                <div class="form-group full-width">
                    <label>
                        <i class="fas fa-id-card"></i> Matrícula
                    </label>
                    <input type="text" id="matricula" name="matricula" placeholder="Generando..." readonly />
                </div>

                <div class="form-group full-width">
                    <label>
                        <i class="fas fa-user"></i> Nombre Completo <span class="required">*</span>
                    </label>
                    <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required />
                </div>

                <div class="form-group">
                    <label>
                        <i class="fas fa-university"></i> Universidad <span class="required">*</span>
                    </label>
                    <input type="text" id="universidad" name="universidad" placeholder="Universidad" required />
                </div>

                <div class="form-group">
                    <label>
                        <i class="fas fa-graduation-cap"></i> Carrera <span class="required">*</span>
                    </label>
                    <input type="text" id="carrera" name="carrera" placeholder="Carrera" required />
                </div>

                <div class="form-group">
                    <label>
                        <i class="fas fa-layer-group"></i> Semestre <span class="required">*</span>
                    </label>
                    <input type="text" id="semestre" name="semestre" placeholder="8° Semestre" required />
                </div>

                <div class="form-group">
                    <label>
                        <i class="fas fa-calendar-alt"></i> Generación <span class="required">*</span>
                    </label>
                    <input type="text" id="generacion" name="generacion" placeholder="2020-2025" required />
                </div>

                <div class="form-group">
                    <label>
                        <i class="fas fa-envelope"></i> Correo <span class="required">*</span>
                    </label>
                    <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required />
                </div>

                <div class="form-group">
                    <label>
                        <i class="fas fa-phone"></i> Teléfono
                    </label>
                    <input type="tel" id="telefono" name="telefono" placeholder="(55) 1234-5678" />
                </div>

                <div class="form-group">
                    <label>
                        <i class="fas fa-toggle-on"></i> Estatus
                    </label>
                    <select id="estatus" name="estatus">
                        <option value="activo">Activo</option>
                        <option value="inactivo">Inactivo</option>
                    </select>
                </div>

                <input type="hidden" id="internoId" value="" />

                <div class="form-group full-width">
                    <label><i class="fas fa-camera"></i> Foto</label>
                    <div class="photo-upload">
                        <div id="photoPreview">
                            <div class="photo-placeholder">
                                <i class="fas fa-user-circle"></i>
                            </div>
                        </div>
                        <div class="photo-actions">
                            <button type="button" class="btn-upload"
                                onclick="document.getElementById('photoInput').click()">
                                <i class="fas fa-upload"></i> Subir
                            </button>
                            <button type="button" class="btn-remove" id="removePhotoBtn" style="display:none;"
                                onclick="removePhoto()">
                                <i class="fas fa-trash"></i> Eliminar
                            </button>
                            <input type="file" id="photoInput" class="file-input-hidden"
                                accept="image/jpeg,image/png,image/webp" onchange="handlePhotoSelect(event)" />
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit" id="submitBtn">
                        <i class="fas fa-save"></i>
                        <span id="submitText">Guardar</span>
                    </button>
                    <button type="reset" class="btn-reset" onclick="resetForm()">
                        <i class="fas fa-undo"></i>
                    </button>
                </div>
            </form>
        </div>

        <div class="bento-list">
            <div class="list-header">
                <h2>
                    <i class="fas fa-users"></i> Internos
                    <span class="badge" id="totalCount">0</span>
                </h2>
                <div class="list-search">
                    <input type="text" id="searchInput" placeholder="Buscar interno..." oninput="filterCards()" />
                </div>
            </div>

            <div id="internosList" class="cards-grid">
                <div class="empty-state">
                    <i class="fas fa-user-plus"></i>
                    <h3>No hay internos registrados</h3>
                    <p>Comienza registrando un nuevo interno</p>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalCredencial">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">
                <i class="fas fa-times"></i>
            </button>
            <div id="credencialContent"></div>
            <div class="modal-actions">
                <button class="btn-print" onclick="imprimirCredencial()">
                    <i class="fas fa-print"></i> Imprimir
                </button>
                <button class="btn-close-modal" onclick="closeModal()">
                    <i class="fas fa-times"></i> Cerrar
                </button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURACIÓN
        // ============================================================
        const SUPABASE_URL = 'https://njtlruvhcatklccdxpla.supabase.co';
        const SUPABASE_ANON_KEY =
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qdGxydXZoY2F0a2xjY2R4cGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzIwOTIsImV4cCI6MjEwMDkwODA5Mn0.MzVwk4OWvahcUfP1KF_kHbLlIXWIbZ-wljce1i2Q1sc';

        if (typeof supabase === 'undefined') {
            document.getElementById('internosList').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
                    <h3 style="color:#ef4444;">Error de conexión</h3>
                    <p>La librería de Supabase no se cargó correctamente.</p>
                </div>
            `;
        }

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentPhotoFile = null;
        let currentPhotoUrl = null;
        let isEditing = false;
        let allInternos = [];

        const form = document.getElementById('internoForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertContainer = document.getElementById('alertContainer');
        const internosList = document.getElementById('internosList');
        const totalCount = document.getElementById('totalCount');
        const photoPreview = document.getElementById('photoPreview');
        const removePhotoBtn = document.getElementById('removePhotoBtn');
        const photoInput = document.getElementById('photoInput');
        const matriculaInput = document.getElementById('matricula');
        const searchInput = document.getElementById('searchInput');

        // ============================================================
        // GENERAR TEXTO PARA QR - VERSIÓN CORTA Y OPTIMIZADA
        // ============================================================
        function generarTextoQR(interno) {
            // Texto corto y conciso - cabe en cualquier nivel de corrección
            return `HOSPITAL REGIONAL PV
INTERNO: ${interno.nombre}
MAT: ${interno.matricula}
CAR: ${interno.carrera}
UNIV: ${interno.universidad}
SEM: ${interno.semestre}
GEN: ${interno.generacion}`;
        }

        // ============================================================
        // GENERAR MATRÍCULA AUTOMÁTICA
        // ============================================================
        async function generarMatricula() {
            let intentos = 0;
            const maxIntentos = 100;

            while (intentos < maxIntentos) {
                const matricula = Math.floor(100000 + Math.random() * 900000).toString();

                const { data, error } = await supabaseClient
                    .from('internos')
                    .select('matricula')
                    .eq('matricula', matricula)
                    .maybeSingle();

                if (error) {
                    console.error('Error verificando matrícula:', error);
                    throw new Error('Error al verificar disponibilidad de matrícula');
                }

                if (!data) {
                    return matricula;
                }

                intentos++;
            }

            throw new Error('No se pudo generar una matrícula única');
        }

        // ============================================================
        // PREGENERAR MATRÍCULA
        // ============================================================
        async function pregenerarMatricula() {
            if (isEditing) return;
            try {
                matriculaInput.value = 'Generando...';
                const matricula = await generarMatricula();
                matriculaInput.value = matricula;
            } catch (error) {
                console.error('Error:', error);
                matriculaInput.value = 'Error';
            }
        }

        // ============================================================
        // ALERTAS
        // ============================================================
        function showAlert(message, type = 'info') {
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };

            alertContainer.innerHTML = `
                <div class="alert alert-${type}">
                    <i class="fas ${icons[type] || icons.info}"></i>
                    <span>${message}</span>
                    <button class="close-alert" onclick="this.parentElement.remove()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;

            setTimeout(() => {
                const alert = alertContainer.querySelector('.alert');
                if (alert) alert.remove();
            }, 5000);
        }

        // ============================================================
        // FOTO
        // ============================================================
        function handlePhotoSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                showAlert('La imagen no debe exceder los 5MB', 'error');
                photoInput.value = '';
                return;
            }

            const validTypes = ['image/jpeg', 'image/png', 'image/webp'];
            if (!validTypes.includes(file.type)) {
                showAlert('Formato no permitido. Usa JPG, PNG o WEBP', 'error');
                photoInput.value = '';
                return;
            }

            currentPhotoFile = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                photoPreview.innerHTML = `
                    <img src="${e.target.result}" alt="Foto" class="photo-preview" />
                `;
                removePhotoBtn.style.display = 'inline-flex';
            };
            reader.readAsDataURL(file);
        }

        function removePhoto() {
            currentPhotoFile = null;
            currentPhotoUrl = null;
            photoInput.value = '';
            photoPreview.innerHTML = `
                <div class="photo-placeholder">
                    <i class="fas fa-user-circle"></i>
                </div>
            `;
            removePhotoBtn.style.display = 'none';
        }

        function setPhotoFromUrl(url) {
            currentPhotoUrl = url;
            photoPreview.innerHTML = `
                <img src="${url}" alt="Foto" class="photo-preview" />
            `;
            removePhotoBtn.style.display = 'inline-flex';
        }

        // ============================================================
        // SUBIR FOTO
        // ============================================================
        async function uploadPhoto(matricula) {
            if (!currentPhotoFile) return null;

            const fileExt = currentPhotoFile.name.split('.').pop();
            const fileName = `${matricula}.${fileExt}`;
            const filePath = `internos/${fileName}`;

            const { error: uploadError } = await supabaseClient.storage
                .from('fotos-internos')
                .upload(filePath, currentPhotoFile, { upsert: true });

            if (uploadError) {
                console.error('Error subiendo foto:', uploadError);
                throw new Error('Error al subir la foto: ' + uploadError.message);
            }

            const { data } = supabaseClient.storage
                .from('fotos-internos')
                .getPublicUrl(filePath);

            return data.publicUrl;
        }

        // ============================================================
        // GENERAR QR - CON TEXTO CORTO Y NIVEL DE CORRECCIÓN BAJO
        // ============================================================
        function generarQR(elementId, interno, size = 60) {
            const container = document.getElementById(elementId);
            if (!container) {
                console.warn('Contenedor no encontrado:', elementId);
                return;
            }

            container.innerHTML = '';

            try {
                // Generar texto corto para el QR
                const textoQR = generarTextoQR(interno);

                // Usar nivel de corrección L (menor corrección, más capacidad)
                // Si el texto es muy largo, se puede usar L o M
                const qr = new QRCode(container, {
                    text: textoQR,
                    width: size,
                    height: size,
                    colorDark: '#1a56db',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.L // L = más capacidad
                });

                const canvas = container.querySelector('canvas');
                if (canvas) {
                    canvas.style.width = size + 'px';
                    canvas.style.height = size + 'px';
                }

                return qr;
            } catch (e) {
                console.error('Error generando QR:', e);
                // Intentar con texto aún más corto si falla
                try {
                    const textoCorto = `MAT:${interno.matricula}|${interno.nombre}`;
                    const qr = new QRCode(container, {
                        text: textoCorto,
                        width: size,
                        height: size,
                        colorDark: '#1a56db',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.L
                    });
                    const canvas = container.querySelector('canvas');
                    if (canvas) {
                        canvas.style.width = size + 'px';
                        canvas.style.height = size + 'px';
                    }
                    return qr;
                } catch (e2) {
                    console.error('Error generando QR con texto corto:', e2);
                    container.innerHTML = `
                        <div style="width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;background:#f1f5f9;border-radius:8px;font-size:10px;color:#94a3b8;">
                            QR Error
                        </div>
                    `;
                    return null;
                }
            }
        }

        // ============================================================
        // CRUD - OBTENER TODOS
        // ============================================================
        async function loadInternos() {
            try {
                const { data, error } = await supabaseClient
                    .from('internos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allInternos = data;
                renderCards(data);
                totalCount.textContent = data.length;

            } catch (error) {
                console.error('Error:', error);
                internosList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
                        <h3 style="color:#ef4444;">Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // ============================================================
        // RENDER CARDS
        // ============================================================
        function renderCards(internos) {
            if (!internos || internos.length === 0) {
                internosList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-user-plus"></i>
                        <h3>No hay internos registrados</h3>
                        <p>Comienza registrando un nuevo interno</p>
                    </div>
                `;
                return;
            }

            internosList.innerHTML = internos.map(interno => {
                const iniciales = interno.nombre
                    .split(' ')
                    .filter(p => p.length > 0)
                    .map(p => p[0])
                    .join('')
                    .slice(0, 2)
                    .toUpperCase();

                return `
                <div class="card" data-id="${interno.id}" onclick="openModal('${interno.id}')">
                    <div class="card-header">
                        <div class="card-avatar">
                            ${interno.foto_url
                                ? `<img src="${interno.foto_url}" />`
                                : iniciales
                            }
                        </div>
                        <div>
                            <div class="card-name">${interno.nombre}</div>
                            <div class="card-matricula">${interno.matricula}</div>
                        </div>
                        <div class="card-qr-mini" id="qr-${interno.id}"></div>
                    </div>
                    <div class="card-body">
                        <span class="tag"><i class="fas fa-university"></i> ${interno.universidad}</span>
                        <span class="tag"><i class="fas fa-graduation-cap"></i> ${interno.carrera}</span>
                        <span class="tag"><i class="fas fa-layer-group"></i> ${interno.semestre}</span>
                        <span class="tag"><i class="fas fa-envelope"></i> ${interno.correo}</span>
                    </div>
                    <div class="card-footer">
                        <span class="card-status ${interno.estatus === 'activo' ? 'status-activo' : 'status-inactivo'}">
                            ${interno.estatus}
                        </span>
                        <div class="card-actions">
                            <button class="btn-edit" onclick="event.stopPropagation(); editInterno('${interno.id}')" title="Editar">
                                <i class="fas fa-pen"></i>
                            </button>
                            <button class="btn-delete" onclick="event.stopPropagation(); deleteInterno('${interno.id}')" title="Eliminar">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `}).join('');

            // Generar QR para cada card
            setTimeout(() => {
                internos.forEach(interno => {
                    generarQR(`qr-${interno.id}`, interno, 50);
                });
            }, 100);
        }

        // ============================================================
        // FILTRAR CARDS
        // ============================================================
        function filterCards() {
            const search = searchInput.value.toLowerCase().trim();
            const filtered = allInternos.filter(interno =>
                interno.nombre.toLowerCase().includes(search) ||
                interno.matricula.includes(search) ||
                interno.carrera.toLowerCase().includes(search)
            );
            renderCards(filtered);
        }

        // ============================================================
        // CRUD - CREAR
        // ============================================================
        async function createInterno(data) {
            if (!data.matricula) {
                data.matricula = await generarMatricula();
                matriculaInput.value = data.matricula;
            }

            data.qr_token = crypto.randomUUID();

            const { data: result, error } = await supabaseClient
                .from('internos')
                .insert([data])
                .select()
                .single();

            if (error) throw error;
            return result;
        }

        // ============================================================
        // CRUD - ACTUALIZAR
        // ============================================================
        async function updateInterno(id, data) {
            const { data: result, error } = await supabaseClient
                .from('internos')
                .update(data)
                .eq('id', id)
                .select()
                .single();

            if (error) throw error;
            return result;
        }

        // ============================================================
        // CRUD - ELIMINAR
        // ============================================================
        async function deleteInterno(id) {
            event.stopPropagation();
            if (!confirm('¿Estás seguro de eliminar este interno?')) return;

            try {
                const { error } = await supabaseClient
                    .from('internos')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                showAlert('Interno eliminado correctamente', 'success');
                loadInternos();

                const currentId = document.getElementById('internoId').value;
                if (currentId === id) resetForm();

            } catch (error) {
                console.error('Error:', error);
                showAlert('Error al eliminar: ' + error.message, 'error');
            }
        }

        // ============================================================
        // EDITAR
        // ============================================================
        async function editInterno(id) {
            event.stopPropagation();
            try {
                const { data, error } = await supabaseClient
                    .from('internos')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (error) throw error;

                document.getElementById('internoId').value = data.id;
                document.getElementById('matricula').value = data.matricula;
                document.getElementById('nombre').value = data.nombre;
                document.getElementById('universidad').value = data.universidad;
                document.getElementById('carrera').value = data.carrera;
                document.getElementById('semestre').value = data.semestre;
                document.getElementById('generacion').value = data.generacion;
                document.getElementById('correo').value = data.correo;
                document.getElementById('telefono').value = data.telefono || '';
                document.getElementById('estatus').value = data.estatus || 'activo';

                if (data.foto_url) {
                    setPhotoFromUrl(data.foto_url);
                } else {
                    removePhoto();
                }

                isEditing = true;
                submitBtn.innerHTML = `
                    <i class="fas fa-save"></i> 
                    <span>Actualizar</span>
                `;

                document.querySelector('.bento-form').scrollIntoView({ behavior: 'smooth' });
                showAlert('Editando: ' + data.nombre, 'info');

            } catch (error) {
                console.error('Error:', error);
                showAlert('Error al cargar: ' + error.message, 'error');
            }
        }

        // ============================================================
        // RESET FORM
        // ============================================================
        function resetForm() {
            form.reset();
            document.getElementById('internoId').value = '';
            removePhoto();
            isEditing = false;
            submitBtn.innerHTML = `
                <i class="fas fa-save"></i> 
                <span>Guardar</span>
            `;
            document.getElementById('estatus').value = 'activo';
            pregenerarMatricula();
            showAlert('Formulario limpiado', 'info');
        }

        // ============================================================
        // MODAL CREDENCIAL
        // ============================================================
        async function openModal(id) {
            try {
                const { data, error } = await supabaseClient
                    .from('internos')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (error) throw error;

                const iniciales = data.nombre
                    .split(' ')
                    .filter(p => p.length > 0)
                    .map(p => p[0])
                    .join('')
                    .slice(0, 2)
                    .toUpperCase();

                document.getElementById('credencialContent').innerHTML = `
                    <div class="credencial">
                        <div class="credencial-header">
                            <h3>Hospital Regional Puerto Vallarta</h3>
                            <p>Credencial de Interno</p>
                        </div>
                        <div class="credencial-body">
                            ${data.foto_url
                                ? `<img src="${data.foto_url}" class="credencial-foto" />`
                                : `<div class="credencial-foto-placeholder">${iniciales}</div>`
                            }
                            <div class="credencial-info">
                                <div class="name">${data.nombre}</div>
                                <div class="detail"><i class="fas fa-id-card"></i> ${data.matricula}</div>
                                <div class="detail"><i class="fas fa-university"></i> ${data.universidad}</div>
                                <div class="detail"><i class="fas fa-graduation-cap"></i> ${data.carrera}</div>
                                <div class="detail"><i class="fas fa-layer-group"></i> ${data.semestre}</div>
                                <div class="detail"><i class="fas fa-calendar"></i> ${data.generacion}</div>
                            </div>
                        </div>
                        <div class="credencial-footer">
                            <div class="qr-container" id="modalQR"></div>
                            <span class="status-badge ${data.estatus}">
                                ${data.estatus.toUpperCase()}
                            </span>
                        </div>
                    </div>
                `;

                // Generar QR en el modal
                setTimeout(() => {
                    generarQR('modalQR', data, 70);
                }, 50);

                document.getElementById('modalCredencial').classList.add('active');
                document.body.style.overflow = 'hidden';

            } catch (error) {
                console.error('Error:', error);
                showAlert('Error al cargar la credencial: ' + error.message, 'error');
            }
        }

        function closeModal() {
            document.getElementById('modalCredencial').classList.remove('active');
            document.body.style.overflow = '';
        }

        function imprimirCredencial() {
            window.print();
        }

        document.getElementById('modalCredencial').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ============================================================
        // ENVÍO DEL FORMULARIO
        // ============================================================
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <span class="spinner"></span> 
                ${isEditing ? 'Actualizando...' : 'Guardando...'}
            `;

            try {
                const id = document.getElementById('internoId').value;
                const matricula = document.getElementById('matricula').value.trim();
                const nombre = document.getElementById('nombre').value.trim();
                const universidad = document.getElementById('universidad').value.trim();
                const carrera = document.getElementById('carrera').value.trim();
                const semestre = document.getElementById('semestre').value.trim();
                const generacion = document.getElementById('generacion').value.trim();
                const correo = document.getElementById('correo').value.trim();
                const telefono = document.getElementById('telefono').value.trim();
                const estatus = document.getElementById('estatus').value;

                if (!nombre || !universidad || !carrera || !semestre || !generacion || !correo) {
                    showAlert('Completa todos los campos obligatorios (*)', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `
                        <i class="fas fa-save"></i> 
                        <span>${isEditing ? 'Actualizar' : 'Guardar'}</span>
                    `;
                    return;
                }

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(correo)) {
                    showAlert('Correo electrónico inválido', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `
                        <i class="fas fa-save"></i> 
                        <span>${isEditing ? 'Actualizar' : 'Guardar'}</span>
                    `;
                    return;
                }

                let foto_url = currentPhotoUrl;

                if (currentPhotoFile) {
                    try {
                        const matriculaParaFoto = matricula || 'temp';
                        foto_url = await uploadPhoto(matriculaParaFoto);
                    } catch (uploadError) {
                        showAlert('Error al subir la foto: ' + uploadError.message, 'error');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = `
                            <i class="fas fa-save"></i> 
                            <span>${isEditing ? 'Actualizar' : 'Guardar'}</span>
                        `;
                        return;
                    }
                }

                const internoData = {
                    nombre,
                    universidad,
                    carrera,
                    semestre,
                    generacion,
                    correo,
                    telefono: telefono || null,
                    estatus,
                    foto_url: foto_url || null
                };

                if (matricula && !isEditing) {
                    internoData.matricula = matricula;
                }

                let result;
                if (isEditing && id) {
                    result = await updateInterno(id, internoData);
                    showAlert('Interno actualizado correctamente', 'success');
                } else {
                    result = await createInterno(internoData);
                    showAlert('✅ Interno registrado. Matrícula: ' + result.matricula, 'success');
                }

                await loadInternos();
                resetForm();
                document.querySelector('.bento-list').scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                console.error('Error:', error);
                showAlert('Error al guardar: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
                    <i class="fas fa-save"></i> 
                    <span>${isEditing ? 'Actualizar' : 'Guardar'}</span>
                `;
            }
        });

        // ============================================================
        // INICIALIZAR
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadInternos();
            pregenerarMatricula();
            console.log('🔍 Conectado a Supabase');
        });
    </script>

</body>
