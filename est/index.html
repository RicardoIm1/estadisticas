<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estadísticas y Archivo Clínico</title>
    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/img/favicon.ico" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link href="/main_css/estilos.css" rel="stylesheet" />

    <style>
      /* === 📊 GRID PRINCIPAL - TILES === */
      .grid-lumia-glass {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 14px;
        padding: 0.5rem 1rem 0.5rem 1rem;
        grid-auto-flow: dense;
        width: 100%;
        box-sizing: border-box;
      }

      /* === 💠 TILE BASE === */
      .tile {
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(10px) saturate(140%);
        -webkit-backdrop-filter: blur(10px) saturate(140%);
        background-color: rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 1rem;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 100px;
        transition: all 0.25s ease-in-out;
        cursor: pointer;
        width: 100%;
        max-width: 100%;
        word-wrap: break-word;
        overflow-wrap: break-word;
        grid-column: span 3;
        text-decoration: none;
      }

      .tile::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 10px;
        background: radial-gradient(
          circle at 30% 20%,
          rgba(255, 255, 255, 0.05),
          transparent 70%
        );
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none;
      }

      .tile:hover::after {
        opacity: 1;
      }

      .tile:hover {
        transform: translateY(-4px) scale(1.01);
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
        background: rgba(255, 255, 255, 0.12);
      }

      /* === 🎨 PALETA GLASS === */
      .azul {
        background: rgba(70, 130, 180, 0.25);
      }
      .azul:hover {
        background: rgba(70, 130, 180, 0.35);
      }
      .verde {
        background: rgba(34, 139, 34, 0.25);
      }
      .verde:hover {
        background: rgba(34, 139, 34, 0.35);
      }
      .naranja {
        background: rgba(218, 112, 48, 0.25);
      }
      .naranja:hover {
        background: rgba(218, 112, 48, 0.35);
      }
      .morado {
        background: rgba(123, 104, 238, 0.25);
      }
      .morado:hover {
        background: rgba(123, 104, 238, 0.35);
      }
      .rojo {
        background: rgba(180, 50, 50, 0.25);
      }
      .rojo:hover {
        background: rgba(180, 50, 50, 0.35);
      }
      .amarillo {
        background: rgba(228, 214, 18, 0.25);
      }
      .amarillo:hover {
        background: rgba(228, 214, 18, 0.35);
      }

      /* === 🔠 TIPOGRAFÍA === */
      .tile h3 {
        font-size: 1.3rem;
        margin: 0 0 0.3rem 0;
        opacity: 0.9;
        transition: transform 0.3s ease;
        line-height: 1.2;
      }
      .tile:hover h3 {
        transform: scale(1.02) translateY(-2px);
      }
      .tile h3 i {
        margin-right: 0.6rem;
      }
      .tile p {
        font-size: 0.85rem;
        margin: 0;
        line-height: 1.3;
        opacity: 0.85;
      }

      /* === 📊 MATRIZ DE INFORMES === */
      .matriz-container {
        padding: 0.5rem 1rem 0.5rem 1rem;
        width: 100%;
        box-sizing: border-box;
        overflow-x: auto;
      }

      .matriz-grid {
        display: grid;
        gap: 3px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 10px;
        padding: 4px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        min-width: 600px;
      }

      .matriz-grid .celda {
        background: rgba(255, 255, 255, 0.04);
        padding: 6px 8px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        transition: background 0.2s ease;
        font-size: 0.75rem;
        min-height: 32px;
        color: #ccc;
        word-break: break-word;
      }

      .matriz-grid .col-titulo {
        font-weight: 600;
        color: #fff;
        background: rgba(255, 255, 255, 0.06);
        justify-content: center;
        text-align: center;
        font-size: 0.7rem;
        letter-spacing: 0.3px;
      }

      .matriz-grid .celda-fija {
        font-weight: 500;
        color: #ddd;
        background: rgba(255, 255, 255, 0.04);
        justify-content: flex-start;
        padding-left: 12px;
        font-size: 0.7rem;
      }

      .matriz-grid .celda-llena {
        background: rgba(50, 200, 50, 0.15);
        border-left: 2px solid rgba(50, 200, 50, 0.3);
      }

      .matriz-grid .card-informe {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 100%;
      }

      .matriz-grid .card-informe input[type="checkbox"] {
        width: 14px;
        height: 14px;
        accent-color: #4caf50;
        cursor: pointer;
        flex-shrink: 0;
      }

      .matriz-grid .input-evidencia {
        background: transparent;
        border: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        color: #eee;
        font-size: 0.7rem;
        padding: 2px 4px;
        width: 100%;
        min-width: 60px;
        transition: border-color 0.2s ease;
        outline: none;
      }

      .matriz-grid .input-evidencia:focus {
        border-bottom-color: rgba(100, 200, 255, 0.5);
      }

      .matriz-grid .input-evidencia::placeholder {
        color: rgba(255, 255, 255, 0.2);
        font-size: 0.6rem;
      }

      .matriz-grid .card-informe.activo .input-evidencia {
        border-bottom-color: rgba(50, 200, 50, 0.3);
      }

      /* === RESPONSIVE === */
      @media (max-width: 1200px) {
        .tile {
          grid-column: span 4;
        }
      }
      @media (max-width: 992px) {
        .tile {
          grid-column: span 6;
        }
      }
      @media (max-width: 768px) {
        .grid-lumia-glass {
          grid-template-columns: repeat(6, 1fr);
          gap: 10px;
          padding: 0.3rem 0.5rem;
        }
        .tile {
          grid-column: span 6;
          padding: 0.8rem;
          min-height: 80px;
        }
        .tile h3 {
          font-size: 1.05rem;
        }
        .matriz-container {
          padding: 0.3rem 0.5rem;
        }
        .matriz-grid .celda {
          font-size: 0.65rem;
          padding: 4px 6px;
          min-height: 28px;
        }
      }
      @media (max-width: 480px) {
        .grid-lumia-glass {
          gap: 8px;
          padding: 0.2rem 0.3rem;
        }
        .tile {
          padding: 0.6rem;
          min-height: 65px;
        }
        .tile h3 {
          font-size: 0.9rem;
        }
        .tile p {
          font-size: 0.7rem;
        }
        .matriz-grid .celda {
          font-size: 0.55rem;
          padding: 3px 4px;
          min-height: 24px;
        }
        .matriz-grid .input-evidencia {
          font-size: 0.55rem;
          min-width: 40px;
        }
      }

      /* === ANIMACIÓN === */
      @keyframes tileFadeIn {
        from {
          opacity: 0;
          transform: translateY(15px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .tile {
        opacity: 0;
        animation: tileFadeIn 0.5s ease-out forwards;
      }
      .tile:nth-child(1) {
        animation-delay: 0.05s;
      }
      .tile:nth-child(2) {
        animation-delay: 0.1s;
      }
      .tile:nth-child(3) {
        animation-delay: 0.15s;
      }
      .tile:nth-child(4) {
        animation-delay: 0.2s;
      }
      .tile:nth-child(5) {
        animation-delay: 0.25s;
      }

      /* === AJUSTE CONTENEDOR === */
      .glass {
        display: flex;
        flex-direction: column;
        height: auto;
      }
      .glass > h5 {
        flex-shrink: 0;
        margin-bottom: 0.3rem;
      }
      #header {
        flex-shrink: 0;
      }
      #footer {
        flex-shrink: 0;
        margin-top: 0.5rem;
      }
    </style>
  </head>

  <body>
    <div class="glass" id="dashboard">
      <h5>ESTADÍSTICAS</h5>
      <div id="header"></div>

      <!-- GRID DE TILES -->
      <div class="grid-lumia-glass">
        <a href="/capacitacion/" target="_self" class="tile azul">
          <h3><i class="fa-solid fa-graduation-cap"></i> Capacitación</h3>
          <p>Formatos y Presentaciones</p>
        </a>

        <a href="/censo/" target="_self" class="tile verde">
          <h3><i class="fa-solid fa-book-open"></i> Censo</h3>
          <p>Ocupación por servicio</p>
        </a>

        <a href="/defunciones/" target="_self" class="tile rojo">
          <h3><i class="fa-solid fa-cross"></i> Defunciones</h3>
          <p>Defunciones Generales</p>
        </a>

        <a href="/archivo/h_faltantes.html" target="_self" class="tile naranja">
          <h3><i class="fa-solid fa-file-lines"></i> Hojas Faltantes</h3>
          <p>Hojas de Egresos incompletas o mal llenadas</p>
        </a>
      </div>

      <!-- MATRIZ DE INFORMES -->
      <div class="matriz-container">
        <div class="matriz-grid" id="matriz"></div>
      </div>

      <div id="footer"></div>
    </div>

    <script>
      const INFORMES = [
        "SINBA BD EGRESOS",
        "SINBA BD URGENCIAS",
        "SINBA BD LESIONES",
        "SINBA BD NACIMIENTOS",
        "SINBA BD DEFUNCIONES",
        "SINBA GERENCIAL",
        "RESUMEN DEFUNCIONES",
        "CONCENTRADO GENERAL DEL CENSO",
        "CORTA ESTANCIA",
        "PRINCIPALES CAUSAS DE EGRESO",
        "EXPEDIENTES CLINICOS NUEVOS",
        "LABORATORIO",
        "TAMIZ NEONATAL",
        "CAPACITACIONES DE ENFERMERIA",
        "VACUNAS",
        "CARTILLAS DE SALUD",
        "REHABILITACION",
        "EPIDEMIOLOGIA",
        "TRABAJO SOCIAL",
        "SERVICIO DE AMBULANCIAS",
      ];

      const LLAVE = "informes_matriz_v2";

      function obtenerDatos() {
        return JSON.parse(localStorage.getItem(LLAVE)) || { meses: {} };
      }

      function guardarDatos(obj) {
        localStorage.setItem(LLAVE, JSON.stringify(obj));
      }

      function generarMesesAñoActual() {
        const y = new Date().getFullYear();
        const m = [];
        for (let i = 1; i <= 12; i++) {
          m.push(`${y}-${String(i).padStart(2, "0")}`);
        }
        return m;
      }

      function generarMatrizAuto() {
        const meses = generarMesesAñoActual();
        const matriz = document.getElementById("matriz");
        matriz.innerHTML = "";

        matriz.style.gridTemplateColumns = `auto repeat(${meses.length}, auto)`;

        const datos = obtenerDatos();

        // TITULOS
        matriz.appendChild(crearCeldaTitulo("Informes"));
        meses.forEach((m) => matriz.appendChild(crearCeldaTitulo(m)));

        // FILAS
        INFORMES.forEach((informe) => {
          matriz.appendChild(crearCeldaFija(informe));

          meses.forEach((mes) => {
            if (!datos.meses[mes]) datos.meses[mes] = {};
            if (!datos.meses[mes][informe]) {
              datos.meses[mes][informe] = { ruta: "", completo: false };
            }

            matriz.appendChild(crearCeldaEditable(mes, informe, datos));
          });
        });

        guardarDatos(datos);
      }

      function crearCeldaTitulo(texto) {
        const d = document.createElement("div");
        d.className = "celda col-titulo";
        d.textContent = texto;
        return d;
      }

      function crearCeldaFija(texto) {
        const d = document.createElement("div");
        d.className = "celda celda-fija";
        d.textContent = texto;
        return d;
      }

      function crearCeldaEditable(mes, informe, datos) {
        const d = document.createElement("div");
        d.className = "celda";

        const reg = datos.meses[mes][informe];

        const box = document.createElement("div");
        box.className = "card-informe";
        if (reg.ruta) box.classList.add("activo");

        const chk = document.createElement("input");
        chk.type = "checkbox";
        chk.checked = reg.completo;

        const inp = document.createElement("input");
        inp.type = "text";
        inp.value = reg.ruta;
        inp.placeholder = "Evidencia";
        inp.className = "input-evidencia";

        if (reg.ruta) d.classList.add("celda-llena");

        inp.addEventListener("input", () => {
          reg.ruta = inp.value.trim();
          reg.completo = reg.ruta !== "";
          chk.checked = reg.completo;
          box.classList.toggle("activo", reg.completo);
          d.classList.toggle("celda-llena", reg.completo);
          guardarDatos(datos);
        });

        d.addEventListener("click", (e) => {
          if (e.target.tagName === "INPUT") return;
          if (reg.ruta && reg.ruta.trim() !== "") {
            let url = reg.ruta.trim();
            if (!/^https?:\/\//i.test(url)) url = "https://" + url;
            window.open(url, "_self");
          }
        });

        chk.addEventListener("change", () => {
          reg.completo = chk.checked;
          if (!reg.completo) reg.ruta = "";
          inp.value = reg.ruta;
          box.classList.toggle("activo", reg.completo);
          d.classList.toggle("celda-llena", reg.completo);
          guardarDatos(datos);
        });

        box.appendChild(chk);
        box.appendChild(inp);
        d.appendChild(box);
        return d;
      }

      window.addEventListener("load", generarMatrizAuto);
    </script>

    <script>
      fetch("/comun/header-estadisticas.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("header").innerHTML = html;
          const s = document.createElement("script");
          s.src = "/comun/sesion_bk.js";
          s.onload = () => {
            console.log("🔥 sesion_bk.js cargado. Verificando sesión...");
            verificarAutenticacion();
          };
          document.body.appendChild(s);
        });

      fetch("/comun/footer.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("footer").innerHTML = html;
          const footer = document.getElementById("footerText");
          if (footer) {
            footer.innerHTML = `Hecho con ❤️ por Ricardo · ${new Date().getFullYear()}`;
          }
        });
    </script>
    <script src="/comun/estadoSistema.js"></script>
    <script src="/comun/sesion_bk.js"></script>
  </body>
</html>
