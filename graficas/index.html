<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estadísticas y Archivo Clínico</title>

  <link rel="shortcut icon" href="./img/favicon.ico" type="image/x-icon">
  <link rel="icon" href="./img/favicon.ico" type="image/x-icon">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link href="/main_css/estilos.css" rel="stylesheet">
</head>

<body>
  <div class="glass" id="dashboard">
    <h5>Index Base Menú Gráficas</h5>
    <div id="header"></div>
    <div class="grid">
      <a href="/graficas/egresos/" style="text-decoration: none; color: inherit;" target="_self">
        <div class="celda">
          <h3><i class="fa-solid fa-solid fa-graduation-cap"></i> Egresos 2024 y 2025</h3>
          <p>Egresos por fecha y por género</p>
        </div>
      </a>
    </div>
    <div class="grid">
      <a href="/graficas/egresos/nov25.html" style="text-decoration: none; color: inherit;" target="_self">
        <div class="celda">
          <h3><i class="fa-solid fa-solid fa-graduation-cap"></i> Egresos Nov 2025</h3>
          <p>Egresos por fecha y por género</p>
        </div>
      </a>
      <a href="/graficas/urgencias/nov25.html" style="text-decoration: none; color: inherit;"
        target="_self">
        <div class="celda">
          <h3><i class="fa-solid fa-solid fa-graduation-cap"></i> Urgencias Nov 2025</h3>
          <p>Urgencias por fecha y por género</p>
        </div>
      </a>
      <a href="/graficas/lesiones/nov25.html" style="text-decoration: none; color: inherit;"
        target="_self">
        <div class="celda">
          <h3><i class="fa-solid fa-solid fa-graduation-cap"></i> Lesiones Nov 2025</h3>
          <p>Lesiones por fecha y por género</p>
        </div>
      </a>
    </div>
    <div id="footer"></div>
  </div>
  </div>
  <script>
    fetch('/comun/header.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('header').innerHTML = html;

        // Cargar sesión.js después de insertar el HTML
        const s = document.createElement('script');
        s.src = '/comun/sesion_bk.js';

        s.onload = () => {
          console.log("🔥 sesion_bk.js cargado. Verificando sesión...");
          verificarAutenticacion();
        };

        document.body.appendChild(s);
      });

    fetch('/comun/footer.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('footer').innerHTML = html;

        // Ya existe footerText
        const footer = document.getElementById('footerText');
        if (footer) {
          footer.innerHTML = `Hecho con ❤️ por Ricardo · ${new Date().getFullYear()}`;
        }
      });
  </script>
  <script src="/comun/estadoSistema.js"></script>
  <script src="/comun/sesion_bk.js"></script>
</body>

</html>
