<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe Situacional Hospitales, Regiones y UAEON 2026</title>
  <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="/main_css/estilos.css" rel="stylesheet">
</head>
<style>
  .grid-graph {
    display: flex;
    flex-wrap: wrap;       /* Permite que las gráficas bajen a la siguiente fila si no caben */
    gap: 1.5rem;           /* Mantiene la separación de al menos 1.5rem entre ellas */
    justify-content: center; /* Centra las gráficas visualmente dentro del contenedor */
  }
  
  /* Ajusta los contenedores div de cada iframe */
  .grid-graph > div {
    flex: 1 1 350px;       /* Permite que crezcan, pero se encogan hasta un mínimo de 350px */
    max-width: 600px;      /* Evita que se estiren más allá de su tamaño original */
  }

  .graph { 
    width: 100%;           /* Hace que el iframe ocupe todo el ancho de su contenedor div */
    max-width: 600px;      /* No superará los 600px definidos originalmente */
    height: 371px;         /* Mantiene la altura fija original */
    border-radius: 5px;    
    display: block;
  }
</style>
<body>
  <div class="glass" id="dashboard">
    <h5>Informe Situacional Hospitales, Regiones y UAEON 2026</h5>
    <div id="header"></div>
    <div class="grid">
  <div class="grid-graph">
    <div><iframe class="graph" height="371" seamless frameborder="0" scrolling="no" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6EOBcrxzMy8Ma15n6qeC2tMfe2h3zIdpafTAECCNHUZlquaAf9nwJENBmy0Tl5sgpZguVfZJzN2NG/pubchart?oid=1005262923&amp;format=interactive"></iframe></div>
    <div><iframe class="graph" height="371" seamless frameborder="0" scrolling="no" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6EOBcrxzMy8Ma15n6qeC2tMfe2h3zIdpafTAECCNHUZlquaAf9nwJENBmy0Tl5sgpZguVfZJzN2NG/pubchart?oid=777640261&amp;format=interactive"></iframe></div>
    <div><iframe class="graph" height="371" seamless frameborder="0" scrolling="no" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6EOBcrxzMy8Ma15n6qeC2tMfe2h3zIdpafTAECCNHUZlquaAf9nwJENBmy0Tl5sgpZguVfZJzN2NG/pubchart?oid=875997216&amp;format=interactive"></iframe></div>
  </div>
    </div>
    <div id="footer"></div>
  </div>
  <script>
    fetch('/comun/header.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('header').innerHTML = html;

        // Cargar sesión.js después de insertar el HTML
        const s = document.createElement('script');
        s.src = '/comun/sesion_bk.js';

        s.onload = () => {
          console.log("🔥 sesion_bk.js cargado. Verificando sesión...");
          verificarAutenticacion();
        };

        document.body.appendChild(s);
      });

    fetch('/comun/footer.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('footer').innerHTML = html;

        // Ya existe footerText
        const footerYear = document.getElementById("footerYear");
        if (footerYear) footerYear.textContent = new Date().getFullYear();
      });
  </script>
  <script src="/comun/estadoSistema.js"></script>
  <script src="/comun/sesion_bk.js"></script>
</body>

</html>
