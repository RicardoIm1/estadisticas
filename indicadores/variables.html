<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario e Informe - Indicadores Hospitalarios</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: #f0f4f8;
        padding: 20px;
        display: flex;
        justify-content: center;
      }

      .container {
        max-width: 1200px;
        width: 100%;
        background: white;
        border-radius: 20px;
        padding: 30px 35px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      h1 {
        font-size: 26px;
        color: #0a2a44;
        border-left: 6px solid #1a73e8;
        padding-left: 15px;
        margin-bottom: 8px;
      }

      .subtitle {
        color: #555;
        font-size: 15px;
        margin-bottom: 25px;
        margin-top: 5px;
        padding-left: 21px;
      }

      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
        border-bottom: 2px solid #e2eaf3;
        padding-bottom: 10px;
      }

      .tab-btn {
        padding: 10px 24px;
        border: none;
        border-radius: 30px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: 0.2s;
        background: #e8edf4;
        color: #1a2a3a;
      }

      .tab-btn:hover {
        background: #d0dbe8;
      }

      .tab-btn.active {
        background: #0a2a44;
        color: white;
      }

      .tab-content {
        display: none;
      }

      .tab-content.active {
        display: block;
      }

      .month-selector {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        background: #e8edf4;
        padding: 18px 22px;
        border-radius: 14px;
        margin-bottom: 30px;
        align-items: center;
      }

      .month-selector label {
        font-weight: 600;
        color: #1a2a3a;
        margin-right: 5px;
      }

      .month-selector input,
      .month-selector select {
        padding: 8px 14px;
        border: 1px solid #bac8d9;
        border-radius: 8px;
        font-size: 15px;
        background: white;
      }

      .month-selector button {
        background: #1a73e8;
        color: white;
        border: none;
        padding: 8px 24px;
        border-radius: 30px;
        font-weight: 600;
        cursor: pointer;
        font-size: 15px;
        transition: 0.2s;
        margin-left: auto;
      }

      .month-selector button:hover {
        background: #1557b0;
        transform: scale(1.02);
      }

      .category {
        margin-top: 20px;
        border: 1px solid #dde3ed;
        border-radius: 16px;
        overflow: hidden;
      }

      .category-header {
        background: #f7faff;
        padding: 14px 24px;
        font-weight: 700;
        font-size: 18px;
        color: #0a2a44;
        border-bottom: 2px solid #d0dbe8;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        user-select: none;
      }

      .category-header:hover {
        background: #eff4fc;
      }

      .category-header .toggle-icon {
        font-size: 22px;
        transition: 0.2s;
      }

      .category-body {
        padding: 20px 24px 24px 24px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 12px 30px;
        background: white;
      }

      .category-body.hidden {
        display: none;
      }

      .field-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .field-group label {
        font-size: 13px;
        font-weight: 500;
        color: #1e2f40;
        line-height: 1.3;
      }

      .field-group input {
        padding: 8px 12px;
        border: 1px solid #ccd7e6;
        border-radius: 8px;
        font-size: 15px;
        background: #fafcff;
        transition: 0.15s;
        width: 100%;
      }

      .field-group input:focus {
        border-color: #1a73e8;
        outline: none;
        box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
        background: white;
      }

      .field-group input.calculated {
        background: #edf3fa;
        font-weight: 600;
        color: #0a2a44;
      }

      .field-group input.has-value {
        border-color: #28a745;
        background: #f8fff9;
      }

      .field-group .hint {
        font-size: 12px;
        color: #6b7d93;
        font-style: italic;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 35px;
        padding-top: 25px;
        border-top: 2px solid #e2eaf3;
        justify-content: center;
      }

      .actions button {
        padding: 12px 36px;
        border: none;
        border-radius: 40px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
      }

      .actions button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none !important;
      }

      .btn-primary {
        background: #0a2a44;
        color: white;
      }

      .btn-primary:hover {
        background: #1a3f62;
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: #dce3ed;
        color: #1a2a3a;
      }

      .btn-secondary:hover {
        background: #cbd5e3;
      }

      .btn-success {
        background: #1e7e34;
        color: white;
      }

      .btn-success:hover {
        background: #14622a;
        transform: translateY(-2px);
      }

      .btn-danger {
        background: #e74c3c;
        color: white;
      }

      .btn-danger:hover {
        background: #c0392b;
        transform: translateY(-2px);
      }

      .btn-info {
        background: #3498db;
        color: white;
      }

      .btn-info:hover {
        background: #2980b9;
        transform: translateY(-2px);
      }

      .btn-purple {
        background: #6f42c1;
        color: white;
      }

      .btn-purple:hover {
        background: #5a32a3;
        transform: translateY(-2px);
      }

      /* ============================================================
       INFORME DE INDICADORES
       ============================================================ */
      .report-container {
        margin-top: 30px;
        padding: 20px;
        background: #fafcff;
        border-radius: 16px;
        border: 1px solid #dde3ed;
        overflow-x: auto;
      }

      .report-container h2 {
        color: #0a2a44;
        margin-bottom: 20px;
        font-size: 22px;
        border-bottom: 2px solid #1a73e8;
        padding-bottom: 10px;
      }

      .report-container .section-title {
        color: #1a73e8;
        font-size: 18px;
        margin: 25px 0 15px 0;
        padding: 8px 16px;
        background: #e8edf4;
        border-radius: 8px;
      }

      .report-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        margin-bottom: 20px;
      }

      .report-table th {
        background: #0a2a44;
        color: white;
        padding: 10px 12px;
        text-align: left;
        font-weight: 600;
      }

      .report-table td {
        padding: 8px 12px;
        border-bottom: 1px solid #e2eaf3;
        vertical-align: top;
      }

      .report-table tr:nth-child(even) {
        background: #f8faff;
      }

      .report-table tr:hover {
        background: #edf3fa;
      }

      .report-table .col-num {
        width: 40px;
        text-align: center;
        font-weight: 600;
        color: #6b7d93;
      }

      .report-table .col-indicador {
        min-width: 200px;
        font-weight: 500;
      }

      .report-table .col-formula {
        min-width: 200px;
        font-size: 12px;
        color: #555;
        font-style: italic;
      }

      .report-table .col-numerador {
        text-align: center;
        min-width: 80px;
      }

      .report-table .col-denominador {
        text-align: center;
        min-width: 80px;
      }

      .report-table .col-resultado {
        text-align: center;
        font-weight: 700;
        min-width: 80px;
        color: #0a2a44;
      }

      .report-table .col-resultado.highlight {
        color: #1a73e8;
      }

      .report-table .col-resultado.warning {
        color: #e74c3c;
      }

      .report-summary {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 15px;
        margin: 20px 0;
        padding: 15px;
        background: #e8edf4;
        border-radius: 12px;
      }

      .report-summary .summary-item {
        text-align: center;
      }

      .report-summary .summary-item .label {
        font-size: 12px;
        color: #6b7d93;
        font-weight: 500;
      }

      .report-summary .summary-item .value {
        font-size: 22px;
        font-weight: 700;
        color: #0a2a44;
      }

      .btn-export {
        display: inline-block;
        padding: 8px 20px;
        margin: 5px;
        background: #0a2a44;
        color: white;
        border: none;
        border-radius: 30px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: 0.2s;
      }

      .btn-export:hover {
        background: #1a3f62;
        transform: scale(1.02);
      }

      /* ============================================================
       TOAST NOTIFICATIONS
       ============================================================ */
      .toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 400px;
        width: 100%;
      }

      .toast {
        background: white;
        border-radius: 12px;
        padding: 16px 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: flex-start;
        gap: 12px;
        animation: slideInRight 0.3s ease-out;
        border-left: 5px solid #1a73e8;
        transform-origin: right;
      }

      .toast.success {
        border-left-color: #1e7e34;
      }

      .toast.error {
        border-left-color: #e74c3c;
      }

      .toast.warning {
        border-left-color: #f39c12;
      }

      .toast.info {
        border-left-color: #3498db;
      }

      .toast-icon {
        font-size: 24px;
        flex-shrink: 0;
        line-height: 1;
      }

      .toast-content {
        flex: 1;
      }

      .toast-title {
        font-weight: 700;
        font-size: 15px;
        color: #1a2a3a;
        margin-bottom: 4px;
      }

      .toast-message {
        font-size: 14px;
        color: #555;
        line-height: 1.4;
      }

      .toast-close {
        background: none;
        border: none;
        font-size: 20px;
        color: #999;
        cursor: pointer;
        padding: 0 4px;
        line-height: 1;
        transition: 0.2s;
      }

      .toast-close:hover {
        color: #333;
        transform: scale(1.2);
      }

      @keyframes slideInRight {
        from {
          opacity: 0;
          transform: translateX(100px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes slideOutRight {
        from {
          opacity: 1;
          transform: translateX(0);
        }
        to {
          opacity: 0;
          transform: translateX(100px);
        }
      }

      .toast.hiding {
        animation: slideOutRight 0.3s ease-in forwards;
      }

      /* Toast para confirmación */
      .toast-confirm-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 10000;
        display: none;
        justify-content: center;
        align-items: center;
      }

      .toast-confirm-overlay.active {
        display: flex;
      }

      .toast-confirm-box {
        background: white;
        border-radius: 16px;
        padding: 30px;
        max-width: 450px;
        width: 90%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: slideInRight 0.3s ease-out;
      }

      .toast-confirm-box .icon {
        font-size: 48px;
        text-align: center;
        margin-bottom: 12px;
      }

      .toast-confirm-box h3 {
        text-align: center;
        font-size: 20px;
        color: #1a2a3a;
        margin-bottom: 8px;
      }

      .toast-confirm-box p {
        text-align: center;
        color: #555;
        font-size: 15px;
        line-height: 1.5;
        margin-bottom: 24px;
      }

      .toast-confirm-box .buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
      }

      .toast-confirm-box .buttons button {
        padding: 10px 32px;
        border: none;
        border-radius: 30px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        transition: 0.2s;
      }

      .toast-confirm-box .buttons button:hover {
        transform: scale(1.05);
      }

      .toast-confirm-box .btn-confirm {
        background: #1a73e8;
        color: white;
      }

      .toast-confirm-box .btn-confirm:hover {
        background: #1557b0;
      }

      .toast-confirm-box .btn-cancel {
        background: #dce3ed;
        color: #1a2a3a;
      }

      .toast-confirm-box .btn-cancel:hover {
        background: #cbd5e3;
      }

      .toast-confirm-box .btn-danger-confirm {
        background: #e74c3c;
        color: white;
      }

      .toast-confirm-box .btn-danger-confirm:hover {
        background: #c0392b;
      }

      @media (max-width: 700px) {
        .container {
          padding: 16px;
        }
        .category-body {
          grid-template-columns: 1fr;
          padding: 14px;
        }
        .month-selector {
          flex-direction: column;
          align-items: stretch;
        }
        .month-selector button {
          margin-left: 0;
        }
        .toast-container {
          max-width: 95%;
          right: 10px;
          top: 10px;
        }
        .toast-confirm-box {
          padding: 20px;
          margin: 20px;
        }
        .tabs {
          flex-wrap: wrap;
        }
        .tab-btn {
          font-size: 13px;
          padding: 8px 16px;
        }
        .report-table {
          font-size: 12px;
        }
        .report-table th,
        .report-table td {
          padding: 6px 8px;
        }
        .report-summary {
          grid-template-columns: 1fr 1fr;
        }
      }

      /* ============================================================
   ESTILOS PARA IMPRESIÓN - TAMAÑO CARTA
   ============================================================ */
      @media print {
        body {
          font-size: 10pt;
          margin: 0;
          padding: 0;
        }

        .container {
          max-width: 100%;
          padding: 0.5cm;
          box-shadow: none;
          border-radius: 0;
        }

        .no-print {
          display: none !important;
        }

        .report-container {
          border: none;
          padding: 0;
          margin: 0;
          background: white;
        }

        .report-header {
          margin-bottom: 15px;
          border-bottom: 3px solid #0a2a44;
          padding-bottom: 10px;
        }

        .report-header h1 {
          font-size: 16pt;
          color: #0a2a44;
          margin: 0;
        }

        .report-meta {
          font-size: 9pt;
          color: #555;
          display: flex;
          justify-content: center;
          gap: 20px;
        }

        .section-title {
          font-size: 10pt;
          margin: 12px 0 8px 0;
          background: #e8edf4;
          padding: 3px 10px;
          border-left: 4px solid #1a73e8;
        }

        .report-table {
          font-size: 8pt;
          border: 1px solid #d0dbe8;
          page-break-inside: avoid;
        }

        .report-table th {
          background: #0a2a44;
          color: white;
          padding: 4px 6px;
          border: 1px solid #0a2a44;
        }

        .report-table td {
          padding: 3px 6px;
          border: 1px solid #d0dbe8;
        }

        .report-table tr:nth-child(even) {
          background: #f8faff;
        }

        .col-num {
          text-align: center;
          width: 25px;
        }

        .col-indicador {
          font-weight: 500;
        }

        .col-formula {
          font-size: 7pt;
          color: #555;
          font-style: italic;
        }

        .col-numerador,
        .col-denominador {
          text-align: center;
        }

        .col-resultado {
          text-align: center;
          font-weight: 700;
          color: #0a2a44;
        }

        .report-footer {
          margin-top: 15px;
          border-top: 1px solid #d0dbe8;
          padding-top: 8px;
          font-size: 8pt;
          color: #888;
          display: flex;
          justify-content: space-between;
        }

        /* Evitar que las tablas se corten entre páginas */
        table {
          page-break-inside: avoid;
        }

        thead {
          display: table-header-group;
        }

        tr {
          page-break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <div class="container" id="app">
      <h1>📋 Formulario e Informe de Indicadores</h1>
      <div class="subtitle">
        Indicadores asistenciales y de gestión hospitalaria
      </div>

      <!-- SELECTOR DE MES -->
      <div class="month-selector">
        <div>
          <label for="month">Mes:</label>
          <select id="month">
            <option value="01">Enero</option>
            <option value="02">Febrero</option>
            <option value="03">Marzo</option>
            <option value="04">Abril</option>
            <option value="05">Mayo</option>
            <option value="06">Junio</option>
            <option value="07">Julio</option>
            <option value="08">Agosto</option>
            <option value="09">Septiembre</option>
            <option value="10">Octubre</option>
            <option value="11">Noviembre</option>
            <option value="12">Diciembre</option>
          </select>
        </div>
        <div>
          <label for="year">Año:</label>
          <input
            type="number"
            id="year"
            value="2026"
            min="2020"
            max="2030"
            style="width: 100px"
          />
        </div>
        <button onclick="cargarDatos()">📂 Cargar datos</button>
        <button onclick="resetForm()">🔄 Limpiar todo</button>
      </div>

      <!-- TABS -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('form')">
          📝 Formulario
        </button>
        <button class="tab-btn" onclick="switchTab('report')">
          📊 Informe de Indicadores
        </button>
      </div>

      <!-- TAB: FORMULARIO -->
      <div id="tab-form" class="tab-content active">
        <div id="categories-container"></div>

        <div class="actions">
          <button
            class="btn-primary"
            onclick="guardarDatos()"
            style="background: #0d47a1"
          >
            💾 Guardar en Supabase
          </button>
          <button class="btn-primary" onclick="validateAll()">
            ✅ Validar formulario
          </button>
          <button class="btn-secondary" onclick="showSummary()">
            📊 Ver resumen
          </button>
          <button class="btn-success" onclick="exportCSV()">
            ⬇️ Exportar a CSV
          </button>
          <button class="btn-danger" onclick="eliminarRegistro()">
            🗑️ Eliminar registro
          </button>
          <button class="btn-purple" onclick="generarInforme()">
            📊 Generar Informe
          </button>
        </div>

        <div id="summaryBox" class="summary-box"></div>
      </div>

      <!-- TAB: INFORME -->
      <div id="tab-report" class="tab-content">
        <div id="reportContainer" class="report-container">
          <h2>📊 Informe de Indicadores Hospitalarios</h2>
          <p style="color: #6b7d93; text-align: center; padding: 40px 0">
            👈 Regresa al formulario, completa los datos y haz clic en "Generar
            Informe"
          </p>
        </div>
      </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- TOAST CONFIRM OVERLAY -->
    <div id="toastConfirmOverlay" class="toast-confirm-overlay">
      <div class="toast-confirm-box">
        <div class="icon" id="confirmIcon">⚠️</div>
        <h3 id="confirmTitle">¿Estás seguro?</h3>
        <p id="confirmMessage">Esta acción no se puede deshacer.</p>
        <div class="buttons">
          <button class="btn-cancel" onclick="confirmCancel()">Cancelar</button>
          <button class="btn-confirm" id="confirmBtn" onclick="confirmAccept()">
            Aceptar
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // ============================================================
      // TOAST NOTIFICATIONS SYSTEM
      // ============================================================

      let confirmResolve = null;

      function showToast(title, message, type = "info", duration = 4000) {
        const container = document.getElementById("toastContainer");

        const icons = {
          success: "✅",
          error: "❌",
          warning: "⚠️",
          info: "ℹ️",
        };

        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.innerHTML = `
            <div class="toast-icon">${icons[type] || "ℹ️"}</div>
            <div class="toast-content">
              <div class="toast-title">${title}</div>
              <div class="toast-message">${message}</div>
            </div>
            <button class="toast-close" onclick="this.parentElement.remove()">×</button>
          `;

        container.appendChild(toast);

        setTimeout(() => {
          if (toast.parentElement) {
            toast.classList.add("hiding");
            setTimeout(() => toast.remove(), 300);
          }
        }, duration);

        return toast;
      }

      function showConfirm(
        title,
        message,
        type = "warning",
        confirmText = "Aceptar",
      ) {
        return new Promise((resolve) => {
          const overlay = document.getElementById("toastConfirmOverlay");
          document.getElementById("confirmIcon").textContent =
            type === "danger" ? "🗑️" : "⚠️";
          document.getElementById("confirmTitle").textContent = title;
          document.getElementById("confirmMessage").textContent = message;

          const confirmBtn = document.getElementById("confirmBtn");
          confirmBtn.textContent = confirmText;
          confirmBtn.className =
            type === "danger" ? "btn-danger-confirm" : "btn-confirm";

          overlay.classList.add("active");
          confirmResolve = resolve;
        });
      }

      function confirmAccept() {
        const overlay = document.getElementById("toastConfirmOverlay");
        overlay.classList.remove("active");
        if (confirmResolve) {

      async function cargarDatos() {
        const mes = parseInt(document.getElementById("month").value);
        const anio = parseInt(document.getElementById("year").value);
        const monthName = document.querySelector(
          "#month option:checked",
        ).textContent;

        try {
          const { data, error } = await supabaseClient
            .from("indicadores_mensuales")
            .select("*")
            .eq("mes", mes)
            .eq("anio", anio)
            .maybeSingle();

          if (error) throw error;

          if (!data) {
            showToast(
              "Sin datos",
              `No hay datos guardados para ${monthName} ${anio}`,
              "info",
            );
            registroExistente = null;
            datosCargados = false;
            return;
          }

          registroExistente = data;

          Object.keys(data).forEach((key) => {
            const input = document.getElementById(key);
            if (
              input &&
              key !== "id" &&
              key !== "mes" &&
              key !== "anio" &&
              key !== "fecha_registro"
            ) {
              input.value = data[key];
              if (data[key] > 0) {
                input.classList.add("has-value");
              }
            }
          });

          datosCargados = true;
          showToast(
            "Datos cargados",
            `Datos cargados para ${monthName} ${anio}`,
            "success",
          );
          dispararCalculos();
        } catch (error) {
          console.error("Error al cargar:", error);
          showToast(
            "Error",
            "Error al cargar los datos: " + error.message,
            "error",
          );
        }
      }

        const btn = document.querySelector('[onclick="guardarDatos()"]');
        if (!btn) return;

        const textoOriginal = btn.textContent;

        try {
          btn.textContent = "⏳ Guardando...";
          btn.disabled = true;

          const mes = parseInt(document.getElementById("month").value);
          const anio = parseInt(document.getElementById("year").value);
          const monthName = document.querySelector(
            "#month option:checked",
          ).textContent;

          const datos = recolectarDatos();

          const tieneDatos = Object.values(datos).some((v) => v > 0);
          if (!tieneDatos) {
            showToast(

              "Complete al menos un campo para guardar.",
              "warning",

            btn.textContent = textoOriginal;
            btn.disabled = false;
            return;
          }

          const existe = await verificarExistencia(mes, anio);

      function recolectarDatos() {
        const mes = parseInt(document.getElementById("month").value);
        const anio = parseInt(document.getElementById("year").value);

        const datos = {
          mes: mes,
          anio: anio,
          fecha_registro: new Date().toISOString(),
        };

        document.querySelectorAll('input[type="number"]').forEach((input) => {
          if (input.id !== "year" && !input.readOnly) {
            const valor = parseFloat(input.value);

            if (input.id === "intervalo_sustitucion") {
              datos[input.id] = isNaN(valor)
                ? 0
                : Math.round(valor * 10000) / 10000;
            } else {
              datos[input.id] = isNaN(valor)
                ? 0
                : Math.round(Math.max(0, valor));
            }
          }
        });

        return datos;
      }

      function renderForm() {

          header.onclick = () => toggleCategory(idx);

          const body = document.createElement("div");
          body.className = "category-body";

          cat.fields.forEach((field) => {
            const group = document.createElement("div");
            group.className = "field-group";

            const label = document.createElement("label");
            label.htmlFor = field.id;

            const input = document.createElement("input");
            input.type = "number";
            input.id = field.id;

            if (field.calculated) {
              input.readOnly = true;
              input.className = "calculated";
            }

            const hint = document.createElement("div");
            hint.className = "hint";
            if (field.calculated) {
              if (field.id === "intervalo_sustitucion") {
                hint.textContent =
                  "⏺ Fórmula: ((días cama - días paciente) / egresos totales)";
              } else {
                hint.textContent = "⏺ Se calcula automáticamente";
              }
            }

            const validation = document.createElement("div");
            validation.className = "validation-msg";
            validation.id = `val-${field.id}`;

            group.appendChild(label);
            group.appendChild(input);
            if (field.calculated) group.appendChild(hint);
            group.appendChild(validation);
            body.appendChild(group);
          });

          div.appendChild(header);
          div.appendChild(body);
          container.appendChild(div);
        });

        attachAutoCalculations();

      function calcularIndiceSustitucion() {
        const diasCama = getVal("dias_cama");
        const diasPaciente = getVal("dias_paciente");
        const egresosTotales = getVal("egresos_totales");

        if (egresosTotales === 0) {
          setVal("intervalo_sustitucion", 0);
          return;
        }

        const indice = (diasCama - diasPaciente) / egresosTotales;
        const indiceRedondeado = Math.round(indice * 10000) / 10000;
        setVal("intervalo_sustitucion", indiceRedondeado);
      }

        ["medicos_ce", "medicos_hosp", "medicos_admin"].forEach((id) => {

        // Urgencias totales

            const sum =
              getVal("urgencias_pediatricas") + getVal("urgencias_adulto");
            setVal("urgencias_totales", sum);
          });
        });

        // Laboratorio total
        ["lab_ce", "lab_hosp", "lab_urgencias"].forEach((id) => {
          document.getElementById(id).addEventListener("input", () => {

              getVal("lab_ce") + getVal("lab_hosp") + getVal("lab_urgencias");
            setVal("lab_total", sum);
          });
        });

        // Radiología total
        ["rx_ce", "rx_hosp", "rx_urgencias"].forEach((id) => {
          document.getElementById(id).addEventListener("input", () => {
            const sum =
              getVal("rx_ce") + getVal("rx_hosp") + getVal("rx_urgencias");
            setVal("rx_total", sum);
          });
        });

        // Índice de sustitución
        ["dias_cama", "dias_paciente", "egresos_totales"].forEach((id) => {
          document.getElementById(id).addEventListener("input", () => {
            calcularIndiceSustitucion();

        if (totalR !== sumR) {

            "⚠️ Total de radiología no coincide con la suma de CE + Hospitalización + Urgencias",
          );
          showValidation(
            "rx_total",
            "Debe ser = CE + Hospitalización + Urgencias",
          );
        } else {
          clearValidation("rx_total");
        }

        const partosAt = getVal("partos_atendidos");
        const sumPartos =
          getVal("partos_cesarea") +
          getVal("partos_espontaneos") +
          getVal("partos_asistidos");
        if (partosAt !== sumPartos && partosAt > 0) {
          warnings.push(
            "⚠️ Partos atendidos no coincide con cesárea + espontáneos + asistidos (verificar)",
          );
        }

        const summaryBox = document.getElementById("summaryBox");
        if (errors.length > 0 || warnings.length > 0) {
          let msg = "🔍 RESULTADO DE VALIDACIÓN:\n";
          if (errors.length > 0) {
            msg +=
              "\n❌ ERRORES (deben corregirse):\n" +
              errors.map((e) => "  • " + e).join("\n");
          }
          if (warnings.length > 0) {
            msg +=
              "\n\n⚠️ ADVERTENCIAS (revisar):\n" +
              warnings.map((w) => "  • " + w).join("\n");
          }
          summaryBox.textContent = msg;
          summaryBox.className = "summary-box visible";
          summaryBox.style.borderColor =
            errors.length > 0 ? "#c62828" : "#f9a825";
        } else {
          summaryBox.textContent =
            "✅ ¡Todos los totales calculados son consistentes! El formulario está correcto.";
          summaryBox.className = "summary-box visible";
          summaryBox.style.borderColor = "#2e7d32";
        }
      }

      function showValidation(id, msg) {
        const el = document.getElementById(`val-${id}`);
        if (el) {
          el.textContent = msg;
          el.className = "validation-msg visible";
        }
      }

      function clearValidation(id) {
        const el = document.getElementById(`val-${id}`);
        if (el) {
          el.textContent = "";
          el.className = "validation-msg";
        }
      }

            result: v("rx_total")
              ? (v("rx_urgencias") / v("rx_total")) * 100
              : 0,
          },
        ];

        const secciones = [
          { titulo: "1. Recursos Humanos", data: rhIndicadores },
          { titulo: "2. Productividad", data: prodIndicadores },
          {
            titulo: "3. Proceso (Egresos, Urgencias, Ocupación)",
            data: procIndicadores,
          },
          { titulo: "4. Seguridad del Paciente", data: segIndicadores },
          {
            titulo: "5. Salud Reproductiva y Materno Infantil",
            data: srmiIndicadores,
          },
          {
            titulo: "6. Auxiliares de Diagnóstico y Tratamiento",
            data: adtIndicadores,
          },
        ];

        let html = "";

        secciones.forEach((seccion) => {
          html += `<h3 class="section-title">${seccion.titulo}</h3>`;
          html += `
        <table class="report-table">
          <thead>
            <tr>
              <th class="col-num">No</th>
              <th class="col-indicador">Indicador</th>
              <th class="col-formula">Fórmula</th>
              <th class="col-numerador">Numerador</th>
              <th class="col-denominador">Denominador</th>
              <th class="col-resultado">Resultado</th>
            </tr>
          </thead>
          <tbody>
      `;

          seccion.data.forEach((item) => {
            const resultado =
              typeof item.result === "number"
                ? item.result.toFixed(4)
                : "0.0000";
            const numDisplay =
              typeof item.num === "number" ? item.num.toFixed(0) : "0";
            const denDisplay =
              typeof item.den === "number" ? item.den.toFixed(0) : "0";

            html += `
          <tr>
            <td class="col-num">${item.no}</td>
            <td class="col-indicador">${item.indicador}</td>
            <td class="col-formula">${item.formula}</td>
            <td class="col-numerador">${numDisplay}</td>
            <td class="col-denominador">${denDisplay}</td>
            <td class="col-resultado">${resultado}</td>
          </tr>
        `;
          });

          html += `
          </tbody>
        </table>
      `;
        });

        return html;
      }

      // ============================================================
      // EXPORTAR A EXCEL (CSV)
      // ============================================================

      function exportarInformeExcel() {
        const container =
          document.getElementById("reportPrint") ||
          document.getElementById("reportContainer");
        const tables = container.querySelectorAll(".report-table");

        let csv = "No,Indicador,Fórmula,Numerador,Denominador,Resultado\n";

        tables.forEach((table) => {
          const rows = table.querySelectorAll("tbody tr");
          rows.forEach((row) => {
            const cells = row.querySelectorAll("td");
            const rowData = [];
            cells.forEach((cell) => {
              let text = cell.textContent.trim();
              if (text.includes(",")) {
                text = `"${text}"`;
              }
              rowData.push(text);
            });
            csv += rowData.join(",") + "\n";
          });
          csv += "\n"; // Separador entre secciones
        });

        const monthName = document.querySelector(
          "#month option:checked",
        ).textContent;
        const year = document.getElementById("year").value;
        const blob = new Blob(["\uFEFF" + csv], {
          type: "text/csv;charset=utf-8;",
        });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Informe_Indicadores_${monthName}_${year}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);

        showToast(
          "Exportado",
          "Informe exportado a Excel correctamente",
          "success",
        );
      }

      // ============================================================
      // RESUMEN Y EXPORTACIÓN (CSV del formulario)
      // ============================================================

      function showSummary() {
        const summaryBox = document.getElementById("summaryBox");
        const month = document.getElementById("month").value;
        const year = document.getElementById("year").value;
        const monthName = document.querySelector(
          "#month option:checked",
        ).textContent;

        let lines = [];
        lines.push(`📊 RESUMEN - ${monthName} ${year}`);
        lines.push("=".repeat(50));

        let allFields = [];
        categories.forEach((cat) => {
          cat.fields.forEach((f) => {
            allFields.push({
              category: cat.name,
              label: f.label,
              id: f.id,
              value: getVal(f.id),
            });
          });
        });

        let currentCat = "";
        allFields.forEach((f) => {
          if (f.category !== currentCat) {
            currentCat = f.category;
            lines.push(`\n${currentCat}`);
            lines.push("-".repeat(30));
          }
          lines.push(`  ${f.label}: ${f.value}`);
        });

        summaryBox.textContent = lines.join("\n");
        summaryBox.className = "summary-box visible";
      }

      function exportCSV() {
        const month = document.getElementById("month").value;
        const year = document.getElementById("year").value;
        const monthName = document.querySelector(
          "#month option:checked",
        ).textContent;

        let rows = [];
        rows.push("Categoría;Indicador;Valor");

        categories.forEach((cat) => {
          cat.fields.forEach((f) => {
            const val = getVal(f.id);
            rows.push(`${cat.name};${f.label};${val}`);
          });
        });

        const csv = rows.join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `indicadores_${monthName}_${year}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
      }

      function resetForm() {
        document.querySelectorAll('input[type="number"]').forEach((input) => {
          if (!input.readOnly && input.id !== "year") {
            input.value = "";
            input.classList.remove("has-value");
          }
        });
        datosCargados = false;
        registroExistente = null;
        dispararCalculos();
        document.querySelectorAll(".validation-msg").forEach((el) => {
          el.textContent = "";
          el.className = "validation-msg";
        });
        document.getElementById("summaryBox").className = "summary-box";
        document.getElementById("summaryBox").textContent = "";

        // Expandir todas las categorías
        categories.forEach((cat, idx) => {
          const body = document.getElementById(`body-${idx}`);
          const toggle = document.querySelector(`#toggle-${idx}`);
          if (body && toggle) {
            body.style.display = "grid";
            toggle.textContent = "▼";
          }
        });
      }

      // ============================================================
      // INICIALIZACIÓN
      // ============================================================
      renderForm();
      dispararCalculos();
    </script>
