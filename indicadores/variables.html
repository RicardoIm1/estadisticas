<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario Mensual - Indicadores Hospitalarios</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: #f0f4f8;
        padding: 20px;
        display: flex;
        justify-content: center;
      }

      .container {
        max-width: 1100px;
        width: 100%;
        background: white;
        border-radius: 20px;
        padding: 30px 35px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      h1 {
        font-size: 26px;
        color: #0a2a44;
        border-left: 6px solid #1a73e8;
        padding-left: 15px;
        margin-bottom: 8px;
      }

      .subtitle {
        color: #555;
        font-size: 15px;
        margin-bottom: 25px;
        margin-top: 5px;
        padding-left: 21px;
      }

      .month-selector {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        background: #e8edf4;
        padding: 18px 22px;
        border-radius: 14px;
        margin-bottom: 30px;
        align-items: center;
      }

      .month-selector label {
        font-weight: 600;
        color: #1a2a3a;
        margin-right: 5px;
      }

      .month-selector input,
      .month-selector select {
        padding: 8px 14px;
        border: 1px solid #bac8d9;
        border-radius: 8px;
        font-size: 15px;
        background: white;
      }

      .month-selector button {
        background: #1a73e8;
        color: white;
        border: none;
        padding: 8px 24px;
        border-radius: 30px;
        font-weight: 600;
        cursor: pointer;
        font-size: 15px;
        transition: 0.2s;
        margin-left: auto;
      }

      .month-selector button:hover {
        background: #1557b0;
        transform: scale(1.02);
      }

      .category {
        margin-top: 30px;
        border: 1px solid #dde3ed;
        border-radius: 16px;
        overflow: hidden;
        transition: all 0.3s ease;
      }

      .category.completed {
        border-color: #28a745;
        background: #f8fff9;
      }

      .category.completed .category-header {
        background: #e8f5e9;
        border-bottom-color: #28a745;
      }

      .category-header {
        background: #f7faff;
        padding: 14px 24px;
        font-weight: 700;
        font-size: 18px;
        color: #0a2a44;
        border-bottom: 2px solid #d0dbe8;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        user-select: none;
        transition: 0.2s;
      }

      .category-header:hover {
        background: #eff4fc;
      }

      .category-header .status-icon {
        font-size: 16px;
        margin-left: 10px;
      }

      .category-header .toggle-icon {
        font-size: 22px;
        transition: 0.2s;
      }

      .category-header .progress-badge {
        font-size: 12px;
        font-weight: 600;
        padding: 2px 10px;
        border-radius: 12px;
        background: #e9ecef;
        color: #6c757d;
        margin-left: 10px;
      }

      .category.completed .progress-badge {
        background: #28a745;
        color: white;
      }

      .category-body {
        padding: 20px 24px 24px 24px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 12px 30px;
        background: white;
        transition: all 0.3s ease;
      }

      .category-body.hidden {
        display: none;
      }

      .field-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .field-group label {
        font-size: 13px;
        font-weight: 500;
        color: #1e2f40;
        line-height: 1.3;
      }

      .field-group input {
        padding: 8px 12px;
        border: 1px solid #ccd7e6;
        border-radius: 8px;
        font-size: 15px;
        background: #fafcff;
        transition: 0.15s;
        width: 100%;
      }

      .field-group input:focus {
        border-color: #1a73e8;
        outline: none;
        box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
        background: white;
      }

      .field-group input.calculated {
        background: #edf3fa;
        font-weight: 600;
        color: #0a2a44;
      }

      .field-group input.readonly {
        background: #f5f5f5;
        color: #666;
        cursor: not-allowed;
      }

      .field-group input.has-value {
        border-color: #28a745;
        background: #f8fff9;
      }

      .field-group .hint {
        font-size: 12px;
        color: #6b7d93;
        font-style: italic;
      }

      .validation-msg {
        font-size: 12px;
        color: #c62828;
        font-weight: 500;
        margin-top: 2px;
        display: none;
      }

      .validation-msg.visible {
        display: block;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 35px;
        padding-top: 25px;
        border-top: 2px solid #e2eaf3;
        justify-content: center;
      }

      .actions button {
        padding: 12px 36px;
        border: none;
        border-radius: 40px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
      }

      .actions button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none !important;
      }

      .btn-primary {
        background: #0a2a44;
        color: white;
      }

      .btn-primary:hover {
        background: #1a3f62;
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: #dce3ed;
        color: #1a2a3a;
      }

      .btn-secondary:hover {
        background: #cbd5e3;
      }

      .btn-success {
        background: #1e7e34;
        color: white;
      }

      .btn-success:hover {
        background: #14622a;
        transform: translateY(-2px);
      }

      .btn-warning {
        background: #f39c12;
        color: white;
      }

      .btn-warning:hover {
        background: #d68910;
        transform: translateY(-2px);
      }

      .btn-danger {
        background: #e74c3c;
        color: white;
      }

      .btn-danger:hover {
        background: #c0392b;
        transform: translateY(-2px);
      }

      .btn-info {
        background: #3498db;
        color: white;
      }

      .btn-info:hover {
        background: #2980b9;
        transform: translateY(-2px);
      }

      .summary-box {
        background: #eaf3fa;
        border-radius: 14px;
        padding: 18px 24px;
        margin-top: 20px;
        display: none;
        font-size: 14px;
        max-height: 300px;
        overflow: auto;
        white-space: pre-wrap;
        font-family: "Courier New", monospace;
        border: 1px solid #c7d9ec;
      }

      .summary-box.visible {
        display: block;
      }

      .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        margin-left: 10px;
      }

      .status-badge.saved {
        background: #d4edda;
        color: #155724;
      }

      .status-badge.edited {
        background: #fff3cd;
        color: #856404;
      }

      .status-badge.new {
        background: #d1ecf1;
        color: #0c5460;
      }

      /* ============================================================
       TOAST NOTIFICATIONS
       ============================================================ */
      .toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 400px;
        width: 100%;
      }

      .toast {
        background: white;
        border-radius: 12px;
        padding: 16px 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: flex-start;
        gap: 12px;
        animation: slideInRight 0.3s ease-out;
        border-left: 5px solid #1a73e8;
        transform-origin: right;
      }

      .toast.success {
        border-left-color: #1e7e34;
      }

      .toast.error {
        border-left-color: #e74c3c;
      }

      .toast.warning {
        border-left-color: #f39c12;
      }

      .toast.info {
        border-left-color: #3498db;
      }

      .toast-icon {
        font-size: 24px;
        flex-shrink: 0;
        line-height: 1;
      }

      .toast-content {
        flex: 1;
      }

      .toast-title {
        font-weight: 700;
        font-size: 15px;
        color: #1a2a3a;
        margin-bottom: 4px;
      }

      .toast-message {
        font-size: 14px;
        color: #555;
        line-height: 1.4;
      }

      .toast-close {
        background: none;
        border: none;
        font-size: 20px;
        color: #999;
        cursor: pointer;
        padding: 0 4px;
        line-height: 1;
        transition: 0.2s;
      }

      .toast-close:hover {
        color: #333;
        transform: scale(1.2);
      }

      @keyframes slideInRight {
        from {
          opacity: 0;
          transform: translateX(100px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes slideOutRight {
        from {
          opacity: 1;
          transform: translateX(0);
        }
        to {
          opacity: 0;
          transform: translateX(100px);
        }
      }

      .toast.hiding {
        animation: slideOutRight 0.3s ease-in forwards;
      }

      /* Toast para confirmación */
      .toast-confirm-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 10000;
        display: none;
        justify-content: center;
        align-items: center;
      }

      .toast-confirm-overlay.active {
        display: flex;
      }

      .toast-confirm-box {
        background: white;
        border-radius: 16px;
        padding: 30px;
        max-width: 450px;
        width: 90%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: slideInRight 0.3s ease-out;
      }

      .toast-confirm-box .icon {
        font-size: 48px;
        text-align: center;
        margin-bottom: 12px;
      }

      .toast-confirm-box h3 {
        text-align: center;
        font-size: 20px;
        color: #1a2a3a;
        margin-bottom: 8px;
      }

      .toast-confirm-box p {
        text-align: center;
        color: #555;
        font-size: 15px;
        line-height: 1.5;
        margin-bottom: 24px;
      }

      .toast-confirm-box .buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
      }

      .toast-confirm-box .buttons button {
        padding: 10px 32px;
        border: none;
        border-radius: 30px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        transition: 0.2s;
      }

      .toast-confirm-box .buttons button:hover {
        transform: scale(1.05);
      }

      .toast-confirm-box .btn-confirm {
        background: #1a73e8;
        color: white;
      }

      .toast-confirm-box .btn-confirm:hover {
        background: #1557b0;
      }

      .toast-confirm-box .btn-cancel {
        background: #dce3ed;
        color: #1a2a3a;
      }

      .toast-confirm-box .btn-cancel:hover {
        background: #cbd5e3;
      }

      .toast-confirm-box .btn-danger-confirm {
        background: #e74c3c;
        color: white;
      }

      .toast-confirm-box .btn-danger-confirm:hover {
        background: #c0392b;
      }

      @media (max-width: 700px) {
        .container {
          padding: 16px;
        }
        .category-body {
          grid-template-columns: 1fr;
          padding: 14px;
        }
        .month-selector {
          flex-direction: column;
          align-items: stretch;
        }
        .month-selector button {
          margin-left: 0;
        }
        .toast-container {
          max-width: 95%;
          right: 10px;
          top: 10px;
        }
        .toast-confirm-box {
          padding: 20px;
          margin: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container" id="app">
      <h1>📋 Formulario Mensual</h1>
      <div class="subtitle">
        Indicadores asistenciales y de gestión hospitalaria
        <span id="statusBadge" class="status-badge new">📝 Nuevo</span>
      </div>

      <!-- SELECTOR DE MES -->
      <div class="month-selector">
        <div>
          <label for="month">Mes:</label>
          <select id="month" onchange="onMonthChange()">
            <option value="01">Enero</option>
            <option value="02">Febrero</option>
            <option value="03">Marzo</option>
            <option value="04">Abril</option>
            <option value="05">Mayo</option>
            <option value="06">Junio</option>
            <option value="07">Julio</option>
            <option value="08">Agosto</option>
            <option value="09">Septiembre</option>
            <option value="10">Octubre</option>
            <option value="11">Noviembre</option>
            <option value="12">Diciembre</option>
          </select>
        </div>
        <div>
          <label for="year">Año:</label>
          <input
            type="number"
            id="year"
            value="2026"
            min="2020"
            max="2030"
            style="width: 100px"
            onchange="onMonthChange()"
          />
        </div>
        <button onclick="resetForm()">🔄 Limpiar todo</button>
        <button
          onclick="cargarDatos()"
          class="btn-info"
          style="
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
          "
        >
          📂 Cargar datos
        </button>
      </div>

      <!-- CATEGORÍAS -->
      <div id="categories-container"></div>

      <!-- ACCIONES -->
      <div class="actions">
        <button
          class="btn-primary"
          onclick="guardarDatos()"
          style="background: #0d47a1"
        >
          💾 Guardar en Supabase
        </button>
        <button class="btn-primary" onclick="validateAll()">
          ✅ Validar formulario
        </button>
        <button class="btn-secondary" onclick="showSummary()">
          📊 Ver resumen
        </button>
        <button class="btn-success" onclick="exportCSV()">
          ⬇️ Exportar a CSV
        </button>
        <button class="btn-danger" onclick="eliminarRegistro()">
          🗑️ Eliminar registro
        </button>
      </div>

      <div id="summaryBox" class="summary-box"></div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- TOAST CONFIRM OVERLAY -->
    <div id="toastConfirmOverlay" class="toast-confirm-overlay">
      <div class="toast-confirm-box">
        <div class="icon" id="confirmIcon">⚠️</div>
        <h3 id="confirmTitle">¿Estás seguro?</h3>
        <p id="confirmMessage">Esta acción no se puede deshacer.</p>
        <div class="buttons">
          <button class="btn-cancel" onclick="confirmCancel()">Cancelar</button>
          <button class="btn-confirm" id="confirmBtn" onclick="confirmAccept()">
            Aceptar
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // ============================================================
      // TOAST NOTIFICATIONS SYSTEM
      // ============================================================

      let confirmResolve = null;

      function showToast(title, message, type = "info", duration = 4000) {
        const container = document.getElementById("toastContainer");

        const icons = {
          success: "✅",
          error: "❌",
          warning: "⚠️",
          info: "ℹ️",
        };

        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.innerHTML = `
        <div class="toast-icon">${icons[type] || "ℹ️"}</div>
        <div class="toast-content">
          <div class="toast-title">${title}</div>
          <div class="toast-message">${message}</div>
        </div>
        <button class="toast-close" onclick="this.parentElement.remove()">×</button>
      `;

        container.appendChild(toast);

        setTimeout(() => {
          if (toast.parentElement) {
            toast.classList.add("hiding");
            setTimeout(() => toast.remove(), 300);
          }
        }, duration);

        return toast;
      }

      function showConfirm(
        title,
        message,
        type = "warning",
        confirmText = "Aceptar",
      ) {
        return new Promise((resolve) => {
          const overlay = document.getElementById("toastConfirmOverlay");
          document.getElementById("confirmIcon").textContent =
            type === "danger" ? "🗑️" : "⚠️";
          document.getElementById("confirmTitle").textContent = title;
          document.getElementById("confirmMessage").textContent = message;

          const confirmBtn = document.getElementById("confirmBtn");
          confirmBtn.textContent = confirmText;
          confirmBtn.className =
            type === "danger" ? "btn-danger-confirm" : "btn-confirm";

          overlay.classList.add("active");
          confirmResolve = resolve;
        });
      }

      function confirmAccept() {
        const overlay = document.getElementById("toastConfirmOverlay");
        overlay.classList.remove("active");
        if (confirmResolve) {
          confirmResolve(true);
          confirmResolve = null;
        }
      }

      function confirmCancel() {
        const overlay = document.getElementById("toastConfirmOverlay");
        overlay.classList.remove("active");
        if (confirmResolve) {
          confirmResolve(false);
          confirmResolve = null;
        }
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          confirmCancel();
        }
      });

      // ============================================================
      // CONFIGURACIÓN DE SUPABASE
      // ============================================================
      const SUPABASE_URL = "https://njtlruvhcatklccdxpla.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qdGxydXZoY2F0a2xjY2R4cGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzIwOTIsImV4cCI6MjEwMDkwODA5Mn0.MzVwk4OWvahcUfP1KF_kHbLlIXWIbZ-wljce1i2Q1sc";

      const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );

      let datosCargados = false;
      let registroExistente = null;
      let categoryStates = {};

      // ============================================================
      // FUNCIONES PARA SUPABASE
      // ============================================================

      async function verificarExistencia(mes, anio) {
        try {
          const { data, error } = await supabaseClient
            .from("indicadores_mensuales")
            .select("id")
            .eq("mes", mes)
            .eq("anio", anio)
            .maybeSingle();

          if (error) {
            console.error("Error al verificar:", error);
            return false;
          }
          return data !== null;
        } catch (error) {
          console.error("Error en verificarExistencia:", error);
          return false;
        }
      }

      async function cargarDatos() {
        const mes = parseInt(document.getElementById("month").value);
        const anio = parseInt(document.getElementById("year").value);
        const monthName = document.querySelector(
          "#month option:checked",
        ).textContent;

        try {
          const { data, error } = await supabaseClient
            .from("indicadores_mensuales")
            .select("*")
            .eq("mes", mes)
            .eq("anio", anio)
            .maybeSingle();

          if (error) throw error;

          if (!data) {
            showToast(
              "Sin datos",
              `No hay datos guardados para ${monthName} ${anio}`,
              "info",
            );
            registroExistente = null;
            datosCargados = false;
            actualizarEstado("new");
            return;
          }

          registroExistente = data;

          Object.keys(data).forEach((key) => {
            const input = document.getElementById(key);
            if (
              input &&
              key !== "id" &&
              key !== "mes" &&
              key !== "anio" &&
              key !== "fecha_registro"
            ) {
              input.value = data[key];
              // Marcar como completado si tiene valor
              if (data[key] > 0) {
                input.classList.add("has-value");
              }
            }
          });

          datosCargados = true;
          actualizarEstado("saved");
          showToast(
            "Datos cargados",
            `Datos cargados para ${monthName} ${anio}`,
            "success",
          );
          dispararCalculos();
          // Verificar el estado de las categorías después de cargar
          verificarCategoriasCompletas();
        } catch (error) {
          console.error("Error al cargar:", error);
          showToast(
            "Error",
            "Error al cargar los datos: " + error.message,
            "error",
          );
        }
      }

      async function guardarDatos() {
        const btn = document.querySelector('[onclick="guardarDatos()"]');
        if (!btn) return;

        const textoOriginal = btn.textContent;

        try {
          btn.textContent = "⏳ Guardando...";
          btn.disabled = true;

          const mes = parseInt(document.getElementById("month").value);
          const anio = parseInt(document.getElementById("year").value);
          const monthName = document.querySelector(
            "#month option:checked",
          ).textContent;

          const datos = recolectarDatos();

          const tieneDatos = Object.values(datos).some((v) => v > 0);
          if (!tieneDatos) {
            showToast(
              "Sin datos",
              "Complete al menos un campo para guardar.",
              "warning",
            );
            btn.textContent = textoOriginal;
            btn.disabled = false;
            return;
          }

          console.log("Datos a guardar:", datos);

          const existe = await verificarExistencia(mes, anio);

          let result;
          if (existe) {
            const confirmar = await showConfirm(
              "¿Actualizar registro?",
              `Ya existe un registro para ${monthName} ${anio}. ¿Desea ACTUALIZARLO?`,
              "warning",
              "Actualizar",
            );

            if (!confirmar) {
              btn.textContent = textoOriginal;
              btn.disabled = false;
              return;
            }

            const { data, error } = await supabaseClient
              .from("indicadores_mensuales")
              .update(datos)
              .eq("mes", mes)
              .eq("anio", anio)
              .select();

            if (error) throw error;
            result = data;
            registroExistente = data[0];
            showToast(
              "Actualizado",
              `Registro de ${monthName} ${anio} actualizado correctamente`,
              "success",
            );
            actualizarEstado("saved");
          } else {
            const { data, error } = await supabaseClient
              .from("indicadores_mensuales")
              .insert([datos])
              .select();

            if (error) throw error;
            result = data;
            registroExistente = data[0];
            showToast(
              "Guardado",
              `Datos de ${monthName} ${anio} guardados correctamente`,
              "success",
            );
            actualizarEstado("saved");
          }

          console.log("Respuesta de Supabase:", result);
          datosCargados = true;
          showSummary();
          verificarCategoriasCompletas();
        } catch (error) {
          console.error("Error detallado:", error);
          showToast("Error", "Error al guardar: " + error.message, "error");
        } finally {
          if (btn) {
            btn.textContent = textoOriginal;
            btn.disabled = false;
          }
        }
      }

      async function eliminarRegistro() {
        const mes = parseInt(document.getElementById("month").value);
        const anio = parseInt(document.getElementById("year").value);
        const monthName = document.querySelector(
          "#month option:checked",
        ).textContent;

        const confirmar = await showConfirm(
          "¿Eliminar registro?",
          `¿Está seguro que desea ELIMINAR el registro de ${monthName} ${anio}?\n\nEsta acción NO se puede deshacer.`,
          "danger",
          "Eliminar",
        );

        if (!confirmar) return;

        try {
          const { error } = await supabaseClient
            .from("indicadores_mensuales")
            .delete()
            .eq("mes", mes)
            .eq("anio", anio);

          if (error) throw error;

          showToast(
            "Eliminado",
            `Registro de ${monthName} ${anio} eliminado correctamente`,
            "success",
          );
          registroExistente = null;
          datosCargados = false;
          resetForm();
        } catch (error) {
          console.error("Error al eliminar:", error);
          showToast("Error", "Error al eliminar: " + error.message, "error");
        }
      }

      function recolectarDatos() {
        const mes = parseInt(document.getElementById("month").value);
        const anio = parseInt(document.getElementById("year").value);

        const datos = {
          mes: mes,
          anio: anio,
          fecha_registro: new Date().toISOString(),
        };

        document.querySelectorAll('input[type="number"]').forEach((input) => {
          if (input.id !== "year" && !input.readOnly) {
            const valor = parseFloat(input.value);

            if (input.id === "intervalo_sustitucion") {
              datos[input.id] = isNaN(valor)
                ? 0
                : Math.round(valor * 10000) / 10000;
            } else {
              datos[input.id] = isNaN(valor)
                ? 0
                : Math.round(Math.max(0, valor));
            }
          }
        });

        return datos;
      }

      function actualizarEstado(tipo) {
        const badge = document.getElementById("statusBadge");
        if (tipo === "saved") {
          badge.className = "status-badge saved";
          badge.textContent = "💾 Guardado";
        } else if (tipo === "edited") {
          badge.className = "status-badge edited";
          badge.textContent = "✏️ Editando";
        } else {
          badge.className = "status-badge new";
          badge.textContent = "📝 Nuevo";
        }
      }

      function onMonthChange() {
        datosCargados = false;
        registroExistente = null;
        actualizarEstado("new");
        document.querySelectorAll('input[type="number"]').forEach((input) => {
          if (!input.readOnly && input.id !== "year") {
            input.value = "";
            input.classList.remove("has-value");
          }
        });
        dispararCalculos();
        verificarCategoriasCompletas();

      // ============================================================

      function verificarCategoriasCompletas() {
        categories.forEach((cat, idx) => {
          const categoryDiv = document.querySelectorAll(".category")[idx];
          if (!categoryDiv) return;

          const fields = cat.fields;
          let todosCompletos = true;
          let camposConValor = 0;
          let camposTotales = 0;

          fields.forEach((field) => {
            const input = document.getElementById(field.id);
            if (input && !input.readOnly) {
              camposTotales++;
              const valor = parseFloat(input.value);
              if (valor > 0) {
                camposConValor++;
              } else {
                todosCompletos = false;
              }
            }
          });

          // Actualizar el badge de progreso
          const badge = categoryDiv.querySelector(".progress-badge");
          if (badge) {
            badge.textContent = `${camposConValor}/${camposTotales}`;
          }

          // Si todos los campos están completos, contraer
          if (todosCompletos && camposTotales > 0) {
            categoryDiv.classList.add("completed");
            // Contraer automáticamente
            const body = document.getElementById(`body-${idx}`);
            const toggle = document.querySelector(`#toggle-${idx}`);
            if (body && toggle && body.style.display !== "none") {
              body.style.display = "none";
              toggle.textContent = "▶";
            }
          } else {
            categoryDiv.classList.remove("completed");
            // Asegurar que esté expandido si no está completo
            const body = document.getElementById(`body-${idx}`);
            const toggle = document.querySelector(`#toggle-${idx}`);
            if (body && toggle && body.style.display === "none") {
              body.style.display = "grid";
              toggle.textContent = "▼";
            }
          }
        });
      }

      // ============================================================
      // RENDERIZADO DEL FORMULARIO
      // ============================================================
      function renderForm() {
        const container = document.getElementById("categories-container");
        container.innerHTML = "";

        categories.forEach((cat, idx) => {
          const div = document.createElement("div");
          div.className = "category";
          div.id = `category-${idx}`;

          // Contar campos editables (no calculados)
          const camposEditables = cat.fields.filter((f) => !f.calculated);
          const totalCampos = camposEditables.length;

          const header = document.createElement("div");
          header.className = "category-header";
          header.innerHTML = `
          ${cat.name} 
          <span>
            <span class="progress-badge">0/${totalCampos}</span>
            <span class="status-icon">📋</span>
            <span class="toggle-icon" id="toggle-${idx}">▼</span>
          </span>
        `;
          header.onclick = () => toggleCategory(idx);

          const body = document.createElement("div");
          body.className = "category-body";
          body.id = `body-${idx}`;

          cat.fields.forEach((field) => {
            const group = document.createElement("div");
            group.className = "field-group";

            const label = document.createElement("label");
            label.htmlFor = field.id;
            label.textContent = field.label;

            const input = document.createElement("input");
            input.type = "number";
            input.id = field.id;
            input.step = "any";
            input.min = "0";

            if (field.calculated) {
              input.readOnly = true;
              input.className = "calculated";
            } else {
              // Agregar evento para verificar completitud
              input.addEventListener("input", () => {
                const valor = parseFloat(input.value);
                if (valor > 0) {
                  input.classList.add("has-value");
                } else {
                  input.classList.remove("has-value");
                }
                verificarCategoriasCompletas();
              });
            }

            const hint = document.createElement("div");
            hint.className = "hint";
            if (field.calculated) {
              if (field.id === "intervalo_sustitucion") {
                hint.textContent =
                  "⏺ Fórmula: ((días cama - días paciente) / egresos totales)";
              } else {
                hint.textContent = "⏺ Se calcula automáticamente";
              }
            }

            const validation = document.createElement("div");
            validation.className = "validation-msg";
            validation.id = `val-${field.id}`;

            group.appendChild(label);
            group.appendChild(input);
            if (field.calculated) group.appendChild(hint);
            group.appendChild(validation);
            body.appendChild(group);
          });

          div.appendChild(header);
          div.appendChild(body);
          container.appendChild(div);

          // TODAS LAS CATEGORÍAS EMPIEZAN EXPANDIDAS
          // No contraemos ninguna al inicio
        });

        attachAutoCalculations();

        // Verificar estado inicial
        setTimeout(() => {
          verificarCategoriasCompletas();
        }, 200);
      }

      // ============================================================
      // CÁLCULOS AUTOMÁTICOS
      // ============================================================
      function calcularIndiceSustitucion() {
        const diasCama = getVal("dias_cama");
        const diasPaciente = getVal("dias_paciente");
        const egresosTotales = getVal("egresos_totales");

        if (egresosTotales === 0) {
          setVal("intervalo_sustitucion", 0);
          return;
        }

        const indice = (diasCama - diasPaciente) / egresosTotales;
        const indiceRedondeado = Math.round(indice * 10000) / 10000;
        setVal("intervalo_sustitucion", indiceRedondeado);
      }

      function attachAutoCalculations() {
        // Total médicos
        ["medicos_ce", "medicos_hosp", "medicos_admin"].forEach((id) => {
          document.getElementById(id).addEventListener("input", () => {
            const sum =
              getVal("medicos_ce") +
              getVal("medicos_hosp") +
              getVal("medicos_admin");
            setVal("total_medicos", sum);
          });
        });

        // Total enfermeras
        ["enf_ce", "enf_hosp", "enf_admin"].forEach((id) => {
          document.getElementById(id).addEventListener("input", () => {
            const sum =
              getVal("enf_ce") + getVal("enf_hosp") + getVal("enf_admin");
            setVal("total_enfermeras", sum);
          });
        });

        // Urgencias totales
        ["urgencias_pediatricas", "urgencias_adulto"].forEach((id) => {
          document.getElementById(id).addEventListener("input", () => {
            const sum =
              getVal("urgencias_pediatricas") + getVal("urgencias_adulto");
            setVal("urgencias_totales", sum);
          });
        });

        // Laboratorio total
        ["lab_ce", "lab_hosp", "lab_urgencias"].forEach((id) => {
          document.getElementById(id).addEventListener("input", () => {
            const sum =
              getVal("lab_ce") + getVal("lab_hosp") + getVal("lab_urgencias");
            setVal("lab_total", sum);
          });
        });

        // Radiología total
        ["rx_ce", "rx_hosp", "rx_urgencias"].forEach((id) => {
          document.getElementById(id).addEventListener("input", () => {
            const sum =
              getVal("rx_ce") + getVal("rx_hosp") + getVal("rx_urgencias");
            setVal("rx_total", sum);
          });
        });

        // Índice de sustitución
        ["dias_cama", "dias_paciente", "egresos_totales"].forEach((id) => {
          document.getElementById(id).addEventListener("input", () => {
            calcularIndiceSustitucion();
            // Después de calcular, verificar categorías
            verificarCategoriasCompletas();
          });
        });
      }

      function getVal(id) {
        const el = document.getElementById(id);
        return el ? parseFloat(el.value) || 0 : 0;
      }

      function setVal(id, value) {
        const el = document.getElementById(id);
        if (el) el.value = value;
      }

      // ============================================================
      // VALIDACIONES CRUZADAS
      // ============================================================
      function validateAll() {
        let errors = [];
        let warnings = [];

        const totalU = getVal("urgencias_totales");
        const sumU =
          getVal("urgencias_pediatricas") + getVal("urgencias_adulto");
        if (totalU !== sumU) {
          errors.push(
            "⚠️ Urgencias totales no coincide con la suma de pediátricas + adulto",
          );
          showValidation(
            "urgencias_totales",
            "Debe ser = pediátricas + adulto",
          );
        } else {
          clearValidation("urgencias_totales");
        }

        const totalM = getVal("total_medicos");
        const sumM =
          getVal("medicos_ce") +
          getVal("medicos_hosp") +
          getVal("medicos_admin");
        if (totalM !== sumM) {
          errors.push(
            "⚠️ Total de médicos no coincide con la suma de sus componentes",
          );
          showValidation(
            "total_medicos",
            "Debe ser = CE + Hospital + Administrativos",
          );
        } else {
          clearValidation("total_medicos");
        }

        const totalE = getVal("total_enfermeras");
        const sumE =
          getVal("enf_ce") + getVal("enf_hosp") + getVal("enf_admin");
        if (totalE !== sumE) {
          errors.push(
            "⚠️ Total de enfermeras no coincide con la suma de sus componentes",
          );
          showValidation(
            "total_enfermeras",
            "Debe ser = CE + Hospital + Administrativas",
          );
        } else {
          clearValidation("total_enfermeras");
        }

        const totalL = getVal("lab_total");
        const sumL =
          getVal("lab_ce") + getVal("lab_hosp") + getVal("lab_urgencias");
        if (totalL !== sumL) {
          errors.push(
            "⚠️ Total de laboratorio no coincide con la suma de CE + Hospitalización + Urgencias",
          );
          showValidation(
            "lab_total",
            "Debe ser = CE + Hospitalización + Urgencias",
          );
        } else {
          clearValidation("lab_total");
        }

        const totalR = getVal("rx_total");
        const sumR =
          getVal("rx_ce") + getVal("rx_hosp") + getVal("rx_urgencias");
        if (totalR !== sumR) {
          errors.push(
            "⚠️ Total de radiología no coincide con la suma de CE + Hospitalización + Urgencias",
          );
          showValidation(
            "rx_total",
            "Debe ser = CE + Hospitalización + Urgencias",
          );
        } else {
          clearValidation("rx_total");
        }

        const partosAt = getVal("partos_atendidos");
        const sumPartos =
          getVal("partos_cesarea") +
          getVal("partos_espontaneos") +
          getVal("partos_asistidos");
        if (partosAt !== sumPartos && partosAt > 0) {
          warnings.push(
            "⚠️ Partos atendidos no coincide con cesárea + espontáneos + asistidos (verificar)",
          );
        }

        const summaryBox = document.getElementById("summaryBox");
        if (errors.length > 0 || warnings.length > 0) {
          let msg = "🔍 RESULTADO DE VALIDACIÓN:\n";
          if (errors.length > 0) {
            msg +=
              "\n❌ ERRORES (deben corregirse):\n" +
              errors.map((e) => "  • " + e).join("\n");
          }
          if (warnings.length > 0) {
            msg +=
              "\n\n⚠️ ADVERTENCIAS (revisar):\n" +
              warnings.map((w) => "  • " + w).join("\n");
          }
          summaryBox.textContent = msg;
          summaryBox.className = "summary-box visible";
          summaryBox.style.borderColor =
            errors.length > 0 ? "#c62828" : "#f9a825";
        } else {
          summaryBox.textContent =
            "✅ ¡Todos los totales calculados son consistentes! El formulario está correcto.";
          summaryBox.className = "summary-box visible";
          summaryBox.style.borderColor = "#2e7d32";
        }
      }

      function showValidation(id, msg) {
        const el = document.getElementById(`val-${id}`);
        if (el) {
          el.textContent = msg;
          el.className = "validation-msg visible";
        }
      }

      function clearValidation(id) {
        const el = document.getElementById(`val-${id}`);
        if (el) {
          el.textContent = "";
          el.className = "validation-msg";
        }
      }

      // ============================================================
      // RESUMEN Y EXPORTACIÓN
      // ============================================================
      function showSummary() {
        const summaryBox = document.getElementById("summaryBox");
        const month = document.getElementById("month").value;
        const year = document.getElementById("year").value;
        const monthName = document.querySelector(
          "#month option:checked",
        ).textContent;

        let lines = [];
        lines.push(`📊 RESUMEN - ${monthName} ${year}`);
        lines.push("=".repeat(50));

        let allFields = [];
        categories.forEach((cat) => {
          cat.fields.forEach((f) => {
            allFields.push({
              category: cat.name,
              label: f.label,
              id: f.id,
              value: getVal(f.id),
            });
          });
        });

        let currentCat = "";
        allFields.forEach((f) => {
          if (f.category !== currentCat) {
            currentCat = f.category;
            lines.push(`\n${currentCat}`);
            lines.push("-".repeat(30));
          }
          lines.push(`  ${f.label}: ${f.value}`);
        });

        summaryBox.textContent = lines.join("\n");
        summaryBox.className = "summary-box visible";
      }

      function exportCSV() {
        const month = document.getElementById("month").value;
        const year = document.getElementById("year").value;
        const monthName = document.querySelector(
          "#month option:checked",
        ).textContent;

        let rows = [];
        rows.push("Categoría;Indicador;Valor");

        categories.forEach((cat) => {
          cat.fields.forEach((f) => {
            const val = getVal(f.id);
            rows.push(`${cat.name};${f.label};${val}`);
          });
        });

        const csv = rows.join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `indicadores_${monthName}_${year}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
      }

      function resetForm() {
        document.querySelectorAll('input[type="number"]').forEach((input) => {
          if (!input.readOnly && input.id !== "year") {
            input.value = "";
            input.classList.remove("has-value");
          }
        });
        datosCargados = false;
        registroExistente = null;
        actualizarEstado("new");
        dispararCalculos();
        document.querySelectorAll(".validation-msg").forEach((el) => {
          el.textContent = "";
          el.className = "validation-msg";
        });
        document.getElementById("summaryBox").className = "summary-box";
        document.getElementById("summaryBox").textContent = "";

        // Asegurar que todas las categorías estén expandidas
        categories.forEach((cat, idx) => {
          const body = document.getElementById(`body-${idx}`);
          const toggle = document.querySelector(`#toggle-${idx}`);
          if (body && toggle) {
            body.style.display = "grid";
            toggle.textContent = "▼";
          }
        });

        verificarCategoriasCompletas();
      }

      // ============================================================
      // INICIALIZACIÓN
      // ============================================================
      renderForm();
      dispararCalculos();
    </script>
  </body>
</html>
