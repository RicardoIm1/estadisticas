<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario Mensual - Indicadores Hospitalarios</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: #f0f4f8;
        padding: 20px;
        display: flex;
        justify-content: center;
      }

      .container {
        max-width: 1100px;
        width: 100%;
        background: white;
        border-radius: 20px;
        padding: 30px 35px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      h1 {
        font-size: 26px;
        color: #0a2a44;
        border-left: 6px solid #1a73e8;
        padding-left: 15px;
        margin-bottom: 8px;
      }

      .subtitle {
        color: #555;
        font-size: 15px;
        margin-bottom: 25px;
        margin-top: 5px;
        padding-left: 21px;
      }

      .month-selector {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        background: #e8edf4;
        padding: 18px 22px;
        border-radius: 14px;
        margin-bottom: 30px;
        align-items: center;
      }

      .month-selector label {
        font-weight: 600;
        color: #1a2a3a;
        margin-right: 5px;
      }

      .month-selector input,
      .month-selector select {
        padding: 8px 14px;
        border: 1px solid #bac8d9;
        border-radius: 8px;
        font-size: 15px;
        background: white;
      }

      .month-selector button {
        background: #1a73e8;
        color: white;
        border: none;
        padding: 8px 24px;
        border-radius: 30px;
        font-weight: 600;
        cursor: pointer;
        font-size: 15px;
        transition: 0.2s;
        margin-left: auto;
      }

      .month-selector button:hover {
        background: #1557b0;
        transform: scale(1.02);
      }

      .category {
        margin-top: 30px;
        border: 1px solid #dde3ed;
        border-radius: 16px;
        overflow: hidden;
      }

      .category-header {
        background: #f7faff;
        padding: 14px 24px;
        font-weight: 700;
        font-size: 18px;
        color: #0a2a44;
        border-bottom: 2px solid #d0dbe8;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        user-select: none;
      }

      .category-header:hover {
        background: #eff4fc;
      }

      .category-header span {
        font-size: 22px;
        transition: 0.2s;
      }

      .category-body {
        padding: 20px 24px 24px 24px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 12px 30px;
        background: white;
      }

      .field-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .field-group label {
        font-size: 13px;
        font-weight: 500;
        color: #1e2f40;
        line-height: 1.3;
      }

      .field-group input {
        padding: 8px 12px;
        border: 1px solid #ccd7e6;
        border-radius: 8px;
        font-size: 15px;
        background: #fafcff;
        transition: 0.15s;
        width: 100%;
      }

      .field-group input:focus {
        border-color: #1a73e8;
        outline: none;
        box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
        background: white;
      }

      .field-group input.calculated {
        background: #edf3fa;
        font-weight: 600;
        color: #0a2a44;
      }

      .field-group .hint {
        font-size: 12px;
        color: #6b7d93;
        font-style: italic;
      }

      .validation-msg {
        font-size: 12px;
        color: #c62828;
        font-weight: 500;
        margin-top: 2px;
        display: none;
      }

      .validation-msg.visible {
        display: block;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 35px;
        padding-top: 25px;
        border-top: 2px solid #e2eaf3;
        justify-content: center;
      }

      .actions button {
        padding: 12px 36px;
        border: none;
        border-radius: 40px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
      }

      .btn-primary {
        background: #0a2a44;
        color: white;
      }

      .btn-primary:hover {
        background: #1a3f62;
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: #dce3ed;
        color: #1a2a3a;
      }

      .btn-secondary:hover {
        background: #cbd5e3;
      }

      .btn-success {
        background: #1e7e34;
        color: white;
      }

      .btn-success:hover {
        background: #14622a;
        transform: translateY(-2px);
      }

      .summary-box {
        background: #eaf3fa;
        border-radius: 14px;
        padding: 18px 24px;
        margin-top: 20px;
        display: none;
        font-size: 14px;
        max-height: 300px;
        overflow: auto;
        white-space: pre-wrap;
        font-family: "Courier New", monospace;
        border: 1px solid #c7d9ec;
      }

      .summary-box.visible {
        display: block;
      }

      @media (max-width: 700px) {
        .container {
          padding: 16px;
        }
        .category-body {
          grid-template-columns: 1fr;
          padding: 14px;
        }
        .month-selector {
          flex-direction: column;
          align-items: stretch;
        }
        .month-selector button {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="container" id="app">
      <h1>📋 Formulario Mensual</h1>
      <div class="subtitle">
        Indicadores asistenciales y de gestión hospitalaria
      </div>

      <!-- SELECTOR DE MES -->
      <div class="month-selector">
        <div>
          <label for="month">Mes:</label>
          <select id="month">
            <option value="01">Enero</option>
            <option value="02">Febrero</option>
            <option value="03">Marzo</option>
            <option value="04">Abril</option>
            <option value="05">Mayo</option>
            <option value="06">Junio</option>
            <option value="07">Julio</option>
            <option value="08">Agosto</option>
            <option value="09">Septiembre</option>
            <option value="10">Octubre</option>
            <option value="11">Noviembre</option>
            <option value="12">Diciembre</option>
          </select>
        </div>
        <div>
          <label for="year">Año:</label>
          <input
            type="number"
            id="year"
            value="2026"
            min="2020"
            max="2030"
            style="width: 100px"
          />
        </div>
        <button onclick="resetForm()">🔄 Limpiar todo</button>
      </div>

      <!-- CATEGORÍAS -->
      <div id="categories-container"></div>

      <!-- ACCIONES -->
      <div class="actions">
        <button
          class="btn-primary"
          onclick="guardarDatos()"
          style="background: #0d47a1"
        >
          💾 Guardar en Supabase
        </button>
        <button class="btn-primary" onclick="validateAll()">
          ✅ Validar formulario
        </button>
        <button class="btn-secondary" onclick="showSummary()">
          📊 Ver resumen
        </button>
        <button class="btn-success" onclick="exportCSV()">
          ⬇️ Exportar a CSV
        </button>
      </div>

      <div id="summaryBox" class="summary-box"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // ============================================================
      // CONFIGURACIÓN DE SUPABASE
      // ============================================================
      const SUPABASE_URL = "https://njtlruvhcatklccdxpla.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qdGxydXZoY2F0a2xjY2R4cGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzIwOTIsImV4cCI6MjEwMDkwODA5Mn0.MzVwk4OWvahcUfP1KF_kHbLlIXWIbZ-wljce1i2Q1sc";

      // Crear cliente de Supabase
      const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );

      // ============================================================
      // FUNCIONES PARA SUPABASE
      // ============================================================

      // Verificar si ya existe un registro
      async function verificarExistencia(mes, anio) {
        try {
          const { data, error } = await supabaseClient
            .from("indicadores_mensuales")
            .select("id")
            .eq("mes", mes)
            .eq("anio", anio)
            .maybeSingle();

          if (error) {
            console.error("Error al verificar:", error);
            return false;
          }
          return data !== null;
        } catch (error) {
          console.error("Error en verificarExistencia:", error);
          return false;
        }
      }

      // Guardar datos en Supabase
      async function guardarDatos() {
        const btn = document.querySelector('[onclick="guardarDatos()"]');
        if (!btn) {
          console.error("Botón no encontrado");
          return;
        }

        const textoOriginal = btn.textContent;

        try {
          // Deshabilitar botón
          btn.textContent = "⏳ Guardando...";
          btn.disabled = true;

          // Obtener mes y año
          const mes = parseInt(document.getElementById("month").value);
          const anio = parseInt(document.getElementById("year").value);
          const monthName = document.querySelector(
            "#month option:checked",
          ).textContent;

          // Recolectar datos
          const datos = recolectarDatos();

          // Verificar si hay datos
          const tieneDatos = Object.values(datos).some((v) => v > 0);
          if (!tieneDatos) {
            alert("⚠️ No hay datos para guardar. Complete al menos un campo.");
            btn.textContent = textoOriginal;
            btn.disabled = false;
            return;
          }

          console.log("Datos a guardar:", datos);

          // Verificar si existe
          const existe = await verificarExistencia(mes, anio);

          let result;
          if (existe) {
            // Actualizar
            const confirmar = confirm(
              `⚠️ Ya existe un registro para ${monthName} ${anio}.\n¿Desea ACTUALIZARLO?`,
            );
            if (!confirmar) {
              btn.textContent = textoOriginal;
              btn.disabled = false;
              return;
            }

            const { data, error } = await supabaseClient
              .from("indicadores_mensuales")
              .update(datos)
              .eq("mes", mes)
              .eq("anio", anio)
              .select();

            if (error) throw error;
            result = data;
            alert("✅ Registro ACTUALIZADO correctamente");
          } else {
            // Insertar nuevo
            const { data, error } = await supabaseClient
              .from("indicadores_mensuales")
              .insert([datos])
              .select();

            if (error) throw error;
            result = data;
            alert("✅ Datos GUARDADOS correctamente");
          }

          console.log("Respuesta de Supabase:", result);

          // Mostrar resumen
          showSummary();
        } catch (error) {
          console.error("Error detallado:", error);

          // Mostrar mensaje de error más descriptivo
          let errorMsg = "❌ Error al guardar en Supabase:\n";
          if (error.code === "42P01") {
            errorMsg += "La tabla 'indicadores_mensuales' no existe.\n";
            errorMsg += "Por favor, crea la tabla en Supabase SQL Editor.";
          } else if (error.code === "23505") {
            errorMsg += "Ya existe un registro con este mes y año (duplicado).";
          } else if (error.code === "42501") {
            errorMsg += "No tienes permisos para insertar en esta tabla.\n";
            errorMsg += "Verifica las políticas RLS en Supabase.";
          } else {
            errorMsg += error.message;
          }
          alert(errorMsg);
        } finally {
          // Restaurar botón
          if (btn) {
            btn.textContent = textoOriginal;
            btn.disabled = false;
          }
        }
      }

      // Recolectar datos del formulario
      function recolectarDatos() {
        const mes = parseInt(document.getElementById("month").value);
        const anio = parseInt(document.getElementById("year").value);

        const datos = {
          mes: mes,
          anio: anio,
          fecha_registro: new Date().toISOString(),
        };

        // Recorrer todos los campos numéricos
        document.querySelectorAll('input[type="number"]').forEach((input) => {
          const valor = parseFloat(input.value);
          datos[input.id] = isNaN(valor) ? 0 : valor;
        });

        return datos;
      }
    </script>
  </body>
</html>
