<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario Mensual - Indicadores Hospitalarios</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: #f0f4f8;
        padding: 20px;
        display: flex;
        justify-content: center;
      }

      .container {
        max-width: 1100px;
        width: 100%;
        background: white;
        border-radius: 20px;
        padding: 30px 35px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      h1 {
        font-size: 26px;
        color: #0a2a44;
        border-left: 6px solid #1a73e8;
        padding-left: 15px;
        margin-bottom: 8px;
      }

      .subtitle {
        color: #555;
        font-size: 15px;
        margin-bottom: 25px;
        margin-top: 5px;
        padding-left: 21px;
      }

      .month-selector {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        background: #e8edf4;
        padding: 18px 22px;
        border-radius: 14px;
        margin-bottom: 30px;
        align-items: center;
      }

      .month-selector label {
        font-weight: 600;
        color: #1a2a3a;
        margin-right: 5px;
      }

      .month-selector input,
      .month-selector select {
        padding: 8px 14px;
        border: 1px solid #bac8d9;
        border-radius: 8px;
        font-size: 15px;
        background: white;
      }

      .month-selector button {
        background: #1a73e8;
        color: white;
        border: none;
        padding: 8px 24px;
        border-radius: 30px;
        font-weight: 600;
        cursor: pointer;
        font-size: 15px;
        transition: 0.2s;
        margin-left: auto;
      }

      .month-selector button:hover {
        background: #1557b0;
        transform: scale(1.02);
      }

      .category {
        margin-top: 30px;
        border: 1px solid #dde3ed;
        border-radius: 16px;
        overflow: hidden;
      }

      .category-header {
        background: #f7faff;
        padding: 14px 24px;
        font-weight: 700;
        font-size: 18px;
        color: #0a2a44;
        border-bottom: 2px solid #d0dbe8;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        user-select: none;
      }

      .category-header:hover {
        background: #eff4fc;
      }

      .category-header span {
        font-size: 22px;
        transition: 0.2s;
      }

      .category-body {
        padding: 20px 24px 24px 24px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 12px 30px;
        background: white;
      }

      .field-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .field-group label {
        font-size: 13px;
        font-weight: 500;
        color: #1e2f40;
        line-height: 1.3;
      }

      .field-group input {
        padding: 8px 12px;
        border: 1px solid #ccd7e6;
        border-radius: 8px;
        font-size: 15px;
        background: #fafcff;
        transition: 0.15s;
        width: 100%;
      }

      .field-group input:focus {
        border-color: #1a73e8;
        outline: none;
        box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
        background: white;
      }

      .field-group input.calculated {
        background: #edf3fa;
        font-weight: 600;
        color: #0a2a44;
      }

      .field-group .hint {
        font-size: 12px;
        color: #6b7d93;
        font-style: italic;
      }

      .validation-msg {
        font-size: 12px;
        color: #c62828;
        font-weight: 500;
        margin-top: 2px;
        display: none;
      }

      .validation-msg.visible {
        display: block;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 35px;
        padding-top: 25px;
        border-top: 2px solid #e2eaf3;
        justify-content: center;
      }

      .actions button {
        padding: 12px 36px;
        border: none;
        border-radius: 40px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
      }

      .btn-primary {
        background: #0a2a44;
        color: white;
      }

      .btn-primary:hover {
        background: #1a3f62;
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: #dce3ed;
        color: #1a2a3a;
      }

      .btn-secondary:hover {
        background: #cbd5e3;
      }

      .btn-success {
        background: #1e7e34;
        color: white;
      }

      .btn-success:hover {
        background: #14622a;
        transform: translateY(-2px);
      }

      .summary-box {
        background: #eaf3fa;
        border-radius: 14px;
        padding: 18px 24px;
        margin-top: 20px;
        display: none;
        font-size: 14px;
        max-height: 300px;
        overflow: auto;
        white-space: pre-wrap;
        font-family: "Courier New", monospace;
        border: 1px solid #c7d9ec;
      }

      .summary-box.visible {
        display: block;
      }

      @media (max-width: 700px) {
        .container {
          padding: 16px;
        }
        .category-body {
          grid-template-columns: 1fr;
          padding: 14px;
        }
        .month-selector {
          flex-direction: column;
          align-items: stretch;
        }
        .month-selector button {
          margin-left: 0;
        }
      }
    </style>
  </head>

      // Verificar si ya existe un registro
      async function verificarExistencia(mes, anio) {
        try {
          const { data, error } = await supabaseClient
            .from("indicadores_mensuales")
            .select("id")
            .eq("mes", mes)
            .eq("anio", anio)
            .maybeSingle();

          if (error) {
            console.error("Error al verificar:", error);
            return false;
          }
          return data !== null;
        } catch (error) {
          console.error("Error en verificarExistencia:", error);
          return false;
        }
      }

      // Guardar datos en Supabase
      async function guardarDatos() {
        const btn = document.querySelector('[onclick="guardarDatos()"]');
        if (!btn) {
          console.error("Botón no encontrado");
          return;
        }

        const textoOriginal = btn.textContent;

        try {
          // Deshabilitar botón
          btn.textContent = "⏳ Guardando...";
          btn.disabled = true;

          // Obtener mes y año
          const mes = parseInt(document.getElementById("month").value);
          const anio = parseInt(document.getElementById("year").value);
          const monthName = document.querySelector(
            "#month option:checked",
          ).textContent;

          // Recolectar datos
          const datos = recolectarDatos();

          // Verificar si hay datos
          const tieneDatos = Object.values(datos).some((v) => v > 0);
          if (!tieneDatos) {
            alert("⚠️ No hay datos para guardar. Complete al menos un campo.");
            btn.textContent = textoOriginal;
            btn.disabled = false;
            return;
          }

          console.log("Datos a guardar:", datos);

          // Verificar si existe
          const existe = await verificarExistencia(mes, anio);

          let result;
          if (existe) {
            // Actualizar
            const confirmar = confirm(
              `⚠️ Ya existe un registro para ${monthName} ${anio}.\n¿Desea ACTUALIZARLO?`,
            );
            if (!confirmar) {
              btn.textContent = textoOriginal;
              btn.disabled = false;
              return;
            }

            const { data, error } = await supabaseClient
              .from("indicadores_mensuales")
              .update(datos)
              .eq("mes", mes)
              .eq("anio", anio)
              .select();

            if (error) throw error;
            result = data;
            alert("✅ Registro ACTUALIZADO correctamente");
          } else {
            // Insertar nuevo
            const { data, error } = await supabaseClient
              .from("indicadores_mensuales")
              .insert([datos])
              .select();

            if (error) throw error;
            result = data;
            alert("✅ Datos GUARDADOS correctamente");
          }

          console.log("Respuesta de Supabase:", result);

          // Mostrar resumen
          showSummary();
        } catch (error) {
          console.error("Error detallado:", error);

          // Mostrar mensaje de error más descriptivo
          let errorMsg = "❌ Error al guardar en Supabase:\n";
          if (error.code === "42P01") {
            errorMsg += "La tabla 'indicadores_mensuales' no existe.\n";
            errorMsg += "Por favor, crea la tabla en Supabase SQL Editor.";
          } else if (error.code === "23505") {
            errorMsg += "Ya existe un registro con este mes y año (duplicado).";
          } else if (error.code === "42501") {
            errorMsg += "No tienes permisos para insertar en esta tabla.\n";
            errorMsg += "Verifica las políticas RLS en Supabase.";
          } else {
            errorMsg += error.message;
          }
          alert(errorMsg);
        } finally {
          // Restaurar botón
          if (btn) {
            btn.textContent = textoOriginal;
            btn.disabled = false;
          }
        }
      }

      // Recolectar datos del formulario
      function recolectarDatos() {
        const mes = parseInt(document.getElementById("month").value);
        const anio = parseInt(document.getElementById("year").value);

        const datos = {
          mes: mes,
          anio: anio,
          fecha_registro: new Date().toISOString(),
        };

        // Recorrer todos los campos numéricos
        document.querySelectorAll('input[type="number"]').forEach((input) => {
          const valor = parseFloat(input.value);
          datos[input.id] = isNaN(valor) ? 0 : valor;
        });

        return datos;
      }

      // ============================================================
      // 2. RENDERIZADO DEL FORMULARIO
      // ============================================================
      function renderForm() {
        const container = document.getElementById("categories-container");
        container.innerHTML = "";

        categories.forEach((cat, idx) => {
          const div = document.createElement("div");
          div.className = "category";

          const header = document.createElement("div");
          header.className = "category-header";
          header.innerHTML = `${cat.name} <span id="toggle-${idx}">▼</span>`;
          header.onclick = () => toggleCategory(idx);

          const body = document.createElement("div");
          body.className = "category-body";
          body.id = `body-${idx}`;

          cat.fields.forEach((field) => {
            const group = document.createElement("div");
            group.className = "field-group";

            const label = document.createElement("label");
            label.htmlFor = field.id;
            label.textContent = field.label;

            const input = document.createElement("input");
            input.type = "number";
            input.id = field.id;
            input.step = "any";
            input.min = "0";
            if (field.calculated) {
              input.readOnly = true;
              input.className = "calculated";
            }

            const hint = document.createElement("div");
            hint.className = "hint";
            if (field.calculated)
              hint.textContent = "⏺ Se calcula automáticamente";

            const validation = document.createElement("div");
            validation.className = "validation-msg";
            validation.id = `val-${field.id}`;

            group.appendChild(label);
            group.appendChild(input);
            if (field.calculated) group.appendChild(hint);
            group.appendChild(validation);
            body.appendChild(group);
          });

          div.appendChild(header);
          div.appendChild(body);
          container.appendChild(div);

          // Por defecto abiertas las primeras 3
          if (idx >= 3) {
            document.getElementById(`body-${idx}`).style.display = "none";
            document.querySelector(`#toggle-${idx}`).textContent = "▶";
          }
        });

        // Eventos para cálculos automáticos
        attachAutoCalculations();
      }

      function toggleCategory(idx) {
        const body = document.getElementById(`body-${idx}`);
        const toggle = document.querySelector(`#toggle-${idx}`);
        if (body.style.display === "none") {
          body.style.display = "grid";
          toggle.textContent = "▼";
        } else {
          body.style.display = "none";
          toggle.textContent = "▶";
        }
      }

      // ============================================================
      // 3. CÁLCULOS AUTOMÁTICOS
      // ============================================================
      function attachAutoCalculations() {
        // Total médicos = médicos_ce + médicos_hosp + médicos_admin
        ["medicos_ce", "medicos_hosp", "medicos_admin"].forEach((id) => {
          document.getElementById(id).addEventListener("input", () => {
            const sum =
              getVal("medicos_ce") +
              getVal("medicos_hosp") +
              getVal("medicos_admin");
            setVal("total_medicos", sum);
          });
        });

        // Total enfermeras = enf_ce + enf_hosp + enf_admin
        ["enf_ce", "enf_hosp", "enf_admin"].forEach((id) => {
          document.getElementById(id).addEventListener("input", () => {
            const sum =
              getVal("enf_ce") + getVal("enf_hosp") + getVal("enf_admin");
            setVal("total_enfermeras", sum);
          });
        });

        // Urgencias totales = pediátricas + adulto
        ["urgencias_pediatricas", "urgencias_adulto"].forEach((id) => {
          document.getElementById(id).addEventListener("input", () => {
            const sum =
              getVal("urgencias_pediatricas") + getVal("urgencias_adulto");
            setVal("urgencias_totales", sum);
          });
        });

        // Laboratorio total = ce + hosp + urgencias
        ["lab_ce", "lab_hosp", "lab_urgencias"].forEach((id) => {
          document.getElementById(id).addEventListener("input", () => {
            const sum =
              getVal("lab_ce") + getVal("lab_hosp") + getVal("lab_urgencias");
            setVal("lab_total", sum);
          });
        });

        // Radiología total = ce + hosp + urgencias
        ["rx_ce", "rx_hosp", "rx_urgencias"].forEach((id) => {
          document.getElementById(id).addEventListener("input", () => {
            const sum =
              getVal("rx_ce") + getVal("rx_hosp") + getVal("rx_urgencias");
            setVal("rx_total", sum);
          });
        });
      }

      function getVal(id) {
        const el = document.getElementById(id);
        return el ? parseFloat(el.value) || 0 : 0;
      }

      function setVal(id, value) {
        const el = document.getElementById(id);
        if (el) el.value = value;
      }

      // ============================================================
      // 4. VALIDACIONES CRUZADAS
      // ============================================================
      function validateAll() {
        let errors = [];
        let warnings = [];

        // Validación 1: Urgencias totales = pediátricas + adulto
        const totalU = getVal("urgencias_totales");
        const sumU =
          getVal("urgencias_pediatricas") + getVal("urgencias_adulto");
        if (totalU !== sumU) {
          errors.push(
            "⚠️ Urgencias totales no coincide con la suma de pediátricas + adulto",
          );
          showValidation(
            "urgencias_totales",
            "Debe ser = pediátricas + adulto",
          );
        } else {
          clearValidation("urgencias_totales");
        }

        // Validación 2: Total médicos = suma de componentes
        const totalM = getVal("total_medicos");
        const sumM =
          getVal("medicos_ce") +
          getVal("medicos_hosp") +
          getVal("medicos_admin");
        if (totalM !== sumM) {
          errors.push(
            "⚠️ Total de médicos no coincide con la suma de sus componentes",
          );
          showValidation(
            "total_medicos",
            "Debe ser = CE + Hospital + Administrativos",
          );
        } else {
          clearValidation("total_medicos");
        }

        // Validación 3: Total enfermeras = suma de componentes
        const totalE = getVal("total_enfermeras");
        const sumE =
          getVal("enf_ce") + getVal("enf_hosp") + getVal("enf_admin");
        if (totalE !== sumE) {
          errors.push(
            "⚠️ Total de enfermeras no coincide con la suma de sus componentes",
          );
          showValidation(
            "total_enfermeras",
            "Debe ser = CE + Hospital + Administrativas",
          );
        } else {
          clearValidation("total_enfermeras");
        }

        // Validación 4: Laboratorio total
        const totalL = getVal("lab_total");
        const sumL =
          getVal("lab_ce") + getVal("lab_hosp") + getVal("lab_urgencias");
        if (totalL !== sumL) {
          errors.push(
            "⚠️ Total de laboratorio no coincide con la suma de CE + Hospitalización + Urgencias",
          );
          showValidation(
            "lab_total",
            "Debe ser = CE + Hospitalización + Urgencias",
          );
        } else {
          clearValidation("lab_total");
        }

        // Validación 5: Radiología total
        const totalR = getVal("rx_total");
        const sumR =
          getVal("rx_ce") + getVal("rx_hosp") + getVal("rx_urgencias");
        if (totalR !== sumR) {
          errors.push(
            "⚠️ Total de radiología no coincide con la suma de CE + Hospitalización + Urgencias",
          );
          showValidation(
            "rx_total",
            "Debe ser = CE + Hospitalización + Urgencias",
          );
        } else {
          clearValidation("rx_total");
        }

        // Validación 6: Partos atendidos = cesárea + espontáneos + asistidos (aproximado)
        const partosAt = getVal("partos_atendidos");
        const sumPartos =
          getVal("partos_cesarea") +
          getVal("partos_espontaneos") +
          getVal("partos_asistidos");
        if (partosAt !== sumPartos && partosAt > 0) {
          warnings.push(
            "⚠️ Partos atendidos no coincide con cesárea + espontáneos + asistidos (verificar)",
          );
        }

        // Mostrar resultados
        const summaryBox = document.getElementById("summaryBox");
        if (errors.length > 0 || warnings.length > 0) {
          let msg = "🔍 RESULTADO DE VALIDACIÓN:\n";
          if (errors.length > 0) {
            msg +=
              "\n❌ ERRORES (deben corregirse):\n" +
              errors.map((e) => "  • " + e).join("\n");
          }
          if (warnings.length > 0) {
            msg +=
              "\n\n⚠️ ADVERTENCIAS (revisar):\n" +
              warnings.map((w) => "  • " + w).join("\n");
          }
          summaryBox.textContent = msg;
          summaryBox.className = "summary-box visible";
          summaryBox.style.borderColor =
            errors.length > 0 ? "#c62828" : "#f9a825";
        } else {
          summaryBox.textContent =
            "✅ ¡Todos los totales calculados son consistentes! El formulario está correcto.";
          summaryBox.className = "summary-box visible";
          summaryBox.style.borderColor = "#2e7d32";
        }
      }

      function showValidation(id, msg) {
        const el = document.getElementById(`val-${id}`);
        if (el) {
          el.textContent = msg;
          el.className = "validation-msg visible";
        }
      }

      function clearValidation(id) {
        const el = document.getElementById(`val-${id}`);
        if (el) {
          el.textContent = "";
          el.className = "validation-msg";
        }
      }

      // ============================================================
      // 5. RESUMEN Y EXPORTACIÓN
      // ============================================================
      function showSummary() {
        const summaryBox = document.getElementById("summaryBox");
        const month = document.getElementById("month").value;
        const year = document.getElementById("year").value;
        const monthName = document.querySelector(
          "#month option:checked",
        ).textContent;

        let lines = [];
        lines.push(`📊 RESUMEN - ${monthName} ${year}`);
        lines.push("=".repeat(50));

        let allFields = [];
        categories.forEach((cat) => {
          cat.fields.forEach((f) => {
            allFields.push({
              category: cat.name,
              label: f.label,
              id: f.id,
              value: getVal(f.id),
            });
          });
        });

        let currentCat = "";
        allFields.forEach((f) => {
          if (f.category !== currentCat) {
            currentCat = f.category;
            lines.push(`\n${currentCat}`);
            lines.push("-".repeat(30));
          }
          lines.push(`  ${f.label}: ${f.value}`);
        });

        summaryBox.textContent = lines.join("\n");
        summaryBox.className = "summary-box visible";
      }

      function exportCSV() {
        const month = document.getElementById("month").value;
        const year = document.getElementById("year").value;
        const monthName = document.querySelector(
          "#month option:checked",
        ).textContent;

        let rows = [];
        rows.push("Categoría;Indicador;Valor");

        categories.forEach((cat) => {
          cat.fields.forEach((f) => {
            const val = getVal(f.id);
            rows.push(`${cat.name};${f.label};${val}`);
          });
        });

        const csv = rows.join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `indicadores_${monthName}_${year}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
      }

      function resetForm() {
        document.querySelectorAll('input[type="number"]').forEach((input) => {
          if (!input.readOnly) input.value = "";
        });
        attachAutoCalculations();
        document.querySelectorAll(".validation-msg").forEach((el) => {
          el.textContent = "";
          el.className = "validation-msg";
        });
        document.getElementById("summaryBox").className = "summary-box";
        document.getElementById("summaryBox").textContent = "";
        [
          "medicos_ce",
          "enf_ce",
          "urgencias_pediatricas",
          "lab_ce",
          "rx_ce",
        ].forEach((id) => {
          const ev = new Event("input");
          document.getElementById(id).dispatchEvent(ev);
        });
      }

      // ============================================================
      // 6. INICIALIZACIÓN
      // ============================================================
      renderForm();

      setTimeout(() => {
        [
          "medicos_ce",
          "enf_ce",
          "urgencias_pediatricas",
          "lab_ce",
          "rx_ce",
        ].forEach((id) => {
          const ev = new Event("input");
          document.getElementById(id).dispatchEvent(ev);
        });
      }, 100);
    </script>
  </body>
</html>
