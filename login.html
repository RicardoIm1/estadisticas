    <style>
      #efemerides-tile.anuncio-item ul {
        list-style-type: none;
        padding-left: 0;
        margin: 0;
      }

      #efemerides-tile.anuncio-item ul li {
        color: #4ecdc4;
        font-size: 1rem;
      }

      /* ===== MEJORAS DE RESPONSIVIDAD ===== */

      /* Reset y mejoras para móviles */
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
        width: 100%;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      /* Contenedor principal - FULL RESPONSIVE */
      .glass {
        width: 100%;
        max-width: 450px;
        margin: 0 auto;
        padding: 25px 20px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
        position: relative;
        z-index: 10;
        transition: transform 0.3s ease;
      }

      /* Header */
      .header {
        text-align: center;
        margin-bottom: 20px;
        padding: 0 5px;
      }

      .header .logo {
        width: 100%;
        max-width: 140px;
        height: auto;
        margin-bottom: 12px;
      }

      .header h3 {
        color: white;
        font-size: clamp(1.1rem, 4vw, 1.5rem);
        font-weight: 600;
        margin: 0;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        word-wrap: break-word;
      }

      /* Formulario */
      #formularioLogin {
        width: 100%;
      }

      .form-group {
        margin-bottom: 16px;
        width: 100%;
      }

      .form-group label {
        display: block;
        color: rgba(255, 255, 255, 0.9);
        font-size: clamp(0.85rem, 2.5vw, 1rem);
        margin-bottom: 6px;
        font-weight: 500;
      }

      .form-group label i {
        margin-right: 8px;
        color: #4ecdc4;
      }

      .form-group input {
        width: 100%;
        padding: 12px 15px;
        font-size: clamp(0.95rem, 2.8vw, 1.05rem);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.08);
        color: white;
        transition: all 0.3s ease;
        outline: none;
        -webkit-appearance: none;
        appearance: none;
      }

      .form-group input::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }

      .form-group input:focus {
        border-color: #4ecdc4;
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.2);
      }

      /* Botones */
      .botones-vertical {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        margin-top: 10px;
      }

      .botones-vertical button {
        width: 100%;
        padding: 14px 20px;
        font-size: clamp(0.95rem, 2.8vw, 1.05rem);
        font-weight: 600;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .botones-vertical button[type="submit"] {
        background: linear-gradient(135deg, #4ecdc4, #44b39d);
        color: white;
        box-shadow: 0 4px 15px rgba(78, 205, 196, 0.3);
      }

      .botones-vertical button[type="submit"]:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(78, 205, 196, 0.4);
      }

      .botones-vertical button[type="reset"] {
        background: rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      .botones-vertical button[type="reset"]:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* Mensaje */
      #message {
        min-height: 50px;
        text-align: center;
        padding: 12px;
        margin: 8px 0 12px 0;
        border-radius: 12px;
        font-size: clamp(0.9rem, 2.5vw, 1rem);
        line-height: 1.5;
        transition: all 0.3s ease;
        background: rgba(0, 0, 0, 0.15);
        word-wrap: break-word;
      }

      #message i {
        margin-right: 8px;
      }

      /* Footer */
      footer {
        text-align: center;
        margin-top: 20px;
        padding-top: 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      footer p {
        color: rgba(255, 255, 255, 0.6);
        font-size: clamp(0.75rem, 2vw, 0.9rem);
        margin: 0;
      }

      /* ===== GACETA LATERAL - RESPONSIVE ===== */
      .gaceta-container {
        position: fixed;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        width: 320px;
        max-height: 85vh;
        overflow-y: auto;
        border-radius: 20px;
        padding: 25px;
        z-index: 100;
      }

      .gaceta-title {
        font-size: 1.4rem;
        margin-bottom: 20px;
        color: #fff;
        text-align: center;
        padding-bottom: 15px;
        border-bottom: 2px solid #4ecdc4;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-weight: 600;
      }

      .gaceta-title i {
        color: #4ecdc4;
        font-size: 1.6rem;
      }

      .anuncios-lista {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .anuncio-item {
        display: flex;
        align-items: flex-start;
        gap: 15px;
        padding: 18px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        transition: all 0.3s ease;
      }

      .anuncio-item:hover {
        background: rgba(255, 255, 255, 0.12);
        transform: translateX(5px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .anuncio-item i {
        color: #4ecdc4;
        font-size: 1.3rem;
        min-width: 24px;
        margin-top: 3px;
      }

      .anuncio-item p {
        margin: 0;
        color: #f0f0f0;
        font-size: 1rem;
        line-height: 1.5;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }

      .anuncio-item img {
        width: 100%;
        padding: 5px;
        border-radius: 15px;
        display: block;
      }

      .anuncio-item h3 {
        color: white;
        font-size: clamp(0.8rem, 2vw, 1rem);
        margin: 0;
      }

      .gaceta-container::-webkit-scrollbar {
        width: 6px;
      }

      .gaceta-container::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
      }

      .gaceta-container::-webkit-scrollbar-thumb {
        background: #4ecdc4;
        border-radius: 10px;
      }

      /* ===== MEDIA QUERIES MEJORADAS ===== */

      /* Móviles y tablets - OCULTAR GACETA */
      @media (max-width: 1024px) {
        .gaceta-container {
          display: none !important;
        }

        body {
          padding: 10px;
          align-items: flex-start;
          padding-top: 20px;
        }

        .glass {
          max-width: 100%;
          padding: 20px 15px;
          margin: 0 auto;
          border-radius: 20px;
        }
      }

      /* Móviles muy pequeños */
      @media (max-width: 380px) {
        .glass {
          padding: 15px 12px;
          border-radius: 16px;
        }

        .header .logo {
          max-width: 100px;
        }

        .form-group input {
          padding: 10px 12px;
        }

        .botones-vertical button {
          padding: 12px 15px;
          font-size: 0.85rem;
        }

        .botones-vertical {
          gap: 8px;
        }
      }

      /* Tablets y pantallas medianas */
      @media (min-width: 768px) and (max-width: 1024px) {
        .glass {
          max-width: 420px;
          padding: 30px 25px;
        }

        body {
          padding: 20px;
        }
      }

      /* Pantallas grandes - ajustar gaceta */
      @media (min-width: 1400px) {
        .gaceta-container {
          left: 40px;
          width: 350px;
        }
      }

      @media (max-width: 1400px) and (min-width: 1025px) {
        .gaceta-container {
          left: 15px;
          width: 300px;
          padding: 20px;
        }

        .glass {
          max-width: 400px;
        }
      }

      /* Mejora para inputs en móviles (evita zoom automático) */
      @media (max-width: 768px) {
        input,
        select,
        textarea {
          font-size: 16px !important; /* Previene zoom en iOS */
        }
      }

      /* Soporte para orientación landscape en móviles */
      @media (max-height: 500px) and (orientation: landscape) {
        body {
          align-items: center;
          padding: 10px 20px;
        }

        .glass {
          max-width: 500px;
          padding: 15px 20px;
          max-height: 90vh;
          overflow-y: auto;
        }

        .header .logo {
          max-width: 80px;
        }

        .header h3 {
          font-size: 1rem;
        }

        .form-group {
          margin-bottom: 10px;
        }

        .form-group input {
          padding: 8px 12px;
        }

        .botones-vertical {
          flex-direction: row;
          gap: 10px;
        }

        .botones-vertical button {
          padding: 10px 15px;
          font-size: 0.9rem;
          flex: 1;
        }

        #message {
          min-height: 30px;
          padding: 8px;
          font-size: 0.8rem;
        }

        footer {
          margin-top: 10px;
          padding-top: 10px;
        }
      }

      /* Mejora de scroll en móviles */
      .glass {
        -webkit-overflow-scrolling: touch;
      }

      /* Ajuste para el mensaje de éxito */
      #message strong {
        color: #4ecdc4;
      }

      /* Estados del formulario */
      .glass.loading {
        animation: pulse 1.5s ease-in-out infinite;
      }

      .glass.success {
        border-color: #4ecdc4;
        box-shadow: 0 0 30px rgba(78, 205, 196, 0.2);
      }

      .glass.error {
        border-color: #f87171;
        box-shadow: 0 0 30px rgba(248, 113, 113, 0.2);
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.01);
        }
      }
    </style>
  </head>

    <script>
      // ========== SISTEMA DE ESTADO ==========
      let intensidadUso = 0;
      let respiracionInterval;

      function iniciarRespiracion() {
        const dashboard = document.querySelector(".glass");
        if (!dashboard) return;

        clearInterval(respiracionInterval);

        let fase = 0;
        respiracionInterval = setInterval(() => {
          fase += 0.02;
          const intensidad = Math.min(0.15 + intensidadUso / 80, 0.4);
          const escala = 1 + Math.sin(fase) * intensidad * 0.02;
          dashboard.style.transform = `scale(${escala})`;
        }, 500);
      }

      function setEstado(estado, mensaje = null) {
        const dashboard = document.querySelector(".glass");
        const messageDiv = document.getElementById("message");
        if (!dashboard) return;

        intensidadUso = Math.min(intensidadUso + 1, 10);
        iniciarRespiracion();
        setTimeout(
          () => (intensidadUso = Math.max(intensidadUso - 1, 0)),
          8000,
        );

        dashboard.classList.remove("loading", "success", "error");
        dashboard.classList.add(estado);

        if (messageDiv) {
          const iconos = {
            loading:
              '<i class="fas fa-sync fa-spin"></i> Validando credenciales...',
            success:
              '<i class="fas fa-check-circle"></i> ¡ACCESO EXITOSO! <br>',
            error: '<i class="fas fa-exclamation-circle"></i> ',
          };
          messageDiv.innerHTML = mensaje
            ? iconos[estado] + mensaje
            : iconos[estado];
          messageDiv.style.color = estado === "error" ? "#f87171" : "white";
          messageDiv.style.opacity = "1";
        }

        if (estado !== "success") {
          setTimeout(() => {
            dashboard.classList.remove("loading", "success", "error");
          }, 5000);
        }
      }
    </script>

    <script>
      // ========== LÓGICA DEL LOGIN CON JSONP ==========
      document.getElementById("footerText").innerHTML =
        `Hecho con ❤️ por Ricardo · ${new Date().getFullYear()}`;

      const form = document.getElementById("formularioLogin");
      const scriptUrl =

      // ✅ Función global para manejar la respuesta del LOGIN
      window.manejarLogin = function (resultado) {
        console.log("🔍 Respuesta REAL de Google Sheets:", resultado);

        const oldScript = document.getElementById("jsonp-script");
        if (oldScript) oldScript.remove();

        if (resultado.success) {
          const usuario = document.getElementById("usuario").value;

          localStorage.setItem("usuario", usuario);
          localStorage.setItem("rol", resultado.rol);
          localStorage.setItem("loginTime", new Date().getTime());

          if (window.ModalPsicodelico) {
            window.ModalPsicodelico.loginExitoso();
          }
          document.dispatchEvent(new CustomEvent("loginExitoso"));

          setTimeout(() => {
            if (resultado.rol === "ADMIN") {
              window.location.href = "/control/";
            } else if (resultado.rol === "CAJA") {
              window.location.href = "/caja/caja.html";
            } else if (resultado.rol === "Lector") {
              window.location.href = "/";
            } else if (resultado.rol === "ESTADISTICAS") {
              window.location.href = "/est/";
            } else if (resultado.rol === "ARCHIVO CLINICO") {
              window.location.href = "/archivo/";
            } else if (resultado.rol === "EPIDEMIOLOGIA") {
              window.location.href = "/epidemio/";
            } else if (resultado.rol === "SUBDIRECCION") {
              window.location.href = "/archivo/h_faltantespp.html";
            } else {
              window.location.href = "/";
            }
          }, 2000);
        } else {
          setEstado("error", resultado.error || "Credenciales incorrectas");
          console.error("❌ Error de login:", resultado.error);
        }
      };

      window.verificarServidorCallback = function (res) {
        console.log("✅ Servidor activo:", res);
        const script = document.getElementById("server-check-script");
        if (script) script.remove();
      };

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        setEstado("loading");

        const usuario = document.getElementById("usuario").value.trim();
        const clave = document.getElementById("clave").value;

        if (!usuario || !clave) {
          setEstado("error", "Usuario y contraseña son requeridos");
          return;
        }

        console.log("📤 Enviando credenciales:", { usuario, clave });

        const script = document.createElement("script");
        script.id = "jsonp-script";

        const params = new URLSearchParams({
          usuario: usuario,
          clave: clave,
          callback: "manejarLogin",
          ip: "web",
        });

        script.src = `${scriptUrl}?${params.toString()}`;
        console.log("🔗 URL llamada:", script.src);

        document.head.appendChild(script);

        setTimeout(() => {
          const scriptElement = document.getElementById("jsonp-script");
          if (scriptElement) {
            scriptElement.remove();
            setEstado("error", "Timeout - No response from server");
          }
        }, 10000);
      });

      form.addEventListener("reset", () => {
        const messageDiv = document.getElementById("message");
        messageDiv.innerHTML = "";
        messageDiv.style.opacity = "0";
      });

      function verificarSesion() {
        const usuario = localStorage.getItem("usuario");
        const loginTime = localStorage.getItem("loginTime");
        const ahora = new Date().getTime();

        if (usuario && loginTime && ahora - loginTime < 24 * 60 * 60 * 1000) {
          console.log("Sesión activa para:", usuario);
        } else {
          localStorage.removeItem("usuario");
          localStorage.removeItem("rol");
          localStorage.removeItem("loginTime");
        }
      }

      function verificarServidor() {
        try {
          const script = document.createElement("script");
          script.id = "server-check-script";
          script.src = `${scriptUrl}?callback=verificarServidorCallback`;
          document.head.appendChild(script);

          setTimeout(() => {
            const oldScript = document.getElementById("server-check-script");
            if (oldScript) oldScript.remove();
          }, 3000);
        } catch (error) {
          console.log("❌ No se pudo conectar al servidor:", error);
        }
      }

      window.addEventListener("load", function () {
        iniciarRespiracion();
        verificarSesion();
        verificarServidor();
      });

      window.cerrarSesion = function () {
        localStorage.removeItem("usuario");
        localStorage.removeItem("rol");
        localStorage.removeItem("loginTime");
        window.location.href = "/index.html";
      };

          window.location.href = "/index.html";
        }
      }

      setInterval(verificarSesionExpirada, 60 * 60 * 1000);
    </script>

      function getEfemeridesProximas() {
        const fecha = new Date();
        const proximas = [];

        for (let i = 1; i <= 30; i++) {
          const fechaCheck = new Date();
          fechaCheck.setDate(fecha.getDate() + i);
          const mes = fechaCheck.getMonth();
          const dia = fechaCheck.getDate();

          const efemeride = efemeridesSalud.find(
            (ef) => ef.mes === mes && ef.dia === dia,
          );

          if (efemeride) {
            const fechaEfemeride = new Date(fecha.getFullYear(), mes, dia);
            const diferenciaTiempo = fechaEfemeride - fecha;
            const diasFaltantes = Math.ceil(
              diferenciaTiempo / (1000 * 60 * 60 * 24),
            );

            proximas.push({
              ...efemeride,
              fecha: fechaEfemeride,
              diasFaltantes: diasFaltantes,
              mes: mes,
              dia: dia,
            });
          }
        }

        proximas.sort((a, b) => a.diasFaltantes - b.diasFaltantes);
        return proximas;
      }

      function actualizarEfemerides() {
        const lista = document.getElementById("efemerides-lista");
        if (!lista) return;

        const efemeridesProximas = getEfemeridesProximas();
        lista.innerHTML = "";

        if (efemeridesProximas.length > 0) {
          efemeridesProximas.slice(0, 4).forEach((ef) => {
            const item = document.createElement("li");
            const diaFormateado = ef.dia.toString().padStart(2, "0");
            const meses = [
              "Ene",
              "Feb",
              "Mar",
              "Abr",
              "May",
              "Jun",
              "Jul",
              "Ago",
              "Sep",
              "Oct",
              "Nov",
              "Dic",
            ];

            let textoDias = "";
            if (ef.diasFaltantes === 0) {
              textoDias = "🔴 HOY";
            } else if (ef.diasFaltantes === 1) {
              textoDias = "⏰ MAÑANA";
            } else {
              textoDias = `📅 ${ef.diasFaltantes} días`;
            }

            item.innerHTML = `${ef.icono} <strong>${diaFormateado} ${meses[ef.mes]}</strong> — ${ef.descripcion} <span
            style="opacity:0.7; font-size:0.8rem;">${textoDias}</span>`;
            lista.appendChild(item);
          });

          if (efemeridesProximas.length > 4) {
            const item = document.createElement("li");
            item.style.opacity = "0.7";
            item.style.fontStyle = "italic";
            item.style.fontSize = "0.8rem";
            item.innerHTML = `↻ y ${efemeridesProximas.length - 4} más en los próximos 30 días`;
            lista.appendChild(item);
          }
        } else {
          const item = document.createElement("li");
          item.style.opacity = "0.7";
          item.style.fontStyle = "italic";
          item.innerHTML = "✨ No hay efemérides en los próximos 30 días";
          lista.appendChild(item);
        }
      }

      document.addEventListener("DOMContentLoaded", actualizarEfemerides);
      setInterval(actualizarEfemerides, 3600000);
    </script>
