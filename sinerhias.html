<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏥 Hospital Regional PV - SINERHIAS</title>
    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/img/favicon.ico" type="image/x-icon" />

    <style>
      /* ============================================
           RESET Y ESTILOS BASE
           ============================================ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        min-height: 100vh;
        background: #e0e5ec;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .container {
        width: 100%;
        max-width: 1440px;
        background: #e0e5ec;
        border-radius: 40px;
        padding: 30px;
        box-shadow:
          9px 9px 16px rgba(163, 177, 198, 0.6),
          -9px -9px 16px rgba(255, 255, 255, 0.8);
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        padding: 20px 30px;
        border-radius: 30px;
        background: #e0e5ec;
        box-shadow:
          inset 2px 2px 5px rgba(163, 177, 198, 0.6),
          inset -5px -5px 10px rgba(255, 255, 255, 0.7);
      }

      .header h1 {
        font-size: 1.8rem;
        font-weight: 700;
        color: #2c3e50;
        letter-spacing: -0.5px;
      }

      .header .badge {
        padding: 8px 20px;
        border-radius: 50px;
        background: #e0e5ec;
        box-shadow:
          3px 3px 6px rgba(163, 177, 198, 0.6),
          -3px -3px 6px rgba(255, 255, 255, 0.7);
        font-size: 0.9rem;
        color: #2c3e50;
        font-weight: 600;
      }

      .main-layout {
        display: flex;
        gap: 20px;
        align-items: flex-start;
      }

      .sidebar {
        flex: 0 0 220px;
        min-width: 180px;
        background: #e0e5ec;
        border-radius: 30px;
        padding: 15px;
        box-shadow:
          inset 2px 2px 5px rgba(163, 177, 198, 0.5),
          inset -5px -5px 10px rgba(255, 255, 255, 0.7);
        max-height: calc(100vh - 200px);
        overflow-y: auto;
        position: sticky;
        top: 20px;
      }

      .sidebar-title {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #7f8c8d;
        padding: 10px 12px 15px 12px;
        font-weight: 700;
        border-bottom: 2px solid rgba(163, 177, 198, 0.2);
        margin-bottom: 10px;
      }

      .sidebar .tab-btn {
        display: block;
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-radius: 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2c3e50;
        cursor: pointer;
        transition: all 0.3s ease;
        background: #e0e5ec;
        box-shadow:
          3px 3px 6px rgba(163, 177, 198, 0.6),
          -3px -3px 6px rgba(255, 255, 255, 0.7);
        margin-bottom: 6px;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .sidebar .tab-btn:hover {
        transform: translateX(4px);
        box-shadow:
          5px 5px 10px rgba(163, 177, 198, 0.7),
          -5px -5px 10px rgba(255, 255, 255, 0.8);
      }

      .sidebar .tab-btn.active {
        background: #e0e5ec;
        box-shadow:
          inset 3px 3px 6px rgba(163, 177, 198, 0.6),
          inset -3px -3px 6px rgba(255, 255, 255, 0.7);
        color: #1a73e8;
      }

      .sidebar .tab-btn .tab-number {
        display: inline-block;
        width: 20px;
        height: 20px;
        line-height: 20px;
        text-align: center;
        border-radius: 50%;
        font-size: 0.6rem;
        font-weight: 700;
        margin-right: 6px;
        background: #e0e5ec;
        box-shadow:
          inset 1px 1px 3px rgba(163, 177, 198, 0.5),
          inset -1px -1px 3px rgba(255, 255, 255, 0.7);
      }

      .sidebar .tab-btn.active .tab-number {
        background: #1a73e8;
        color: white;
        box-shadow: none;
      }

      .content-area {
        flex: 1;
        min-width: 0;
        background: #e0e5ec;
        border-radius: 30px;
        padding: 20px;
        box-shadow:
          inset 3px 3px 8px rgba(163, 177, 198, 0.5),
          inset -3px -3px 8px rgba(255, 255, 255, 0.7);
        min-height: 400px;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 10px;
      }

      .toolbar .info {
        font-size: 0.9rem;
        color: #34495e;
        font-weight: 500;
      }

      .toolbar .info span {
        font-weight: 700;
        color: #1a73e8;
      }

      .btn-neo {
        padding: 10px 24px;
        border: none;
        border-radius: 50px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #2c3e50;
        cursor: pointer;
        transition: all 0.3s ease;
        background: #e0e5ec;
        box-shadow:
          3px 3px 6px rgba(163, 177, 198, 0.6),
          -3px -3px 6px rgba(255, 255, 255, 0.7);
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn-neo:hover {
        transform: translateY(-2px);
        box-shadow:
          5px 5px 12px rgba(163, 177, 198, 0.7),
          -5px -5px 12px rgba(255, 255, 255, 0.8);
      }

      .btn-neo:active {
        transform: translateY(0);
        box-shadow:
          inset 3px 3px 6px rgba(163, 177, 198, 0.6),
          inset -3px -3px 6px rgba(255, 255, 255, 0.7);
      }

      .btn-neo.primary {
        color: #1a73e8;
      }

      .btn-neo.danger {
        color: #e74c3c;
      }

      .btn-neo.success {
        color: #27ae60;
      }

      /* ============================================
   CARDS - VERSIÓN MULTICOLUMNA (4-5 columnas)
   ============================================ */
      .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        padding: 10px 0;
      }

      /* Para pantallas grandes - 5 columnas */
      @media (min-width: 1600px) {
        .cards-grid {
          grid-template-columns: repeat(5, 1fr);
          gap: 24px;
        }
      }

      /* Para pantallas medianas-grandes - 4 columnas */
      @media (min-width: 1200px) and (max-width: 1599px) {
        .cards-grid {
          grid-template-columns: repeat(4, 1fr);
          gap: 22px;
        }
      }

      /* Para tablets - 3 columnas */
      @media (min-width: 768px) and (max-width: 1199px) {
        .cards-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 18px;
        }
      }

      /* Para móviles grandes - 2 columnas */
      @media (min-width: 480px) and (max-width: 767px) {
        .cards-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 14px;
        }
      }

      /* Para móviles pequeños - 1 columna */
      @media (max-width: 479px) {
        .cards-grid {
          grid-template-columns: 1fr;
          gap: 12px;
        }
      }

      .card-item {
        background: #e0e5ec;
        border-radius: 24px;
        padding: 18px 16px 16px 16px;
        box-shadow:
          8px 8px 16px rgba(163, 177, 198, 0.6),
          -8px -8px 16px rgba(255, 255, 255, 0.7);
        transition: all 0.3s ease;
        position: relative;
        display: flex;
        flex-direction: column;
      }

      .card-item:hover {
        transform: translateY(-4px);
        box-shadow:
          12px 12px 24px rgba(163, 177, 198, 0.7),
          -12px -12px 24px rgba(255, 255, 255, 0.8);
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 2px solid rgba(163, 177, 198, 0.2);
      }

      .card-number {
        font-size: 0.6rem;
        font-weight: 700;
        color: #7f8c8d;
        background: #e0e5ec;
        padding: 3px 10px;
        border-radius: 16px;
        box-shadow:
          inset 2px 2px 4px rgba(163, 177, 198, 0.5),
          inset -2px -2px 4px rgba(255, 255, 255, 0.7);
      }

      .card-actions {
        display: flex;
        gap: 6px;
      }

      .card-actions .btn-icon {
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 50%;
        font-size: 0.7rem;
        cursor: pointer;
        transition: all 0.2s ease;
        background: #e0e5ec;
        box-shadow:
          2px 2px 4px rgba(163, 177, 198, 0.5),
          -2px -2px 4px rgba(255, 255, 255, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2c3e50;
      }

      .card-actions .btn-icon:hover {
        transform: scale(1.1);
      }

      .card-actions .btn-icon.delete:hover {
        color: #e74c3c;
        box-shadow:
          2px 2px 4px rgba(231, 76, 60, 0.3),
          -2px -2px 4px rgba(255, 255, 255, 0.7);
      }

      .card-actions .btn-icon.edit:hover {
        color: #1a73e8;
        box-shadow:
          2px 2px 4px rgba(26, 115, 232, 0.3),
          -2px -2px 4px rgba(255, 255, 255, 0.7);
      }

      .card-body {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }

      .card-field {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 12px;
        background: #e0e5ec;
        box-shadow:
          inset 2px 2px 4px rgba(163, 177, 198, 0.4),
          inset -2px -2px 4px rgba(255, 255, 255, 0.6);
        transition: all 0.3s ease;
        cursor: pointer;
        min-height: 36px;
        border-left: 3px solid transparent;
      }

      .card-field:hover {
        box-shadow:
          inset 2px 2px 8px rgba(26, 115, 232, 0.12),
          inset -2px -2px 8px rgba(255, 255, 255, 0.7);
        background: rgba(26, 115, 232, 0.02);
        border-left-color: rgba(26, 115, 232, 0.3);
      }

      .card-field.editing {
        box-shadow:
          inset 2px 2px 8px rgba(26, 115, 232, 0.25),
          inset -2px -2px 8px rgba(255, 255, 255, 0.7),
          0 0 0 2px rgba(26, 115, 232, 0.15);
        background: rgba(26, 115, 232, 0.04);
        border-left-color: #1a73e8;
      }

      .card-field .field-label {
        font-size: 0.55rem;
        font-weight: 700;
        color: #7f8c8d;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        min-width: 60px;
        flex-shrink: 0;
        padding: 1px 0;
      }

      .card-field .field-value {
        flex: 1;
        font-size: 0.8rem;
        color: #2c3e50;
        font-weight: 500;
        word-break: break-word;
        padding: 2px 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .card-field .field-value.empty {
        color: #b0b8c8;
        font-style: italic;
        font-weight: 400;
      }

      /* Inputs en modo edición */
      .card-field .field-input {
        flex: 1;
        padding: 4px 8px;
        border: none;
        border-radius: 8px;
        font-size: 0.8rem;
        background: #e0e5ec;
        box-shadow:
          inset 2px 2px 6px rgba(163, 177, 198, 0.5),
          inset -2px -2px 6px rgba(255, 255, 255, 0.7);
        color: #2c3e50;
        outline: none;
        font-weight: 500;
        min-width: 80px;
        transition: all 0.3s ease;
      }

      .card-field .field-input:focus {
        box-shadow:
          inset 3px 3px 8px rgba(26, 115, 232, 0.2),
          inset -3px -3px 8px rgba(255, 255, 255, 0.8),
          0 0 0 2px rgba(26, 115, 232, 0.1);
      }

      .card-field .field-select {
        flex: 1;
        padding: 4px 8px;
        border: none;
        border-radius: 8px;
        font-size: 0.8rem;
        background: #e0e5ec;
        box-shadow:
          inset 2px 2px 6px rgba(163, 177, 198, 0.5),
          inset -2px -2px 6px rgba(255, 255, 255, 0.7);
        color: #2c3e50;
        outline: none;
        font-weight: 500;
        cursor: pointer;
        min-width: 80px;
      }

      .card-field .field-select:focus {
        box-shadow:
          inset 3px 3px 8px rgba(26, 115, 232, 0.2),
          inset -3px -3px 8px rgba(255, 255, 255, 0.8);
      }

      /* Botones de acción dentro del campo */
      .card-field .field-actions {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
      }

      .card-field .save-btn {
        padding: 3px 10px;
        border: none;
        border-radius: 16px;
        font-size: 0.6rem;
        font-weight: 700;
        cursor: pointer;
        background: #1a73e8;
        color: white;
        box-shadow:
          2px 2px 4px rgba(26, 115, 232, 0.3),
          -2px -2px 4px rgba(255, 255, 255, 0.5);
        transition: all 0.2s ease;
        letter-spacing: 0.3px;
      }

      .card-field .save-btn:hover {
        transform: scale(1.05);
        box-shadow:
          3px 3px 6px rgba(26, 115, 232, 0.4),
          -3px -3px 6px rgba(255, 255, 255, 0.6);
      }

      .card-field .save-btn:active {
        transform: scale(0.95);
      }

      .card-field .cancel-btn {
        padding: 3px 10px;
        border: none;
        border-radius: 16px;
        font-size: 0.6rem;
        font-weight: 600;
        cursor: pointer;
        background: #e0e5ec;
        color: #7f8c8d;
        box-shadow:
          inset 2px 2px 4px rgba(163, 177, 198, 0.5),
          inset -2px -2px 4px rgba(255, 255, 255, 0.7);
        transition: all 0.2s ease;
      }

      .card-field .cancel-btn:hover {
        color: #e74c3c;
        box-shadow:
          inset 2px 2px 4px rgba(231, 76, 60, 0.2),
          inset -2px -2px 4px rgba(255, 255, 255, 0.7);
      }

      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 20px;
      }

      .modal-overlay.active {
        display: flex;
      }

      .modal {
        background: #e0e5ec;
        border-radius: 40px;
        padding: 35px;
        max-width: 900px;
        width: 100%;
        max-height: 85vh;
        overflow-y: auto;
        box-shadow:
          15px 15px 30px rgba(163, 177, 198, 0.7),
          -15px -15px 30px rgba(255, 255, 255, 0.8);
        animation: modalIn 0.3s ease;
      }

      @keyframes modalIn {
        from {
          opacity: 0;
          transform: scale(0.95) translateY(20px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 2px solid rgba(163, 177, 198, 0.2);
        position: sticky;
        top: 0;
        background: #e0e5ec;
        z-index: 10;
      }

      .modal-header h2 {
        font-size: 1.4rem;
        color: #2c3e50;
      }

      .modal-close {
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 50%;
        font-size: 1.2rem;
        cursor: pointer;
        background: #e0e5ec;
        box-shadow:
          3px 3px 6px rgba(163, 177, 198, 0.6),
          -3px -3px 6px rgba(255, 255, 255, 0.7);
        color: #2c3e50;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .modal-close:hover {
        transform: rotate(90deg);
      }

      .form-scroll {
        max-height: 55vh;
        overflow-y: auto;
        padding-right: 10px;
      }

      .form-scroll::-webkit-scrollbar {
        width: 6px;
      }

      .form-scroll::-webkit-scrollbar-track {
        background: #e0e5ec;
        border-radius: 10px;
      }

      .form-scroll::-webkit-scrollbar-thumb {
        background: #b0b8c8;
        border-radius: 10px;
      }

      .form-scroll::-webkit-scrollbar-thumb:hover {
        background: #9aa3b5;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .form-group label {
        font-size: 0.75rem;
        font-weight: 600;
        color: #34495e;
        letter-spacing: 0.3px;
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
        padding: 8px 12px;
        border: none;
        border-radius: 12px;
        font-size: 0.85rem;
        background: #e0e5ec;
        box-shadow:
          inset 2px 2px 6px rgba(163, 177, 198, 0.5),
          inset -2px -2px 6px rgba(255, 255, 255, 0.7);
        color: #2c3e50;
        transition: all 0.3s ease;
        outline: none;
        width: 100%;
      }

      .form-group input:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        box-shadow:
          inset 3px 3px 8px rgba(26, 115, 232, 0.2),
          inset -3px -3px 8px rgba(255, 255, 255, 0.8),
          0 0 0 2px rgba(26, 115, 232, 0.2);
      }

      .form-group textarea {
        resize: vertical;
        min-height: 50px;
      }

      .modal-footer {
        margin-top: 20px;
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        padding-top: 15px;
        border-top: 2px solid rgba(163, 177, 198, 0.2);
        position: sticky;
        bottom: 0;
        background: #e0e5ec;
        z-index: 10;
      }

      .loading {
        text-align: center;
        padding: 50px 20px;
        color: #34495e;
        font-size: 1.1rem;
      }

      .loading::after {
        content: "...";
        animation: dots 1.5s steps(4) infinite;
      }

      @keyframes dots {
        0%,
        20% {
          content: ".";
        }
        40% {
          content: "..";
        }
        60% {
          content: "...";
        }
        80%,
        100% {
          content: "";
        }
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #95a5a6;
        font-size: 1.1rem;
      }

      .empty-state .icon {
        font-size: 3rem;
        margin-bottom: 15px;
        display: block;
      }

      .toast-notification {
        position: fixed;
        bottom: 30px;
        right: 30px;
        padding: 16px 24px;
        border-radius: 16px;
        background: #e0e5ec;
        box-shadow:
          8px 8px 16px rgba(163, 177, 198, 0.6),
          -8px -8px 16px rgba(255, 255, 255, 0.7);
        color: #2c3e50;
        font-weight: 600;
        font-size: 0.95rem;
        z-index: 2000;
        animation: slideUp 0.3s ease;
        max-width: 400px;
      }

      @keyframes slideUp {
        from {
          transform: translateY(20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      /* RESPONSIVE GENERAL */
      @media (max-width: 992px) {
        .main-layout {
          flex-direction: column;
        }
        .sidebar {
          flex: 1 1 auto;
          width: 100%;
          max-height: none;
          position: static;
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
          padding: 12px;
        }
        .sidebar-title {
          width: 100%;
          padding: 5px 10px;
          margin-bottom: 5px;
        }
        .sidebar .tab-btn {
          flex: 0 0 auto;
          width: auto;
          padding: 6px 14px;
          font-size: 0.75rem;
          margin-bottom: 0;
          white-space: nowrap;
        }
        .sidebar .tab-btn .tab-number {
          width: 18px;
          height: 18px;
          line-height: 18px;
          font-size: 0.6rem;
          margin-right: 4px;
        }
      }

      @media (max-width: 768px) {
        .container {
          padding: 15px;
        }
        .header {
          flex-direction: column;
          gap: 10px;
          text-align: center;
          padding: 15px;
        }
        .header h1 {
          font-size: 1.3rem;
        }
        .toolbar {
          flex-direction: column;
          align-items: stretch;
        }
        .btn-neo {
          justify-content: center;
          padding: 8px 16px;
          font-size: 0.8rem;
        }
        .form-grid {
          grid-template-columns: 1fr;
        }
        .modal {
          padding: 20px;
          margin: 10px;
          max-height: 90vh;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 10px;
        }
        .container {
          padding: 10px;
          border-radius: 25px;
        }
        .sidebar .tab-btn {
          font-size: 0.65rem;
          padding: 4px 10px;
        }
        .sidebar .tab-btn .tab-number {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header class="header">
        <h1>🏥 Hospital Regional PV - SINERHIAS</h1>
        <div class="badge">🟢 <span id="statusText">Conectado</span></div>
      </header>

      <div class="main-layout">
        <nav class="sidebar" id="sidebarContainer">
          <div class="sidebar-title">📋 Secciones</div>
        </nav>

        <main class="content-area">
          <div class="toolbar">
            <div class="info">
              📋 <span id="sheetNameDisplay">Datos Generales</span> ·
              <span id="rowCountDisplay">0</span> registros
            </div>
            <button class="btn-neo primary" id="btnAdd">
              ➕ Agregar Registro
            </button>
          </div>

          <div class="table-wrapper">
            <div id="cardsContainer">
              <div class="loading">Cargando datos...</div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modalTitle">📝 Agregar Registro</h2>
          <button class="modal-close" id="modalClose">✕</button>
        </div>
        <form id="modalForm">
          <div class="form-scroll" id="formScroll">
            <div class="form-grid" id="formFields"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-neo" id="btnCancel">
              Cancelar
            </button>
            <button type="submit" class="btn-neo primary" id="btnSave">
              💾 Guardar
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      // ============================================
      // CONFIGURACIÓN - ACTUALIZA CON TU URL
      // ============================================
      const API_URL =
        "https://script.google.com/macros/s/AKfycbyf4vcWL1eVxOSP-aCvVebMp-oS2wZfpcfM5HjqYDs2dxwEwrtiX1Qbhazixfh5uQJ9/exec";

      // ============================================
      // DEFINICIÓN DE PESTAÑAS
      // ============================================
      const TABS = [
        { id: "ORDEN 1", label: "📊 Datos Generales" },
        { id: "ORDEN 11-1", label: "👨‍⚕️ RH - Plazas" },
        { id: "ORDEN 11-2", label: "👩‍⚕️ RH - Ocupadas" },
        { id: "ORDEN 11-3", label: "📉 RH - Desocupadas" },
        { id: "ORDEN 2-2", label: "🏥 Serv. Médicos 1" },
        { id: "ORDEN 2-3", label: "🏥 Serv. Médicos 2" },
        { id: "ORDEN 3", label: "🚑 Serv. Apoyo" },
        { id: "ORDEN 4", label: "🔧 Serv. Generales" },
        { id: "ORDEN 5", label: "📋 Administrativas" },
        { id: "ORDEN 6", label: "📚 Enseñanza" },
        { id: "ORDEN 7", label: "🔬 Investigacion" },
      ];

      // ============================================
      // ESTADO GLOBAL
      // ============================================
      let state = {
        currentTab: "ORDEN 1",
        data: [],
        headers: [],
        isLoading: false,
        editingFields: {},
        isEditing: false,
        editRowIndex: null,
      };

      // ============================================
      // DOM REFERENCIAS
      // ============================================
      const sidebarContainer = document.getElementById("sidebarContainer");
      const cardsContainer = document.getElementById("cardsContainer");
      const sheetNameDisplay = document.getElementById("sheetNameDisplay");
      const rowCountDisplay = document.getElementById("rowCountDisplay");
      const modalOverlay = document.getElementById("modalOverlay");
      const modalTitle = document.getElementById("modalTitle");
      const modalForm = document.getElementById("modalForm");
      const formFields = document.getElementById("formFields");
      const formScroll = document.getElementById("formScroll");
      const btnAdd = document.getElementById("btnAdd");
      const btnCancel = document.getElementById("btnCancel");
      const btnSave = document.getElementById("btnSave");
      const modalClose = document.getElementById("modalClose");
      const statusText = document.getElementById("statusText");

      // ============================================
      // API - CONEXIÓN REAL A BASE DE DATOS
      // ============================================
      function apiRequest(action, sheet, data = null, rowIndex = null) {
        return new Promise((resolve, reject) => {
          statusText.textContent = "⏳ Cargando...";

          if (action === "read") {
            const callbackName =
              "callback_" +
              Date.now() +
              "_" +
              Math.random().toString(36).substr(2, 9);
            const script = document.createElement("script");
            const url = `${API_URL}?action=${action}&sheet=${encodeURIComponent(sheet)}&callback=${callbackName}&_=${Date.now()}`;

            let resolved = false;

            window[callbackName] = function (result) {
              if (resolved) return;
              resolved = true;
              delete window[callbackName];
              if (document.body.contains(script))
                document.body.removeChild(script);
              statusText.textContent = "✅ Conectado";

              if (result.success === false || result.error) {
                reject(new Error(result.error || "Error en la operación"));
              } else {
                resolve(result);
              }
            };

            script.src = url;
            script.onerror = function () {
              if (resolved) return;
              resolved = true;
              delete window[callbackName];
              if (document.body.contains(script))
                document.body.removeChild(script);
              statusText.textContent = "❌ Error";
              reject(new Error("Error de conexión con el servidor"));
            };

            const timeout = setTimeout(() => {
              if (resolved) return;
              resolved = true;
              delete window[callbackName];
              if (document.body.contains(script))
                document.body.removeChild(script);
              statusText.textContent = "⏰ Timeout";
              reject(new Error("Timeout: El servidor no responde"));
            }, 30000);

            const originalCallback = window[callbackName];
            window[callbackName] = function (result) {
              clearTimeout(timeout);
              originalCallback(result);
            };

            document.body.appendChild(script);
            return;
          }

          // POST requests
          if (
            action === "create" ||
            action === "update" ||
            action === "delete"
          ) {
            const params = new URLSearchParams({ action, sheet });
            if (rowIndex !== null) params.append("rowIndex", rowIndex);

            fetch(`${API_URL}?${params.toString()}`, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            })
              .then(() => {
                statusText.textContent = "✅ Conectado";
                resolve({ success: true, message: "Operación completada" });
              })
              .catch((error) => {
                statusText.textContent = "❌ Error";
                reject(new Error(error.message));
              });
            return;
          }

          reject(new Error("Acción no válida"));
        });
      }

      // ============================================
      // CARGAR DATOS DESDE LA BASE DE DATOS
      // ============================================
      async function loadData(sheetName) {
        if (state.isLoading) return;
        state.isLoading = true;
        state.editingFields = {};
        cardsContainer.innerHTML =
          '<div class="loading">Cargando datos...</div>';

        try {
          const result = await apiRequest("read", sheetName);

          if (!result.data || result.data.length === 0) {
            cardsContainer.innerHTML = `
              <div class="empty-state">
                <span class="icon">📭</span>
                No hay registros en esta hoja
                <br><br>
                <button class="btn-neo primary" onclick="openCreateModal()">
                  ➕ Agregar primer registro
                </button>
              </div>
            `;
            state.data = [];
            state.headers = [];
          } else {
            state.data = result.data;
            state.headers = result.headers || Object.keys(result.data[0] || {});
          }

          state.currentTab = sheetName;
          const tabLabel =
            TABS.find((t) => t.id === sheetName)?.label || sheetName;
          sheetNameDisplay.textContent = tabLabel;
          rowCountDisplay.textContent = state.data.length;

          if (state.data.length > 0) {
            renderCards();
          }
          updateActiveTab(sheetName);
        } catch (error) {
          console.error("Error loading data:", error);
          cardsContainer.innerHTML = `
            <div class="empty-state">
              <span class="icon">⚠️</span>
              <strong>Error al cargar datos</strong>
              <br><br>
              <div style="color: #666; font-size: 0.9rem; max-width: 500px; margin: 0 auto;">
                ${error.message}
              </div>
              <br>
              <button class="btn-neo" onclick="loadData('${sheetName}')">🔄 Reintentar</button>
            </div>
          `;
        } finally {
          state.isLoading = false;
        }
      }

      // ============================================
      // RENDER CARDS
      // ============================================
      function renderCards() {
        if (state.data.length === 0) {
          cardsContainer.innerHTML = `
            <div class="empty-state">
              <span class="icon">📭</span>
              No hay registros
              <br><br>
              <button class="btn-neo primary" onclick="openCreateModal()">➕ Agregar primer registro</button>
            </div>
          `;
          return;
        }

        let html = '<div class="cards-grid">';

        state.data.forEach((row, rowIndex) => {
          html += `
            <div class="card-item" data-row="${rowIndex}">
              <div class="card-header">
                <span class="card-number">#${rowIndex + 1}</span>
                <div class="card-actions">
                  <button class="btn-icon edit" onclick="openEditModal(${rowIndex})" title="Editar todo">✏️</button>
                  <button class="btn-icon delete" onclick="deleteRow(${rowIndex})" title="Eliminar">🗑️</button>
                </div>
              </div>
              <div class="card-body">
          `;

          state.headers.forEach((header) => {
            const value = row[header] || "";
            const fieldId = `field_${rowIndex}_${header.replace(/\s+/g, "_")}`;
            const isEditing =
              state.editingFields[`${rowIndex}_${header}`] || false;
            const isBoolean =
              typeof value === "string" &&
              (value.toUpperCase() === "SI" ||
                value.toUpperCase() === "NO" ||
                value === "");

            html += `
              <div class="card-field ${isEditing ? "editing" : ""}" 
                   data-row="${rowIndex}" 
                   data-header="${header}"
                   onclick="if(!this.classList.contains('editing')) startFieldEdit(${rowIndex}, '${header}')">
                <span class="field-label">${header}</span>
            `;

            if (isEditing) {
              if (isBoolean) {
                html += `
                  <select class="field-select" id="${fieldId}" data-row="${rowIndex}" data-header="${header}">
                    <option value="">Seleccionar</option>
                    <option value="SI" ${value.toUpperCase() === "SI" ? "selected" : ""}>SI</option>
                    <option value="NO" ${value.toUpperCase() === "NO" ? "selected" : ""}>NO</option>
                  </select>
                `;
              } else {
                html += `
                  <input class="field-input" id="${fieldId}" type="text" value="${value}" 
                         data-row="${rowIndex}" data-header="${header}" 
                         onkeydown="if(event.key==='Enter') saveFieldEdit(${rowIndex}, '${header}')" />
                `;
              }
              html += `
                <div class="field-actions">
                  <button class="save-btn" onclick="event.stopPropagation(); saveFieldEdit(${rowIndex}, '${header}')">💾</button>
                  <button class="cancel-btn" onclick="event.stopPropagation(); cancelFieldEdit(${rowIndex}, '${header}')">✕</button>
                </div>
              `;
            } else {
              html += `
                <span class="field-value ${value ? "" : "empty"}">${value || "—"}</span>
              `;
            }

            html += `</div>`;
          });

          html += `
              </div>
            </div>
          `;
        });

        html += "</div>";
        cardsContainer.innerHTML = html;
      }

      // ============================================
      // EDICIÓN DE CAMPO INDIVIDUAL
      // ============================================
      function startFieldEdit(rowIndex, header) {
        state.editingFields[`${rowIndex}_${header}`] = true;
        renderCards();
        setTimeout(() => {
          const input = document.querySelector(
            `input[data-row="${rowIndex}"][data-header="${header}"], select[data-row="${rowIndex}"][data-header="${header}"]`,
          );
          if (input) input.focus();
        }, 50);
      }

      function cancelFieldEdit(rowIndex, header) {
        delete state.editingFields[`${rowIndex}_${header}`];
        renderCards();
      }

      async function saveFieldEdit(rowIndex, header) {
        const fieldId = `field_${rowIndex}_${header.replace(/\s+/g, "_")}`;
        const input = document.getElementById(fieldId);
        if (!input) return;

        const newValue = input.value;
        const oldValue = state.data[rowIndex][header] || "";

        if (newValue === oldValue) {
          delete state.editingFields[`${rowIndex}_${header}`];
          renderCards();
          return;
        }

        state.data[rowIndex][header] = newValue;

        try {
          await apiRequest(
            "update",
            state.currentTab,
            state.data[rowIndex],
            rowIndex,
          );
          delete state.editingFields[`${rowIndex}_${header}`];
          renderCards();
          showToast(`✅ Campo "${header}" actualizado`);
        } catch (error) {
          state.data[rowIndex][header] = oldValue;
          renderCards();
          showToast(`❌ ${error.message}`, "error");
        }
      }

      // ============================================
      // SIDEBAR
      // ============================================
      function renderSidebar() {
        const title =
          sidebarContainer.querySelector(".sidebar-title") ||
          document.createElement("div");
        title.className = "sidebar-title";
        title.textContent = "📋 Secciones";
        sidebarContainer.innerHTML = "";
        sidebarContainer.appendChild(title);

        TABS.forEach((tab, index) => {
          const btn = document.createElement("button");
          btn.className = `tab-btn ${tab.id === state.currentTab ? "active" : ""}`;
          btn.innerHTML = `<span class="tab-number">${index + 1}</span> ${tab.label}`;
          btn.dataset.sheet = tab.id;
          btn.addEventListener("click", () => {
            document
              .querySelectorAll(".sidebar .tab-btn")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            loadData(tab.id);
          });
          sidebarContainer.appendChild(btn);
        });
      }

      function updateActiveTab(sheetName) {
        document.querySelectorAll(".sidebar .tab-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.sheet === sheetName);
        });
      }

      // ============================================
      // MODAL
      // ============================================
      function openCreateModal() {
        state.isEditing = false;
        state.editRowIndex = null;
        modalTitle.textContent = "📝 Agregar Registro";
        renderFormFields({});
        modalOverlay.classList.add("active");
        formScroll.scrollTop = 0;
      }

      function openEditModal(index) {
        state.isEditing = true;
        state.editRowIndex = index;
        modalTitle.textContent = "✏️ Editar Registro Completo";
        const rowData = state.data[index] || {};
        renderFormFields(rowData);
        modalOverlay.classList.add("active");
        formScroll.scrollTop = 0;
      }

      function renderFormFields(rowData) {
        const allHeaders = state.headers;
        if (allHeaders.length === 0) {
          formFields.innerHTML =
            '<p style="color:#666;">No hay campos disponibles</p>';
          return;
        }

        let html = "";
        allHeaders.forEach((header) => {
          const value =
            rowData[header] !== undefined && rowData[header] !== null
              ? rowData[header]
              : "";
          const isBoolean =
            typeof value === "string" &&
            (value.toUpperCase() === "SI" ||
              value.toUpperCase() === "NO" ||
              value === "");

          html += `
            <div class="form-group">
              <label for="field_${header.replace(/\s+/g, "_")}">${header}</label>
              ${
                isBoolean
                  ? `
                <select id="field_${header.replace(/\s+/g, "_")}" name="${header}">
                  <option value="">Seleccionar</option>
                  <option value="SI" ${value.toUpperCase() === "SI" ? "selected" : ""}>SI</option>
                  <option value="NO" ${value.toUpperCase() === "NO" ? "selected" : ""}>NO</option>
                </select>
              `
                  : `
                <input type="text" id="field_${header.replace(/\s+/g, "_")}" name="${header}" value="${value}" />
              `
              }
            </div>
          `;
        });

        formFields.innerHTML = html;
      }

      function collectFormData() {
        const formData = {};
        const inputs = formFields.querySelectorAll("input, select, textarea");
        inputs.forEach((input) => {
          formData[input.name] = input.value;
        });
        return formData;
      }

      // ============================================
      // GUARDAR (Modal)
      // ============================================
      async function handleSave(event) {
        event.preventDefault();
        const formData = collectFormData();

        const hasValue = Object.values(formData).some(
          (v) => v && v.trim() !== "",
        );
        if (!hasValue) {
          showToast("⚠️ Ingresa al menos un valor", "error");
          return;
        }

        try {
          if (state.isEditing && state.editRowIndex !== null) {
            await apiRequest(
              "update",
              state.currentTab,
              formData,
              state.editRowIndex,
            );
          } else {
            await apiRequest("create", state.currentTab, formData);
          }

          closeModal();
          await loadData(state.currentTab);
          showToast("✅ Registro guardado");
        } catch (error) {
          showToast(`❌ ${error.message}`, "error");
        }
      }

      // ============================================
      // ELIMINAR
      // ============================================
      async function deleteRow(index) {
        if (!confirm("⚠️ ¿Estás seguro de eliminar este registro?")) return;

        try {
          await apiRequest("delete", state.currentTab, null, index);
          await loadData(state.currentTab);
          showToast("🗑️ Registro eliminado");
        } catch (error) {
          showToast(`❌ ${error.message}`, "error");
        }
      }

      // ============================================
      // TOAST
      // ============================================
      function showToast(message, type = "success") {
        const existing = document.querySelector(".toast-notification");
        if (existing) existing.remove();

        const toast = document.createElement("div");
        toast.className = "toast-notification";
        toast.textContent = message;

        if (type === "error") {
          toast.style.color = "#e74c3c";
        }

        document.body.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transition = "opacity 0.3s ease";
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      // ============================================
      // MODAL CONTROLS
      // ============================================
      function closeModal() {
        modalOverlay.classList.remove("active");
      }

      // ============================================
      // INICIALIZACIÓN
      // ============================================
      function init() {
        try {
          console.log("🔍 Inicializando conexión a base de datos...");
          console.log(`📡 API URL: ${API_URL}`);

          if (API_URL.includes("TU_URL_AQUI")) {
            console.warn(
              "⚠️ Debes actualizar API_URL con la URL de tu implementación de Apps Script",
            );
            cardsContainer.innerHTML = `
              <div class="empty-state">
                <span class="icon">⚙️</span>
                <strong>Configuración pendiente</strong>
                <br><br>
                <div style="color: #666; font-size: 0.9rem; max-width: 500px; margin: 0 auto;">
                  Debes actualizar la variable <code>API_URL</code> con la URL de tu implementación de Google Apps Script.
                  <br><br>
                  <strong>Paso 1:</strong> Despliega tu Apps Script como aplicación web<br>
                  <strong>Paso 2:</strong> Copia la URL generada<br>
                  <strong>Paso 3:</strong> Reemplaza <code>TU_URL_AQUI</code> en el código
                </div>
              </div>
            `;
            return;
          }

          renderSidebar();
          loadData("ORDEN 1");

          btnAdd.addEventListener("click", openCreateModal);
          btnCancel.addEventListener("click", closeModal);
          modalClose.addEventListener("click", closeModal);
          modalForm.addEventListener("submit", handleSave);

          modalOverlay.addEventListener("click", (e) => {
            if (e.target === modalOverlay) closeModal();
          });
        } catch (error) {
          console.error("❌ Error:", error);
        }
      }

      // Exponer funciones globales
      window.openCreateModal = openCreateModal;
      window.openEditModal = openEditModal;
      window.deleteRow = deleteRow;
      window.loadData = loadData;
      window.closeModal = closeModal;
      window.init = init;
      window.startFieldEdit = startFieldEdit;
      window.cancelFieldEdit = cancelFieldEdit;
      window.saveFieldEdit = saveFieldEdit;
      window.showToast = showToast;

      // Iniciar
      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
