<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JCSSA004230 - SINERHIAS</title>
    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/img/favicon.ico" type="image/x-icon" />

    <style>
      /* ============================================
   RESET Y ESTILOS BASE
   ============================================ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        min-height: 100vh;
        background: #e0e5ec;
        padding: 16px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        overflow: hidden;
      }

      .container {
        width: 100%;
        max-width: 1440px;
        height: calc(100vh - 32px);
        max-height: calc(100vh - 32px);
        background: #e0e5ec;
        border-radius: 40px;
        padding: 24px 28px;
        box-shadow:
          9px 9px 16px rgba(163, 177, 198, 0.6),
          -9px -9px 16px rgba(255, 255, 255, 0.8);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ============================================
   HEADER
   ============================================ */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
        padding: 12px 24px;
        border-radius: 30px;
        background: #e0e5ec;
        box-shadow:
          inset 2px 2px 5px rgba(163, 177, 198, 0.6),
          inset -5px -5px 10px rgba(255, 255, 255, 0.7);
        flex-shrink: 0;
        flex-wrap: wrap;
      }

      .header h1 {
        font-size: 1.6rem;
        font-weight: 700;
        color: #2c3e50;
        letter-spacing: -0.5px;
        flex-shrink: 0;
      }

      .header-center {
        flex: 1;
        min-width: 200px;
        max-width: 600px;
        display: flex;
        justify-content: center;
      }

      .search-container {
        position: relative;
        width: 100%;
        display: flex;
        align-items: center;
        background: #e0e5ec;
        border-radius: 50px;
        padding: 0 16px;
        box-shadow:
          inset 3px 3px 8px rgba(163, 177, 198, 0.5),
          inset -3px -3px 8px rgba(255, 255, 255, 0.7);
        transition: all 0.3s ease;
      }

      .search-container:focus-within {
        box-shadow:
          inset 3px 3px 8px rgba(26, 115, 232, 0.15),
          inset -3px -3px 8px rgba(255, 255, 255, 0.8),
          0 0 0 2px rgba(26, 115, 232, 0.1);
      }

      .search-icon {
        font-size: 1rem;
        color: #7f8c8d;
        margin-right: 10px;
        flex-shrink: 0;
      }

      .search-input {
        flex: 1;
        padding: 10px 8px;
        border: none;
        background: transparent;
        font-size: 0.95rem;
        color: #2c3e50;
        outline: none;
        min-width: 100px;
        font-weight: 500;
      }

      .search-input::placeholder {
        color: #b0b8c8;
        font-weight: 400;
      }

      .search-clear {
        display: none;
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        background: #e0e5ec;
        color: #7f8c8d;
        font-size: 0.8rem;
        box-shadow:
          inset 2px 2px 4px rgba(163, 177, 198, 0.4),
          inset -2px -2px 4px rgba(255, 255, 255, 0.6);
        transition: all 0.2s ease;
        flex-shrink: 0;
        margin-left: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .search-clear.visible {
        display: flex;
      }

      .search-clear:hover {
        color: #e74c3c;
        transform: scale(1.05);
      }

      .search-results {
        font-size: 0.7rem;
        color: #7f8c8d;
        font-weight: 600;
        margin-left: 10px;
        white-space: nowrap;
        flex-shrink: 0;
        min-width: 40px;
        text-align: right;
      }

      .search-results.highlight {
        color: #1a73e8;
      }

      .header .badge {
        padding: 6px 16px;
        border-radius: 50px;
        background: #e0e5ec;
        box-shadow:
          3px 3px 6px rgba(163, 177, 198, 0.6),
          -3px -3px 6px rgba(255, 255, 255, 0.7);
        font-size: 0.8rem;
        color: #2c3e50;
        font-weight: 600;
        flex-shrink: 0;
      }

      /* ============================================
   MAIN LAYOUT
   ============================================ */
      .main-layout {
        display: flex;
        gap: 20px;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      /* ============================================
   SIDEBAR - BASE
   ============================================ */
      .sidebar {
        flex: 0 0 220px;
        min-width: 180px;
        background: #e0e5ec;
        border-radius: 30px;
        padding: 15px;
        box-shadow:
          inset 2px 2px 5px rgba(163, 177, 198, 0.5),
          inset -5px -5px 10px rgba(255, 255, 255, 0.7);
        overflow-y: auto;
        height: 100%;
        flex-shrink: 0;
      }

      .sidebar::-webkit-scrollbar {
        width: 4px;
      }

      .sidebar::-webkit-scrollbar-track {
        background: #e0e5ec;
        border-radius: 10px;
      }

      .sidebar::-webkit-scrollbar-thumb {
        background: #b0b8c8;
        border-radius: 10px;
      }

      .sidebar-title {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #7f8c8d;
        padding: 10px 12px 15px 12px;
        font-weight: 700;
        border-bottom: 2px solid rgba(163, 177, 198, 0.2);
        margin-bottom: 10px;
      }

      .sidebar .tab-btn {
        display: block;
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-radius: 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2c3e50;
        cursor: pointer;
        transition: all 0.3s ease;
        background: #e0e5ec;
        box-shadow:
          3px 3px 6px rgba(163, 177, 198, 0.6),
          -3px -3px 6px rgba(255, 255, 255, 0.7);
        margin-bottom: 10px;
        text-align: left;
        white-space: normal; /* ← CAMBIADO: nowrap → normal */
        overflow: visible; /* ← CAMBIADO: hidden → visible */
        text-overflow: clip; /* ← CAMBIADO: ellipsis → clip */
        word-wrap: break-word; /* ← NUEVO: permite saltos de línea */
        line-height: 1.3;
        min-height: 36px;
      }

      .sidebar .tab-btn:hover {
        transform: translateX(4px);
        box-shadow:
          5px 5px 10px rgba(163, 177, 198, 0.7),
          -5px -5px 10px rgba(255, 255, 255, 0.8);
      }

      .sidebar .tab-btn.active {
        background: #e0e5ec;
        box-shadow:
          inset 3px 3px 6px rgba(163, 177, 198, 0.6),
          inset -3px -3px 6px rgba(255, 255, 255, 0.7);
        color: #1a73e8;
      }

      .sidebar .tab-btn .tab-number {
        display: inline-block;
        width: 20px;
        height: 20px;
        line-height: 20px;
        text-align: center;
        border-radius: 50%;
        font-size: 0.6rem;
        font-weight: 700;
        margin-right: 6px;
        background: #e0e5ec;
        box-shadow:
          inset 1px 1px 3px rgba(163, 177, 198, 0.5),
          inset -1px -1px 3px rgba(255, 255, 255, 0.7);
      }

      .sidebar .tab-btn.active .tab-number {
        background: #1a73e8;
        color: white;
        box-shadow: none;
      }

      /* ============================================
   SIDEBAR - SCROLL HORIZONTAL EN MÓVILES
   ============================================ */
      @media (max-width: 992px) {
        .sidebar {
          flex: 0 0 auto;
          width: 100%;
          max-height: 60px;
          min-height: unset;
          height: auto;
          display: flex;
          flex-wrap: nowrap;
          overflow-x: auto;
          overflow-y: hidden;
          gap: 8px;
          padding: 10px 14px;
          align-items: center;
          scrollbar-width: thin;
          -webkit-overflow-scrolling: touch;
        }

        .sidebar-title {
          display: none;
        }

        .sidebar .tab-btn {
          flex: 0 0 auto;
          width: auto;
          padding: 6px 16px;
          font-size: 0.75rem;
          margin-bottom: 0;
          white-space: nowrap;
          border-radius: 20px;
          overflow: visible;
          text-overflow: clip;
          min-width: 80px;
          text-align: center;
        }

        .sidebar .tab-btn .tab-number {
          width: 20px;
          height: 20px;
          line-height: 20px;
          font-size: 0.6rem;
          margin-right: 6px;
        }

        .sidebar .tab-btn.active {
          min-width: 120px;
          padding: 6px 20px;
          font-size: 0.8rem;
          background: #e0e5ec;
          box-shadow:
            inset 3px 3px 6px rgba(163, 177, 198, 0.6),
            inset -3px -3px 6px rgba(255, 255, 255, 0.7);
          color: #1a73e8;
        }

        .sidebar .tab-btn.active .tab-number {
          background: #1a73e8;
          color: white;
          box-shadow: none;
        }

        .sidebar::-webkit-scrollbar {
          height: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb {
          background: #b0b8c8;
          border-radius: 10px;
        }

        .sidebar::-webkit-scrollbar-track {
          background: transparent;
        }
      }

      @media (max-width: 480px) {
        .sidebar {
          max-height: 50px;
          padding: 6px 10px;
          gap: 6px;
        }

        .sidebar .tab-btn {
          padding: 4px 12px;
          font-size: 0.65rem;
          min-width: 60px;
        }

        .sidebar .tab-btn.active {
          min-width: 100px;
          padding: 5px 16px;
          font-size: 0.75rem;
        }

        .sidebar .tab-btn .tab-number {
          width: 18px;
          height: 18px;
          line-height: 18px;
          font-size: 0.55rem;
          margin-right: 4px;
        }
      }

      @media (max-width: 380px) {
        .sidebar {
          max-height: 44px;
          padding: 4px 8px;
          gap: 4px;
        }

        .sidebar .tab-btn {
          padding: 3px 10px;
          font-size: 0.6rem;
          min-width: 50px;
        }

        .sidebar .tab-btn.active {
          min-width: 80px;
          padding: 4px 14px;
          font-size: 0.7rem;
        }

        .sidebar .tab-btn .tab-number {
          width: 16px;
          height: 16px;
          line-height: 16px;
          font-size: 0.5rem;
          margin-right: 3px;
        }
      }

      /* ============================================
   CONTENT AREA
   ============================================ */
      .content-area {
        flex: 1;
        min-width: 0;
        background: #e0e5ec;
        border-radius: 30px;
        padding: 20px 24px;
        box-shadow:
          inset 3px 3px 8px rgba(163, 177, 198, 0.5),
          inset -3px -3px 8px rgba(255, 255, 255, 0.7);
        min-height: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ============================================
   TOOLBAR
   ============================================ */
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        flex-wrap: wrap;
        gap: 12px;
        padding: 0 4px;
        width: 100%;
        flex-shrink: 0;
      }

      .toolbar .info {
        font-size: 0.95rem;
        color: #34495e;
        font-weight: 500;
        padding: 8px 16px;
        border-radius: 16px;
        background: #e0e5ec;
        box-shadow:
          inset 2px 2px 4px rgba(163, 177, 198, 0.4),
          inset -2px -2px 4px rgba(255, 255, 255, 0.6);
      }

      .toolbar .info span {
        font-weight: 700;
        color: #1a73e8;
      }

      /* ============================================
   TABLA WRAPPER
   ============================================ */
      .table-wrapper {
        width: 100%;
        border-radius: 20px;
        background: transparent;
        padding: 0;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
      }

      .table-wrapper::-webkit-scrollbar {
        width: 6px;
      }

      .table-wrapper::-webkit-scrollbar-track {
        background: #e0e5ec;
        border-radius: 10px;
      }

      .table-wrapper::-webkit-scrollbar-thumb {
        background: #b0b8c8;
        border-radius: 10px;
      }

      .table-wrapper::-webkit-scrollbar-thumb:hover {
        background: #9aa3b5;
      }

      #cardsContainer {
        width: 100%;
        min-height: 100%;
      }

      /* ============================================
   CARDS GRID - 1 SOLA COLUMNA
   ============================================ */
      .cards-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        padding: 4px 0 8px 0;
        width: 100%;
      }

      /* ============================================
   CARD ITEM
   ============================================ */
      .card-item {
        background: #e0e5ec;
        border-radius: 24px;
        padding: 18px 22px 16px 22px;
        box-shadow:
          8px 8px 16px rgba(163, 177, 198, 0.6),
          -8px -8px 16px rgba(255, 255, 255, 0.7);
        transition: all 0.3s ease;
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
      }

      .card-item:hover {
        transform: translateY(-2px);
        box-shadow:
          10px 10px 20px rgba(163, 177, 198, 0.7),
          -10px -10px 20px rgba(255, 255, 255, 0.8);
      }

      .card-header {
        display: none !important;
      }

      /* ============================================
   CARD BODY - 4 COLUMNAS
   ============================================ */
      .card-body {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        flex: 1;
        align-content: start;
        width: 100%;
      }

      .card-body .card-field:last-child:nth-child(4n + 1) {
        grid-column: 1 / -1;
      }

      .card-body .card-field:last-child:nth-child(4n + 2) {
        grid-column: 2 / -1;
      }

      .card-body .card-field:last-child:nth-child(4n + 3) {
        grid-column: 3 / -1;
      }

      @media (min-width: 768px) and (max-width: 1199px) {
        .card-body {
          grid-template-columns: 1fr 1fr;
          gap: 8px;
        }
        .card-body .card-field:last-child:nth-child(odd) {
          grid-column: 1 / -1;
        }
      }

      @media (max-width: 767px) {
        .card-body {
          grid-template-columns: 1fr;
          gap: 6px;
        }
      }

      /* ============================================
   CARD FIELD - SIN SOMBRAS INSET (ESTILO MODERNO)
   ============================================ */
      .card-field {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        padding: 8px 12px;
        border-radius: 12px;
        background: #e0e5ec;
        box-shadow:
          3px 3px 6px rgba(163, 177, 198, 0.4),
          -3px -3px 6px rgba(255, 255, 255, 0.6);
        /* ← SOMBRA EXTERNA, no inset */
        transition: all 0.3s ease;
        cursor: pointer;
        min-height: 44px;
        border-left: 2px solid transparent;
        width: 100%;
        overflow: hidden;
        position: relative;
      }

      .card-field:hover {
        box-shadow:
          4px 4px 10px rgba(26, 115, 232, 0.12),
          4px 4px 8px rgba(163, 177, 198, 0.4),
          -4px -4px 8px rgba(255, 255, 255, 0.6);
        background: rgba(26, 115, 232, 0.02);
        border-left-color: rgba(26, 115, 232, 0.3);
      }

      .card-field.editing {
        box-shadow:
          0 0 0 2px rgba(26, 115, 232, 0.2),
          4px 4px 12px rgba(26, 115, 232, 0.08),
          4px 4px 8px rgba(163, 177, 198, 0.4),
          -4px -4px 8px rgba(255, 255, 255, 0.6);
        background: rgba(26, 115, 232, 0.03);
        border-left-color: #1a73e8;
        border-left-width: 3px;
        grid-column: 1 / -1 !important;
        transform: scale(1.01);
        transition: all 0.3s ease;
      }

      /* ============================================
   BOTONES EN LADOS OPUESTOS
   ============================================ */
      .card-field .field-actions {
        display: flex;
        gap: 8px;
        width: 100%;
        justify-content: space-between; /* ← LADOS OPUESTOS */
        margin-top: 6px;
        padding-top: 4px;
        border-top: 1px solid rgba(163, 177, 198, 0.15);
      }

      .card-field .field-actions .btn-group-left {
        display: flex;
        gap: 6px;
      }

      .card-field .field-actions .btn-group-right {
        display: flex;
        gap: 6px;
      }

      .card-field .save-btn {
        padding: 5px 16px;
        border: none;
        border-radius: 20px;
        font-size: 0.7rem;
        font-weight: 700;
        cursor: pointer;
        background: #1a73e8;
        color: white;
        box-shadow:
          2px 2px 6px rgba(26, 115, 232, 0.3),
          -2px -2px 6px rgba(255, 255, 255, 0.5);
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .card-field .save-btn:hover {
        transform: translateY(-2px);
        box-shadow:
          4px 4px 10px rgba(26, 115, 232, 0.4),
          -4px -4px 10px rgba(255, 255, 255, 0.6);
      }

      .card-field .save-btn:active {
        transform: scale(0.95);
      }

      .card-field .cancel-btn {
        padding: 5px 16px;
        border: none;
        border-radius: 20px;
        font-size: 0.7rem;
        font-weight: 700;
        cursor: pointer;
        background: #e0e5ec;
        color: #7f8c8d;
        box-shadow:
          2px 2px 6px rgba(163, 177, 198, 0.4),
          -2px -2px 6px rgba(255, 255, 255, 0.6);
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .card-field .cancel-btn:hover {
        color: #e74c3c;
        box-shadow:
          3px 3px 8px rgba(231, 76, 60, 0.15),
          3px 3px 8px rgba(163, 177, 198, 0.4),
          -3px -3px 8px rgba(255, 255, 255, 0.6);
      }

      .card-field .cancel-btn:active {
        transform: scale(0.95);
      }

      /* ============================================
   CARD FIELD - LABEL Y VALUE CON DIFERENCIACIÓN
   ============================================ */
      .card-field .field-label {
        font-size: 0.85rem !important;
        font-weight: 700 !important;
        color: #917250 !important;
        letter-spacing: 0.6px !important;
        padding: 0 !important;
        line-height: 1.2 !important;
        width: 100% !important;
        opacity: 0.85 !important;
        display: block !important;
        margin-bottom: 2px !important;
      }

      .card-field .field-value {
        font-size: 0.95rem !important;
        color: #1a1a1a !important;
        font-weight: 600 !important;
        word-break: break-word !important;
        padding: 0 !important;
        line-height: 1.3 !important;
        width: 100% !important;
        display: block !important;
      }

      .card-field .field-value.empty {
        color: #b0b8c8 !important;
        font-style: italic !important;
        font-weight: 400 !important;
      }

      /* Estilo específico para cuando el campo está en modo edición */
      .card-field.editing .field-label {
        color: #1a73e8 !important;
      }

      /* Asegurar que el valor no herede estilos no deseados */
      .card-field .field-value,
      .card-field .field-value * {
        font-size: inherit !important;
        font-weight: inherit !important;
        color: inherit !important;
      }

      /* Ajustes para móviles pequeños */
      @media (max-width: 480px) {
        .card-field .field-label {
          font-size: 0.55rem !important;
        }
        .card-field .field-value {
          font-size: 0.85rem !important;
        }
      }

      /* ============================================
   NÚMERO DE ORDEN ANARANJADO EN CADA CAMPO
   ============================================ */
      .card-field .order-number {
        position: absolute;
        top: 2px;
        right: 8px;
        font-size: 1.8rem;
        font-weight: 900;
        color: #e67e22; /* NARANJA */
        opacity: 0.25;
        pointer-events: none;
        user-select: none;
        line-height: 1;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        z-index: 0;
      }

      /* El contenido del card-field debe estar por encima */
      .card-field .field-label,
      .card-field .field-value,
      .card-field .field-input,
      .card-field .field-actions {
        position: relative;
        z-index: 1;
      }

      /* ============================================
   ELIMINA EL ESTILO ANTERIOR DE card-item-number
   ============================================ */
      /* .card-item-number ya no se usa, se eliminó */

      @media (max-width: 768px) {
        .card-field .order-number {
          font-size: 1.4rem;
          top: 2px;
          right: 6px;
          opacity: 0.3;
        }
      }

      @media (max-width: 480px) {
        .card-field .order-number {
          font-size: 1.1rem;
          top: 1px;
          right: 4px;
          opacity: 0.35;
        }
      }

      /* ============================================
   RESULTADOS DE BÚSQUEDA - LISTA
   ============================================ */
      .search-results-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        margin-bottom: 12px;
        border-radius: 16px;
        background: #e0e5ec;
        box-shadow:
          inset 2px 2px 4px rgba(163, 177, 198, 0.4),
          inset -2px -2px 4px rgba(255, 255, 255, 0.6);
        font-weight: 600;
        color: #2c3e50;
      }

      .search-result-count {
        font-size: 0.8rem;
        color: #7f8c8d;
        background: #e0e5ec;
        padding: 4px 14px;
        border-radius: 20px;
        box-shadow:
          inset 2px 2px 4px rgba(163, 177, 198, 0.5),
          inset -2px -2px 4px rgba(255, 255, 255, 0.7);
      }

      .search-results-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 4px 0 12px 0;
      }

      .search-result-item {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 14px 20px;
        border-radius: 16px;

    <script>
      // ============================================
      // CONFIGURACIÓN - ACTUALIZA CON TU URL
      // ============================================
      const API_URL =
        "https://script.google.com/macros/s/AKfycbxeXenJi19X4_-RdH2_XrRGqOAUI5ZSCU5f0x7l6g6oCU70Ob7OBo26cnD-2EbPOYqG/exec";

      // ============================================
      // DEFINICIÓN DE PESTAÑAS
      // ============================================
      const TABS = [
        { id: "ORDEN 1", label: "Orden 1, Datos Generales" },
        { id: "ORDEN 11-1", label: "Orden 11-1 Recursos Humanos" },
        { id: "ORDEN 11-2", label: "Orden 11-2 Recursos Humanos" },
        { id: "ORDEN 11-3", label: "Orden 11-3 Recursos Humanos" },
        { id: "ORDEN 2-2", label: "Orden 2-2 Areas de Servicios Médicos" },
        { id: "ORDEN 2-3", label: "Orden 2-3 Areas de Servicios Médicos" },
        { id: "ORDEN 3", label: "Orden 3 Areas de Servicios de Apoyo" },
        { id: "ORDEN 4", label: "Orden 4 Servicios Generales" },
        { id: "ORDEN 5", label: "Orden 5 Areas Administrativas y Directivas" },
        { id: "ORDEN 6", label: "Orden 6 Areas de Enseñanza" },
        { id: "ORDEN 7", label: "Orden 7, Areas de Investigacion" },
      ];

      // ============================================
      // ESTADO GLOBAL
      // ============================================
      let state = {
        currentTab: "ORDEN 1",
        data: [],
        headers: [],
        isLoading: false,
        editingFields: {},
      };

      // ============================================
      // CACHE PARA TODAS LAS SECCIONES
      // ============================================
      let allDataCache = {};
      let isLoadingAll = false;

      // ============================================
      // DOM REFERENCIAS
      // ============================================
      const sidebarContainer = document.getElementById("sidebarContainer");
      const cardsContainer = document.getElementById("cardsContainer");
      const sheetNameDisplay = document.getElementById("sheetNameDisplay");
      const rowCountDisplay = document.getElementById("rowCountDisplay");
      const statusText = document.getElementById("statusText");

      // Modal pequeño
      const fieldModalOverlay = document.getElementById("fieldModalOverlay");
      const fieldModalTitle = document.getElementById("fieldModalTitle");
      const fieldModalLabel = document.getElementById("fieldModalLabel");
      const fieldModalInput = document.getElementById("fieldModalInput");
      const fieldModalForm = document.getElementById("fieldModalForm");
      const fieldModalClose = document.getElementById("fieldModalClose");
      const fieldModalCancel = document.getElementById("fieldModalCancel");
      const fieldModalSave = document.getElementById("fieldModalSave");

      let fieldModalData = {
        sheetId: null,
        index: null,
        header: null,
        currentValue: null,
      };

      // ============================================
      // API - CONEXIÓN REAL A BASE DE DATOS
      // ============================================
      function apiRequest(action, sheet, data = null, rowIndex = null) {
        return new Promise((resolve, reject) => {
          statusText.textContent = "⏳ Cargando...";

          if (action === "read") {
            const callbackName =
              "callback_" +
              Date.now() +
              "_" +
              Math.random().toString(36).substr(2, 9);
            const script = document.createElement("script");
            const url = `${API_URL}?action=${action}&sheet=${encodeURIComponent(sheet)}&callback=${callbackName}&_=${Date.now()}`;

            let resolved = false;

            window[callbackName] = function (result) {
              if (resolved) return;
              resolved = true;
              delete window[callbackName];
              if (document.body.contains(script))
                document.body.removeChild(script);
              statusText.textContent = "✅ Conectado";

              if (result.success === false || result.error) {
                reject(new Error(result.error || "Error en la operación"));
              } else {
                resolve(result);
              }
            };

            script.src = url;
            script.onerror = function () {
              if (resolved) return;
              resolved = true;
              delete window[callbackName];
              if (document.body.contains(script))
                document.body.removeChild(script);
              statusText.textContent = "❌ Error";
              reject(new Error("Error de conexión con el servidor"));
            };

            const timeout = setTimeout(() => {
              if (resolved) return;
              resolved = true;
              delete window[callbackName];
              if (document.body.contains(script))
                document.body.removeChild(script);
              statusText.textContent = "⏰ Timeout";
              reject(new Error("Timeout: El servidor no responde"));
            }, 30000);

            const originalCallback = window[callbackName];
            window[callbackName] = function (result) {
              clearTimeout(timeout);
              originalCallback(result);
            };

            document.body.appendChild(script);
            return;
          }

          // POST requests
          if (
            action === "create" ||
            action === "update" ||
            action === "delete"
          ) {
            const params = new URLSearchParams({ action, sheet });
            if (rowIndex !== null) params.append("rowIndex", rowIndex);

            fetch(`${API_URL}?${params.toString()}`, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            })
              .then(() => {
                statusText.textContent = "✅ Conectado";
                resolve({ success: true, message: "Operación completada" });
              })
              .catch((error) => {
                statusText.textContent = "❌ Error";
                reject(new Error(error.message));
              });
            return;
          }

          reject(new Error("Acción no válida"));
        });
      }

      // ============================================
      // CARGAR TODAS LAS SECCIONES AL INICIO
      // ============================================
      async function loadAllSections() {
        if (isLoadingAll) return;
        isLoadingAll = true;

        console.log("📦 Cargando todas las secciones...");
        statusText.textContent = "⏳ Cargando todas las secciones...";

        cardsContainer.innerHTML = `

            <br><br>
            Cargando todas las secciones...
            <br>
            <small style="color: #95a5a6; font-size: 0.8rem;">Esto puede tomar unos segundos</small>
          </div>
        `;

        const promises = TABS.map(async (tab) => {
          try {
            const result = await apiRequest("read", tab.id);
            allDataCache[tab.id] = {
              data: result.data || [],
              headers: result.headers || [],
            };
            console.log(
              `✅ ${tab.label}: ${allDataCache[tab.id].data.length} registros`,
            );
            return { success: true, tab: tab.id };
          } catch (error) {
            console.warn(`❌ Error en ${tab.label}:`, error);
            allDataCache[tab.id] = { data: [], headers: [] };
            return { success: false, tab: tab.id };
          }
        });

        await Promise.all(promises);

        isLoadingAll = false;
        statusText.textContent = "✅ Conectado";
        console.log("📦 ¡Todas las secciones cargadas!");

        let totalRegistros = 0;
        for (const tab of TABS) {
          totalRegistros += allDataCache[tab.id]?.data?.length || 0;
        }
        console.log(
          `📊 Total: ${totalRegistros} registros en ${TABS.length} secciones`,
        );
      }

      // ============================================
      // CARGAR DATOS DESDE LA BASE DE DATOS
      // ============================================
      async function loadData(sheetName) {
        if (state.isLoading) return;
        state.isLoading = true;
        state.editingFields = {};
        cardsContainer.innerHTML =
          '<div class="loading">Cargando datos...</div>';

        try {
          let result;
          if (allDataCache[sheetName]) {
            result = allDataCache[sheetName];
          } else {
            result = await apiRequest("read", sheetName);
            allDataCache[sheetName] = {
              data: result.data || [],
              headers: result.headers || [],
            };
          }

          if (!result.data || result.data.length === 0) {
            cardsContainer.innerHTML = `
              <div class="empty-state">
                <span class="icon">📭</span>
                No hay registros en esta hoja
              </div>
            `;
            state.data = [];
            state.headers = [];
          } else {
            state.data = result.data;
            state.headers = result.headers || Object.keys(result.data[0] || {});
          }

          state.currentTab = sheetName;
          const tabLabel =
            TABS.find((t) => t.id === sheetName)?.label || sheetName;
          const columnCount = state.headers.length;
          const rowCount = state.data.length;

          sheetNameDisplay.textContent = tabLabel;
          rowCountDisplay.textContent = `${rowCount} registros · ${columnCount} columnas`;

          if (state.data.length > 0) {
            renderCards();
          }
          updateActiveTab(sheetName);
        } catch (error) {
          console.error("Error loading data:", error);
          cardsContainer.innerHTML = `
            <div class="empty-state">
              <span class="icon">⚠️</span>
              <strong>Error al cargar datos</strong>
              <br><br>
              <div style="color: #666; font-size: 0.9rem; max-width: 500px; margin: 0 auto;">
                ${error.message}
              </div>
              <br>
              <button class="btn-neo" onclick="loadData('${sheetName}')">🔄 Reintentar</button>
            </div>
          `;
        } finally {
          state.isLoading = false;
        }
      }

      // ============================================
      // RENDER CARDS
      // ============================================
      function renderCards() {
        if (state.data.length === 0) {
          cardsContainer.innerHTML = `
      <div class="empty-state">
        <span class="icon">📭</span>
        No hay registros
      </div>
    `;
          return;
        }

        const columnCount = state.headers.length;
        const rowCount = state.data.length;
        const tabLabel =
          TABS.find((t) => t.id === state.currentTab)?.label ||
          state.currentTab;

        sheetNameDisplay.textContent = tabLabel;
        rowCountDisplay.textContent = `${rowCount} registros · ${columnCount} columnas`;

        let html = '<div class="cards-grid">';

        let globalFieldCounter = 0;

        state.data.forEach((row, rowIndex) => {
          html += `
      <div class="card-item" data-row="${rowIndex}">
        <div class="card-body">
    `;

          state.headers.forEach((header) => {
            globalFieldCounter++;
            const fieldNumber = globalFieldCounter;

            const value = row[header] || "";
            const fieldId = `field_${rowIndex}_${header.replace(/\s+/g, "_")}`;
            const isEditing =
              state.editingFields[`${rowIndex}_${header}`] || false;

            html += `
        <div class="card-field ${isEditing ? "editing" : ""}" 
             data-row="${rowIndex}" 
             data-header="${header}"
             onclick="if(!this.classList.contains('editing')) startFieldEdit(${rowIndex}, '${header}')">
          <span class="order-number">${fieldNumber}</span>
          <span class="field-label">${header}</span>
      `;

            // En la función renderCards(), reemplaza esta parte:
            if (isEditing) {
              html += `
    <input class="field-input" id="${fieldId}" type="text" value="${value}" 
           data-row="${rowIndex}" data-header="${header}" 
           onkeydown="if(event.key==='Enter') saveFieldEdit(${rowIndex}, '${header}')" />
    <div class="field-actions">
      <div class="btn-group-left">
        <button class="cancel-btn" onclick="event.stopPropagation(); cancelFieldEdit(${rowIndex}, '${header}')">
          <span>✕</span> Cancelar
        </button>
      </div>
      <div class="btn-group-right">
        <button class="save-btn" onclick="event.stopPropagation(); saveFieldEdit(${rowIndex}, '${header}')">
          <span>✓</span> Guardar
        </button>
      </div>
    </div>
  `;
            } else {
              // Asegurar que el valor se muestre correctamente
              const displayValue = value || "—";
              html += `
    <span class="field-value ${value ? "" : "empty"}">${displayValue}</span>
  `;
            }

            html += `</div>`;
          });

          html += `
        </div>
      </div>
    `;
        });

        html += "</div>";
        cardsContainer.innerHTML = html;
      }

      // ============================================
      // EDICIÓN DE CAMPO INDIVIDUAL (en línea)
      // ============================================
      function startFieldEdit(rowIndex, header) {
        state.editingFields[`${rowIndex}_${header}`] = true;
        renderCards();
        setTimeout(() => {
          const input = document.querySelector(
            `input[data-row="${rowIndex}"][data-header="${header}"]`,
          );
          if (input) input.focus();
        }, 50);
      }

      function cancelFieldEdit(rowIndex, header) {
        delete state.editingFields[`${rowIndex}_${header}`];
        renderCards();
      }

      async function saveFieldEdit(rowIndex, header) {
        const fieldId = `field_${rowIndex}_${header.replace(/\s+/g, "_")}`;
        const input = document.getElementById(fieldId);
        if (!input) return;

        const newValue = input.value;
        const oldValue = state.data[rowIndex][header] || "";

        if (newValue === oldValue) {
          delete state.editingFields[`${rowIndex}_${header}`];
          renderCards();
          return;
        }

        state.data[rowIndex][header] = newValue;

        try {
          await apiRequest(
            "update",
            state.currentTab,
            state.data[rowIndex],
            rowIndex,
          );
          delete state.editingFields[`${rowIndex}_${header}`];
          renderCards();
          showToast(`✅ Campo "${header}" actualizado`);
        } catch (error) {
          state.data[rowIndex][header] = oldValue;
          renderCards();
          showToast(`❌ ${error.message}`, "error");
        }
      }

      // ============================================
      // MODAL PEQUEÑO - ABRIR, CERRAR, GUARDAR
      // ============================================
      function openFieldModal(sheetId, index, header) {
        fieldModalData.sheetId = sheetId;
        fieldModalData.index = index;
        fieldModalData.header = header;

        const cached = allDataCache[sheetId];
        if (cached && cached.data && cached.data[index]) {
          const currentValue = cached.data[index][header] || "";
          fieldModalData.currentValue = currentValue;
          fieldModalLabel.textContent = header;
          fieldModalInput.value = currentValue;
          fieldModalTitle.textContent = `✏️ Editar "${header}"`;

          // Mostrar el valor actual en el modal
          const currentValueDisplay = document.getElementById(
            "currentValueDisplay",
          );
          if (currentValueDisplay) {
            currentValueDisplay.innerHTML = `<strong>Valor actual:</strong> ${currentValue || "—"}`;
          }
        }

        fieldModalOverlay.classList.add("active");
        setTimeout(() => fieldModalInput.focus(), 100);
        fieldModalInput.select();
      }

      function closeFieldModal() {
        fieldModalOverlay.classList.remove("active");
        fieldModalData = {
          sheetId: null,
          index: null,
          header: null,
          currentValue: null,
        };
      }

      async function saveFieldFromModal(event) {
        event.preventDefault();

        const newValue = fieldModalInput.value.trim();
        const { sheetId, index, header, currentValue } = fieldModalData;

        if (newValue === currentValue) {
          closeFieldModal();
          return;
        }

        if (!newValue) {
          showToast("⚠️ El campo no puede estar vacío", "error");
          return;
        }

        try {
          // Actualizar en caché
          if (allDataCache[sheetId] && allDataCache[sheetId].data[index]) {
            allDataCache[sheetId].data[index][header] = newValue;
          }

          // Si es la sección actual, actualizar state.data
          if (state.currentTab === sheetId && state.data[index]) {
            state.data[index][header] = newValue;
          }

          // Guardar en API
          const rowData = allDataCache[sheetId].data[index];
          await apiRequest("update", sheetId, rowData, index);

          closeFieldModal();
          showToast(`✅ "${header}" actualizado correctamente`);

          if (state.currentTab === sheetId) {
            renderCards();
          }
        } catch (error) {
          showToast(`❌ ${error.message}`, "error");
        }
      }

      // ============================================
      // SIDEBAR
      // ============================================
      function renderSidebar() {
        const title =
          sidebarContainer.querySelector(".sidebar-title") ||
          document.createElement("div");
        title.className = "sidebar-title";
        title.textContent = "📋 Secciones";
        sidebarContainer.innerHTML = "";
        sidebarContainer.appendChild(title);

        TABS.forEach((tab, index) => {
          const btn = document.createElement("button");
          btn.className = `tab-btn ${tab.id === state.currentTab ? "active" : ""}`;
          btn.innerHTML = `<span class="tab-number">${index + 1}</span> ${tab.label}`;
          btn.dataset.sheet = tab.id;
          btn.addEventListener("click", () => {
            document
              .querySelectorAll(".sidebar .tab-btn")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            loadData(tab.id);
          });
          sidebarContainer.appendChild(btn);
        });
      }

      function updateActiveTab(sheetName) {
        document.querySelectorAll(".sidebar .tab-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.sheet === sheetName);
        });
      }

      // ============================================
      // TOAST
      // ============================================
      function showToast(message, type = "success") {
        const existing = document.querySelector(".toast-notification");
        if (existing) existing.remove();

        const toast = document.createElement("div");
        toast.className = "toast-notification";
        toast.textContent = message;

        if (type === "error") {
          toast.style.color = "#e74c3c";
        }

        document.body.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transition = "opacity 0.3s ease";
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      // ============================================
      // BUSCADOR - RENDERIZAR RESULTADOS
      // ============================================
      function renderSearchResults(results) {
        if (results.length === 0) {
          cardsContainer.innerHTML = `
            <div class="empty-state">
              <span class="icon">🔍</span>
              <strong>No se encontraron resultados</strong>
              <br><br>
              <div style="color: #666; font-size: 0.9rem;">
                No hay headers que coincidan con "<strong>${searchTerm}</strong>"
              </div>
              <br>
              <button class="btn-neo" onclick="clearSearch()" style="display:inline-flex !important;">
                🧹 Limpiar búsqueda
              </button>
            </div>
          `;
          return;
        }

        let html = `
          <div class="search-results-header">
            <span>🔍 Headers encontrados</span>
            <span class="search-result-count">${results.length} coincidencias</span>
          </div>
          <div class="search-results-list">
        `;

        results.forEach((result) => {
          const row = result.row;
          const sheetLabel = result.sheetLabel;
          const matchedFields = result.matchedFields;
          const header = matchedFields[0]?.header;

          const summary = matchedFields
            .map(
              (f) =>
                `<span class="search-match-field">📌 ${f.header}: <strong>${highlightText(f.header, searchTerm)}</strong></span>`,
            )
            .join(" ");

          const resultHeaders = Object.keys(row);

          html += `
            <div class="search-result-item" onclick="openSearchResult('${result.sheet}', 0, '${header}')">
              <div class="search-result-number">📋</div>
              <div class="search-result-content">
                <div class="search-result-sheet">📂 ${sheetLabel}</div>
                <div class="search-result-summary">${summary}</div>
                <div class="search-result-preview">
                  ${resultHeaders
                    .slice(0, 3)
                    .map(
                      (h) =>
                        `<span class="search-result-preview-item">${h}: ${row[h] || "—"}</span>`,
                    )
                    .join(" ")}
                  ${resultHeaders.length > 3 ? `<span class="search-result-more">+${resultHeaders.length - 3} más</span>` : ""}
                </div>
              </div>
              <div class="search-result-action">✏️ Editar campo</div>
            </div>
          `;
        });

        html += `
          </div>
          <div class="search-results-footer">
            <button class="btn-neo" onclick="clearSearch()" style="display:inline-flex !important;">
              🧹 Limpiar búsqueda
            </button>
            <button class="btn-neo primary" onclick="showAllResults()" style="display:inline-flex !important;">
              📋 Mostrar todos
            </button>
          </div>
        `;

        cardsContainer.innerHTML = html;
      }

      // ============================================
      // FUNCIÓN PRINCIPAL DE BÚSQUEDA - BUSCA EN HEADERS
      // ============================================
      let searchTimeout = null;
      let searchTerm = "";
      let searchResultsData = [];

      function performSearch(query) {
        searchTerm = query.trim().toLowerCase();
        const searchClear = document.getElementById("searchClear");
        const searchResults = document.getElementById("searchResults");

        if (searchTerm.length > 0) {
          searchClear.classList.add("visible");
        } else {
          searchClear.classList.remove("visible");
        }

        if (searchTerm.length === 0) {
          searchResults.textContent = "";
          searchResults.classList.remove("highlight");
          searchResultsData = [];
          renderCards();
          return;
        }

        console.log(`🔍 Buscando headers que contengan: "${searchTerm}"`);

        const allResults = [];

        for (const tab of TABS) {
          const cached = allDataCache[tab.id];
          if (!cached || !cached.headers || cached.headers.length === 0) {
            console.log(`⚠️ ${tab.label}: sin headers en caché`);
            continue;
          }

          const headers = cached.headers;
          const data = cached.data || [];

          console.log(
            `🔎 Buscando en headers de ${tab.label} (${headers.length} headers)`,
          );

          headers.forEach((header) => {
            if (header.toLowerCase().includes(searchTerm)) {
              console.log(
                `  ✅ Encontrado header en ${tab.label}: "${header}"`,
              );

              const sampleRow = data.length > 0 ? data[0] : {};
              allResults.push({
                sheet: tab.id,
                sheetLabel: tab.label,
                index: 0,
                row: sampleRow,
                matchedFields: [
                  {
                    header: header,
                    value: "HEADER",
                    match: header,
                  },
                ],
                headerMatch: true,
              });
            }
          });
        }

        console.log(`📊 Resultados: ${allResults.length} coincidencias`);

        searchResultsData = allResults;
        const total = allResults.length;
        searchResults.textContent = total > 0 ? `${total} encontrados` : "0";
        searchResults.classList.toggle("highlight", total > 0);

        renderSearchResults(allResults);
      }

      // ============================================
      // CONFIGURAR BÚSQUEDA (EVENTOS)
      // ============================================
      function setupSearch() {
        const searchInput = document.getElementById("searchInput");
        const searchClear = document.getElementById("searchClear");
        const searchResults = document.getElementById("searchResults");

        searchInput.addEventListener("input", function () {
          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(() => {
            performSearch(this.value);
          }, 300);
        });

        searchClear.addEventListener("click", function () {
          searchInput.value = "";
          searchClear.classList.remove("visible");
          searchResults.textContent = "";
          searchResults.classList.remove("highlight");
          searchResultsData = [];
          searchTerm = "";
          renderCards();
          searchInput.focus();
        });

        document.addEventListener("keydown", function (e) {
          if ((e.ctrlKey || e.metaKey) && e.key === "f") {
            e.preventDefault();
            searchInput.focus();
            searchInput.select();
          }
        });

        searchInput.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            this.value = "";
            searchClear.classList.remove("visible");
            searchResults.textContent = "";
            searchResults.classList.remove("highlight");
            searchResultsData = [];
            searchTerm = "";
            renderCards();
            this.blur();
          }
        });
      }

      // ============================================
      // ABRIR RESULTADO - SOLO MODAL PEQUEÑO
      // ============================================
      function openSearchResult(sheetId, index, header) {
        const tab = TABS.find((t) => t.id === sheetId);
        if (tab && header) {
          // Abrir el modal pequeño para editar el campo específico
          openFieldModal(sheetId, index, header);
          clearSearch();
        } else {
          showToast("⚠️ No se pudo abrir el campo", "error");
        }
      }

      // ============================================
      // LIMPIAR BÚSQUEDA
      // ============================================
      function clearSearch() {
        const searchInput = document.getElementById("searchInput");
        const searchClear = document.getElementById("searchClear");
        const searchResults = document.getElementById("searchResults");
        searchInput.value = "";
        searchClear.classList.remove("visible");
        searchResults.textContent = "";
        searchResults.classList.remove("highlight");
        searchResultsData = [];
        searchTerm = "";
        renderCards();
      }

      // ============================================
      // MOSTRAR TODOS LOS REGISTROS
      // ============================================
      function showAllResults() {
        clearSearch();
      }

      // ============================================
      // RESALTAR TEXTO
      // ============================================
      function highlightText(text, query) {
        if (!text || !query) return text || "—";
        const regex = new RegExp(
          `(${query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`,
          "gi",
        );
        return text.replace(regex, '<span class="highlight-match">$1</span>');
      }

      // ============================================
      // FUNCIÓN PARA RECARGAR TODAS LAS SECCIONES
      // ============================================
      function reloadAllSections() {
        allDataCache = {};
        loadAllSections().then(() => {
          showToast("✅ Todas las secciones recargadas");
          const searchInput = document.getElementById("searchInput");
          if (searchInput.value) {
            performSearch(searchInput.value);
          }
        });
      }

      // ============================================
      // INICIALIZACIÓN
      // ============================================
      function init() {
        try {
          console.log("🔍 Inicializando conexión a base de datos...");
          console.log(`📡 API URL: ${API_URL}`);

          if (API_URL.includes("TU_URL_AQUI")) {
            console.warn("⚠️ Debes actualizar API_URL...");
            cardsContainer.innerHTML = `
              <div class="empty-state">
                <span class="icon">⚙️</span>
                <strong>Configuración pendiente</strong>
                <br><br>
                <div style="color: #666; font-size: 0.9rem; max-width: 500px; margin: 0 auto;">
                  Debes actualizar la variable <code>API_URL</code>
                </div>
              </div>
            `;
            return;
          }

          renderSidebar();

          loadAllSections().then(() => {
            loadData("ORDEN 1");
          });

          setupSearch();

          // Event listeners modal pequeño
          fieldModalClose.addEventListener("click", closeFieldModal);
          fieldModalCancel.addEventListener("click", closeFieldModal);
          fieldModalForm.addEventListener("submit", saveFieldFromModal);
          fieldModalOverlay.addEventListener("click", (e) => {
            if (e.target === fieldModalOverlay) closeFieldModal();
          });
        } catch (error) {
          console.error("❌ Error:", error);
        }
      }

      // Exponer funciones globales
      window.loadData = loadData;
      window.init = init;
      window.startFieldEdit = startFieldEdit;
      window.cancelFieldEdit = cancelFieldEdit;
      window.saveFieldEdit = saveFieldEdit;
      window.showToast = showToast;
      window.clearSearch = clearSearch;
      window.showAllResults = showAllResults;
      window.openSearchResult = openSearchResult;
      window.reloadAllSections = reloadAllSections;

      // Iniciar
      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
