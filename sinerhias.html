<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏥 Hospital Regional PV - SINERHIAS</title>
    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/img/favicon.ico" type="image/x-icon" />

    <style>
      /* ============================================
           RESET Y ESTILOS BASE
           ============================================ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        min-height: 100vh;
        background: #e0e5ec;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      /* ============================================
           CONTENEDOR PRINCIPAL
           ============================================ */
      .container {
        width: 100%;
        max-width: 1440px;
        background: #e0e5ec;
        border-radius: 40px;
        padding: 30px;
        box-shadow:
          9px 9px 16px rgba(163, 177, 198, 0.6),
          -9px -9px 16px rgba(255, 255, 255, 0.8);
      }

      /* ============================================
           HEADER
           ============================================ */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        padding: 20px 30px;
        border-radius: 30px;
        background: #e0e5ec;
        box-shadow:
          inset 2px 2px 5px rgba(163, 177, 198, 0.6),
          inset -5px -5px 10px rgba(255, 255, 255, 0.7);
      }

      .header h1 {
        font-size: 1.8rem;
        font-weight: 700;
        color: #2c3e50;
        letter-spacing: -0.5px;
      }

      .header .badge {
        padding: 8px 20px;
        border-radius: 50px;
        background: #e0e5ec;
        box-shadow:
          3px 3px 6px rgba(163, 177, 198, 0.6),
          -3px -3px 6px rgba(255, 255, 255, 0.7);
        font-size: 0.9rem;
        color: #2c3e50;
        font-weight: 600;
      }

      /* ============================================
           PANEL LATERAL + CONTENIDO (Layout)
           ============================================ */
      .main-layout {
        display: flex;
        gap: 20px;
        align-items: flex-start;
      }

      /* SIDEBAR - Panel lateral */
      .sidebar {
        flex: 0 0 240px;
        min-width: 200px;
        background: #e0e5ec;
        border-radius: 30px;
        padding: 15px;
        box-shadow:
          inset 2px 2px 5px rgba(163, 177, 198, 0.5),
          inset -5px -5px 10px rgba(255, 255, 255, 0.7);
        max-height: calc(100vh - 200px);
        overflow-y: auto;
        position: sticky;
        top: 20px;
      }

      .sidebar-title {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #7f8c8d;
        padding: 10px 12px 15px 12px;
        font-weight: 700;
        border-bottom: 2px solid rgba(163, 177, 198, 0.2);
        margin-bottom: 10px;
      }

      .sidebar .tab-btn {
        display: block;
        width: 100%;
        padding: 10px 14px;
        border: none;
        border-radius: 16px;
        font-size: 0.8rem;
        font-weight: 600;
        color: #2c3e50;
        cursor: pointer;
        transition: all 0.3s ease;
        background: #e0e5ec;
        box-shadow:
          3px 3px 6px rgba(163, 177, 198, 0.6),
          -3px -3px 6px rgba(255, 255, 255, 0.7);
        margin-bottom: 8px;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .sidebar .tab-btn:hover {
        transform: translateX(4px);
        box-shadow:
          5px 5px 10px rgba(163, 177, 198, 0.7),
          -5px -5px 10px rgba(255, 255, 255, 0.8);
      }

      .sidebar .tab-btn.active {
        background: #e0e5ec;
        box-shadow:
          inset 3px 3px 6px rgba(163, 177, 198, 0.6),
          inset -3px -3px 6px rgba(255, 255, 255, 0.7);
        color: #1a73e8;
      }

      .sidebar .tab-btn .tab-number {
        display: inline-block;
        width: 22px;
        height: 22px;
        line-height: 22px;
        text-align: center;
        border-radius: 50%;
        font-size: 0.65rem;
        font-weight: 700;
        margin-right: 8px;
        background: #e0e5ec;
        box-shadow:
          inset 1px 1px 3px rgba(163, 177, 198, 0.5),
          inset -1px -1px 3px rgba(255, 255, 255, 0.7);
      }

      .sidebar .tab-btn.active .tab-number {
        background: #1a73e8;
        color: white;
        box-shadow: none;
      }

      /* CONTENIDO PRINCIPAL */
      .content-area {
        flex: 1;
        min-width: 0;
        background: #e0e5ec;
        border-radius: 30px;
        padding: 20px;
        box-shadow:
          inset 3px 3px 8px rgba(163, 177, 198, 0.5),
          inset -3px -3px 8px rgba(255, 255, 255, 0.7);
        min-height: 400px;
      }

      /* ============================================
           TOOLBAR
           ============================================ */
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 10px;
      }

      .toolbar .info {
        font-size: 0.9rem;
        color: #34495e;
        font-weight: 500;
      }

      .toolbar .info span {
        font-weight: 700;
        color: #1a73e8;
      }

      .btn-neo {
        padding: 10px 24px;
        border: none;
        border-radius: 50px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #2c3e50;
        cursor: pointer;
        transition: all 0.3s ease;
        background: #e0e5ec;
        box-shadow:
          3px 3px 6px rgba(163, 177, 198, 0.6),
          -3px -3px 6px rgba(255, 255, 255, 0.7);
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn-neo:hover {
        transform: translateY(-2px);
        box-shadow:
          5px 5px 12px rgba(163, 177, 198, 0.7),
          -5px -5px 12px rgba(255, 255, 255, 0.8);
      }

      .btn-neo:active {
        transform: translateY(0);
        box-shadow:
          inset 3px 3px 6px rgba(163, 177, 198, 0.6),
          inset -3px -3px 6px rgba(255, 255, 255, 0.7);
      }

      .btn-neo.primary {
        color: #1a73e8;
      }

      .btn-neo.danger {
        color: #e74c3c;
      }

      .btn-neo.success {
        color: #27ae60;
      }

      /* ============================================
           CARDS GRID
           ============================================ */
      .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 20px;
        padding: 10px 0;
      }

      .card-item {
        background: #e0e5ec;
        border-radius: 24px;
        padding: 20px;
        box-shadow:
          8px 8px 16px rgba(163, 177, 198, 0.6),
          -8px -8px 16px rgba(255, 255, 255, 0.7);
        transition: all 0.3s ease;
        position: relative;
      }

      .card-item:hover {
        transform: translateY(-4px);
        box-shadow:
          12px 12px 24px rgba(163, 177, 198, 0.7),
          -12px -12px 24px rgba(255, 255, 255, 0.8);
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        padding-bottom: 12px;
        border-bottom: 2px solid rgba(163, 177, 198, 0.2);
      }

      .card-number {
        font-size: 0.75rem;
        font-weight: 700;
        color: #7f8c8d;
        background: #e0e5ec;
        padding: 4px 12px;
        border-radius: 20px;
        box-shadow:
          inset 2px 2px 4px rgba(163, 177, 198, 0.5),
          inset -2px -2px 4px rgba(255, 255, 255, 0.7);
      }

      .card-actions {
        display: flex;
        gap: 6px;
      }

      .card-actions .btn-icon {
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 50%;
        font-size: 0.8rem;
        cursor: pointer;
        transition: all 0.2s ease;
        background: #e0e5ec;
        box-shadow:
          2px 2px 4px rgba(163, 177, 198, 0.5),
          -2px -2px 4px rgba(255, 255, 255, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2c3e50;
      }

      .card-actions .btn-icon:hover {
        transform: scale(1.1);
      }

      .card-actions .btn-icon.delete:hover {
        color: #e74c3c;
      }

      .card-actions .btn-icon.edit:hover {
        color: #1a73e8;
      }

      .card-body {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .card-field {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 12px;
        background: #e0e5ec;
        box-shadow:
          inset 2px 2px 4px rgba(163, 177, 198, 0.5),
          inset -2px -2px 4px rgba(255, 255, 255, 0.7);
        transition: all 0.3s ease;
        cursor: pointer;
        min-height: 40px;
      }

      .card-field:hover {
        box-shadow:
          inset 2px 2px 8px rgba(26, 115, 232, 0.15),
          inset -2px -2px 8px rgba(255, 255, 255, 0.8);
        background: rgba(26, 115, 232, 0.03);
      }

      .card-field.editing {
        box-shadow:
          inset 2px 2px 8px rgba(26, 115, 232, 0.3),
          inset -2px -2px 8px rgba(255, 255, 255, 0.8),
          0 0 0 2px rgba(26, 115, 232, 0.2);
        background: rgba(26, 115, 232, 0.05);
      }

      .card-field .field-label {
        font-size: 0.7rem;
        font-weight: 700;
        color: #7f8c8d;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        min-width: 80px;
        flex-shrink: 0;
      }

      .card-field .field-value {
        flex: 1;
        font-size: 0.9rem;
        color: #2c3e50;
        font-weight: 500;
        word-break: break-word;
      }

      .card-field .field-value.empty {
        color: #b0b8c8;
        font-style: italic;
      }

      .card-field .field-input {
        flex: 1;
        padding: 4px 8px;
        border: none;
        border-radius: 8px;
        font-size: 0.9rem;
        background: #e0e5ec;
        box-shadow:
          inset 2px 2px 6px rgba(163, 177, 198, 0.5),
          inset -2px -2px 6px rgba(255, 255, 255, 0.7);
        color: #2c3e50;
        outline: none;
        font-weight: 500;
        min-width: 100px;
      }

      .card-field .field-input:focus {
        box-shadow:
          inset 3px 3px 8px rgba(26, 115, 232, 0.2),
          inset -3px -3px 8px rgba(255, 255, 255, 0.8);
      }

      .card-field .field-select {
        flex: 1;
        padding: 4px 8px;
        border: none;
        border-radius: 8px;
        font-size: 0.9rem;
        background: #e0e5ec;
        box-shadow:
          inset 2px 2px 6px rgba(163, 177, 198, 0.5),
          inset -2px -2px 6px rgba(255, 255, 255, 0.7);
        color: #2c3e50;
        outline: none;
        font-weight: 500;
        cursor: pointer;
      }

      .card-field .field-select:focus {
        box-shadow:
          inset 3px 3px 8px rgba(26, 115, 232, 0.2),
          inset -3px -3px 8px rgba(255, 255, 255, 0.8);
      }

      .card-field .save-btn {
        padding: 4px 12px;
        border: none;
        border-radius: 20px;
        font-size: 0.7rem;
        font-weight: 600;
        cursor: pointer;
        background: #1a73e8;
        color: white;
        box-shadow:
          2px 2px 4px rgba(26, 115, 232, 0.3),
          -2px -2px 4px rgba(255, 255, 255, 0.5);
        transition: all 0.2s ease;
      }

      .card-field .save-btn:hover {
        transform: scale(1.05);
        box-shadow:
          3px 3px 6px rgba(26, 115, 232, 0.4),
          -3px -3px 6px rgba(255, 255, 255, 0.6);
      }

      .card-field .save-btn:active {
        transform: scale(0.95);
      }

      .card-field .cancel-btn {
        padding: 4px 12px;
        border: none;
        border-radius: 20px;
        font-size: 0.7rem;
        font-weight: 600;
        cursor: pointer;
        background: #e0e5ec;
        color: #7f8c8d;
        box-shadow:
          inset 2px 2px 4px rgba(163, 177, 198, 0.5),
          inset -2px -2px 4px rgba(255, 255, 255, 0.7);
        transition: all 0.2s ease;
      }

      .card-field .cancel-btn:hover {
        color: #e74c3c;
      }

      /* ============================================
           ESTADOS
           ============================================ */
      .loading {
        text-align: center;
        padding: 50px 20px;
        color: #34495e;
        font-size: 1.1rem;
      }

      .loading::after {
        content: "...";
        animation: dots 1.5s steps(4) infinite;
      }

      @keyframes dots {
        0%,
        20% {
          content: ".";
        }

        40% {
          content: "..";
        }

        60% {
          content: "...";
        }

        80%,
        100% {
          content: "";
        }
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #95a5a6;
        font-size: 1.1rem;
      }

      .empty-state .icon {
        font-size: 3rem;
        margin-bottom: 15px;
        display: block;
      }

      /* ============================================
           RESPONSIVE
           ============================================ */
      @media (max-width: 992px) {
        .main-layout {
          flex-direction: column;
        }

        .sidebar {
          flex: 1 1 auto;
          width: 100%;
          max-height: none;
          position: static;
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
          padding: 12px;
        }

        .sidebar-title {
          width: 100%;
          padding: 5px 10px;
          margin-bottom: 5px;
        }

        .sidebar .tab-btn {
          flex: 0 0 auto;
          width: auto;
          padding: 6px 14px;
          font-size: 0.75rem;
          margin-bottom: 0;
          white-space: nowrap;
        }

        .sidebar .tab-btn .tab-number {
          width: 18px;
          height: 18px;
          line-height: 18px;
          font-size: 0.6rem;
          margin-right: 4px;
        }
      }

      @media (max-width: 768px) {
        .container {
          padding: 15px;
        }

        .header {
          flex-direction: column;
          gap: 10px;
          text-align: center;
          padding: 15px;
        }

        .header h1 {
          font-size: 1.3rem;
        }

        .cards-grid {
          grid-template-columns: 1fr;
        }

        .card-field .field-label {
          min-width: 60px;
          font-size: 0.65rem;
        }

        .toolbar {
          flex-direction: column;
          align-items: stretch;
        }

        .btn-neo {
          justify-content: center;
          padding: 8px 16px;
          font-size: 0.8rem;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 10px;
        }

        .container {
          padding: 10px;
          border-radius: 25px;
        }

        .sidebar .tab-btn {
          font-size: 0.65rem;
          padding: 4px 10px;
        }

        .sidebar .tab-btn .tab-number {
          display: none;
        }

        .card-field {
          flex-wrap: wrap;
        }

        .card-field .field-label {
          width: 100%;
          min-width: unset;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- HEADER -->
      <header class="header">
        <h1>🏥 Hospital Regional PV - SINERHIAS</h1>
        <div class="badge">🟢 <span id="statusText">Conectado</span></div>
      </header>

      <!-- LAYOUT PRINCIPAL: SIDEBAR + CONTENIDO -->
      <div class="main-layout">
        <!-- SIDEBAR (Panel Lateral) -->
        <nav class="sidebar" id="sidebarContainer">
          <div class="sidebar-title">📋 Secciones</div>
          <!-- Las pestañas se generan con JavaScript -->
        </nav>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="content-area">
          <div class="toolbar">
            <div class="info">
              📋 <span id="sheetNameDisplay">Datos Generales</span> ·
              <span id="rowCountDisplay">0</span> registros
            </div>
            <button class="btn-neo primary" id="btnAdd">➕ Agregar Registro</button>
          </div>

          <div class="table-wrapper" id="tableWrapper">
            <div id="cardsContainer">
              <div class="loading">Cargando datos</div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- ============================================
    MODAL (para Crear/Editar Registro Completo)
    ============================================ -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modalTitle">📝 Agregar Registro</h2>
          <button class="modal-close" id="modalClose">✕</button>
        </div>
        <form id="modalForm">
          <div class="form-scroll" id="formScroll">
            <div class="form-grid" id="formFields">
              <!-- Los campos se generan dinámicamente -->
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-neo" id="btnCancel">
              Cancelar
            </button>
            <button type="submit" class="btn-neo primary" id="btnSave">
              💾 Guardar
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ============================================
    JAVASCRIPT - LÓGICA COMPLETA (CON CARDS EDITABLES)
    ============================================ -->
    <script>
      // ============================================
      // CONFIGURACIÓN - URL DE TU APPS SCRIPT
      // ============================================
      const API_URL =
        "https://script.google.com/macros/s/AKfycbzPrk_ircKRKarMCSe8L136R42pGSVUGI_msXYnP167KmSZ9WXI2CaFztJI_-4kuEIT/exec";

      // ============================================
      // CONFIGURACIÓN
      // ============================================

      const TABS = [
        { id: "ORDEN 1", label: "📊 Datos Generales" },
        { id: "ORDEN 11-1", label: "👨‍⚕️ RH - Plazas" },
        { id: "ORDEN 11-2", label: "👩‍⚕️ RH - Ocupadas" },
        { id: "ORDEN 11-3", label: "📉 RH - Desocupadas" },
        { id: "ORDEN 2-2", label: "🏥 Serv. Médicos 1" },
        { id: "ORDEN 2-3", label: "🏥 Serv. Médicos 2" },
        { id: "ORDEN 3", label: "🚑 Serv. Apoyo" },
        { id: "ORDEN 4", label: "🔧 Serv. Generales" },
        { id: "ORDEN 5", label: "📋 Administrativas" },
        { id: "ORDEN 6", label: "📚 Enseñanza" },
        { id: "ORDEN 7", label: "🔬 Investigacion" },
      ];

      let state = {
        currentTab: "ORDEN 1",
        data: [],
        headers: [],
        isLoading: false,
        editingFields: {},
      };

      // ============================================
      // DOM REFERENCIAS
      // ============================================
      const sidebarContainer = document.getElementById("sidebarContainer");
      const cardsContainer = document.getElementById("cardsContainer");
      const sheetNameDisplay = document.getElementById("sheetNameDisplay");
      const rowCountDisplay = document.getElementById("rowCountDisplay");
      const modalOverlay = document.getElementById("modalOverlay");
      const modalTitle = document.getElementById("modalTitle");
      const modalForm = document.getElementById("modalForm");
      const formFields = document.getElementById("formFields");
      const formScroll = document.getElementById("formScroll");
      const btnAdd = document.getElementById("btnAdd");
      const btnCancel = document.getElementById("btnCancel");
      const btnSave = document.getElementById("btnSave");
      const modalClose = document.getElementById("modalClose");

      // ============================================
      // FUNCIONES DE API (JSONP para Vercel)
      // ============================================

      function apiRequest(action, sheet, data = null, rowIndex = null) {
        return new Promise((resolve, reject) => {
          document.getElementById("statusText").textContent = "⏳ Cargando...";

          if (action === "read") {
            const callbackName = "callback_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9);
            const script = document.createElement("script");
            const url =
              `${API_URL}?action=${action}&sheet=${encodeURIComponent(sheet)}&callback=${callbackName}`;

            window[callbackName] = function(result) {
              delete window[callbackName];
              if (document.body.contains(script)) document.body.removeChild(script);
              document.getElementById("statusText").textContent = "✅ Conectado";
              if (result.success === false || result.error) {
                reject(new Error(result.error || "Error en la operación"));
              } else {
                resolve(result);
              }
            };

            script.src = url;
            script.onerror = function() {
              delete window[callbackName];
              if (document.body.contains(script)) document.body.removeChild(script);
              document.getElementById("statusText").textContent = "❌ Error";
              reject(new Error("Error al cargar los datos"));
            };

            const timeout = setTimeout(() => {
              delete window[callbackName];
              if (document.body.contains(script)) document.body.removeChild(script);
              document.getElementById("statusText").textContent = "❌ Timeout";
              reject(new Error("Timeout al cargar los datos"));
            }, 30000);

            const originalCallback = window[callbackName];
            window[callbackName] = function(result) {
              clearTimeout(timeout);
              originalCallback(result);
            };

            document.body.appendChild(script);
            return;
          }

          if (action === "create" || action === "update" || action === "delete") {
            const params = new URLSearchParams({ action, sheet });
            if (rowIndex !== null) params.append("rowIndex", rowIndex);

            fetch(`${API_URL}?${params.toString()}`, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data),
              })
              .then(() => {
                document.getElementById("statusText").textContent = "✅ Conectado";
                resolve({ success: true, message: "Operación completada" });
              })
              .catch((error) => {
                document.getElementById("statusText").textContent = "❌ Error";
                reject(new Error(error.message));
              });
            return;
          }

          reject(new Error("Acción no válida"));
        });
      }

      // ============================================
      // CARGAR DATOS
      // ============================================
      async function loadData(sheetName) {
        if (state.isLoading) return;
        state.isLoading = true;
        state.editingFields = {};
        cardsContainer.innerHTML = '<div class="loading">Cargando datos</div>';

        try {
          const result = await apiRequest("read", sheetName);
          state.data = result.data || [];
          state.headers = result.headers || [];
          state.currentTab = sheetName;

          const tabLabel = TABS.find((t) => t.id === sheetName)?.label || sheetName;
          sheetNameDisplay.textContent = tabLabel;
          rowCountDisplay.textContent = state.data.length;

          renderCards();
          updateActiveTab(sheetName);
        } catch (error) {
          console.error("Error loading data:", error);
          cardsContainer.innerHTML = `
            <div class="empty-state">
              <span class="icon">⚠️</span>
              <strong>Error al cargar datos</strong>
              <br><br>
              <div style="color: #666; font-size: 0.9rem;">${error.message}</div>
              <br>
              <button class="btn-neo" onclick="loadData('${sheetName}')">🔄 Reintentar</button>
            </div>
          `;
        } finally {
          state.isLoading = false;
        }
      }

      // ============================================
      // RENDER CARDS
      // ============================================
      function renderCards() {
        if (state.data.length === 0) {
          cardsContainer.innerHTML = `
            <div class="empty-state">
              <span class="icon">📭</span>
              No hay registros en esta hoja
              <br><br>
              <button class="btn-neo primary" onclick="openCreateModal()">
                ➕ Agregar primer registro
              </button>
            </div>
          `;
          return;
        }

        let html = '<div class="cards-grid">';

        state.data.forEach((row, rowIndex) => {
          html += `
            <div class="card-item" data-row="${rowIndex}">
              <div class="card-header">
                <span class="card-number">#${rowIndex + 1}</span>
                <div class="card-actions">
                  <button class="btn-icon edit" onclick="openEditModal(${rowIndex})" title="Editar todo">✏️</button>
                  <button class="btn-icon delete" onclick="deleteRow(${rowIndex})" title="Eliminar">🗑️</button>
                </div>
              </div>
              <div class="card-body">
          `;

          state.headers.forEach((header) => {
            const value = row[header] || "";
            const fieldId = `field_${rowIndex}_${header.replace(/\s+/g, '_')}`;
            const isEditing = state.editingFields[`${rowIndex}_${header}`] || false;
            const isBoolean = typeof value === "string" &&
              (value.toUpperCase() === "SI" || value.toUpperCase() === "NO" || value === "");

            html += `
              <div class="card-field ${isEditing ? 'editing' : ''}" 
                   data-row="${rowIndex}" 
                   data-header="${header}"
                   onclick="if(!this.classList.contains('editing')) startFieldEdit(${rowIndex}, '${header}')">
                <span class="field-label">${header}</span>
            `;

            if (isEditing) {
              if (isBoolean) {
                html += `
                  <select class="field-select" id="${fieldId}" data-row="${rowIndex}" data-header="${header}">
                    <option value="">Seleccionar</option>
                    <option value="SI" ${value.toUpperCase() === "SI" ? "selected" : ""}>SI</option>
                    <option value="NO" ${value.toUpperCase() === "NO" ? "selected" : ""}>NO</option>
                  </select>
                `;
              } else {
                html += `
                  <input class="field-input" id="${fieldId}" type="text" value="${value}" 
                         data-row="${rowIndex}" data-header="${header}" 
                         onkeydown="if(event.key==='Enter') saveFieldEdit(${rowIndex}, '${header}')" />
                `;
              }
              html += `
                <button class="save-btn" onclick="event.stopPropagation(); saveFieldEdit(${rowIndex}, '${header}')">💾</button>
                <button class="cancel-btn" onclick="event.stopPropagation(); cancelFieldEdit(${rowIndex}, '${header}')">✕</button>
              `;
            } else {
              html += `
                <span class="field-value ${value ? '' : 'empty'}">${value || '—'}</span>
              `;
            }

            html += `</div>`;
          });

          html += `
              </div>
            </div>
          `;
        });

        html += "</div>";
        cardsContainer.innerHTML = html;
      }

      // ============================================
      // EDICIÓN DE CAMPO INDIVIDUAL
      // ============================================
      function startFieldEdit(rowIndex, header) {
        state.editingFields[`${rowIndex}_${header}`] = true;
        renderCards();

        // Enfocar el input después de renderizar
        setTimeout(() => {
          const input = document.querySelector(
            `input[data-row="${rowIndex}"][data-header="${header}"], select[data-row="${rowIndex}"][data-header="${header}"]`
          );
          if (input) input.focus();
        }, 50);
      }

      function cancelFieldEdit(rowIndex, header) {
        delete state.editingFields[`${rowIndex}_${header}`];
        renderCards();
      }

      async function saveFieldEdit(rowIndex, header) {
        const fieldId = `field_${rowIndex}_${header.replace(/\s+/g, '_')}`;
        const input = document.getElementById(fieldId);
        if (!input) return;

        const newValue = input.value;
        const oldValue = state.data[rowIndex][header] || "";

        if (newValue === oldValue) {
          delete state.editingFields[`${rowIndex}_${header}`];
          renderCards();
          return;
        }

        // Actualizar localmente
        state.data[rowIndex][header] = newValue;

        // Guardar en la API
        try {
          await apiRequest("update", state.currentTab, state.data[rowIndex], rowIndex);
          delete state.editingFields[`${rowIndex}_${header}`];
          renderCards();
          showToast(`✅ Campo "${header}" actualizado exitosamente`);
        } catch (error) {
          // Revertir cambio local si falla
          state.data[rowIndex][header] = oldValue;
          renderCards();
          alert(`❌ Error al guardar: ${error.message}`);
        }
      }

      // ============================================
      // SIDEBAR
      // ============================================
      function renderSidebar() {
        const title = sidebarContainer.querySelector(".sidebar-title");
        sidebarContainer.innerHTML = "";
        sidebarContainer.appendChild(title);

        TABS.forEach((tab, index) => {
          const btn = document.createElement("button");
          btn.className = `tab-btn ${tab.id === state.currentTab ? "active" : ""}`;
          btn.innerHTML = `<span class="tab-number">${index + 1}</span> ${tab.label}`;
          btn.dataset.sheet = tab.id;
          btn.addEventListener("click", () => {
            document.querySelectorAll(".sidebar .tab-btn").forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            loadData(tab.id);
          });
          sidebarContainer.appendChild(btn);
        });
      }

      function updateActiveTab(sheetName) {
        document.querySelectorAll(".sidebar .tab-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.sheet === sheetName);
        });
      }

      // ============================================
      // MODAL (Crear/Editar)
      // ============================================
      function openCreateModal() {
        state.isEditing = false;
        state.editRowIndex = null;
        modalTitle.textContent = "📝 Agregar Registro";
        renderFormFields({});
        modalOverlay.classList.add("active");
        formScroll.scrollTop = 0;
      }

      function openEditModal(index) {
        state.isEditing = true;
        state.editRowIndex = index;
        modalTitle.textContent = "✏️ Editar Registro Completo";
        const rowData = state.data[index] || {};
        renderFormFields(rowData);
        modalOverlay.classList.add("active");
        formScroll.scrollTop = 0;
      }

      function renderFormFields(rowData) {
        const allHeaders = state.headers;
        let html = "";

        allHeaders.forEach((header) => {
          const value = rowData[header] !== undefined && rowData[header] !== null ? rowData[header] : "";
          const isBoolean = typeof value === "string" &&
            (value.toUpperCase() === "SI" || value.toUpperCase() === "NO" || value === "");

          html += `
            <div class="form-group">
              <label for="field_${header.replace(/\s+/g, "_")}">${header}</label>
              ${isBoolean ? `
                <select id="field_${header.replace(/\s+/g, "_")}" name="${header}">
                  <option value="">Seleccionar</option>
                  <option value="SI" ${value.toUpperCase() === "SI" ? "selected" : ""}>SI</option>
                  <option value="NO" ${value.toUpperCase() === "NO" ? "selected" : ""}>NO</option>
                </select>
              ` : `
                <input type="text" id="field_${header.replace(/\s+/g, "_")}" name="${header}" value="${value}" />
              `}
            </div>
          `;
        });

        formFields.innerHTML = html;
      }

      function collectFormData() {
        const formData = {};
        const inputs = formFields.querySelectorAll("input, select, textarea");
        inputs.forEach((input) => {
          formData[input.name] = input.value;
        });
        return formData;
      }

      // ============================================
      // GUARDAR (Modal)
      // ============================================
      async function handleSave(event) {
        event.preventDefault();
        const formData = collectFormData();

        const hasValue = Object.values(formData).some((v) => v && v.trim() !== "");
        if (!hasValue) {
          alert("⚠️ Por favor, ingresa al menos un valor.");
          return;
        }

        try {
          if (state.isEditing && state.editRowIndex !== null) {
            await apiRequest("update", state.currentTab, formData, state.editRowIndex);
          } else {
            await apiRequest("create", state.currentTab, formData);
          }

          closeModal();
          await loadData(state.currentTab);
          showToast("✅ Registro guardado exitosamente");
        } catch (error) {
          alert(`❌ Error al guardar: ${error.message}`);
        }
      }

      // ============================================
      // ELIMINAR
      // ============================================
      async function deleteRow(index) {
        if (!confirm("⚠️ ¿Estás seguro de eliminar este registro?")) return;

        try {
          await apiRequest("delete", state.currentTab, null, index);
          await loadData(state.currentTab);
          showToast("🗑️ Registro eliminado");
        } catch (error) {
          alert(`❌ Error al eliminar: ${error.message}`);
        }
      }

      // ============================================
      // TOAST NOTIFICATIONS
      // ============================================
      function showToast(message) {
        const existing = document.querySelector(".toast-notification");
        if (existing) existing.remove();

        const toast = document.createElement("div");
        toast.className = "toast-notification";
        toast.style.cssText = `
          position: fixed;
          bottom: 30px;
          right: 30px;
          padding: 16px 24px;
          border-radius: 16px;
          background: #e0e5ec;
          box-shadow: 8px 8px 16px rgba(163,177,198,0.6), -8px -8px 16px rgba(255,255,255,0.7);
          color: #2c3e50;
          font-weight: 600;
          font-size: 0.95rem;
          z-index: 2000;
          animation: slideUp 0.3s ease;
          max-width: 400px;
        `;
        toast.textContent = message;
        document.body.appendChild(toast);

        setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transition = "opacity 0.3s ease";
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      // Estilo para la animación del toast
      const styleToast = document.createElement("style");
      styleToast.textContent = `
        @keyframes slideUp {
          from { transform: translateY(20px); opacity: 0; }
          to { transform: translateY(0); opacity: 1; }
        }
      `;
      document.head.appendChild(styleToast);

      // ============================================
      // MODAL CONTROLS
      // ============================================
      function closeModal() {
        modalOverlay.classList.remove("active");
      }

      // ============================================
      // INICIALIZACIÓN
      // ============================================
      function init() {
        try {
          console.log("🔍 Inicializando con Cards Editables...");
          renderSidebar();
          loadData("ORDEN 1");

          btnAdd.addEventListener("click", openCreateModal);
          btnCancel.addEventListener("click", closeModal);
          modalClose.addEventListener("click", closeModal);
          modalForm.addEventListener("submit", handleSave);

          modalOverlay.addEventListener("click", (e) => {
            if (e.target === modalOverlay) closeModal();
          });

          document.getElementById("statusText").textContent = "✅ Conectado";
        } catch (error) {
          console.error("❌ Error de inicialización:", error);
          document.getElementById("statusText").textContent = "❌ Error";
          cardsContainer.innerHTML = `
            <div class="empty-state">
              <span class="icon">🚨</span>
              <strong>Error de inicialización</strong>
              <br><br>
              <div style="color: #666; font-size: 0.9rem;">${error.message}</div>
              <br>
              <button class="btn-neo" onclick="init()">🔄 Reintentar</button>
            </div>
          `;
        }
      }

      // Iniciar
      document.addEventListener("DOMContentLoaded", init);

      // Exponer funciones globales
      window.openCreateModal = openCreateModal;
      window.openEditModal = openEditModal;
      window.deleteRow = deleteRow;
      window.loadData = loadData;
      window.closeModal = closeModal;
      window.init = init;
      window.startFieldEdit = startFieldEdit;
      window.cancelFieldEdit = cancelFieldEdit;
      window.saveFieldEdit = saveFieldEdit;
    </script>
  </body>
</html>
