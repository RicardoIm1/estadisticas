<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospital Regional PV - SINERHIAS</title>
    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/img/favicon.ico" type="image/x-icon" />

    <style>
      /* ============================================
   RESET Y ESTILOS BASE
   ============================================ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        min-height: 100vh;
        background: #e0e5ec;
        padding: 16px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        overflow: hidden;
      }

      .container {
        width: 100%;
        max-width: 1440px;
        height: calc(100vh - 32px);
        max-height: calc(100vh - 32px);
        background: #e0e5ec;
        border-radius: 40px;
        padding: 24px 28px;
        box-shadow:
          9px 9px 16px rgba(163, 177, 198, 0.6),
          -9px -9px 16px rgba(255, 255, 255, 0.8);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ============================================
   HEADER
   ============================================ */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
        padding: 12px 24px;
        border-radius: 30px;
        background: #e0e5ec;
        box-shadow:
          inset 2px 2px 5px rgba(163, 177, 198, 0.6),
          inset -5px -5px 10px rgba(255, 255, 255, 0.7);
        flex-shrink: 0;
        flex-wrap: wrap;
      }

      .header h1 {
        font-size: 1.6rem;
        font-weight: 700;
        color: #2c3e50;
        letter-spacing: -0.5px;
        flex-shrink: 0;
      }

      .header-center {
        flex: 1;
        min-width: 200px;
        max-width: 600px;
        display: flex;
        justify-content: center;
      }

      .search-container {
        position: relative;
        width: 100%;
        display: flex;
        align-items: center;
        background: #e0e5ec;
        border-radius: 50px;
        padding: 0 16px;
        box-shadow:
          inset 3px 3px 8px rgba(163, 177, 198, 0.5),
          inset -3px -3px 8px rgba(255, 255, 255, 0.7);
        transition: all 0.3s ease;
      }

      .search-container:focus-within {
        box-shadow:
          inset 3px 3px 8px rgba(26, 115, 232, 0.15),
          inset -3px -3px 8px rgba(255, 255, 255, 0.8),
          0 0 0 2px rgba(26, 115, 232, 0.1);
      }

      .search-icon {
        font-size: 1rem;
        color: #7f8c8d;
        margin-right: 10px;
        flex-shrink: 0;
      }

      .search-input {
        flex: 1;
        padding: 10px 8px;
        border: none;
        background: transparent;
        font-size: 0.95rem;
        color: #2c3e50;
        outline: none;
        min-width: 100px;
        font-weight: 500;
      }

      .search-input::placeholder {
        color: #b0b8c8;
        font-weight: 400;
      }

      .search-clear {
        display: none;
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        background: #e0e5ec;
        color: #7f8c8d;
        font-size: 0.8rem;
        box-shadow:
          inset 2px 2px 4px rgba(163, 177, 198, 0.4),
          inset -2px -2px 4px rgba(255, 255, 255, 0.6);
        transition: all 0.2s ease;
        flex-shrink: 0;
        margin-left: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .search-clear.visible {
        display: flex;
      }

      .search-clear:hover {
        color: #e74c3c;
        transform: scale(1.05);
      }

      .search-results {
        font-size: 0.7rem;
        color: #7f8c8d;
        font-weight: 600;
        margin-left: 10px;
        white-space: nowrap;
        flex-shrink: 0;
        min-width: 40px;
        text-align: right;
      }

      .search-results.highlight {
        color: #1a73e8;
      }

      .header .badge {
        padding: 6px 16px;
        border-radius: 50px;
        background: #e0e5ec;
        box-shadow:
          3px 3px 6px rgba(163, 177, 198, 0.6),
          -3px -3px 6px rgba(255, 255, 255, 0.7);
        font-size: 0.8rem;
        color: #2c3e50;
        font-weight: 600;
        flex-shrink: 0;
      }

      /* ============================================
   MAIN LAYOUT
   ============================================ */
      .main-layout {
        display: flex;
        gap: 20px;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      /* ============================================
   SIDEBAR - BASE
   ============================================ */
      .sidebar {
        flex: 0 0 220px;
        min-width: 180px;
        background: #e0e5ec;
        border-radius: 30px;
        padding: 15px;
        box-shadow:
          inset 2px 2px 5px rgba(163, 177, 198, 0.5),
          inset -5px -5px 10px rgba(255, 255, 255, 0.7);
        overflow-y: auto;
        height: 100%;
        flex-shrink: 0;
      }

      .sidebar::-webkit-scrollbar {
        width: 4px;
      }

      .sidebar::-webkit-scrollbar-track {
        background: #e0e5ec;
        border-radius: 10px;
      }

      .sidebar::-webkit-scrollbar-thumb {
        background: #b0b8c8;
        border-radius: 10px;
      }

      .sidebar-title {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #7f8c8d;
        padding: 10px 12px 15px 12px;
        font-weight: 700;
        border-bottom: 2px solid rgba(163, 177, 198, 0.2);
        margin-bottom: 10px;
      }

      .sidebar .tab-btn {
        display: block;
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-radius: 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2c3e50;
        cursor: pointer;
        transition: all 0.3s ease;
        background: #e0e5ec;
        box-shadow:
          3px 3px 6px rgba(163, 177, 198, 0.6),
          -3px -3px 6px rgba(255, 255, 255, 0.7);
        margin-bottom: 16px;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .sidebar .tab-btn:hover {
        transform: translateX(4px);
        box-shadow:
          5px 5px 10px rgba(163, 177, 198, 0.7),
          -5px -5px 10px rgba(255, 255, 255, 0.8);
      }

      .sidebar .tab-btn.active {
        background: #e0e5ec;
        box-shadow:
          inset 3px 3px 6px rgba(163, 177, 198, 0.6),
          inset -3px -3px 6px rgba(255, 255, 255, 0.7);
        color: #1a73e8;
      }

      .sidebar .tab-btn .tab-number {
        display: inline-block;
        width: 20px;
        height: 20px;
        line-height: 20px;
        text-align: center;
        border-radius: 50%;
        font-size: 0.6rem;
        font-weight: 700;
        margin-right: 6px;
        background: #e0e5ec;
        box-shadow:
          inset 1px 1px 3px rgba(163, 177, 198, 0.5),
          inset -1px -1px 3px rgba(255, 255, 255, 0.7);
      }

      .sidebar .tab-btn.active .tab-number {
        background: #1a73e8;
        color: white;
        box-shadow: none;
      }

      /* ============================================
   SIDEBAR - SCROLL HORIZONTAL EN MÓVILES
   ============================================ */
      @media (max-width: 992px) {
        .sidebar {
          flex: 0 0 auto;
          width: 100%;
          max-height: 60px;
          min-height: unset;
          height: auto;
          display: flex;
          flex-wrap: nowrap;
          overflow-x: auto;
          overflow-y: hidden;
          gap: 8px;
          padding: 10px 14px;
          align-items: center;
          scrollbar-width: thin;
          -webkit-overflow-scrolling: touch;
        }

        .sidebar-title {
          display: none;
        }

        .sidebar .tab-btn {
          flex: 0 0 auto;
          width: auto;
          padding: 6px 16px;
          font-size: 0.75rem;
          margin-bottom: 0;
          white-space: nowrap;
          border-radius: 20px;
          overflow: visible;
          text-overflow: clip;
          min-width: 80px;
          text-align: center;
        }

        .sidebar .tab-btn .tab-number {
          width: 20px;
          height: 20px;
          line-height: 20px;
          font-size: 0.6rem;
          margin-right: 6px;
        }

        .sidebar .tab-btn.active {
          min-width: 120px;
          padding: 6px 20px;
          font-size: 0.8rem;
          background: #e0e5ec;
          box-shadow:
            inset 3px 3px 6px rgba(163, 177, 198, 0.6),
            inset -3px -3px 6px rgba(255, 255, 255, 0.7);
          color: #1a73e8;
        }

        .sidebar .tab-btn.active .tab-number {
          background: #1a73e8;
          color: white;
          box-shadow: none;
        }

        .sidebar::-webkit-scrollbar {
          height: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb {
          background: #b0b8c8;
          border-radius: 10px;
        }

        .sidebar::-webkit-scrollbar-track {
          background: transparent;
        }
      }

      @media (max-width: 480px) {
        .sidebar {
          max-height: 50px;
          padding: 6px 10px;
          gap: 6px;
        }

        .sidebar .tab-btn {
          padding: 4px 12px;
          font-size: 0.65rem;
          min-width: 60px;
        }

        .sidebar .tab-btn.active {
          min-width: 100px;
          padding: 5px 16px;
          font-size: 0.75rem;
        }

        .sidebar .tab-btn .tab-number {
          width: 18px;
          height: 18px;
          line-height: 18px;
          font-size: 0.55rem;
          margin-right: 4px;
        }
      }

      @media (max-width: 380px) {
        .sidebar {
          max-height: 44px;
          padding: 4px 8px;
          gap: 4px;
        }

        .sidebar .tab-btn {
          padding: 3px 10px;
          font-size: 0.6rem;
          min-width: 50px;
        }

        .sidebar .tab-btn.active {
          min-width: 80px;
          padding: 4px 14px;
          font-size: 0.7rem;
        }

        .sidebar .tab-btn .tab-number {
          width: 16px;
          height: 16px;
          line-height: 16px;
          font-size: 0.5rem;
          margin-right: 3px;
        }
      }

      /* ============================================
   CONTENT AREA
   ============================================ */
      .content-area {
        flex: 1;
        min-width: 0;
        background: #e0e5ec;
        border-radius: 30px;
        padding: 20px 24px;
        box-shadow:
          inset 3px 3px 8px rgba(163, 177, 198, 0.5),
          inset -3px -3px 8px rgba(255, 255, 255, 0.7);
        min-height: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ============================================
   TOOLBAR
   ============================================ */
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        flex-wrap: wrap;
        gap: 12px;
        padding: 0 4px;
        width: 100%;
        flex-shrink: 0;
      }

      .toolbar .info {
        font-size: 0.95rem;
        color: #34495e;
        font-weight: 500;
        padding: 8px 16px;
        border-radius: 16px;
        background: #e0e5ec;
        box-shadow:
          inset 2px 2px 4px rgba(163, 177, 198, 0.4),
          inset -2px -2px 4px rgba(255, 255, 255, 0.6);
      }

      .toolbar .info span {
        font-weight: 700;
        color: #1a73e8;
      }

      /* ============================================
   TABLA WRAPPER
   ============================================ */
      .table-wrapper {
        width: 100%;
        border-radius: 20px;
        background: transparent;
        padding: 0;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
      }

      .table-wrapper::-webkit-scrollbar {
        width: 6px;
      }

      .table-wrapper::-webkit-scrollbar-track {
        background: #e0e5ec;
        border-radius: 10px;
      }

      .table-wrapper::-webkit-scrollbar-thumb {
        background: #b0b8c8;
        border-radius: 10px;
      }

      .table-wrapper::-webkit-scrollbar-thumb:hover {
        background: #9aa3b5;
      }

      #cardsContainer {
        width: 100%;
        min-height: 100%;
      }

      /* ============================================
   CARDS GRID - 1 SOLA COLUMNA
   ============================================ */
      .cards-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        padding: 4px 0 8px 0;
        width: 100%;
      }

      /* ============================================
   CARD ITEM
   ============================================ */
      .card-item {
        background: #e0e5ec;
        border-radius: 24px;
        padding: 18px 22px 16px 22px;
        box-shadow:
          8px 8px 16px rgba(163, 177, 198, 0.6),
          -8px -8px 16px rgba(255, 255, 255, 0.7);
        transition: all 0.3s ease;
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
      }

      .card-item:hover {
        transform: translateY(-2px);
        box-shadow:
          10px 10px 20px rgba(163, 177, 198, 0.7),
          -10px -10px 20px rgba(255, 255, 255, 0.8);
      }

      .card-header {
        display: none !important;
      }

      /* ============================================
   CARD BODY - 4 COLUMNAS
   ============================================ */
      .card-body {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        flex: 1;
        align-content: start;
        width: 100%;
      }

      .card-body .card-field:last-child:nth-child(4n + 1) {
        grid-column: 1 / -1;
      }

      .card-body .card-field:last-child:nth-child(4n + 2) {
        grid-column: 2 / -1;
      }

      .card-body .card-field:last-child:nth-child(4n + 3) {
        grid-column: 3 / -1;
      }

      @media (min-width: 768px) and (max-width: 1199px) {
        .card-body {
          grid-template-columns: 1fr 1fr;
          gap: 8px;
        }
        .card-body .card-field:last-child:nth-child(odd) {
          grid-column: 1 / -1;
        }
      }

      @media (max-width: 767px) {
        .card-body {
          grid-template-columns: 1fr;
          gap: 6px;
        }
      }

      /* ============================================
   CARD FIELD
   ============================================ */
      .card-field {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        padding: 8px 12px;
        border-radius: 12px;
        background: #e0e5ec;
        box-shadow:
          inset 1px 1px 3px rgba(163, 177, 198, 0.4),
          inset -1px -1px 3px rgba(255, 255, 255, 0.6);
        transition: all 0.3s ease;
        cursor: pointer;
        min-height: 44px;
        border-left: 2px solid transparent;
        width: 100%;
        overflow: hidden;
      }

      .card-field:hover {
        box-shadow:
          inset 2px 2px 8px rgba(26, 115, 232, 0.12),
          inset -2px -2px 8px rgba(255, 255, 255, 0.7);
        background: rgba(26, 115, 232, 0.02);
        border-left-color: rgba(26, 115, 232, 0.3);
      }

      .card-field.editing {
        box-shadow:
          inset 2px 2px 8px rgba(26, 115, 232, 0.25),
          inset -2px -2px 8px rgba(255, 255, 255, 0.7),
          0 0 0 2px rgba(26, 115, 232, 0.15);
        background: rgba(26, 115, 232, 0.04);
        border-left-color: #1a73e8;
        grid-column: 1 / -1 !important;
      }

      .card-field .field-label {
        font-size: 0.5rem;
        font-weight: 700;
        color: #7f8c8d;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 0;
        line-height: 1.2;
        width: 100%;
      }

      .card-field .field-value {
        font-size: 0.85rem;
        color: #2c3e50;
        font-weight: 600;
        word-break: break-word;
        padding: 0;
        line-height: 1.3;
        width: 100%;
      }

      .card-field .field-value.empty {
        color: #b0b8c8;
        font-style: italic;
        font-weight: 400;
      }

      .card-field .field-value .highlight-match {
        background: #ffeb3b;
        color: #1a1a1a;
        padding: 0 2px;
        border-radius: 3px;
        font-weight: 700;
        box-shadow: 0 0 8px rgba(255, 235, 59, 0.3);
      }

      .card-field .field-input {
        width: 100%;
        padding: 4px 8px;
        border: none;
        border-radius: 8px;
        font-size: 0.85rem;
        background: #e0e5ec;
        box-shadow:
          inset 2px 2px 6px rgba(163, 177, 198, 0.5),
          inset -2px -2px 6px rgba(255, 255, 255, 0.7);
        color: #2c3e50;
        outline: none;
        font-weight: 600;
        transition: all 0.3s ease;
        margin-top: 2px;
      }

      .card-field .field-input:focus {
        box-shadow:
          inset 3px 3px 8px rgba(26, 115, 232, 0.2),
          inset -3px -3px 8px rgba(255, 255, 255, 0.8),
          0 0 0 2px rgba(26, 115, 232, 0.1);
      }

      .card-field .field-select {
        width: 100%;
        padding: 4px 8px;
        border: none;
        border-radius: 8px;
        font-size: 0.85rem;
        background: #e0e5ec;
        box-shadow:
          inset 2px 2px 6px rgba(163, 177, 198, 0.5),
          inset -2px -2px 6px rgba(255, 255, 255, 0.7);
        color: #2c3e50;
        outline: none;
        font-weight: 600;
        cursor: pointer;
        margin-top: 2px;
      }

      .card-field .field-select:focus {
        box-shadow:
          inset 3px 3px 8px rgba(26, 115, 232, 0.2),
          inset -3px -3px 8px rgba(255, 255, 255, 0.8);
      }

      .card-field .field-actions {
        display: flex;
        gap: 4px;
        width: 100%;
        justify-content: flex-end;
        margin-top: 4px;
      }

      .card-field .save-btn {
        padding: 3px 12px;
        border: none;
        border-radius: 14px;
        font-size: 0.6rem;
        font-weight: 700;
        cursor: pointer;
        background: #1a73e8;
        color: white;
        box-shadow:
          2px 2px 4px rgba(26, 115, 232, 0.3),
          -2px -2px 4px rgba(255, 255, 255, 0.5);
        transition: all 0.2s ease;
      }

      .card-field .save-btn:hover {
        transform: scale(1.05);
      }

      .card-field .cancel-btn {
        padding: 3px 12px;
        border: none;
        border-radius: 14px;
        font-size: 0.6rem;
        font-weight: 600;
        cursor: pointer;
        background: #e0e5ec;
        color: #7f8c8d;
        box-shadow:
          inset 2px 2px 4px rgba(163, 177, 198, 0.5),
          inset -2px -2px 4px rgba(255, 255, 255, 0.7);
        transition: all 0.2s ease;
      }

      .card-field .cancel-btn:hover {
        color: #e74c3c;
      }

      /* ============================================
   RESULTADOS DE BÚSQUEDA - LISTA
   ============================================ */
      .search-results-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        margin-bottom: 12px;
        border-radius: 16px;
        background: #e0e5ec;
        box-shadow:
          inset 2px 2px 4px rgba(163, 177, 198, 0.4),
          inset -2px -2px 4px rgba(255, 255, 255, 0.6);
        font-weight: 600;
        color: #2c3e50;
      }

      .search-result-count {
        font-size: 0.8rem;
        color: #7f8c8d;
        background: #e0e5ec;
        padding: 4px 14px;
        border-radius: 20px;
        box-shadow:
          inset 2px 2px 4px rgba(163, 177, 198, 0.5),
          inset -2px -2px 4px rgba(255, 255, 255, 0.7);
      }

      .search-results-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 4px 0 12px 0;
      }

      .search-result-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 18px;
        border-radius: 16px;
        background: #e0e5ec;
        box-shadow:
          4px 4px 8px rgba(163, 177, 198, 0.5),
          -4px -4px 8px rgba(255, 255, 255, 0.7);
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .search-result-item:hover {
        transform: translateX(4px);
        box-shadow:
          6px 6px 12px rgba(163, 177, 198, 0.6),
          -6px -6px 12px rgba(255, 255, 255, 0.8);
        background: rgba(26, 115, 232, 0.03);
      }

      .search-result-item:active {
        transform: scale(0.98);
      }

      .search-result-number {
        font-size: 0.7rem;
        font-weight: 700;
        color: #7f8c8d;
        background: #e0e5ec;
        padding: 4px 12px;
        border-radius: 20px;
        box-shadow:
          inset 2px 2px 4px rgba(163, 177, 198, 0.5),
          inset -2px -2px 4px rgba(255, 255, 255, 0.7);
        flex-shrink: 0;
      }

      .search-result-content {
        flex: 1;
        min-width: 0;
      }

      .search-result-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 0.85rem;
        color: #2c3e50;
      }

      .search-match-field {
        background: rgba(26, 115, 232, 0.06);
        padding: 2px 8px;
        border-radius: 8px;
        font-size: 0.8rem;
        border-left: 2px solid rgba(26, 115, 232, 0.2);
      }

      .search-match-field .highlight-match {
        background: #ffeb3b;
        color: #1a1a1a;
        padding: 0 2px;
        border-radius: 2px;
        font-weight: 700;
        box-shadow: 0 0 8px rgba(255, 235, 59, 0.3);
      }

      .search-result-preview {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
        font-size: 0.7rem;
        color: #7f8c8d;
      }

      .search-result-preview-item {
        background: #e0e5ec;
        padding: 2px 10px;
        border-radius: 12px;
        box-shadow:

      .search-result-sheet {
        font-size: 0.65rem;

      }

      /* ============================================
   MODAL
   ============================================ */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);

      .modal {

        to {
          opacity: 1;

      .modal-header {
        display: flex;

      }

      .modal-header h2 {
        font-size: 1.4rem;

      }

      .modal-close {
        width: 40px;
        height: 40px;

        border-radius: 50%;
        font-size: 1.2rem;
        cursor: pointer;
        background: #e0e5ec;
        box-shadow:
          3px 3px 6px rgba(163, 177, 198, 0.6),
          -3px -3px 6px rgba(255, 255, 255, 0.7);

        transition: all 0.2s ease;
        display: flex;

      .modal-close:hover {

      .form-scroll {

      .form-scroll::-webkit-scrollbar {

      .form-scroll::-webkit-scrollbar-thumb:hover {

      .form-grid {
        display: grid;

      .form-group {

      .form-group label {
        font-size: 0.75rem;

        letter-spacing: 0.3px;
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
        padding: 8px 12px;
        border: none;
        border-radius: 12px;
        font-size: 0.85rem;
        background: #e0e5ec;
        box-shadow:
          inset 2px 2px 6px rgba(163, 177, 198, 0.5),
          inset -2px -2px 6px rgba(255, 255, 255, 0.7);

      .modal-footer {

      /* ============================================
   ESTADOS
   ============================================ */
      .loading {
        text-align: center;
        padding: 50px 20px;
        color: #34495e;
        font-size: 1.1rem;
      }

      .loading::after {
        content: "...";
        animation: dots 1.5s steps(4) infinite;
      }

      @keyframes dots {
        0%,
        20% {
          content: ".";
        }
        40% {
          content: "..";
        }
        60% {
          content: "...";
        }
        80%,
        100% {
          content: "";
        }
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #95a5a6;
        font-size: 1.1rem;
      }

      .empty-state .icon {
        font-size: 3rem;

      .btn-neo {

      /* ============================================
   TOAST NOTIFICATIONS
   ============================================ */
      .toast-notification {
        position: fixed;
        bottom: 30px;
        right: 30px;
        padding: 16px 24px;
        border-radius: 16px;
        background: #e0e5ec;
        box-shadow:
          8px 8px 16px rgba(163, 177, 198, 0.6),
          -8px -8px 16px rgba(255, 255, 255, 0.7);
        color: #2c3e50;
        font-weight: 600;
        font-size: 0.95rem;
        z-index: 2000;
        animation: slideUp 0.3s ease;
        max-width: 400px;
      }

      @keyframes slideUp {
        from {
          transform: translateY(20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      /* ============================================
   RESPONSIVE
   ============================================ */
      @media (max-width: 768px) {
        .header {
          flex-direction: column;
          gap: 10px;
          text-align: center;
          padding: 12px 16px;
        }

        .header h1 {
          font-size: 1.2rem;
        }

        .header-center {
          max-width: 100%;
          width: 100%;
        }

        .search-container {
          padding: 0 12px;
        }

        .search-input {
          font-size: 0.85rem;

        }

        .search-results {
          font-size: 0.65rem;

        .search-result-item {

        .search-result-number {

      @media (max-width: 480px) {
        body {
          padding: 10px;

        .container {
          padding: 12px 14px;

          max-height: calc(100vh - 20px);

        }

          flex-direction: column;
          gap: 8px;
          text-align: center;
          padding: 12px 16px;
          margin-bottom: 14px;
        }

          font-size: 1.1rem;
        }

        .header .badge {
          font-size: 0.75rem;
          padding: 4px 14px;
        }

        .header h1 {
          font-size: 1rem;
        }

        .search-container {
          padding: 0 10px;
        }

        .search-input {
          font-size: 0.8rem;
          padding: 6px 4px;
        }

        .search-icon {
          font-size: 0.8rem;
          margin-right: 6px;
        }

        .search-results {
          font-size: 0.6rem;
          min-width: 25px;
        }

        .search-clear {
          width: 24px;
          height: 24px;
          font-size: 0.7rem;
        }

        .content-area {
          padding: 12px;
          border-radius: 20px;
        }

        .toolbar {
          flex-direction: column;
          align-items: stretch;
          gap: 10px;
          margin-bottom: 12px;
        }

        .toolbar .info {

        }

    </style>
  </head>

  <body>
    <div class="container">
      <header class="header">
        <h1>SINERHIAS</h1>
        <div class="header-center">
          <div class="search-container">
            <span class="search-icon">🔍</span>
            <input
              type="text"
              id="searchInput"
              class="search-input"
              placeholder="Buscar en todos los campos..."
            />
            <button
              class="search-clear"
              id="searchClear"
              title="Limpiar búsqueda"
            >
              ✕
            </button>
            <span class="search-results" id="searchResults"></span>
          </div>
        </div>
        <div class="badge">🟢 <span id="statusText">Conectado</span></div>
      </header>

      <div class="main-layout">
        <nav class="sidebar" id="sidebarContainer">
          <div class="sidebar-title">Secciones</div>
        </nav>

        <main class="content-area">
          <div class="toolbar">
            <div class="info">
              <span id="sheetNameDisplay">Datos Generales</span> ·
              <span id="rowCountDisplay">0</span>
            </div>
          </div>

          <div class="table-wrapper">
            <div id="cardsContainer">
              <div class="loading">Cargando datos...</div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modalTitle">📝 Agregar Registro</h2>
          <button class="modal-close" id="modalClose">✕</button>
        </div>
        <form id="modalForm">
          <div class="form-scroll" id="formScroll">
            <div class="form-grid" id="formFields"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-neo" id="btnCancel">
              Cancelar
            </button>
            <button type="submit" class="btn-neo primary" id="btnSave">
              💾 Guardar
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      // ============================================
      // CONFIGURACIÓN - ACTUALIZA CON TU URL
      // ============================================
      const API_URL =
        "https://script.google.com/macros/s/AKfycbyf4vcWL1eVxOSP-aCvVebMp-oS2wZfpcfM5HjqYDs2dxwEwrtiX1Qbhazixfh5uQJ9/exec";

      // ============================================
      // DEFINICIÓN DE PESTAÑAS
      // ============================================
      const TABS = [
        { id: "ORDEN 1", label: "Orden 1, Datos Generales" },
        { id: "ORDEN 11-1", label: "Orden 11-1 Recursos Humanos" },
        { id: "ORDEN 11-2", label: "Orden 11-2 Recursos Humanos" },
        { id: "ORDEN 11-3", label: "Orden 11-3 Recursos Humanos" },
        { id: "ORDEN 2-2", label: "Orden 2-2 Areas de Servicios Médicos" },
        { id: "ORDEN 2-3", label: "Orden 2-3 Areas de Servicios Médicos" },
        { id: "ORDEN 3", label: "Orden 3 Areas de Servicios de Apoyo" },
        { id: "ORDEN 4", label: "Orden 4 Servicios Generales" },
        { id: "ORDEN 5", label: "Orden 5 Areas Administrativas y Directivas" },
        { id: "ORDEN 6", label: "Orden 6 Areas de Enseñanza" },
        { id: "ORDEN 7", label: "Orden 7, Areas de Investigacion" },
      ];

      // ============================================
      // ESTADO GLOBAL
      // ============================================
      let state = {
        currentTab: "ORDEN 1",
        data: [],
        headers: [],
        isLoading: false,
        editingFields: {},
        isEditing: false,
        editRowIndex: null,
      };

      // ============================================
      // DOM REFERENCIAS
      // ============================================
      const sidebarContainer = document.getElementById("sidebarContainer");
      const cardsContainer = document.getElementById("cardsContainer");
      const sheetNameDisplay = document.getElementById("sheetNameDisplay");
      const rowCountDisplay = document.getElementById("rowCountDisplay");
      const statusText = document.getElementById("statusText");
      const modalOverlay = document.getElementById("modalOverlay");
      const modalTitle = document.getElementById("modalTitle");
      const modalForm = document.getElementById("modalForm");
      const formFields = document.getElementById("formFields");
      const formScroll = document.getElementById("formScroll");
      const btnCancel = document.getElementById("btnCancel");
      const btnSave = document.getElementById("btnSave");
      const modalClose = document.getElementById("modalClose");

      // ============================================
      // API - CONEXIÓN REAL A BASE DE DATOS
      // ============================================
      function apiRequest(action, sheet, data = null, rowIndex = null) {
        return new Promise((resolve, reject) => {
          statusText.textContent = "⏳ Cargando...";

          if (action === "read") {
            const callbackName =
              "callback_" +
              Date.now() +
              "_" +
              Math.random().toString(36).substr(2, 9);
            const script = document.createElement("script");
            const url = `${API_URL}?action=${action}&sheet=${encodeURIComponent(sheet)}&callback=${callbackName}&_=${Date.now()}`;

            let resolved = false;

            window[callbackName] = function (result) {
              if (resolved) return;
              resolved = true;
              delete window[callbackName];
              if (document.body.contains(script))
                document.body.removeChild(script);
              statusText.textContent = "✅ Conectado";

              if (result.success === false || result.error) {
                reject(new Error(result.error || "Error en la operación"));
              } else {
                resolve(result);
              }
            };

            script.src = url;
            script.onerror = function () {
              if (resolved) return;
              resolved = true;
              delete window[callbackName];
              if (document.body.contains(script))
                document.body.removeChild(script);
              statusText.textContent = "❌ Error";
              reject(new Error("Error de conexión con el servidor"));
            };

            const timeout = setTimeout(() => {
              if (resolved) return;
              resolved = true;
              delete window[callbackName];
              if (document.body.contains(script))
                document.body.removeChild(script);
              statusText.textContent = "⏰ Timeout";
              reject(new Error("Timeout: El servidor no responde"));
            }, 30000);

            const originalCallback = window[callbackName];
            window[callbackName] = function (result) {
              clearTimeout(timeout);
              originalCallback(result);
            };

            document.body.appendChild(script);
            return;
          }

          // POST requests
          if (
            action === "create" ||
            action === "update" ||
            action === "delete"
          ) {
            const params = new URLSearchParams({ action, sheet });
            if (rowIndex !== null) params.append("rowIndex", rowIndex);

            fetch(`${API_URL}?${params.toString()}`, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            })
              .then(() => {
                statusText.textContent = "✅ Conectado";
                resolve({ success: true, message: "Operación completada" });
              })
              .catch((error) => {
                statusText.textContent = "❌ Error";
                reject(new Error(error.message));
              });
            return;
          }

          reject(new Error("Acción no válida"));
        });
      }

      // ============================================
      // CARGAR DATOS DESDE LA BASE DE DATOS
      // ============================================
      async function loadData(sheetName) {
        if (state.isLoading) return;
        state.isLoading = true;
        state.editingFields = {};
        cardsContainer.innerHTML =
          '<div class="loading">Cargando datos...</div>';

        try {
          const result = await apiRequest("read", sheetName);

          if (!result.data || result.data.length === 0) {
            cardsContainer.innerHTML = `
              <div class="empty-state">
                <span class="icon">📭</span>
                No hay registros en esta hoja
              </div>
            `;
            state.data = [];
            state.headers = [];
          } else {
            state.data = result.data;
            state.headers = result.headers || Object.keys(result.data[0] || {});
          }

          state.currentTab = sheetName;
          const tabLabel =
            TABS.find((t) => t.id === sheetName)?.label || sheetName;
          const columnCount = state.headers.length;
          const rowCount = state.data.length;

          sheetNameDisplay.textContent = tabLabel;
          rowCountDisplay.textContent = `${rowCount} registros · ${columnCount} columnas`;

          if (state.data.length > 0) {
            renderCards();
          }
          updateActiveTab(sheetName);
        } catch (error) {
          console.error("Error loading data:", error);
          cardsContainer.innerHTML = `
            <div class="empty-state">
              <span class="icon">⚠️</span>
              <strong>Error al cargar datos</strong>
              <br><br>
              <div style="color: #666; font-size: 0.9rem; max-width: 500px; margin: 0 auto;">
                ${error.message}
              </div>
              <br>
              <button class="btn-neo" onclick="loadData('${sheetName}')">🔄 Reintentar</button>
            </div>
          `;
        } finally {
          state.isLoading = false;
        }
      }

      // ============================================
      // RENDER CARDS
      // ============================================
      function renderCards() {
        if (state.data.length === 0) {
          cardsContainer.innerHTML = `
            <div class="empty-state">
              <span class="icon">📭</span>
              No hay registros
            </div>
          `;
          return;
        }

        const columnCount = state.headers.length;
        const rowCount = state.data.length;
        const tabLabel =
          TABS.find((t) => t.id === state.currentTab)?.label ||
          state.currentTab;

        sheetNameDisplay.textContent = tabLabel;
        rowCountDisplay.textContent = `${rowCount} registros · ${columnCount} columnas`;

        let html = '<div class="cards-grid">';

        state.data.forEach((row, rowIndex) => {
          html += `
            <div class="card-item" data-row="${rowIndex}">
              <div class="card-body">
          `;

          state.headers.forEach((header) => {
            const value = row[header] || "";
            const fieldId = `field_${rowIndex}_${header.replace(/\s+/g, "_")}`;
            const isEditing =
              state.editingFields[`${rowIndex}_${header}`] || false;
            const isBoolean =
              typeof value === "string" &&
              (value.toUpperCase() === "SI" ||
                value.toUpperCase() === "NO" ||
                value === "");

            html += `
              <div class="card-field ${isEditing ? "editing" : ""}" 
                   data-row="${rowIndex}" 
                   data-header="${header}"
                   onclick="if(!this.classList.contains('editing')) startFieldEdit(${rowIndex}, '${header}')">
                <span class="field-label">${header}</span>
            `;

            if (isEditing) {
              if (isBoolean) {
                html += `
                  <select class="field-select" id="${fieldId}" data-row="${rowIndex}" data-header="${header}">
                    <option value="">Seleccionar</option>
                    <option value="SI" ${value.toUpperCase() === "SI" ? "selected" : ""}>SI</option>
                    <option value="NO" ${value.toUpperCase() === "NO" ? "selected" : ""}>NO</option>
                  </select>
                `;
              } else {
                html += `
                  <input class="field-input" id="${fieldId}" type="text" value="${value}" 
                         data-row="${rowIndex}" data-header="${header}" 
                         onkeydown="if(event.key==='Enter') saveFieldEdit(${rowIndex}, '${header}')" />
                `;
              }
              html += `
                <div class="field-actions">
                  <button class="save-btn" onclick="event.stopPropagation(); saveFieldEdit(${rowIndex}, '${header}')">💾</button>
                  <button class="cancel-btn" onclick="event.stopPropagation(); cancelFieldEdit(${rowIndex}, '${header}')">✕</button>
                </div>
              `;
            } else {
              html += `
                <span class="field-value ${value ? "" : "empty"}">${value || "—"}</span>
              `;
            }

            html += `</div>`;
          });

          html += `
              </div>
            </div>
          `;
        });

        html += "</div>";
        cardsContainer.innerHTML = html;
      }

      // ============================================
      // EDICIÓN DE CAMPO INDIVIDUAL
      // ============================================
      function startFieldEdit(rowIndex, header) {
        state.editingFields[`${rowIndex}_${header}`] = true;
        renderCards();
        setTimeout(() => {
          const input = document.querySelector(
            `input[data-row="${rowIndex}"][data-header="${header}"], select[data-row="${rowIndex}"][data-header="${header}"]`,
          );
          if (input) input.focus();
        }, 50);
      }

      function cancelFieldEdit(rowIndex, header) {
        delete state.editingFields[`${rowIndex}_${header}`];
        renderCards();
      }

      async function saveFieldEdit(rowIndex, header) {
        const fieldId = `field_${rowIndex}_${header.replace(/\s+/g, "_")}`;
        const input = document.getElementById(fieldId);
        if (!input) return;

        const newValue = input.value;
        const oldValue = state.data[rowIndex][header] || "";

        if (newValue === oldValue) {
          delete state.editingFields[`${rowIndex}_${header}`];
          renderCards();
          return;
        }

        state.data[rowIndex][header] = newValue;

        try {
          await apiRequest(
            "update",
            state.currentTab,
            state.data[rowIndex],
            rowIndex,
          );
          delete state.editingFields[`${rowIndex}_${header}`];
          renderCards();
          showToast(`✅ Campo "${header}" actualizado`);
        } catch (error) {
          state.data[rowIndex][header] = oldValue;
          renderCards();
          showToast(`❌ ${error.message}`, "error");
        }
      }

      // ============================================
      // SIDEBAR
      // ============================================
      function renderSidebar() {
        const title =
          sidebarContainer.querySelector(".sidebar-title") ||
          document.createElement("div");
        title.className = "sidebar-title";
        title.textContent = "📋 Secciones";
        sidebarContainer.innerHTML = "";
        sidebarContainer.appendChild(title);

        TABS.forEach((tab, index) => {
          const btn = document.createElement("button");
          btn.className = `tab-btn ${tab.id === state.currentTab ? "active" : ""}`;
          btn.innerHTML = `<span class="tab-number">${index + 1}</span> ${tab.label}`;
          btn.dataset.sheet = tab.id;
          btn.addEventListener("click", () => {
            document
              .querySelectorAll(".sidebar .tab-btn")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            loadData(tab.id);
          });
          sidebarContainer.appendChild(btn);
        });
      }

      function updateActiveTab(sheetName) {
        document.querySelectorAll(".sidebar .tab-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.sheet === sheetName);
        });
      }

      // ============================================
      // MODAL
      // ============================================
      function openEditModal(index) {
        state.isEditing = true;
        state.editRowIndex = index;
        modalTitle.textContent = "✏️ Editar Registro Completo";
        const rowData = state.data[index] || {};
        renderFormFields(rowData);
        modalOverlay.classList.add("active");
        formScroll.scrollTop = 0;
      }

      function closeModal() {
        modalOverlay.classList.remove("active");
      }

      function renderFormFields(rowData) {
        const allHeaders = state.headers;
        if (allHeaders.length === 0) {
          formFields.innerHTML =
            '<p style="color:#666;">No hay campos disponibles</p>';
          return;
        }

        let html = "";
        allHeaders.forEach((header) => {
          const value =
            rowData[header] !== undefined && rowData[header] !== null
              ? rowData[header]
              : "";
          const isBoolean =
            typeof value === "string" &&
            (value.toUpperCase() === "SI" ||
              value.toUpperCase() === "NO" ||
              value === "");

          html += `
            <div class="form-group">
              <label for="field_${header.replace(/\s+/g, "_")}">${header}</label>
              ${
                isBoolean
                  ? `
                <select id="field_${header.replace(/\s+/g, "_")}" name="${header}">
                  <option value="">Seleccionar</option>
                  <option value="SI" ${value.toUpperCase() === "SI" ? "selected" : ""}>SI</option>
                  <option value="NO" ${value.toUpperCase() === "NO" ? "selected" : ""}>NO</option>
                </select>
              `
                  : `
                <input type="text" id="field_${header.replace(/\s+/g, "_")}" name="${header}" value="${value}" />
              `
              }
            </div>
          `;
        });

        formFields.innerHTML = html;
      }

      function collectFormData() {
        const formData = {};
        const inputs = formFields.querySelectorAll("input, select, textarea");
        inputs.forEach((input) => {
          formData[input.name] = input.value;
        });
        return formData;
      }

      async function handleSave(event) {
        event.preventDefault();
        const formData = collectFormData();

        const hasValue = Object.values(formData).some(
          (v) => v && v.trim() !== "",
        );
        if (!hasValue) {
          showToast("⚠️ Ingresa al menos un valor", "error");
          return;
        }

        try {
          if (state.isEditing && state.editRowIndex !== null) {
            await apiRequest(
              "update",
              state.currentTab,
              formData,
              state.editRowIndex,
            );
          } else {
            await apiRequest("create", state.currentTab, formData);
          }

          closeModal();
          await loadData(state.currentTab);
          showToast("✅ Registro guardado");
        } catch (error) {
          showToast(`❌ ${error.message}`, "error");
        }
      }

      // ============================================
      // TOAST
      // ============================================
      function showToast(message, type = "success") {
        const existing = document.querySelector(".toast-notification");
        if (existing) existing.remove();

        const toast = document.createElement("div");
        toast.className = "toast-notification";
        toast.textContent = message;

        if (type === "error") {
          toast.style.color = "#e74c3c";
        }

        document.body.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transition = "opacity 0.3s ease";
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      // ============================================
      // BUSCADOR SUPER PODEROSO - TODAS LAS SECCIONES
      // ============================================
      let searchTimeout = null;
      let searchTerm = "";
      let searchResultsData = [];
      let allDataCache = {}; // Cache para almacenar datos de todas las secciones

      // ============================================
      // CARGAR TODAS LAS SECCIONES AL INICIO
      // ============================================
      async function loadAllSections() {
        console.log("📦 Cargando todas las secciones...");
        for (const tab of TABS) {
          try {
            const result = await apiRequest("read", tab.id);
            allDataCache[tab.id] = {
              data: result.data || [],
              headers: result.headers || [],
            };
            console.log(
              `✅ Cargada: ${tab.label} (${allDataCache[tab.id].data.length} registros)`,
            );
          } catch (error) {
            console.warn(`❌ Error al cargar ${tab.label}:`, error);
            allDataCache[tab.id] = { data: [], headers: [] };
          }
        }
        console.log("📦 Todas las secciones cargadas!");
      }

      // ============================================
      // RENDERIZAR RESULTADOS DE BÚSQUEDA
      // ============================================
      function renderSearchResults(results) {
        if (results.length === 0) {
          cardsContainer.innerHTML = `
      <div class="empty-state">
        <span class="icon">🔍</span>
        <strong>No se encontraron resultados</strong>
        <br><br>
        <div style="color: #666; font-size: 0.9rem;">
          No hay coincidencias para "<strong>${searchTerm}</strong>" en ninguna sección
        </div>
        <br>
        <button class="btn-neo" onclick="clearSearch()" style="display:inline-flex !important;">
          🧹 Limpiar búsqueda
        </button>
      </div>
    `;
          return;
        }

        let html = `
    <div class="search-results-header">
      <span>🔍 Resultados de búsqueda en todas las secciones</span>
      <span class="search-result-count">${results.length} coincidencias</span>
    </div>
    <div class="search-results-list">
  `;

        results.forEach((result) => {
          const row = result.row;
          const rowIndex = result.index;
          const sheetLabel = result.sheetLabel;
          const matchedFields = result.matchedFields;

          const summary = matchedFields
            .map(
              (f) =>
                `<span class="search-match-field">${f.header}: <strong>${highlightText(f.value, searchTerm)}</strong></span>`,
            )
            .join(" ");

          const resultHeaders = Object.keys(row);

          html += `
      <div class="search-result-item" onclick="openSearchResult('${result.sheet}', ${rowIndex})">
        <div class="search-result-number">#${rowIndex + 1}</div>
        <div class="search-result-content">
          <div class="search-result-sheet">📂 ${sheetLabel}</div>
          <div class="search-result-summary">${summary}</div>
          <div class="search-result-preview">
            ${resultHeaders
              .slice(0, 3)
              .map(
                (h) =>
                  `<span class="search-result-preview-item">${h}: ${row[h] || "—"}</span>`,
              )
              .join(" ")}
            ${resultHeaders.length > 3 ? `<span class="search-result-more">+${resultHeaders.length - 3} más</span>` : ""}
          </div>
        </div>
        <div class="search-result-action">👁️ Ver</div>
      </div>
    `;
        });

        html += `
    </div>
    <div class="search-results-footer">
      <button class="btn-neo" onclick="clearSearch()" style="display:inline-flex !important;">
        🧹 Limpiar búsqueda
      </button>
      <button class="btn-neo primary" onclick="showAllResults()" style="display:inline-flex !important;">
        📋 Mostrar todos
      </button>
    </div>
  `;

        cardsContainer.innerHTML = html;
      }

      // ============================================
      // FUNCIÓN PRINCIPAL DE BÚSQUEDA
      // ============================================
      function performSearch(query) {
        searchTerm = query.trim().toLowerCase();
        const searchClear = document.getElementById("searchClear");
        const searchResults = document.getElementById("searchResults");

        if (searchTerm.length > 0) {
          searchClear.classList.add("visible");
        } else {
          searchClear.classList.remove("visible");
        }

        if (searchTerm.length === 0) {
          searchResults.textContent = "";
          searchResults.classList.remove("highlight");
          searchResultsData = [];
          renderCards();
          return;
        }

        // Buscar en TODAS las secciones usando el caché
        const allResults = [];

        for (const tab of TABS) {
          const cached = allDataCache[tab.id];
          if (!cached || !cached.data || cached.data.length === 0) continue;

          const data = cached.data;
          const headers = cached.headers || Object.keys(data[0] || {});

          data.forEach((row, rowIndex) => {
            let found = false;
            const matchedFields = [];

            headers.forEach((header) => {
              const value = String(row[header] || "").toLowerCase();
              if (value.includes(searchTerm)) {
                found = true;
                matchedFields.push({
                  header: header,
                  value: row[header] || "",
                  match: value,
                });
              }
            });

            if (found) {
              allResults.push({
                sheet: tab.id,
                sheetLabel: tab.label,
                index: rowIndex,
                row: row,
                matchedFields: matchedFields,
              });
            }
          });
        }

        searchResultsData = allResults;
        const total = allResults.length;
        searchResults.textContent = total > 0 ? `${total} encontrados` : "0";
        searchResults.classList.toggle("highlight", total > 0);

        renderSearchResults(allResults);
      }

      // ============================================
      // INICIALIZACIÓN - MODIFICADA
      // ============================================
      function init() {
        try {
          console.log("🔍 Inicializando conexión a base de datos...");
          console.log(`📡 API URL: ${API_URL}`);

          if (API_URL.includes("TU_URL_AQUI")) {
            console.warn("⚠️ Debes actualizar API_URL...");
            cardsContainer.innerHTML = `
        <div class="empty-state">
          <span class="icon">⚙️</span>
          <strong>Configuración pendiente</strong>
          <br><br>
          <div style="color: #666; font-size: 0.9rem; max-width: 500px; margin: 0 auto;">
            Debes actualizar la variable <code>API_URL</code>
          </div>
        </div>
      `;
            return;
          }

          renderSidebar();

          // Cargar TODAS las secciones primero
          loadAllSections().then(() => {
            // Luego cargar la sección por defecto
            loadData("ORDEN 1");
          });

          setupSearch();

          btnCancel.addEventListener("click", closeModal);
          modalClose.addEventListener("click", closeModal);
          modalForm.addEventListener("submit", handleSave);
          modalOverlay.addEventListener("click", (e) => {
            if (e.target === modalOverlay) closeModal();
          });
        } catch (error) {
          console.error("❌ Error:", error);
        }
      }
    </script>
  </body>
</html>
