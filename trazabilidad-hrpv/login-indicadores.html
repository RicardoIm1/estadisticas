<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2c3e50">
<link rel="icon" type="image/x-icon" href="../img/favicon.ico">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<title>Acceso a indicadores · HRPV</title>
<style>
:root{
  color-scheme:dark;
  --navy:#2c3e50;--blue:#4a90e2;--teal:#4ecdc4;
  --glass:rgba(255,255,255,.105);--line:rgba(255,255,255,.2);
  --text:#fff;--muted:rgba(255,255,255,.72);
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  min-height:100vh;display:grid;place-items:center;padding:24px;
  overflow-x:hidden;color:var(--text);
  font:14px/1.55 "Poppins",Tahoma,Geneva,Verdana,sans-serif;
  background:linear-gradient(135deg,#2c3e50 0%,#4a6a85 55%,#7dacbf 100%);
}
.glass{
  width:min(100%,440px);padding:38px 36px 25px;border:1px solid var(--line);
  border-radius:20px;background:var(--glass);
  box-shadow:0 16px 48px rgba(0,0,0,.2);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  animation:card-breathe 7s ease-in-out infinite;
  transform-origin:center;
}
@keyframes card-breathe{0%,100%{opacity:.97;transform:translateY(0) scale(1)}50%{opacity:1;transform:translateY(-2px) scale(1.006)}}
.brand{text-align:center;margin-bottom:26px}
.logo{display:block;width:112px;height:auto;max-height:112px;object-fit:contain;margin:0 auto 15px}
.brand h1{font-size:19px;line-height:1.3;font-weight:500;letter-spacing:.1px;margin:0;color:#fff}
.eyebrow{margin:25px 0 5px;text-align:center;color:var(--teal);font-size:10px;font-weight:700;letter-spacing:1.7px;text-transform:uppercase}
h2{margin:0 0 8px;text-align:center;font-size:24px;line-height:1.25;font-weight:500;letter-spacing:-.45px}
.intro{margin:0 auto 24px;max-width:340px;text-align:center;color:var(--muted);font-size:12px;line-height:1.65}
.form-group{display:flex;flex-direction:column;gap:7px;margin:16px 0}
label{display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.9);font-size:12px}
label i{width:14px;color:var(--teal);text-align:center}
input{
  width:100%;min-height:46px;padding:12px 14px;border:1px solid rgba(255,255,255,.22);
  border-radius:9px;background:rgba(255,255,255,.1);color:#fff;
  font:inherit;font-size:14px;transition:border-color .2s ease,background .2s ease,box-shadow .2s ease;
}
input::placeholder{color:rgba(255,255,255,.48)}
input:focus{outline:none;border-color:rgba(78,205,196,.85);background:rgba(255,255,255,.14);box-shadow:0 0 0 3px rgba(78,205,196,.12)}
button{
  width:100%;min-height:46px;margin-top:10px;padding:12px 16px;border:1px solid transparent;
  border-radius:9px;background:#4a90e2;color:#fff;font:inherit;font-size:13px;font-weight:600;
  cursor:pointer;transition:background .2s ease,transform .2s ease,opacity .2s ease;
}
button:hover:not(:disabled){background:#3a7bc8;transform:translateY(-1px)}
button:focus-visible{outline:3px solid rgba(78,205,196,.6);outline-offset:3px}
button:disabled{opacity:.65;cursor:wait;transform:none}
#message{
  min-height:0;margin-top:14px;padding:0;text-align:center;border-radius:8px;
  color:#fff;font-size:12px;line-height:1.5;opacity:0;transition:opacity .2s ease;
  overflow-wrap:anywhere;
}
#message.is-visible{opacity:1;padding:10px 12px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12)}
.glass.loading{border-color:rgba(74,144,226,.7);box-shadow:0 16px 48px rgba(0,0,0,.2),0 0 0 3px rgba(74,144,226,.1)}
.glass.success{border-color:rgba(78,205,196,.75)}
.glass.error{border-color:rgba(255,130,130,.75)}
.foot{margin-top:25px;padding-top:15px;border-top:1px solid rgba(255,255,255,.14);text-align:center;color:rgba(255,255,255,.65);font-size:10px}
@media(max-width:480px){body{padding:14px}.glass{padding:30px 22px 22px}.logo{width:96px}h2{font-size:22px}}
@media(max-height:620px){body{align-items:start;padding-top:16px;padding-bottom:16px}.glass{padding-top:24px;padding-bottom:18px}.brand{margin-bottom:16px}.logo{width:78px;margin-bottom:10px}.eyebrow{margin-top:14px}.intro{margin-bottom:16px}.form-group{margin:12px 0}.foot{margin-top:18px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.glass.motion-paused{animation-play-state:paused}
</style>
</head>
<body>
<main class="glass">
  <header class="brand">
    <img class="logo" src="../img/logo-hrpv.png" alt="Logotipo del Hospital Regional de Puerto Vallarta">
    <h1>Estadísticas y Archivo Clínico</h1>
  </header>
  <div class="eyebrow">Autenticación segura</div>
  <h2>Procedencia de cifras</h2>
  <p class="intro">Inicia sesión con tu cuenta institucional de Supabase. Este acceso es independiente del resto de módulos HRPV.</p>
  <form id="loginForm" novalidate>
    <div class="form-group">
      <label for="email"><i class="fa-solid fa-user" aria-hidden="true"></i> Correo electrónico</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="nombre@institucion.gob.mx" required maxlength="254">
    </div>
    <div class="form-group">
      <label for="password"><i class="fa-solid fa-key" aria-hidden="true"></i> Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
    </div>
    <button id="submitBtn" type="submit"><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> Iniciar sesión</button>
    <div id="message" role="status" aria-live="polite"></div>
  </form>
  <footer class="foot">HRPV · Módulo de trazabilidad · Acceso mediante Supabase Auth</footer>
</main>

<script src="/main_js/estadoSistema.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://njtlruvhcatklccdxpla.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qdGxydXZoY2F0a2xjY2R4cGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzIwOTIsImV4cCI6MjEwMDkwODA5Mn0.MzVwk4OWvahcUfP1KF_kHbLlIXWIbZ-wljce1i2Q1sc";
const AUTH_STORAGE_KEY = "hrpv-indicadores-auth-v1";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storageKey: AUTH_STORAGE_KEY, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
});

const form = document.getElementById("loginForm");
const email = document.getElementById("email");
const password = document.getElementById("password");
const button = document.getElementById("submitBtn");

function showMessage(text, kind = "info") {
  window.setEstado?.(kind === "error" ? "error" : "loading", text);
}
function friendlyError(error) {
  const known = {
    "Invalid login credentials": "Correo o contraseña incorrectos.",
    "Email not confirmed": "Tu correo aún no está confirmado. Revisa Authentication → Users en Supabase.",
    "Too many requests": "Se alcanzó el límite temporal de intentos. Espera antes de volver a probar."
  };
  return known[error?.message] || "No fue posible iniciar sesión. Verifica los datos y el estado de la cuenta en Supabase.";
}

try {
  const { data, error } = await supabase.auth.getSession();
  if (error) throw error;
  if (data.session) {
    window.setEstado?.("success", "Sesión activa. Abriendo el módulo…");
    location.replace("./index.html");
  }
} catch (error) {
  showMessage("No se pudo verificar la sesión. Comprueba la conexión y vuelve a intentarlo.", "error");
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  const mail = email.value.trim();
  const pass = password.value;
  if (!mail || !pass) {
    showMessage("Escribe tu correo y contraseña.", "error");
    return;
  }

  button.disabled = true;
  button.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i> Verificando…';
  window.setEstado?.("loading", "Validando la cuenta con Supabase Auth…");

  try {
    const { data, error } = await supabase.auth.signInWithPassword({ email: mail, password: pass });
    if (error) throw error;
    if (!data.session || !data.user) throw new Error("No se recibió una sesión válida.");

    window.setEstado?.("success", "Acceso correcto. Abriendo Procedencia de cifras…");
    location.replace("./index.html");
  } catch (error) {
    showMessage(friendlyError(error), "error");
    button.disabled = false;
    button.innerHTML = '<i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> Iniciar sesión';
    password.value = "";
    password.focus();
  }
});
</script>
</body>
</html>
